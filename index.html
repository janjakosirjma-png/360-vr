<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover"
>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>360° Cardboard Viewer</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

#viewer {
  position: fixed;
  inset: 0;
}

a-scene {
  width: 100%;
  height: 100%;
}


/* =====================================================
   TOOLBAR
===================================================== */

#toolbar {
  position: fixed;
  z-index: 10000;

  top: 15px;
  left: 15px;

  display: flex;
  gap: 7px;
  align-items: center;
  flex-wrap: wrap;

  padding: 8px;

  border-radius: 14px;

  background: rgba(15,15,15,.88);

  box-shadow: 0 8px 30px rgba(0,0,0,.35);
}

.tool-button {
  height: 42px;

  padding: 0 14px;

  border: 0;
  border-radius: 9px;

  background: rgba(255,255,255,.13);

  color: white;

  font-weight: 700;

  cursor: pointer;
}

#addHotspotBtn {
  background: #2563eb;
}

#addHotspotBtn.active {
  background: #16a34a;
}

#cardboardBtn {
  background: #7c3aed;
}

.separator {
  width: 1px;
  height: 25px;

  background: rgba(255,255,255,.2);
}


/* =====================================================
   INSTRUCTION
===================================================== */

#instruction {
  position: fixed;
  z-index: 10000;

  left: 50%;
  bottom: 25px;

  transform: translateX(-50%);

  display: none;

  padding: 11px 18px;

  border-radius: 30px;

  background: rgba(0,0,0,.82);

  color: white;

  pointer-events: none;
}


/* =====================================================
   POPUP
===================================================== */

#popup {
  position: fixed;
  z-index: 20000;

  display: none;

  width: 330px;
  max-width: calc(100vw - 30px);

  padding: 18px;

  border-radius: 14px;

  background: white;

  color: #222;

  box-shadow: 0 15px 45px rgba(0,0,0,.4);
}

#popup::before {
  content: "";

  position: absolute;

  left: -9px;
  top: 50%;

  transform: translateY(-50%);

  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-right: 9px solid white;
}

#popup.open-left::before {
  left: auto;
  right: -9px;

  border-right: 0;
  border-left: 9px solid white;
}

#popupClose {
  position: absolute;

  right: 9px;
  top: 9px;

  width: 30px;
  height: 30px;

  padding: 0;

  border: 0;
  border-radius: 50%;

  background: #eee;

  font-size: 20px;

  cursor: pointer;
}

#readerMode,
#editorMode {
  display: none;
}

#readerTitle {
  margin: 0 35px 10px 0;
}

#readerDescription {
  margin-bottom: 17px;

  white-space: pre-wrap;

  line-height: 1.5;
}

#editBtn {
  width: 100%;

  padding: 10px;

  border: 0;
  border-radius: 8px;

  background: #2563eb;

  color: white;

  font-weight: bold;
}

.field-label {
  display: block;

  margin: 0 0 5px;

  font-size: 12px;

  font-weight: bold;
}

#titleInput,
#descriptionInput {
  width: 100%;

  padding: 10px;

  border: 1px solid #ccc;
  border-radius: 8px;
}

#titleInput {
  margin-bottom: 12px;
}

#descriptionInput {
  min-height: 120px;

  margin-bottom: 12px;

  resize: vertical;
}

.editor-buttons {
  display: flex;
  gap: 7px;
}

.editor-buttons button {
  padding: 9px 12px;

  border: 0;
  border-radius: 8px;

  font-weight: bold;
}

#saveBtn {
  flex: 1;

  background: #16a34a;

  color: white;
}

#cancelBtn {
  background: #ddd;
}

#deleteBtn {
  background: #dc2626;

  color: white;
}


/* =====================================================
   CARDBOARD START
===================================================== */

#cardboardStartPanel {
  position: fixed;
  inset: 0;

  z-index: 50000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(0,0,0,.9);
}

#cardboardStartBox {
  width: 390px;
  max-width: 100%;

  padding: 25px;

  border-radius: 18px;

  background: white;

  text-align: center;
}

#startCardboardBtn {
  width: 100%;

  padding: 13px;

  border: 0;
  border-radius: 10px;

  background: #7c3aed;

  color: white;

  font-weight: bold;
}

#cancelCardboardBtn {
  width: 100%;

  margin-top: 8px;

  padding: 11px;

  border: 0;
  border-radius: 10px;

  background: #ddd;

  font-weight: bold;
}


/* =====================================================
   CARDBOARD OVERLAY
===================================================== */

#cardboardUI {
  position: fixed;
  inset: 0;

  z-index: 30000;

  display: none;

  pointer-events: none;
}

.gaze {
  position: absolute;

  top: 50%;

  width: 25px;
  height: 25px;

  transform: translate(-50%,-50%);

  border: 2px solid white;

  border-radius: 50%;

  box-shadow: 0 0 8px black;
}

.gaze::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 4px;
  height: 4px;

  transform: translate(-50%,-50%);

  background: white;

  border-radius: 50%;
}

#gazeLeft {
  left: 25%;
}

#gazeRight {
  left: 75%;
}

.gaze.active {
  animation: gazeAnimation 1.2s linear forwards;
}

@keyframes gazeAnimation {

  from {
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  to {
    transform:
      translate(-50%,-50%)
      scale(1.7);
  }

}

#exitCardboardBtn {
  position: absolute;

  right: 12px;
  top: 12px;

  z-index: 31000;

  pointer-events: auto;

  padding: 10px 14px;

  border: 0;
  border-radius: 9px;

  background: rgba(0,0,0,.75);

  color: white;

  font-weight: bold;
}


/* =====================================================
   IOS PERMISSION
===================================================== */

#permissionPanel {
  position: fixed;
  inset: 0;

  z-index: 60000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(0,0,0,.9);
}

#permissionBox {
  width: 350px;
  max-width: 100%;

  padding: 24px;

  border-radius: 16px;

  background: white;

  text-align: center;
}

#permissionButton {
  width: 100%;

  padding: 12px;

  border: 0;
  border-radius: 9px;

  background: #7c3aed;

  color: white;

  font-weight: bold;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px) {

  #toolbar {
    top: 8px;
    left: 8px;
    right: 8px;

    justify-content: center;
  }

  .tool-button {
    height: 38px;

    padding: 0 10px;

    font-size: 12px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     360 VIEWER
===================================================== -->

<div id="viewer">

<a-scene
  id="scene"

  embedded

  vr-mode-ui="enabled:false"

  renderer="
    antialias:true;
    colorManagement:true
  "

  loading-screen="enabled:true"

  cursor="rayOrigin:mouse"

  raycaster="
    objects:.clickable;
    far:100
  "
>

<a-assets>

  <!--
    Če telefon kaže staro 360 sliko,
    povečaj v=20 na v=21.
  -->

  <img
    id="panoramaImage"
    src="360.jpg?v=20"
    crossorigin="anonymous"
  >

</a-assets>


<a-sky
  id="sky"
  src="#panoramaImage"
  rotation="0 -90 0"
></a-sky>


<a-entity id="hotspotContainer"></a-entity>


<a-entity id="cameraRig">

  <a-camera
    id="camera"

    position="0 0 0"

    look-controls="
      enabled:true;
      magicWindowTrackingEnabled:false
    "

    wasd-controls="enabled:false"
  ></a-camera>

</a-entity>

</a-scene>

</div>


<!-- =====================================================
     TOOLBAR
===================================================== -->

<div id="toolbar">

<button
  id="addHotspotBtn"
  class="tool-button"
>
+ Dodaj hotspot
</button>


<div class="separator"></div>


<button
  id="zoomInBtn"
  class="tool-button"
>
+
</button>


<button
  id="zoomOutBtn"
  class="tool-button"
>
−
</button>


<div class="separator"></div>


<button
  id="fullscreenBtn"
  class="tool-button"
>
⛶ Fullscreen
</button>


<button
  id="cardboardBtn"
  class="tool-button"
>
🥽 CARDBOARD
</button>

</div>


<div id="instruction">
Klikni na mesto v panorami.
</div>


<!-- =====================================================
     HOTSPOT POPUP
===================================================== -->

<div id="popup">

<button id="popupClose">
×
</button>


<div id="readerMode">

<h2 id="readerTitle"></h2>

<div id="readerDescription"></div>

<button id="editBtn">
Uredi
</button>

</div>


<div id="editorMode">

<label class="field-label">
Naslov
</label>

<input
  id="titleInput"
  type="text"
  placeholder="Naslov hotspota"
>


<label class="field-label">
Opis
</label>

<textarea
  id="descriptionInput"
  placeholder="Opis..."
></textarea>


<div class="editor-buttons">

<button id="saveBtn">
Shrani
</button>

<button id="cancelBtn">
Prekliči
</button>

<button id="deleteBtn">
Izbriši
</button>

</div>

</div>

</div>


<!-- =====================================================
     CARDBOARD START
===================================================== -->

<div id="cardboardStartPanel">

<div id="cardboardStartBox">

<h2>🥽 Cardboard</h2>

<p>
Telefon obrni vodoravno in ga vstavi v
Esperanza Apocalypse.
</p>

<p>
Prikaz uporablja dve optično ukrivljeni sliki,
podobno kot Cardboard način.
</p>

<p>
Zaslon bo med ogledom ostal prižgan.
</p>


<button id="startCardboardBtn">
ZAŽENI CARDBOARD
</button>


<button id="cancelCardboardBtn">
Prekliči
</button>

</div>

</div>


<!-- =====================================================
     CARDBOARD UI
===================================================== -->

<div id="cardboardUI">

<div
  id="gazeLeft"
  class="gaze"
></div>

<div
  id="gazeRight"
  class="gaze"
></div>


<button id="exitCardboardBtn">
✕
</button>

</div>


<!-- =====================================================
     SENSOR PERMISSION
===================================================== -->

<div id="permissionPanel">

<div id="permissionBox">

<h2>Gibanje telefona</h2>

<p>
Dovoli uporabo senzorjev telefona.
</p>

<button id="permissionButton">
Dovoli in zaženi
</button>

</div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const scene =
  document.querySelector("#scene");

const camera =
  document.querySelector("#camera");

const hotspotContainer =
  document.querySelector("#hotspotContainer");

const toolbar =
  document.querySelector("#toolbar");

const addHotspotBtn =
  document.querySelector("#addHotspotBtn");

const zoomInBtn =
  document.querySelector("#zoomInBtn");

const zoomOutBtn =
  document.querySelector("#zoomOutBtn");

const fullscreenBtn =
  document.querySelector("#fullscreenBtn");

const cardboardBtn =
  document.querySelector("#cardboardBtn");

const instruction =
  document.querySelector("#instruction");

const popup =
  document.querySelector("#popup");

const popupClose =
  document.querySelector("#popupClose");

const readerMode =
  document.querySelector("#readerMode");

const editorMode =
  document.querySelector("#editorMode");

const readerTitle =
  document.querySelector("#readerTitle");

const readerDescription =
  document.querySelector("#readerDescription");

const editBtn =
  document.querySelector("#editBtn");

const titleInput =
  document.querySelector("#titleInput");

const descriptionInput =
  document.querySelector("#descriptionInput");

const saveBtn =
  document.querySelector("#saveBtn");

const cancelBtn =
  document.querySelector("#cancelBtn");

const deleteBtn =
  document.querySelector("#deleteBtn");

const cardboardStartPanel =
  document.querySelector("#cardboardStartPanel");

const startCardboardBtn =
  document.querySelector("#startCardboardBtn");

const cancelCardboardBtn =
  document.querySelector("#cancelCardboardBtn");

const cardboardUI =
  document.querySelector("#cardboardUI");

const gazeLeft =
  document.querySelector("#gazeLeft");

const gazeRight =
  document.querySelector("#gazeRight");

const exitCardboardBtn =
  document.querySelector("#exitCardboardBtn");

const permissionPanel =
  document.querySelector("#permissionPanel");

const permissionButton =
  document.querySelector("#permissionButton");


/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
  "stable-360-hotspots-v5";


let hotspots =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || [];


function saveHotspots() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(hotspots)
  );

}


/* =====================================================
   STATE
===================================================== */

let selectedHotspotId =
  null;

let addMode =
  false;

let cardboardMode =
  false;

let pointerStartX =
  0;

let pointerStartY =
  0;

let pointerDistance =
  0;


/* =====================================================
   WAKE LOCK
===================================================== */

let wakeLock =
  null;


async function enableWakeLock() {

  if (
    !("wakeLock" in navigator)
  ) {

    console.log(
      "Wake Lock ni podprt."
    );

    return;

  }


  if (
    wakeLock &&
    !wakeLock.released
  )
    return;


  try {

    wakeLock =
      await navigator
        .wakeLock
        .request("screen");


    console.log(
      "Wake Lock AKTIVEN"
    );


    wakeLock.addEventListener(
      "release",
      () => {

        wakeLock =
          null;

      }
    );

  }

  catch(error) {

    console.log(
      "Wake Lock:",
      error
    );

  }

}


async function disableWakeLock() {

  if (!wakeLock)
    return;


  try {

    await wakeLock.release();

  }

  catch(error) {}


  wakeLock =
    null;

}


/*
   Če brskalnik Wake Lock začasno
   sprosti, ga ob vrnitvi ponovno vključimo.
*/

document.addEventListener(
  "visibilitychange",
  async () => {

    if (
      cardboardMode &&
      document.visibilityState === "visible"
    ) {

      await enableWakeLock();

    }

  }
);


window.addEventListener(
  "focus",
  async () => {

    if (
      cardboardMode
    ) {

      await enableWakeLock();

    }

  }
);


/* =====================================================
   SPHERICAL
===================================================== */

function sphericalToVector(
  yaw,
  pitch,
  radius = 8
) {

  return new THREE.Vector3(

    radius *
    Math.cos(pitch) *
    Math.sin(yaw),

    radius *
    Math.sin(pitch),

    -radius *
    Math.cos(pitch) *
    Math.cos(yaw)

  );

}


function directionToSpherical(
  direction
) {

  return {

    yaw:
      Math.atan2(
        direction.x,
        -direction.z
      ),

    pitch:
      Math.asin(
        THREE.MathUtils.clamp(
          direction.y,
          -1,
          1
        )
      )

  };

}


/* =====================================================
   FACE CAMERA
===================================================== */

AFRAME.registerComponent(
  "face-camera",
  {

    tick:function() {

      if(cardboardMode)
        return;


      const cam =
        camera.object3D;


      if(!cam)
        return;


      const p =
        new THREE.Vector3();


      cam.getWorldPosition(p);


      this.el.object3D.lookAt(p);

    }

  }
);


/* =====================================================
   CREATE HOTSPOT
===================================================== */

function createHotspotEntity(
  hotspot,
  number
) {

  const root =
    document.createElement(
      "a-entity"
    );


  root.dataset.id =
    hotspot.id;


  root.classList.add(
    "clickable"
  );


  root.setAttribute(
    "face-camera",
    ""
  );


  const p =
    sphericalToVector(
      hotspot.yaw,
      hotspot.pitch
    );


  root.setAttribute(
    "position",
    `${p.x} ${p.y} ${p.z}`
  );


  const border =
    document.createElement(
      "a-circle"
    );


  border.setAttribute(
    "radius",
    "0.26"
  );

  border.setAttribute(
    "color",
    "#fff"
  );

  border.setAttribute(
    "material",
    "shader:flat;side:double"
  );


  const dot =
    document.createElement(
      "a-circle"
    );


  dot.setAttribute(
    "radius",
    "0.20"
  );

  dot.setAttribute(
    "position",
    "0 0 0.01"
  );

  dot.setAttribute(
    "color",
    "#ef4444"
  );

  dot.setAttribute(
    "material",
    "shader:flat;side:double"
  );


  const text =
    document.createElement(
      "a-text"
    );


  text.setAttribute(
    "value",
    String(number)
  );

  text.setAttribute(
    "align",
    "center"
  );

  text.setAttribute(
    "anchor",
    "center"
  );

  text.setAttribute(
    "baseline",
    "center"
  );

  text.setAttribute(
    "color",
    "#fff"
  );

  text.setAttribute(
    "width",
    "1"
  );

  text.setAttribute(
    "position",
    "0 0 0.025"
  );


  root.appendChild(border);
  root.appendChild(dot);
  root.appendChild(text);


  root.addEventListener(
    "click",
    event => {

      if(cardboardMode)
        return;


      event.stopPropagation();

      stopAddMode();

      openReader(
        hotspot.id
      );

    }
  );


  hotspotContainer.appendChild(
    root
  );

}


/* =====================================================
   RENDER HOTSPOTS
===================================================== */

function renderHotspots() {

  hotspotContainer.innerHTML =
    "";


  hotspots.forEach(
    (hotspot,index) => {

      createHotspotEntity(
        hotspot,
        index + 1
      );

    }
  );

}


/* =====================================================
   SCREEN DIRECTION
===================================================== */

function screenToDirection(
  clientX,
  clientY
) {

  const cam =
    camera.getObject3D(
      "camera"
    );


  if(!cam)
    return null;


  const rect =
    scene.canvas
      .getBoundingClientRect();


  const x =
    (
      (clientX - rect.left)
      / rect.width
    ) * 2 - 1;


  const y =
    -(
      (
        clientY - rect.top
      )
      / rect.height
      * 2 - 1
    );


  const vector =
    new THREE.Vector3(
      x,
      y,
      .5
    );


  vector.unproject(cam);


  const cp =
    new THREE.Vector3();


  cam.getWorldPosition(cp);


  return vector
    .sub(cp)
    .normalize();

}


/* =====================================================
   ADD MODE
===================================================== */

addHotspotBtn.addEventListener(
  "click",
  () => {

    if(cardboardMode)
      return;


    addMode =
      !addMode;


    closePopup();


    if(addMode) {

      addHotspotBtn
        .classList
        .add("active");


      addHotspotBtn.textContent =
        "Klikni v panoramo";


      instruction.style.display =
        "block";

    }

    else {

      stopAddMode();

    }

  }
);


function stopAddMode() {

  addMode =
    false;


  addHotspotBtn
    .classList
    .remove("active");


  addHotspotBtn.textContent =
    "+ Dodaj hotspot";


  instruction.style.display =
    "none";

}


/* =====================================================
   POINTER
===================================================== */

scene.addEventListener(
  "pointerdown",
  e => {

    pointerStartX =
      e.clientX;

    pointerStartY =
      e.clientY;

    pointerDistance =
      0;

  }
);


scene.addEventListener(
  "pointermove",
  e => {

    const dx =
      e.clientX -
      pointerStartX;


    const dy =
      e.clientY -
      pointerStartY;


    pointerDistance =
      Math.sqrt(
        dx*dx + dy*dy
      );

  }
);


/* =====================================================
   PLACE HOTSPOT
===================================================== */

scene.addEventListener(
  "click",
  e => {

    if(
      !addMode ||
      cardboardMode ||
      pointerDistance > 8
    )
      return;


    const direction =
      screenToDirection(
        e.clientX,
        e.clientY
      );


    if(!direction)
      return;


    const s =
      directionToSpherical(
        direction
      );


    const hotspot = {

      id:
        "hs-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,7),

      yaw:s.yaw,

      pitch:s.pitch,

      title:"",

      description:""

    };


    hotspots.push(hotspot);


    saveHotspots();

    stopAddMode();

    renderHotspots();

    openEditor(
      hotspot.id
    );

  }
);


/* =====================================================
   POPUP POSITION
===================================================== */

function getHotspotScreenPosition(
  hotspot
) {

  const cam =
    camera.getObject3D(
      "camera"
    );


  if(!cam)
    return null;


  const p =
    sphericalToVector(
      hotspot.yaw,
      hotspot.pitch
    );


  const cameraPosition =
    new THREE.Vector3();


  const cameraDirection =
    new THREE.Vector3();


  cam.getWorldPosition(
    cameraPosition
  );


  cam.getWorldDirection(
    cameraDirection
  );


  const direction =
    p.clone()
     .sub(cameraPosition)
     .normalize();


  if(
    cameraDirection.dot(direction)
    <= 0
  )
    return null;


  p.project(cam);


  return {

    x:
      (p.x + 1) /
      2 *
      window.innerWidth,

    y:
      (-p.y + 1) /
      2 *
      window.innerHeight

  };

}


function positionPopup() {

  if(
    cardboardMode ||
    !selectedHotspotId ||
    popup.style.display === "none"
  )
    return;


  const hotspot =
    hotspots.find(
      h =>
        h.id ===
        selectedHotspotId
    );


  if(!hotspot)
    return;


  const screen =
    getHotspotScreenPosition(
      hotspot
    );


  if(!screen) {

    popup.style.visibility =
      "hidden";

    return;

  }


  popup.style.visibility =
    "visible";


  const width =
    popup.offsetWidth;

  const height =
    popup.offsetHeight;

  const gap =
    32;


  let left;

  let top =
    screen.y -
    height / 2;


  if(
    screen.x <
    window.innerWidth / 2
  ) {

    popup.classList.remove(
      "open-left"
    );


    left =
      screen.x + gap;

  }

  else {

    popup.classList.add(
      "open-left"
    );


    left =
      screen.x -
      width -
      gap;

  }


  left =
    Math.max(
      10,
      Math.min(
        left,
        window.innerWidth -
        width -
        10
      )
    );


  top =
    Math.max(
      10,
      Math.min(
        top,
        window.innerHeight -
        height -
        10
      )
    );


  popup.style.left =
    left + "px";


  popup.style.top =
    top + "px";

}

/* =====================================================
   DEVICE ORIENTATION
===================================================== */

let deviceAlpha = 0;
let deviceBeta = 0;
let deviceGamma = 0;

let hasOrientation =
  false;


function orientationHandler(e) {

  if(e.alpha === null)
    return;


  deviceAlpha =
    e.alpha || 0;

  deviceBeta =
    e.beta || 0;

  deviceGamma =
    e.gamma || 0;


  hasOrientation =
    true;

}


/* =====================================================
   ORIENTATION QUATERNION
===================================================== */

const zee =
  new THREE.Vector3(
    0,0,1
  );


const orientationEuler =
  new THREE.Euler();


const orientationQ0 =
  new THREE.Quaternion();


const orientationQ1 =
  new THREE.Quaternion(
    -Math.sqrt(.5),
    0,
    0,
    Math.sqrt(.5)
  );


function updateCardboardOrientation(
  object
) {

  if(
    !hasOrientation ||
    !object
  )
    return;


  const alpha =
    THREE.MathUtils.degToRad(
      deviceAlpha
    );


  const beta =
    THREE.MathUtils.degToRad(
      deviceBeta
    );


  const gamma =
    THREE.MathUtils.degToRad(
      deviceGamma
    );


  let orient =
    0;


  if(
    screen.orientation &&
    typeof screen.orientation.angle
      === "number"
  ) {

    orient =
      THREE.MathUtils.degToRad(
        screen.orientation.angle
      );

  }

  else if(
    typeof window.orientation
      === "number"
  ) {

    orient =
      THREE.MathUtils.degToRad(
        window.orientation
      );

  }


  orientationEuler.set(
    beta,
    alpha,
    -gamma,
    "YXZ"
  );


  object.quaternion
    .setFromEuler(
      orientationEuler
    );


  object.quaternion
    .multiply(
      orientationQ1
    );


  object.quaternion
    .multiply(
      orientationQ0
        .setFromAxisAngle(
          zee,
          -orient
        )
    );

}

/* =====================================================
   DISTORTION SHADER

   To naredi optično ukrivljene robove
   podobne Cardboard/YouTube prikazu.
===================================================== */

const distortionVertexShader = `

varying vec2 vUv;

void main() {

  vUv = uv;

  gl_Position =
    vec4(
      position.xy,
      0.0,
      1.0
    );

}

`;


const distortionFragmentShader = `

precision highp float;

uniform sampler2D eyeTexture;

uniform float k1;
uniform float k2;

varying vec2 vUv;


void main() {

  /*
     UV:
     0..1 -> -1..1
  */

  vec2 p =
    vUv * 2.0 - 1.0;


  /*
     Rahlo drugačna horizontalna
     geometrija zaradi razmerja
     telefonskega viewporta.
  */

  vec2 q = p;

  q.x *= 1.04;


  float r2 =
    dot(q,q);


  /*
     Inverzna radialna korekcija.

     S tem dobimo "pincushion"
     pred-deformacijo, ki jo nato
     leča vizualno popravi.
  */

  float factor =
    1.0 +
    k1 * r2 +
    k2 * r2 * r2;


  vec2 distorted =
    q * factor;


  distorted.x /= 1.04;


  vec2 uv =
    distorted * 0.5 + 0.5;


  /*
     Vse izven optičnega območja
     postane ČRNO.
  */

  if(
    uv.x < 0.0 ||
    uv.x > 1.0 ||
    uv.y < 0.0 ||
    uv.y > 1.0
  ) {

    gl_FragColor =
      vec4(
        0.0,
        0.0,
        0.0,
        1.0
      );

    return;

  }


  /*
     Dodatna optična maska.

     Zaradi tega dobimo obliko
     podobno screenshotu YouTube.
  */

  vec2 maskP = p;

  maskP.x *= 0.91;

  float maskR =
    dot(
      maskP,
      maskP
    );


  if(maskR > 1.30) {

    gl_FragColor =
      vec4(
        0.0,
        0.0,
        0.0,
        1.0
      );

    return;

  }


  gl_FragColor =
    texture2D(
      eyeTexture,
      uv
    );

}

`;


/* =====================================================
   CREATE DISTORTION SYSTEM
===================================================== */

function createDistortionSystem() {

  const canvas =
    renderer.domElement;


  const pixelRatio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  const eyeWidth =
    Math.max(
      512,
      Math.floor(
        canvas.clientWidth /
        2 *
        pixelRatio
      )
    );


  const eyeHeight =
    Math.max(
      512,
      Math.floor(
        canvas.clientHeight *
        pixelRatio
      )
    );


  leftTarget =
    new THREE.WebGLRenderTarget(
      eyeWidth,
      eyeHeight,
      {
        minFilter:
          THREE.LinearFilter,

        magFilter:
          THREE.LinearFilter,

        format:
          THREE.RGBAFormat,

        depthBuffer:
          true
      }
    );


  rightTarget =
    new THREE.WebGLRenderTarget(
      eyeWidth,
      eyeHeight,
      {
        minFilter:
          THREE.LinearFilter,

        magFilter:
          THREE.LinearFilter,

        format:
          THREE.RGBAFormat,

        depthBuffer:
          true
      }
    );


  distortionScene =
    new THREE.Scene();


  distortionCamera =
    new THREE.Camera();


  /*
     Material za levo oko.
  */

  const leftMaterial =
    new THREE.ShaderMaterial({

      uniforms: {

        eyeTexture: {
          value:
            leftTarget.texture
        },

        /*
           Glavna ukrivljenost.
        */

        k1: {
          value:
            0.20
        },

        k2: {
          value:
            0.07
        }

      },

      vertexShader:
        distortionVertexShader,

      fragmentShader:
        distortionFragmentShader,

      depthTest:
        false,

      depthWrite:
        false

    });


  /*
     Material za desno oko.
  */

  const rightMaterial =
    leftMaterial.clone();


  rightMaterial.uniforms =
    THREE.UniformsUtils.clone(
      leftMaterial.uniforms
    );


  rightMaterial.uniforms
    .eyeTexture
    .value =
      rightTarget.texture;


  /*
     Fullscreen geometry.

     Vsaka ravnina zavzame malo manj
     kot polovico zaslona.

     Tako dobimo črne robove kot
     na YouTube screenshotu.
  */

  const geometry =
    new THREE.PlaneGeometry(
      1,
      1.72
    );


  leftDistortionMesh =
    new THREE.Mesh(
      geometry,
      leftMaterial
    );


  rightDistortionMesh =
    new THREE.Mesh(
      geometry.clone(),
      rightMaterial
    );


  /*
     Celoten clip-space je -1..+1.

     Levo oko:
     center približno -0.5

     Desno oko:
     center približno +0.5
  */

  leftDistortionMesh.position.x =
    -0.50;


  rightDistortionMesh.position.x =
    0.50;


  distortionScene.add(
    leftDistortionMesh
  );


  distortionScene.add(
    rightDistortionMesh
  );

}

/* =====================================================
   ENTER CARDBOARD
===================================================== */

async function enterCardboard() {

  if(cardboardMode)
    return;


  cardboardMode =
    true;


  /*
     TELEFON OSTANE PRIŽGAN
  */

  await enableWakeLock();


  await preparePhone();


  window.addEventListener(
    "deviceorientation",
    orientationHandler,
    true
  );


  toolbar.style.display =
    "none";


  popup.style.display =
    "none";


  instruction.style.display =
    "none";


  cardboardUI.style.display =
    "block";


  renderer =
    scene.renderer;


  world =
    scene.object3D;


  vrCamera =
    camera.getObject3D(
      "camera"
    );


  if(
    !renderer ||
    !vrCamera
  ) {

    cardboardMode =
      false;

    await disableWakeLock();

    return;

  }


  originalFov =
    vrCamera.fov;


  camera.setAttribute(
    "look-controls",
    "enabled",
    false
  );


  stereoCamera =
    new THREE.StereoCamera();


  /*
     Standardna stereo razdalja.
  */

  stereoCamera.eyeSep =
    0.064;


  createDistortionSystem();


  setTimeout(
    () => {

      if(cardboardMode) {

        cardboardLoop();

      }

    },
    150
  );

}


/* =====================================================
   RENDER CARDBOARD
===================================================== */

function renderCardboard() {

  if(
    !renderer ||
    !vrCamera ||
    !stereoCamera
  )
    return;


  const canvas =
    renderer.domElement;


  const width =
    canvas.clientWidth;


  const height =
    canvas.clientHeight;


  if(
    width <= 0 ||
    height <= 0
  )
    return;


  /*
     Vsako oko ima polovico zaslona.
  */

  vrCamera.aspect =
    (width / 2) /
    height;


  /*
     Približno Cardboard FOV.

     Ker shader sliko še deformira,
     je malo širši pogled bolj primeren.
  */

  vrCamera.fov =
    82;


  vrCamera.updateProjectionMatrix();


  vrCamera.updateMatrixWorld(
    true
  );


  stereoCamera.update(
    vrCamera
  );


  /*
     -----------------------------------------
     1. LEVO OKO -> OFFSCREEN TEXTURE
     -----------------------------------------
  */

  renderer.setRenderTarget(
    leftTarget
  );


  renderer.setScissorTest(
    false
  );


  renderer.setClearColor(
    0x000000,
    1
  );


  renderer.clear(
    true,
    true,
    true
  );


  renderer.render(
    world,
    stereoCamera.cameraL
  );


  /*
     -----------------------------------------
     2. DESNO OKO -> OFFSCREEN TEXTURE
     -----------------------------------------
  */

  renderer.setRenderTarget(
    rightTarget
  );


  renderer.clear(
    true,
    true,
    true
  );


  renderer.render(
    world,
    stereoCamera.cameraR
  );


  /*
     -----------------------------------------
     3. DISTORTED OUTPUT -> TELEFON
     -----------------------------------------
  */

  renderer.setRenderTarget(
    null
  );


  renderer.setScissorTest(
    false
  );


  renderer.setClearColor(
    0x000000,
    1
  );


  renderer.clear(
    true,
    true,
    true
  );


  renderer.render(
    distortionScene,
    distortionCamera
  );

}

/* =====================================================
   GAZE
===================================================== */

const gazeRaycaster =
  new THREE.Raycaster();


const gazeCenter =
  new THREE.Vector2(
    0,
    0
  );


const GAZE_TIME =
  1200;


let gazeTargetId =
  null;

let gazeStartedAt =
  0;

let gazeActivated =
  false;


function updateGaze() {

  if(!vrCamera)
    return;


  gazeRaycaster.setFromCamera(
    gazeCenter,
    vrCamera
  );


  const targets =
    [];


  document
    .querySelectorAll(
      "#hotspotContainer > a-entity"
    )
    .forEach(
      entity => {

        entity.object3D.traverse(
          child => {

            if(child.isMesh) {

              child.userData.hotspotId =
                entity.dataset.id;


              targets.push(child);

            }

          }
        );

      }
    );


  const hits =
    gazeRaycaster.intersectObjects(
      targets,
      false
    );


  const id =
    hits.length
    ? hits[0]
        .object
        .userData
        .hotspotId
    : null;


  if(!id) {

    resetGaze();

    return;

  }


  if(gazeTargetId !== id) {

    gazeTargetId =
      id;


    gazeStartedAt =
      performance.now();


    gazeActivated =
      false;


    gazeLeft.classList.remove(
      "active"
    );


    gazeRight.classList.remove(
      "active"
    );


    void gazeLeft.offsetWidth;


    gazeLeft.classList.add(
      "active"
    );


    gazeRight.classList.add(
      "active"
    );


    return;

  }


  if(
    !gazeActivated &&
    performance.now() -
    gazeStartedAt >=
    GAZE_TIME
  ) {

    gazeActivated =
      true;


    const h =
      hotspots.find(
        h =>
          h.id ===
          gazeTargetId
      );


    if(h) {

      showCardboardInfo(h);

    }

  }

}


function resetGaze() {

  gazeTargetId =
    null;


  gazeStartedAt =
    0;


  gazeActivated =
    false;


  gazeLeft.classList.remove(
    "active"
  );


  gazeRight.classList.remove(
    "active"
  );

}


/* =====================================================
   VR INFO
===================================================== */

function showCardboardInfo(hotspot) {

  removeCardboardInfo();


  const group =
    new THREE.Group();


  const panel =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        2.7,
        1.45
      ),

      new THREE.MeshBasicMaterial({

        color:
          0xffffff,

        transparent:
          true,

        opacity:
          .96,

        side:
          THREE.DoubleSide

      })

    );


  group.add(panel);


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    1024;


  canvas.height =
    512;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.fillStyle =
    "#111";


  ctx.font =
    "bold 54px Arial";


  drawWrappedText(
    ctx,
    hotspot.title ||
    "Brez naslova",
    70,
    95,
    880,
    64,
    2
  );


  ctx.fillStyle =
    "#333";


  ctx.font =
    "34px Arial";


  drawWrappedText(
    ctx,
    hotspot.description ||
    "Ni opisa.",
    70,
    225,
    880,
    48,
    5
  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  const text =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        2.7,
        1.4
      ),

      new THREE.MeshBasicMaterial({

        map:
          texture,

        transparent:
          true,

        side:
          THREE.DoubleSide

      })

    );


  text.position.z =
    .01;


  group.add(text);


  const cp =
    new THREE.Vector3();


  const direction =
    new THREE.Vector3();


  vrCamera.getWorldPosition(cp);


  vrCamera.getWorldDirection(
    direction
  );


  group.position.copy(

    cp.clone().add(

      direction.clone()
        .multiplyScalar(2.8)

    )

  );


  group.lookAt(cp);


  world.add(group);


  cardboardInfoGroup =
    group;


  resetGaze();

}


/* =====================================================
   WRAP TEXT
===================================================== */

function drawWrappedText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight,
  maxLines
) {

  const words =
    String(text)
      .split(/\s+/);


  let line =
    "";

  let lineNumber =
    0;


  for(
    let i = 0;
    i < words.length;
    i++
  ) {

    const test =
      line +
      words[i] +
      " ";


    if(
      ctx.measureText(test).width
      > maxWidth &&
      line !== ""
    ) {

      ctx.fillText(
        line,
        x,
        y +
        lineNumber *
        lineHeight
      );


      lineNumber++;


      if(
        lineNumber >=
        maxLines
      )
        return;


      line =
        words[i] + " ";

    }

    else {

      line =
        test;

    }

  }


  if(lineNumber < maxLines) {

    ctx.fillText(
      line,
      x,
      y +
      lineNumber *
      lineHeight
    );

  }

}


/* =====================================================
   REMOVE VR INFO
===================================================== */

function removeCardboardInfo() {

  if(!cardboardInfoGroup)
    return;


  world.remove(
    cardboardInfoGroup
  );


  cardboardInfoGroup.traverse(
    child => {

      if(child.geometry)
        child.geometry.dispose();


      if(child.material) {

        if(child.material.map)
          child.material.map.dispose();


        child.material.dispose();

      }

    }
  );


  cardboardInfoGroup =
    null;

}


/* =====================================================
   CARDBOARD LOOP
===================================================== */

function cardboardLoop() {

  if(!cardboardMode)
    return;


  cardboardAnimationId =
    requestAnimationFrame(
      cardboardLoop
    );


  updateCardboardOrientation(
    vrCamera
  );


  vrCamera.updateMatrixWorld(
    true
  );


  orientHotspotsToCamera();


  updateGaze();


  renderCardboard();

}


/* =====================================================
   EXIT
===================================================== */

exitCardboardBtn.addEventListener(
  "click",
  exitCardboard
);


async function exitCardboard() {

  if(!cardboardMode)
    return;


  cardboardMode =
    false;


  await disableWakeLock();


  if(cardboardAnimationId) {

    cancelAnimationFrame(
      cardboardAnimationId
    );

  }


  cardboardAnimationId =
    null;


  window.removeEventListener(
    "deviceorientation",
    orientationHandler,
    true
  );


  removeCardboardInfo();


  resetGaze();


  cardboardUI.style.display =
    "none";


  toolbar.style.display =
    "flex";


  camera.setAttribute(
    "look-controls",
    "enabled",
    true
  );


  if(vrCamera) {

    vrCamera.fov =
      originalFov;


    vrCamera.aspect =
      window.innerWidth /
      window.innerHeight;


    vrCamera.updateProjectionMatrix();

  }


  /*
     Dispose VR render targets.
  */

  if(leftTarget) {

    leftTarget.dispose();

    leftTarget =
      null;

  }


  if(rightTarget) {

    rightTarget.dispose();

    rightTarget =
      null;

  }


  if(leftDistortionMesh) {

    leftDistortionMesh
      .geometry
      .dispose();


    leftDistortionMesh
      .material
      .dispose();

  }


  if(rightDistortionMesh) {

    rightDistortionMesh
      .geometry
      .dispose();


    rightDistortionMesh
      .material
      .dispose();

  }


  distortionScene =
    null;

  distortionCamera =
    null;

  leftDistortionMesh =
    null;

  rightDistortionMesh =
    null;


  if(renderer) {

    renderer.setRenderTarget(
      null
    );


    renderer.setScissorTest(
      false
    );


    renderer.setClearColor(
      0x000000,
      1
    );

  }


  try {

    if(
      screen.orientation &&
      screen.orientation.unlock
    ) {

      screen.orientation.unlock();

    }

  }

  catch(error){}


  try {

    if(
      document.fullscreenElement
    ) {

      await document
        .exitFullscreen();

    }

  }

  catch(error){}

}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
  "keydown",
  e => {

    if(e.key !== "Escape")
      return;


    if(cardboardMode) {

      exitCardboard();

      return;

    }


    closePopup();

    stopAddMode();

  }
);


/* =====================================================
   START
===================================================== */

scene.addEventListener(
  "loaded",
  () => {

    renderHotspots();

  }
);

</script>

</body>
</html>
