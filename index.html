<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slika 260 – Hotspoti</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    header {
      padding: 16px 24px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .toolbar {
      padding: 12px 24px;
      background: white;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    #addModeBtn {
      background: #2563eb;
      color: white;
    }

    #addModeBtn.active {
      background: #16a34a;
    }

    .workspace {
      padding: 25px;
      display: flex;
      justify-content: center;
    }

    #imageContainer {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }

    #mainImage {
      display: block;
      max-width: 100%;
      height: auto;
      user-select: none;
    }

    /* -------------------------
       HOTSPOT
    -------------------------- */

    .hotspot {
      position: absolute;
      width: 30px;
      height: 30px;

      transform: translate(-50%, -50%);

      border-radius: 50%;
      background: #ef4444;

      border: 3px solid white;

      box-shadow:
        0 2px 8px rgba(0,0,0,.35),
        0 0 0 2px rgba(239,68,68,.25);

      cursor: pointer;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 12px;
      font-weight: bold;

      transition: transform .15s;
    }

    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.15);
    }

    /* -------------------------
       POPUP
    -------------------------- */

    #popup {
      position: absolute;
      display: none;

      width: 280px;

      background: white;

      border-radius: 12px;

      padding: 16px;

      box-shadow:
        0 10px 35px rgba(0,0,0,.25);

      z-index: 50;
    }

    #popupTitle {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* -------------------------
       BRALNI POGLED
    -------------------------- */

    #viewMode {
      display: none;
    }

    #viewDescription {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;

      padding: 10px 0 14px 0;
    }

    #editBtn {
      background: #2563eb;
      color: white;
      width: 100%;
    }

    /* -------------------------
       UREJANJE
    -------------------------- */

    #editMode {
      display: none;
    }

    #description {
      width: 100%;
      min-height: 110px;

      resize: vertical;

      padding: 10px;

      margin: 5px 0 12px 0;

      border: 1px solid #ccc;
      border-radius: 7px;

      font-family: inherit;
      font-size: 14px;
    }

    .popupButtons {
      display: flex;
      gap: 7px;
    }

    #saveBtn {
      background: #16a34a;
      color: white;
      flex: 1;
    }

    #deleteBtn {
      background: #dc2626;
      color: white;
    }

    #cancelBtn {
      background: #e5e7eb;
    }

    #closeBtn {
      position: absolute;

      right: 8px;
      top: 8px;

      width: 28px;
      height: 28px;

      padding: 0;

      border-radius: 50%;

      background: #f3f4f6;
      color: #555;

      font-size: 18px;
    }

    .hint {
      padding: 8px 24px;
      font-size: 13px;
      color: #666;
    }

  </style>
</head>

<body>

<header>
  <h1>Slika 260</h1>
  <p>Interaktivna slika z opisnimi točkami</p>
</header>


<div class="toolbar">

  <button id="addModeBtn">
    + Dodaj hotspot
  </button>

</div>


<div class="hint">
  Klikni »Dodaj hotspot«, nato klikni na želeno mesto na sliki.
</div>


<div class="workspace">

  <div id="imageContainer">

    <img
      id="mainImage"
      src="slika260.jpg"
      alt="Slika 260"
    >


    <!-- POPUP -->

    <div id="popup">

      <button id="closeBtn">×</button>

      <div id="popupTitle">
        Hotspot
      </div>


      <!-- BRALNI POGLED -->

      <div id="viewMode">

        <div id="viewDescription"></div>

        <button id="editBtn">
          Uredi
        </button>

      </div>


      <!-- UREJANJE -->

      <div id="editMode">

        <textarea
          id="description"
          placeholder="Vpiši opis..."
        ></textarea>

        <div class="popupButtons">

          <button id="saveBtn">
            Shrani
          </button>

          <button id="deleteBtn">
            Izbriši
          </button>

          <button id="cancelBtn">
            Prekliči
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

const container =
  document.getElementById("imageContainer");

const image =
  document.getElementById("mainImage");

const addModeBtn =
  document.getElementById("addModeBtn");

const popup =
  document.getElementById("popup");

const popupTitle =
  document.getElementById("popupTitle");

const viewMode =
  document.getElementById("viewMode");

const editMode =
  document.getElementById("editMode");

const viewDescription =
  document.getElementById("viewDescription");

const description =
  document.getElementById("description");

const editBtn =
  document.getElementById("editBtn");

const saveBtn =
  document.getElementById("saveBtn");

const deleteBtn =
  document.getElementById("deleteBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const closeBtn =
  document.getElementById("closeBtn");


let addMode = false;
let selectedHotspotId = null;


/* =========================
   PODATKI
========================= */

let hotspots =
  JSON.parse(
    localStorage.getItem("slika260-hotspots")
  ) || [];


function saveHotspots() {

  localStorage.setItem(
    "slika260-hotspots",
    JSON.stringify(hotspots)
  );

}


/* =========================
   DODAJANJE
========================= */

addModeBtn.addEventListener("click", () => {

  addMode = !addMode;

  popup.style.display = "none";


  if (addMode) {

    addModeBtn.textContent =
      "Klikni na sliko...";

    addModeBtn.classList.add("active");

  }

  else {

    addModeBtn.textContent =
      "+ Dodaj hotspot";

    addModeBtn.classList.remove("active");

  }

});


/* =========================
   KLIK NA SLIKO
========================= */

image.addEventListener("click", event => {

  if (!addMode)
    return;


  const rect =
    image.getBoundingClientRect();


  const x =
    ((event.clientX - rect.left)
    / rect.width) * 100;


  const y =
    ((event.clientY - rect.top)
    / rect.height) * 100;


  const hotspot = {

    id: Date.now(),

    x: x,
    y: y,

    description: ""

  };


  hotspots.push(hotspot);

  saveHotspots();

  renderHotspots();


  addMode = false;

  addModeBtn.textContent =
    "+ Dodaj hotspot";

  addModeBtn.classList.remove("active");


  /* nov hotspot se takoj ureja */

  openPopup(hotspot, true);

});


/* =========================
   PRIKAZ HOTSPOTOV
========================= */

function renderHotspots() {

  document
    .querySelectorAll(".hotspot")
    .forEach(el => el.remove());


  hotspots.forEach((hotspot, index) => {

    const el =
      document.createElement("div");


    el.className = "hotspot";

    el.style.left =
      hotspot.x + "%";

    el.style.top =
      hotspot.y + "%";


    el.textContent =
      index + 1;


    el.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        /*
        Obstoječ hotspot se odpre
        v BRALNEM načinu.
        */

        openPopup(
          hotspot,
          false
        );

      }
    );


    container.appendChild(el);

  });

}


/* =========================
   POPUP
========================= */

function openPopup(
  hotspot,
  startEditing = false
) {

  selectedHotspotId =
    hotspot.id;


  description.value =
    hotspot.description || "";


  viewDescription.textContent =
    hotspot.description ||
    "Ta hotspot še nima opisa.";


  popupTitle.textContent =
    "Hotspot";


  popup.style.display =
    "block";


  /*
  Najprej pokažemo pravi način,
  da lahko browser izračuna
  dejansko velikost popup-a.
  */

  if (startEditing) {

    showEditMode();

  }

  else {

    showViewMode();

  }


  /*
  Počakamo en frame,
  nato popup postavimo
  neposredno ob hotspot.
  */

  requestAnimationFrame(() => {

    positionPopup(hotspot);

  });

}


/* =========================
   POZICIJA POPUPA
========================= */

function positionPopup(hotspot) {

  const containerWidth =
    container.clientWidth;

  const containerHeight =
    container.clientHeight;


  /*
  Dejanska pozicija hotspota
  v pixelih.
  */

  const hotspotX =
    containerWidth *
    hotspot.x / 100;

  const hotspotY =
    containerHeight *
    hotspot.y / 100;


  const popupWidth =
    popup.offsetWidth;

  const popupHeight =
    popup.offsetHeight;


  const gap = 18;


  /*
  Privzeto:
  popup desno od hotspota.
  */

  let left =
    hotspotX + gap;

  let top =
    hotspotY -
    popupHeight / 2;


  /*
  Če ni prostora desno,
  ga prestavimo LEVO.
  */

  if (
    left + popupWidth >
    containerWidth
  ) {

    left =
      hotspotX -
      popupWidth -
      gap;

  }


  /*
  Če gre zgoraj ven.
  */

  if (top < 5) {

    top = 5;

  }


  /*
  Če gre spodaj ven.
  */

  if (
    top + popupHeight >
    containerHeight
  ) {

    top =
      containerHeight -
      popupHeight -
      5;

  }


  /*
  Dodatna zaščita za
  zelo majhne slike.
  */

  if (left < 5) {

    left = 5;

  }


  popup.style.left =
    left + "px";

  popup.style.top =
    top + "px";

}


/* =========================
   BRALNI NAČIN
========================= */

function showViewMode() {

  editMode.style.display =
    "none";

  viewMode.style.display =
    "block";

}


/* =========================
   UREJANJE
========================= */

function showEditMode() {

  viewMode.style.display =
    "none";

  editMode.style.display =
    "block";


  setTimeout(() => {

    description.focus();

  }, 50);

}


/* =========================
   GUMB UREDI
========================= */

editBtn.addEventListener(
  "click",
  () => {

    const hotspot =
      hotspots.find(
        h =>
        h.id === selectedHotspotId
      );


    if (!hotspot)
      return;


    description.value =
      hotspot.description || "";


    showEditMode();


    requestAnimationFrame(() => {

      positionPopup(hotspot);

    });

  }
);


/* =========================
   SHRANI
========================= */

saveBtn.addEventListener(
  "click",
  () => {

    const hotspot =
      hotspots.find(
        h =>
        h.id === selectedHotspotId
      );


    if (!hotspot)
      return;


    hotspot.description =
      description.value.trim();


    saveHotspots();


    /*
    Po shranjevanju NE zapremo.

    Samo preklopimo v
    lep bralni način.
    */

    viewDescription.textContent =
      hotspot.description ||
      "Ta hotspot še nima opisa.";


    showViewMode();


    requestAnimationFrame(() => {

      positionPopup(hotspot);

    });

  }
);


/* =========================
   PREKLIČI
========================= */

cancelBtn.addEventListener(
  "click",
  () => {

    const hotspot =
      hotspots.find(
        h =>
        h.id === selectedHotspotId
      );


    if (!hotspot)
      return;


    /*
    Če hotspot nima opisa,
    vseeno pokažemo reader.
    */

    viewDescription.textContent =
      hotspot.description ||
      "Ta hotspot še nima opisa.";


    showViewMode();


    requestAnimationFrame(() => {

      positionPopup(hotspot);

    });

  }
);


/* =========================
   IZBRIŠI
========================= */

deleteBtn.addEventListener(
  "click",
  () => {

    hotspots =
      hotspots.filter(
        h =>
        h.id !== selectedHotspotId
      );


    saveHotspots();


    popup.style.display =
      "none";


    renderHotspots();

  }
);


/* =========================
   ZAPRI
========================= */

closeBtn.addEventListener(
  "click",
  () => {

    popup.style.display =
      "none";

  }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  () => {

    if (
      popup.style.display !==
      "block"
    )
      return;


    const hotspot =
      hotspots.find(
        h =>
        h.id === selectedHotspotId
      );


    if (hotspot) {

      positionPopup(hotspot);

    }

  }
);


/* =========================
   START
========================= */

renderHotspots();

</script>

</body>
</html>
