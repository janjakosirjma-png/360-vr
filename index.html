<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>360° VR ogled</title>

<!-- A-FRAME: stereo VR + žiroskop + Cardboard/WebXR -->
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  touch-action: none;
}

/* =========================================================
   A-FRAME
========================================================= */

a-scene {
  position: fixed !important;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
}

/* =========================================================
   NORMAL UI
========================================================= */

#toolbar {
  position: fixed;
  z-index: 10000;
  top: 10px;
  left: 10px;

  display: flex;
  gap: 7px;
  flex-wrap: wrap;

  padding: 8px;

  border-radius: 14px;
  background: rgba(0,0,0,.82);
}

button {
  min-height: 40px;
  padding: 0 12px;

  border: 0;
  border-radius: 9px;

  background: #333;
  color: #fff;

  font-weight: 700;
  cursor: pointer;
}

#addBtn {
  background: #2563eb;
}

#addBtn.active {
  background: #16a34a;
}

#vrBtn {
  background: #7c3aed;
}

#hint {
  position: fixed;
  z-index: 10001;

  display: none;

  left: 50%;
  bottom: 22px;

  transform: translateX(-50%);

  padding: 10px 17px;

  border-radius: 30px;

  background: rgba(0,0,0,.86);
  color: #fff;

  pointer-events: none;
}

/* =========================================================
   POPUP
========================================================= */

#popup {
  position: fixed;
  z-index: 10002;

  display: none;

  width: 330px;
  max-width: calc(100vw - 20px);

  padding: 18px;

  border-radius: 14px;

  background: #fff;
  color: #111;

  box-shadow: 0 12px 45px rgba(0,0,0,.5);
}

#popupClose {
  position: absolute;

  right: 8px;
  top: 8px;

  width: 30px;
  height: 30px;
  min-height: 0;

  padding: 0;

  border-radius: 50%;

  background: #e5e5e5;
  color: #111;

  font-size: 21px;
}

#reader,
#editor {
  display: none;
}

#readerTitle {
  margin: 0 38px 10px 0;
}

#readerDescription {
  margin-bottom: 15px;

  white-space: pre-wrap;
  line-height: 1.45;
}

#editBtn {
  width: 100%;
  background: #2563eb;
}

.fieldLabel {
  display: block;

  margin: 9px 0 4px;

  font-size: 13px;
  font-weight: 700;
}

#titleInput,
#descriptionInput {
  width: 100%;

  padding: 10px;

  border: 1px solid #aaa;
  border-radius: 8px;

  font: inherit;
}

#descriptionInput {
  min-height: 110px;
  resize: vertical;
}

.editorButtons {
  display: flex;
  gap: 6px;

  margin-top: 10px;
}

.editorButtons button {
  flex: 1;
}

#saveBtn {
  background: #16a34a;
}

#cancelBtn {
  background: #666;
}

#deleteBtn {
  background: #dc2626;
}

/* =========================================================
   VR START WINDOW
========================================================= */

#vrStart {
  position: fixed;
  inset: 0;
  z-index: 20000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(0,0,0,.94);
}

#vrStartBox {
  width: 390px;
  max-width: 100%;

  padding: 24px;

  border-radius: 16px;

  background: #fff;
  color: #111;

  text-align: center;
}

#vrStartBox h2 {
  margin-top: 0;
}

#vrStartBox button {
  width: 100%;
  margin-top: 8px;
}

#startVRBtn {
  background: #7c3aed;
}

#cancelVRBtn {
  background: #666;
}

/* =========================================================
   ROTATE WARNING
========================================================= */

#rotateWarning {
  position: fixed;
  inset: 0;
  z-index: 30000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 30px;

  background: #000;
  color: #fff;

  text-align: center;

  font-size: 22px;
  font-weight: bold;
}

/* =========================================================
   HIDE DEFAULT A-FRAME VR BUTTON

   Uporabimo svoj CARDBOARD gumb.
========================================================= */

.a-enter-vr {
  display: none !important;
}
</style>
</head>

<body>

<!-- =======================================================
     A-FRAME SCENE
======================================================== -->

<a-scene
  id="scene"

  embedded

  vr-mode-ui="enabled: true"

  device-orientation-permission-ui="enabled: true"

  renderer="
    antialias: true;
    colorManagement: true;
    highRefreshRate: true;
    physicallyCorrectLights: false;
  "

  background="color: #000000">

  <!-- =====================================================
       ASSETS
  ====================================================== -->

  <a-assets timeout="20000">

    <!--
      Mapa:

      index.html
      360.jpg
    -->

    <img
      id="panoramaImage"
      src="360.jpg"
      crossorigin="anonymous">

  </a-assets>


  <!-- =====================================================
       360 PANORAMA
  ====================================================== -->

  <a-sky
    id="sky"
    src="#panoramaImage"
    rotation="0 0 0">
  </a-sky>


  <!-- =====================================================
       HOTSPOTS
  ====================================================== -->

  <a-entity id="hotspotContainer"></a-entity>


  <!-- =====================================================
       VR INFO CARD

       Ta objekt obstaja v 3D prostoru, zato ga A-Frame
       pravilno izriše za obe očesi.
  ====================================================== -->

  <a-entity
    id="vrInfo"
    visible="false">

    <a-plane
      id="vrInfoBackground"
      width="3.4"
      height="1.8"
      color="#ffffff"
      material="
        shader: flat;
        opacity: 0.96;
        transparent: true;
      ">
    </a-plane>

    <a-text
      id="vrInfoTitle"
      value=""
      color="#111111"
      width="3"
      align="center"
      anchor="center"
      position="0 0.45 0.015">
    </a-text>

    <a-text
      id="vrInfoDescription"
      value=""
      color="#333333"
      width="2.8"
      align="center"
      anchor="center"
      wrap-count="42"
      position="0 -0.15 0.015">
    </a-text>

  </a-entity>


  <!-- =====================================================
       CAMERA
  ====================================================== -->

  <a-entity
    id="cameraRig"
    position="0 0 0">

    <a-camera
      id="camera"

      position="0 0 0"

      wasd-controls="enabled: false"

      look-controls="
        enabled: true;
        magicWindowTrackingEnabled: true;
        touchEnabled: true;
        mouseEnabled: true;
        pointerLockEnabled: false;
      ">

      <!--
        RETICLE

        A-Frame ga v VR načinu sam izriše v stereo pogledu.
      -->

      <a-entity
        id="reticle"

        position="0 0 -1"

        cursor="
          fuse: true;
          fuseTimeout: 1200;
        "

        raycaster="
          objects: .hotspot;
          far: 100;
          interval: 50;
        "

        geometry="
          primitive: ring;
          radiusInner: 0.012;
          radiusOuter: 0.019;
        "

        material="
          color: #ffffff;
          shader: flat;
          opacity: 0.95;
        ">
      </a-entity>

    </a-camera>

  </a-entity>

</a-scene>


<!-- =======================================================
     HTML UI
======================================================== -->

<div id="toolbar">

  <button id="addBtn">
    + Dodaj hotspot
  </button>

  <button id="zoomInBtn">
    +
  </button>

  <button id="zoomOutBtn">
    −
  </button>

  <button id="fullscreenBtn">
    ⛶
  </button>

  <button id="vrBtn">
    🥽 CARDBOARD
  </button>

</div>


<div id="hint">
  Klikni na mesto v panorami
</div>


<!-- =======================================================
     HOTSPOT POPUP
======================================================== -->

<div id="popup">

  <button id="popupClose">
    ×
  </button>

  <div id="reader">

    <h2 id="readerTitle"></h2>

    <div id="readerDescription"></div>

    <button id="editBtn">
      Uredi
    </button>

  </div>


  <div id="editor">

    <label class="fieldLabel">
      Naslov
    </label>

    <input
      id="titleInput"
      type="text">


    <label class="fieldLabel">
      Opis
    </label>

    <textarea
      id="descriptionInput">
    </textarea>


    <div class="editorButtons">

      <button id="saveBtn">
        Shrani
      </button>

      <button id="cancelBtn">
        Prekliči
      </button>

      <button id="deleteBtn">
        Izbriši
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     CARDBOARD START
======================================================== -->

<div id="vrStart">

  <div id="vrStartBox">

    <h2>
      Samsung Galaxy A36
    </h2>

    <p>
      Obrni telefon vodoravno in ga vstavi v Cardboard očala.
    </p>

    <p>
      A-Frame bo prevzel stereo VR prikaz in žiroskop.
    </p>

    <button id="startVRBtn">
      ZAŽENI CARDBOARD
    </button>

    <button id="cancelVRBtn">
      Prekliči
    </button>

  </div>

</div>


<div id="rotateWarning">
  Obrni Samsung Galaxy A36 vodoravno
</div>


<script>
"use strict";

/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);

const scene =
  $("scene");

const camera =
  $("camera");

const sky =
  $("sky");

const hotspotContainer =
  $("hotspotContainer");

const reticle =
  $("reticle");

const vrInfo =
  $("vrInfo");

const vrInfoTitle =
  $("vrInfoTitle");

const vrInfoDescription =
  $("vrInfoDescription");


const toolbar =
  $("toolbar");

const addBtn =
  $("addBtn");

const zoomInBtn =
  $("zoomInBtn");

const zoomOutBtn =
  $("zoomOutBtn");

const fullscreenBtn =
  $("fullscreenBtn");

const vrBtn =
  $("vrBtn");

const hint =
  $("hint");


const popup =
  $("popup");

const popupClose =
  $("popupClose");

const reader =
  $("reader");

const editor =
  $("editor");

const readerTitle =
  $("readerTitle");

const readerDescription =
  $("readerDescription");

const editBtn =
  $("editBtn");

const titleInput =
  $("titleInput");

const descriptionInput =
  $("descriptionInput");

const saveBtn =
  $("saveBtn");

const cancelBtn =
  $("cancelBtn");

const deleteBtn =
  $("deleteBtn");


const vrStart =
  $("vrStart");

const startVRBtn =
  $("startVRBtn");

const cancelVRBtn =
  $("cancelVRBtn");

const rotateWarning =
  $("rotateWarning");


/* =========================================================
   STORAGE

   TOČNO ISTI KLJUČ KOT PREJ.

   Obstoječi hotspoti se zato ohranijo.
========================================================= */

const STORAGE_KEY =
  "stable-360-hotspots-v5";

let hotspots = [];

try {

  hotspots =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

}
catch (e) {

  hotspots = [];

}


function saveHotspots() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      hotspots
    )
  );

}


function getHotspot(id) {

  return hotspots.find(
    h => h.id === id
  );

}


/* =========================================================
   COORDINATE

   Ohranimo yaw/pitch format stare kode.
========================================================= */

function sphericalToVector(
  yaw,
  pitch,
  radius = 8
) {

  return {

    x:
      radius *
      Math.cos(pitch) *
      Math.sin(yaw),

    y:
      radius *
      Math.sin(pitch),

    z:
      -radius *
      Math.cos(pitch) *
      Math.cos(yaw)

  };

}


function vectorToSpherical(v) {

  const length =
    Math.sqrt(
      v.x * v.x +
      v.y * v.y +
      v.z * v.z
    );

  if (!length) {

    return {
      yaw: 0,
      pitch: 0
    };

  }

  const x =
    v.x / length;

  const y =
    v.y / length;

  const z =
    v.z / length;

  return {

    yaw:
      Math.atan2(
        x,
        -z
      ),

    pitch:
      Math.asin(
        Math.max(
          -1,
          Math.min(
            1,
            y
          )
        )
      )

  };

}


/* =========================================================
   HOTSPOT LABEL TEXTURE
========================================================= */

function makeHotspotCanvas(number) {

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    256;

  canvas.height =
    256;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    256,
    256
  );


  /*
    WHITE OUTER CIRCLE
  */

  ctx.beginPath();

  ctx.arc(
    128,
    128,
    112,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.fill();


  /*
    RED INNER CIRCLE
  */

  ctx.beginPath();

  ctx.arc(
    128,
    128,
    91,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ef3333";

  ctx.fill();


  /*
    NUMBER
  */

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "bold 100px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    String(number),
    128,
    136
  );


  return canvas;

}


/* =========================================================
   HOTSPOTS
========================================================= */

function renderHotspots() {

  while (
    hotspotContainer.firstChild
  ) {

    hotspotContainer.removeChild(
      hotspotContainer.firstChild
    );

  }


  hotspots.forEach(
    (hotspot, index) => {

      const position =
        sphericalToVector(
          hotspot.yaw,
          hotspot.pitch,
          8
        );


      const canvas =
        makeHotspotCanvas(
          index + 1
        );


      const dataURL =
        canvas.toDataURL(
          "image/png"
        );


      const marker =
        document.createElement(
          "a-image"
        );


      marker.setAttribute(
        "src",
        dataURL
      );


      marker.setAttribute(
        "position",
        `${position.x} ${position.y} ${position.z}`
      );


      marker.setAttribute(
        "width",
        "0.55"
      );


      marker.setAttribute(
        "height",
        "0.55"
      );


      marker.setAttribute(
        "transparent",
        "true"
      );


      marker.setAttribute(
        "material",
        "shader: flat; transparent: true; alphaTest: 0.05"
      );


      /*
        Billboard:
        A-Frame look-at component ni v osnovnem A-Frame,
        zato marker ročno obračamo proti centru.
      */

      marker.setAttribute(
        "look-at-center",
        ""
      );


      marker.classList.add(
        "hotspot"
      );


      marker.dataset.hotspotId =
        hotspot.id;


      marker.addEventListener(
        "click",
        () => {

          /*
            V VR:
            samo reader kartica.

            Normalno:
            HTML popup.
          */

          if (
            scene.is(
              "vr-mode"
            )
          ) {

            showVRInfo(
              hotspot.id
            );

          }
          else {

            openReader(
              hotspot.id
            );

          }

        }
      );


      hotspotContainer.appendChild(
        marker
      );

    }
  );

}


/* =========================================================
   BILLBOARD COMPONENT

   Marker je vedno obrnjen proti uporabniku.
========================================================= */

AFRAME.registerComponent(
  "look-at-center",
  {

    tick: function () {

      if (
        !this.el.object3D
      ) {
        return;
      }


      this.el.object3D.lookAt(
        0,
        0,
        0
      );

    }

  }
);


/* =========================================================
   VR INFO CARD BILLBOARD
========================================================= */

AFRAME.registerComponent(
  "vr-card-face-camera",
  {

    tick: function () {

      if (
        !this.el.object3D ||
        !camera ||
        !camera.object3D
      ) {
        return;
      }


      const cameraPosition =
        new THREE.Vector3();


      camera.object3D.getWorldPosition(
        cameraPosition
      );


      this.el.object3D.lookAt(
        cameraPosition
      );

    }

  }
);


vrInfo.setAttribute(
  "vr-card-face-camera",
  ""
);


/* =========================================================
   INITIAL HOTSPOTS
========================================================= */

scene.addEventListener(
  "loaded",
  () => {

    renderHotspots();

  }
);


/* =========================================================
   POPUP
========================================================= */

let selectedHotspotId =
  null;


function closePopup() {

  popup.style.display =
    "none";

  selectedHotspotId =
    null;

}


function openReader(id) {

  const hotspot =
    getHotspot(id);


  if (!hotspot) {
    return;
  }


  selectedHotspotId =
    id;


  readerTitle.textContent =
    hotspot.title ||
    "Brez naslova";


  readerDescription.textContent =
    hotspot.description ||
    "Ni opisa.";


  editor.style.display =
    "none";


  reader.style.display =
    "block";


  popup.style.display =
    "block";


  positionPopup();

}


function openEditor(id) {

  const hotspot =
    getHotspot(id);


  if (!hotspot) {
    return;
  }


  selectedHotspotId =
    id;


  titleInput.value =
    hotspot.title ||
    "";


  descriptionInput.value =
    hotspot.description ||
    "";


  reader.style.display =
    "none";


  editor.style.display =
    "block";


  popup.style.display =
    "block";


  positionPopup();

}


popupClose.onclick =
  closePopup;


editBtn.onclick =
  () => {

    if (
      selectedHotspotId
    ) {

      openEditor(
        selectedHotspotId
      );

    }

  };


saveBtn.onclick =
  () => {

    const hotspot =
      getHotspot(
        selectedHotspotId
      );


    if (!hotspot) {
      return;
    }


    hotspot.title =
      titleInput.value.trim();


    hotspot.description =
      descriptionInput.value.trim();


    saveHotspots();

    renderHotspots();

    openReader(
      hotspot.id
    );

  };


cancelBtn.onclick =
  () => {

    const hotspot =
      getHotspot(
        selectedHotspotId
      );


    if (
      hotspot &&
      (
        hotspot.title ||
        hotspot.description
      )
    ) {

      openReader(
        hotspot.id
      );

    }
    else {

      closePopup();

    }

  };


deleteBtn.onclick =
  () => {

    if (
      !selectedHotspotId
    ) {
      return;
    }


    hotspots =
      hotspots.filter(
        hotspot =>
          hotspot.id !==
          selectedHotspotId
      );


    saveHotspots();

    closePopup();

    renderHotspots();

  };


/* =========================================================
   POPUP POSITION
========================================================= */

function positionPopup() {

  if (
    !selectedHotspotId ||
    popup.style.display === "none" ||
    scene.is("vr-mode")
  ) {

    return;

  }


  const hotspot =
    getHotspot(
      selectedHotspotId
    );


  if (!hotspot) {
    return;
  }


  const marker =
    [...hotspotContainer.children]
      .find(
        el =>
          el.dataset.hotspotId ===
          selectedHotspotId
      );


  if (
    !marker ||
    !marker.object3D ||
    !scene.camera
  ) {

    return;

  }


  const worldPosition =
    new THREE.Vector3();


  marker.object3D.getWorldPosition(
    worldPosition
  );


  const cameraWorld =
    new THREE.Vector3();


  scene.camera.getWorldPosition(
    cameraWorld
  );


  const cameraDirection =
    new THREE.Vector3();


  scene.camera.getWorldDirection(
    cameraDirection
  );


  const toMarker =
    worldPosition
      .clone()
      .sub(
        cameraWorld
      )
      .normalize();


  /*
    Hotspot za kamero.
  */

  if (
    cameraDirection.dot(
      toMarker
    ) <= 0
  ) {

    popup.style.visibility =
      "hidden";

    return;

  }


  popup.style.visibility =
    "visible";


  worldPosition.project(
    scene.camera
  );


  const x =
    (
      worldPosition.x + 1
    ) *
    0.5 *
    window.innerWidth;


  const y =
    (
      -worldPosition.y + 1
    ) *
    0.5 *
    window.innerHeight;


  const width =
    popup.offsetWidth;


  const height =
    popup.offsetHeight;


  let left;


  if (
    x <
    window.innerWidth / 2
  ) {

    left =
      x + 28;

  }
  else {

    left =
      x -
      width -
      28;

  }


  let top =
    y -
    height / 2;


  left =
    Math.max(
      8,
      Math.min(
        window.innerWidth -
        width -
        8,
        left
      )
    );


  top =
    Math.max(
      8,
      Math.min(
        window.innerHeight -
        height -
        8,
        top
      )
    );


  popup.style.left =
    left + "px";


  popup.style.top =
    top + "px";

}


/* =========================================================
   ADD HOTSPOT
========================================================= */

let addMode =
  false;


function stopAddMode() {

  addMode =
    false;


  addBtn.classList.remove(
    "active"
  );


  addBtn.textContent =
    "+ Dodaj hotspot";


  hint.style.display =
    "none";

}


addBtn.onclick =
  () => {

    if (
      scene.is(
        "vr-mode"
      )
    ) {

      return;

    }


    closePopup();


    addMode =
      !addMode;


    if (
      addMode
    ) {

      addBtn.classList.add(
        "active"
      );


      addBtn.textContent =
        "Klikni v panoramo";


      hint.style.display =
        "block";

    }
    else {

      stopAddMode();

    }

  };


/* =========================================================
   CLICK ON PANORAMA TO ADD HOTSPOT

   Uporabimo A-Frame/Three.js kamero in raycaster.
========================================================= */

scene.addEventListener(
  "loaded",
  () => {

    const sceneCanvas =
      scene.canvas;


    sceneCanvas.addEventListener(
      "click",
      event => {

        if (
          !addMode ||
          scene.is(
            "vr-mode"
          )
        ) {

          return;

        }


        /*
          Če smo kliknili obstoječi hotspot,
          ne dodamo novega.
        */

        if (
          event.target &&
          event.target.closest &&
          event.target.closest(
            ".hotspot"
          )
        ) {

          return;

        }


        const rect =
          sceneCanvas.getBoundingClientRect();


        const mouse =
          new THREE.Vector2(

            (
              (
                event.clientX -
                rect.left
              ) /
              rect.width
            ) *
            2 -
            1,

            -(
              (
                event.clientY -
                rect.top
              ) /
              rect.height
            ) *
            2 +
            1

          );


        const raycaster =
          new THREE.Raycaster();


        raycaster.setFromCamera(
          mouse,
          scene.camera
        );


        const direction =
          raycaster
            .ray
            .direction
            .clone()
            .normalize();


        const spherical =
          vectorToSpherical(
            direction
          );


        const hotspot = {

          id:
            "hs-" +
            Date.now() +
            "-" +
            Math.random()
              .toString(36)
              .slice(
                2,
                7
              ),

          yaw:
            spherical.yaw,

          pitch:
            spherical.pitch,

          title:
            "",

          description:
            ""

        };


        hotspots.push(
          hotspot
        );


        saveHotspots();

        renderHotspots();

        stopAddMode();


        /*
          Počakamo en frame,
          da A-Frame ustvari object3D.
        */

        requestAnimationFrame(
          () => {

            openEditor(
              hotspot.id
            );

          }
        );

      }
    );

  }
);


/* =========================================================
   ZOOM

   A-Frame kamera uporablja Three.js PerspectiveCamera.
========================================================= */

let normalFov =
  80;


function setFov(
  value
) {

  normalFov =
    Math.max(
      35,
      Math.min(
        100,
        value
      )
    );


  if (
    camera &&
    camera.components &&
    camera.components.camera &&
    camera.components.camera.camera
  ) {

    const threeCamera =
      camera
        .components
        .camera
        .camera;


    threeCamera.fov =
      normalFov;


    threeCamera.updateProjectionMatrix();

  }

}


zoomInBtn.onclick =
  () => {

    setFov(
      normalFov - 8
    );

  };


zoomOutBtn.onclick =
  () => {

    setFov(
      normalFov + 8
    );

  };


scene.addEventListener(
  "loaded",
  () => {

    setFov(
      normalFov
    );


    scene.canvas.addEventListener(
      "wheel",
      event => {

        if (
          scene.is(
            "vr-mode"
          )
        ) {

          return;

        }


        event.preventDefault();


        setFov(

          normalFov +

          (
            event.deltaY > 0
              ? 4
              : -4
          )

        );

      },

      {
        passive: false
      }

    );

  }
);


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.onclick =
  async () => {

    try {

      if (
        !document.fullscreenElement
      ) {

        if (
          document.documentElement
            .requestFullscreen
        ) {

          await document
            .documentElement
            .requestFullscreen();

        }

      }
      else {

        if (
          document.exitFullscreen
        ) {

          await document
            .exitFullscreen();

        }

      }

    }
    catch (e) {}

  };


/* =========================================================
   VR INFO CARD
========================================================= */

function hideVRInfo() {

  vrInfo.setAttribute(
    "visible",
    false
  );

}


function showVRInfo(id) {

  const hotspot =
    getHotspot(id);


  if (!hotspot) {
    return;
  }


  vrInfoTitle.setAttribute(
    "value",
    hotspot.title ||
    "Brez naslova"
  );


  vrInfoDescription.setAttribute(
    "value",
    hotspot.description ||
    "Ni opisa."
  );


  /*
    Postavimo kartico 2.6 m pred trenutno smer pogleda.
  */

  const threeCamera =
    scene.camera;


  if (!threeCamera) {
    return;
  }


  const cameraPosition =
    new THREE.Vector3();


  const direction =
    new THREE.Vector3();


  threeCamera.getWorldPosition(
    cameraPosition
  );


  threeCamera.getWorldDirection(
    direction
  );


  const position =
    cameraPosition
      .clone()
      .add(
        direction
          .multiplyScalar(
            2.6
          )
      );


  vrInfo.object3D.position.copy(
    position
  );


  vrInfo.object3D.lookAt(
    cameraPosition
  );


  vrInfo.setAttribute(
    "visible",
    true
  );

}


/* =========================================================
   RETICLE / DWELL

   A-Frame cursor s fuseTimeout 1200 naredi gaze click.
========================================================= */

reticle.addEventListener(
  "fusing",
  event => {

    /*
      Vizualna indikacija:
      reticle med 1.2 s postane zelen.
    */

    reticle.setAttribute(
      "material",
      "color",
      "#22c55e"
    );

  }
);


reticle.addEventListener(
  "mouseleave",
  () => {

    reticle.setAttribute(
      "material",
      "color",
      "#ffffff"
    );

  }
);


reticle.addEventListener(
  "click",
  event => {

    const target =
      event.detail &&
      event.detail.intersectedEl;


    if (
      !target ||
      !target.classList.contains(
        "hotspot"
      )
    ) {

      return;

    }


    const id =
      target.dataset.hotspotId;


    if (
      scene.is(
        "vr-mode"
      )
    ) {

      showVRInfo(
        id
      );

    }

  }
);


/* =========================================================
   WAKE LOCK
========================================================= */

let wakeLock =
  null;


async function acquireWakeLock() {

  if (
    !(
      "wakeLock" in
      navigator
    )
  ) {

    return;

  }


  try {

    if (
      wakeLock &&
      !wakeLock.released
    ) {

      return;

    }


    wakeLock =
      await navigator
        .wakeLock
        .request(
          "screen"
        );


    wakeLock.addEventListener(
      "release",
      () => {

        wakeLock =
          null;

      }
    );

  }
  catch (e) {}

}


async function releaseWakeLock() {

  if (
    !wakeLock
  ) {

    return;

  }


  try {

    await wakeLock.release();

  }
  catch (e) {}


  wakeLock =
    null;

}


/* =========================================================
   CARDBOARD BUTTON
========================================================= */

vrBtn.onclick =
  () => {

    closePopup();

    stopAddMode();

    vrStart.style.display =
      "flex";

  };


cancelVRBtn.onclick =
  () => {

    vrStart.style.display =
      "none";

  };


startVRBtn.onclick =
  async () => {

    /*
      iOS motion permission.
      Samsung/Android tega običajno ne potrebuje.
    */

    if (
      typeof DeviceOrientationEvent !==
        "undefined" &&

      typeof DeviceOrientationEvent
        .requestPermission ===
        "function"
    ) {

      try {

        const permission =
          await DeviceOrientationEvent
            .requestPermission();


        if (
          permission !==
          "granted"
        ) {

          alert(
            "Dovoljenje za senzor gibanja ni bilo odobreno."
          );

          return;

        }

      }
      catch (e) {

        return;

      }

    }


    vrStart.style.display =
      "none";


    /*
      Poskus landscape orientacije.
    */

    try {

      if (
        screen.orientation &&
        screen.orientation.lock
      ) {

        await screen.orientation.lock(
          "landscape"
        );

      }

    }
    catch (e) {}


    /*
      KLJUČNA SPREMEMBA:

      Ne ustvarjamo svojih:
      - StereoCamera
      - shaderjev
      - render targetov
      - left/right viewportov

      A-Frame vstopi v VR.
    */

    try {

      await scene.enterVR();

    }
    catch (e) {

      alert(
        "Brskalnik ni uspel zagnati VR načina."
      );

    }

  };


/* =========================================================
   ENTER VR
========================================================= */

scene.addEventListener(
  "enter-vr",
  async () => {

    toolbar.style.display =
      "none";


    popup.style.display =
      "none";


    hint.style.display =
      "none";


    hideVRInfo();


    await acquireWakeLock();


    checkOrientation();

  }
);


/* =========================================================
   EXIT VR
========================================================= */

scene.addEventListener(
  "exit-vr",
  async () => {

    toolbar.style.display =
      "flex";


    rotateWarning.style.display =
      "none";


    hideVRInfo();


    await releaseWakeLock();


    try {

      if (
        screen.orientation &&
        screen.orientation.unlock
      ) {

        screen.orientation.unlock();

      }

    }
    catch (e) {}

  }
);


/* =========================================================
   ORIENTATION
========================================================= */

function checkOrientation() {

  if (
    !scene.is(
      "vr-mode"
    )
  ) {

    rotateWarning.style.display =
      "none";

    return;

  }


  if (
    window.innerHeight >
    window.innerWidth
  ) {

    rotateWarning.style.display =
      "flex";

  }
  else {

    rotateWarning.style.display =
      "none";

  }

}


window.addEventListener(
  "resize",
  checkOrientation
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      checkOrientation,
      300
    );

  }
);


/* =========================================================
   WAKE LOCK RETURN
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
        "visible" &&

      scene.is(
        "vr-mode"
      )
    ) {

      acquireWakeLock();

    }

  }
);


/* =========================================================
   POPUP FOLLOW HOTSPOT
========================================================= */

function uiLoop() {

  requestAnimationFrame(
    uiLoop
  );


  if (
    !scene.is(
      "vr-mode"
    )
  ) {

    positionPopup();

  }

}


uiLoop();

</script>
