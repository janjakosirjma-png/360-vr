<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>360 Panorama</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea{
    font:inherit;
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#000;
    touch-action:none;
}

/* =========================================================
   TOOLBAR
========================================================= */

#toolbar{
    position:fixed;
    z-index:100;
    top:12px;
    left:12px;

    display:flex;
    gap:7px;
    align-items:center;
    flex-wrap:wrap;

    padding:8px;

    background:rgba(15,15,15,.88);
    border-radius:14px;
}

.tool{
    min-height:42px;
    padding:0 13px;

    border:0;
    border-radius:9px;

    background:#333;
    color:#fff;

    font-weight:700;
    cursor:pointer;
}

#addBtn{
    background:#2563eb;
}

#addBtn.active{
    background:#16a34a;
}

#cardboardBtn{
    background:#7c3aed;
}

#hint{
    position:fixed;
    z-index:120;

    display:none;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    padding:11px 18px;

    background:rgba(0,0,0,.82);
    color:#fff;

    border-radius:30px;

    pointer-events:none;
}

/* =========================================================
   HOTSPOT POPUP
========================================================= */

#popup{
    position:fixed;
    z-index:200;

    display:none;

    width:330px;
    max-width:calc(100vw - 24px);

    padding:18px;

    background:#fff;
    color:#111;

    border-radius:14px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);
}

#popupClose{
    position:absolute;

    top:8px;
    right:8px;

    width:30px;
    height:30px;

    padding:0;

    border:0;
    border-radius:50%;

    background:#eee;

    font-size:20px;

    cursor:pointer;
}

#reader,
#editor{
    display:none;
}

#readerTitle{
    margin:0 35px 10px 0;
}

#readerDescription{
    margin-bottom:15px;

    line-height:1.5;
    white-space:pre-wrap;
}

#editBtn{
    width:100%;

    padding:10px;

    border:0;
    border-radius:8px;

    background:#2563eb;
    color:#fff;

    font-weight:bold;

    cursor:pointer;
}

.fieldLabel{
    display:block;

    margin:9px 0 4px;

    font-size:12px;
    font-weight:bold;
}

#titleInput,
#descriptionInput{
    width:100%;

    padding:10px;

    border:1px solid #bbb;
    border-radius:8px;
}

#descriptionInput{
    min-height:115px;
    resize:vertical;
}

.editorButtons{
    display:flex;
    gap:7px;

    margin-top:10px;
}

.editorButtons button{
    flex:1;

    padding:10px;

    border:0;
    border-radius:8px;

    font-weight:bold;

    cursor:pointer;
}

#saveBtn{
    background:#16a34a;
    color:#fff;
}

#cancelBtn{
    background:#ddd;
}

#deleteBtn{
    background:#dc2626;
    color:#fff;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;

    z-index:500;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.94);
}

.modalBox{
    width:390px;
    max-width:100%;

    padding:24px;

    background:#fff;
    color:#111;

    border-radius:17px;

    text-align:center;
}

.modalBox h2{
    margin-top:0;
}

.modalBox button{
    width:100%;

    margin-top:8px;
    padding:13px;

    border:0;
    border-radius:9px;

    font-weight:bold;

    cursor:pointer;
}

#startCardboardBtn,
#sensorBtn{
    background:#7c3aed;
    color:#fff;
}

#cancelCardboardBtn{
    background:#ddd;
}

/* =========================================================
   CARDBOARD UI
========================================================= */

#cardboardUI{
    position:fixed;
    inset:0;

    z-index:300;

    display:none;

    pointer-events:none;
}

.reticle{
    position:absolute;

    top:50%;

    width:24px;
    height:24px;

    transform:
        translate(-50%,-50%);

    border:2px solid #fff;
    border-radius:50%;

    box-shadow:
        0 0 3px #000,
        0 0 8px #000;
}

.reticle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:4px;
    height:4px;

    transform:
        translate(-50%,-50%);

    background:#fff;

    border-radius:50%;
}

/*
    YT REFERENCA:

    center levega okna ~30.44 %
    center desnega ~69.48 %
*/

#reticleLeft{
    left:30.44%;
}

#reticleRight{
    left:69.48%;
}

.reticle.active{
    animation:
        gazeProgress 1.2s linear forwards;
}

@keyframes gazeProgress{
    from{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1.7);
    }
}

#exitCardboardBtn{
    position:absolute;

    top:10px;
    right:10px;

    z-index:400;

    width:46px;
    height:46px;

    padding:0;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.72);
    color:#fff;

    font-size:28px;

    pointer-events:auto;

    cursor:pointer;
}

@media(max-width:700px){

    #toolbar{
        top:7px;
        left:7px;
        right:7px;

        justify-content:center;
    }

    .tool{
        min-height:38px;

        padding:0 9px;

        font-size:12px;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="toolbar">

    <button
        type="button"
        id="addBtn"
        class="tool"
    >
        + Dodaj hotspot
    </button>

    <button
        type="button"
        id="zoomInBtn"
        class="tool"
    >
        +
    </button>

    <button
        type="button"
        id="zoomOutBtn"
        class="tool"
    >
        −
    </button>

    <button
        type="button"
        id="fullscreenBtn"
        class="tool"
    >
        ⛶
    </button>

    <button
        type="button"
        id="cardboardBtn"
        class="tool"
    >
        🥽 CARDBOARD
    </button>

</div>

<div id="hint">
    Klikni na mesto v panorami
</div>

<div id="popup">

    <button
        type="button"
        id="popupClose"
    >
        ×
    </button>

    <div id="reader">

        <h2 id="readerTitle"></h2>

        <div id="readerDescription"></div>

        <button
            type="button"
            id="editBtn"
        >
            Uredi
        </button>

    </div>

    <div id="editor">

        <label class="fieldLabel">
            Naslov
        </label>

        <input
            id="titleInput"
            type="text"
            placeholder="Naslov"
        >

        <label class="fieldLabel">
            Opis
        </label>

        <textarea
            id="descriptionInput"
            placeholder="Opis..."
        ></textarea>

        <div class="editorButtons">

            <button
                type="button"
                id="saveBtn"
            >
                Shrani
            </button>

            <button
                type="button"
                id="cancelBtn"
            >
                Prekliči
            </button>

            <button
                type="button"
                id="deleteBtn"
            >
                Izbriši
            </button>

        </div>

    </div>

</div>

<div
    id="cardboardStart"
    class="modal"
>
    <div class="modalBox">

        <h2>🥽 Cardboard</h2>

        <p>
            Obrni telefon vodoravno in ga vstavi v očala.
        </p>

        <button
            type="button"
            id="startCardboardBtn"
        >
            ZAŽENI
        </button>

        <button
            type="button"
            id="cancelCardboardBtn"
        >
            Prekliči
        </button>

    </div>
</div>

<div
    id="sensorModal"
    class="modal"
>
    <div class="modalBox">

        <h2>Senzor gibanja</h2>

        <p>
            Dovoli uporabo senzorjev telefona.
        </p>

        <button
            type="button"
            id="sensorBtn"
        >
            DOVOLI IN ZAŽENI
        </button>

    </div>
</div>

<div id="cardboardUI">

    <div
        id="reticleLeft"
        class="reticle"
    ></div>

    <div
        id="reticleRight"
        class="reticle"
    ></div>

    <button
        type="button"
        id="exitCardboardBtn"
    >
        ×
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   DOM
========================================================= */

const $ = id =>
    document.getElementById(id);

const canvas =
    $("canvas");

const toolbar =
    $("toolbar");

const addBtn =
    $("addBtn");

const zoomInBtn =
    $("zoomInBtn");

const zoomOutBtn =
    $("zoomOutBtn");

const fullscreenBtn =
    $("fullscreenBtn");

const cardboardBtn =
    $("cardboardBtn");

const hint =
    $("hint");

const popup =
    $("popup");

const popupClose =
    $("popupClose");

const reader =
    $("reader");

const editor =
    $("editor");

const readerTitle =
    $("readerTitle");

const readerDescription =
    $("readerDescription");

const editBtn =
    $("editBtn");

const titleInput =
    $("titleInput");

const descriptionInput =
    $("descriptionInput");

const saveBtn =
    $("saveBtn");

const cancelBtn =
    $("cancelBtn");

const deleteBtn =
    $("deleteBtn");

const cardboardStart =
    $("cardboardStart");

const startCardboardBtn =
    $("startCardboardBtn");

const cancelCardboardBtn =
    $("cancelCardboardBtn");

const sensorModal =
    $("sensorModal");

const sensorBtn =
    $("sensorBtn");

const cardboardUI =
    $("cardboardUI");

const reticleLeft =
    $("reticleLeft");

const reticleRight =
    $("reticleRight");

const exitCardboardBtn =
    $("exitCardboardBtn");

/* =========================================================
   THREE CHECK
========================================================= */

if(typeof THREE === "undefined"){

    alert(
        "Three.js se ni naložil."
    );

    throw new Error(
        "THREE missing"
    );
}

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        canvas:canvas,

        antialias:true,

        alpha:false,

        powerPreference:
            "high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setClearColor(
    0x000000,
    1
);

renderer.autoClear = true;

/* =========================================================
   MAIN 360 SCENE
========================================================= */

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.01,
        200
    );

camera.position.set(
    0,
    0,
    0
);

/* =========================================================
   PANORAMA
========================================================= */

const sphereGeometry =
    new THREE.SphereGeometry(
        50,
        64,
        40
    );

sphereGeometry.scale(
    -1,
    1,
    1
);

const panoramaMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });

const panoramaSphere =
    new THREE.Mesh(
        sphereGeometry,
        panoramaMaterial
    );

scene.add(
    panoramaSphere
);

const textureLoader =
    new THREE.TextureLoader();

textureLoader.load(

    "360.jpg",

    texture => {

        texture.colorSpace =
            THREE.SRGBColorSpace;

        texture.minFilter =
            THREE.LinearFilter;

        texture.magFilter =
            THREE.LinearFilter;

        panoramaMaterial.map =
            texture;

        panoramaMaterial.needsUpdate =
            true;
    },

    undefined,

    () => {

        alert(
            "360.jpg se ni naložil. " +
            "360.jpg mora biti v isti mapi kot index.html."
        );
    }
);

/* =========================================================
   NORMAL CAMERA
========================================================= */

let normalYaw = 0;

let normalPitch = 0;

let normalFov = 75;

function updateNormalCamera(){

    camera.rotation.order =
        "YXZ";

    camera.rotation.set(
        normalPitch,
        normalYaw,
        0
    );
}

updateNormalCamera();

/* =========================================================
   HOTSPOTS
========================================================= */

const STORAGE_KEY =
    "stable-360-hotspots-v5";

let hotspots = [];

try{

    hotspots =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            )
        ) || [];
}
catch(error){

    hotspots = [];
}

function saveHotspots(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(hotspots)
    );
}

const hotspotGroup =
    new THREE.Group();

scene.add(
    hotspotGroup
);

let hotspotMeshes = [];

function sphericalToVector(
    yaw,
    pitch,
    radius = 47
){

    return new THREE.Vector3(

        radius *
        Math.cos(pitch) *
        Math.sin(yaw),

        radius *
        Math.sin(pitch),

        -radius *
        Math.cos(pitch) *
        Math.cos(yaw)
    );
}

function directionToSpherical(
    direction
){

    return {

        yaw:
            Math.atan2(
                direction.x,
                -direction.z
            ),

        pitch:
            Math.asin(
                THREE.MathUtils.clamp(
                    direction.y,
                    -1,
                    1
                )
            )
    };
}

/* =========================================================
   HOTSPOT TEXTURE
========================================================= */

function createHotspotTexture(
    number
){

    const c =
        document.createElement(
            "canvas"
        );

    c.width = 256;
    c.height = 256;

    const ctx =
        c.getContext("2d");

    ctx.clearRect(
        0,
        0,
        256,
        256
    );

    ctx.beginPath();

    ctx.arc(
        128,
        128,
        113,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        128,
        128,
        91,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ef3333";

    ctx.fill();

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 100px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        String(number),
        128,
        136
    );

    const texture =
        new THREE.CanvasTexture(c);

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}

/* =========================================================
   RENDER HOTSPOTS
========================================================= */

function renderHotspots(){

    for(
        const sprite of
        hotspotMeshes
    ){

        hotspotGroup.remove(
            sprite
        );

        if(sprite.material.map){

            sprite.material.map.dispose();
        }

        sprite.material.dispose();
    }

    hotspotMeshes = [];

    hotspots.forEach(
        (hotspot,index) => {

            const material =
                new THREE.SpriteMaterial({

                    map:
                        createHotspotTexture(
                            index + 1
                        ),

                    transparent:true,

                    depthTest:false,

                    depthWrite:false
                });

            const sprite =
                new THREE.Sprite(
                    material
                );

            sprite.position.copy(

                sphericalToVector(
                    hotspot.yaw,
                    hotspot.pitch
                )
            );

            sprite.scale.set(
                2.35,
                2.35,
                1
            );

            sprite.userData.hotspotId =
                hotspot.id;

            hotspotGroup.add(
                sprite
            );

            hotspotMeshes.push(
                sprite
            );
        }
    );
}

renderHotspots();

/* =========================================================
   HOTSPOT LOOKUP
========================================================= */

let selectedHotspotId =
    null;

function getHotspot(id){

    return hotspots.find(
        hotspot =>
            hotspot.id === id
    );
}

/* =========================================================
   POPUP
========================================================= */

function openReader(id){

    const hotspot =
        getHotspot(id);

    if(!hotspot)
        return;

    selectedHotspotId =
        id;

    readerTitle.textContent =
        hotspot.title ||
        "Brez naslova";

    readerDescription.textContent =
        hotspot.description ||
        "Ni opisa.";

    editor.style.display =
        "none";

    reader.style.display =
        "block";

    popup.style.display =
        "block";

    popup.style.visibility =
        "visible";

    positionPopup();
}

function openEditor(id){

    const hotspot =
        getHotspot(id);

    if(!hotspot)
        return;

    selectedHotspotId =
        id;

    titleInput.value =
        hotspot.title || "";

    descriptionInput.value =
        hotspot.description || "";

    reader.style.display =
        "none";

    editor.style.display =
        "block";

    popup.style.display =
        "block";

    popup.style.visibility =
        "visible";

    positionPopup();
}

function closePopup(){

    popup.style.display =
        "none";

    popup.style.visibility =
        "visible";

    selectedHotspotId =
        null;
}

popupClose.addEventListener(
    "click",
    closePopup
);

editBtn.addEventListener(
    "click",
    () => {

        if(selectedHotspotId){

            openEditor(
                selectedHotspotId
            );
        }
    }
);

saveBtn.addEventListener(
    "click",
    () => {

        const hotspot =
            getHotspot(
                selectedHotspotId
            );

        if(!hotspot)
            return;

        hotspot.title =
            titleInput.value.trim();

        hotspot.description =
            descriptionInput
                .value
                .trim();

        saveHotspots();

        openReader(
            hotspot.id
        );
    }
);

cancelBtn.addEventListener(
    "click",
    () => {

        const hotspot =
            getHotspot(
                selectedHotspotId
            );

        if(
            hotspot &&
            (
                hotspot.title ||
                hotspot.description
            )
        ){

            openReader(
                hotspot.id
            );
        }
        else{

            closePopup();
        }
    }
);

deleteBtn.addEventListener(
    "click",
    () => {

        if(!selectedHotspotId)
            return;

        hotspots =
            hotspots.filter(
                hotspot =>
                    hotspot.id !==
                    selectedHotspotId
            );

        saveHotspots();

        closePopup();

        renderHotspots();
    }
);

/* =========================================================
   POPUP POSITION
========================================================= */

function positionPopup(){

    if(
        cardboardMode ||
        !selectedHotspotId ||
        popup.style.display ===
            "none"
    ){
        return;
    }

    const hotspot =
        getHotspot(
            selectedHotspotId
        );

    if(!hotspot)
        return;

    const world =
        sphericalToVector(
            hotspot.yaw,
            hotspot.pitch
        );

    const forward =
        new THREE.Vector3();

    camera.getWorldDirection(
        forward
    );

    const direction =
        world
            .clone()
            .normalize();

    if(
        forward.dot(direction) <= 0
    ){

        popup.style.visibility =
            "hidden";

        return;
    }

    popup.style.visibility =
        "visible";

    const projected =
        world.clone();

    projected.project(
        camera
    );

    const x =
        (
            projected.x + 1
        ) *
        0.5 *
        innerWidth;

    const y =
        (
            -projected.y + 1
        ) *
        0.5 *
        innerHeight;

    const popupWidth =
        popup.offsetWidth;

    const popupHeight =
        popup.offsetHeight;

    let left;

    if(x < innerWidth / 2){

        left =
            x + 30;
    }
    else{

        left =
            x -
            popupWidth -
            30;
    }

    let top =
        y -
        popupHeight / 2;

    left =
        THREE.MathUtils.clamp(
            left,
            8,
            innerWidth -
                popupWidth -
                8
        );

    top =
        THREE.MathUtils.clamp(
            top,
            8,
            innerHeight -
                popupHeight -
                8
        );

    popup.style.left =
        left + "px";

    popup.style.top =
        top + "px";
}

/* =========================================================
   ADD MODE
========================================================= */

let addMode =
    false;

function stopAddMode(){

    addMode =
        false;

    addBtn.classList.remove(
        "active"
    );

    addBtn.textContent =
        "+ Dodaj hotspot";

    hint.style.display =
        "none";
}

addBtn.addEventListener(
    "click",
    () => {

        if(cardboardMode)
            return;

        closePopup();

        addMode =
            !addMode;

        if(addMode){

            addBtn.classList.add(
                "active"
            );

            addBtn.textContent =
                "Klikni v panoramo";

            hint.style.display =
                "block";
        }
        else{

            stopAddMode();
        }
    }
);

/* =========================================================
   NORMAL POINTER CONTROL
========================================================= */

let pointerDown =
    false;

let pointerMoved =
    false;

let pointerStartX =
    0;

let pointerStartY =
    0;

let pointerLastX =
    0;

let pointerLastY =
    0;

canvas.addEventListener(
    "pointerdown",
    event => {

        if(cardboardMode)
            return;

        pointerDown =
            true;

        pointerMoved =
            false;

        pointerStartX =
            event.clientX;

        pointerStartY =
            event.clientY;

        pointerLastX =
            event.clientX;

        pointerLastY =
            event.clientY;

        try{

            canvas.setPointerCapture(
                event.pointerId
            );
        }
        catch(error){}
    }
);

canvas.addEventListener(
    "pointermove",
    event => {

        if(
            !pointerDown ||
            cardboardMode
        ){
            return;
        }

        const dx =
            event.clientX -
            pointerLastX;

        const dy =
            event.clientY -
            pointerLastY;

        if(
            Math.hypot(
                event.clientX -
                    pointerStartX,

                event.clientY -
                    pointerStartY
            ) > 6
        ){

            pointerMoved =
                true;
        }

        if(!addMode){

            normalYaw -=
                dx * 0.004;

            normalPitch -=
                dy * 0.004;

            normalPitch =
                THREE.MathUtils.clamp(
                    normalPitch,
                    -Math.PI / 2 +
                        0.05,
                    Math.PI / 2 -
                        0.05
                );

            updateNormalCamera();
        }

        pointerLastX =
            event.clientX;

        pointerLastY =
            event.clientY;
    }
);

canvas.addEventListener(
    "pointerup",
    event => {

        if(cardboardMode)
            return;

        pointerDown =
            false;

        if(pointerMoved)
            return;

        const rect =
            canvas
                .getBoundingClientRect();

        const mouse =
            new THREE.Vector2(

                (
                    (
                        event.clientX -
                        rect.left
                    ) /
                    rect.width
                ) *
                2 -
                1,

                -(
                    (
                        event.clientY -
                        rect.top
                    ) /
                    rect.height
                ) *
                2 +
                1
            );

        const raycaster =
            new THREE.Raycaster();

        raycaster.setFromCamera(
            mouse,
            camera
        );

        if(!addMode){

            const hits =
                raycaster
                    .intersectObjects(
                        hotspotMeshes,
                        false
                    );

            if(hits.length){

                openReader(
                    hits[0]
                        .object
                        .userData
                        .hotspotId
                );

                return;
            }
        }

        if(!addMode)
            return;

        const direction =
            raycaster
                .ray
                .direction
                .clone()
                .normalize();

        const spherical =
            directionToSpherical(
                direction
            );

        const hotspot = {

            id:
                "hs-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2,7),

            yaw:
                spherical.yaw,

            pitch:
                spherical.pitch,

            title:"",

            description:""
        };

        hotspots.push(
            hotspot
        );

        saveHotspots();

        renderHotspots();

        stopAddMode();

        openEditor(
            hotspot.id
        );
    }
);

let wakeLock =
    null;

async function requestWakeLock(){

    if(
        !("wakeLock" in navigator)
    ){
        return;
    }

    try{

        if(
            wakeLock &&
            !wakeLock.released
        ){
            return;
        }

        wakeLock =
            await navigator
                .wakeLock
                .request(
                    "screen"
                );

        wakeLock.addEventListener(
            "release",
            () => {

                wakeLock =
                    null;
            }
        );
    }
    catch(error){}
}

async function releaseWakeLock(){

    if(!wakeLock)
        return;

    try{

        await wakeLock.release();
    }
    catch(error){}

    wakeLock =
        null;
}

document.addEventListener(

/* =========================================================
   DEVICE ORIENTATION
========================================================= */

let sensorAlpha =
    0;

let sensorBeta =
    0;

let sensorGamma =
    0;

let sensorAvailable =
    false;

function orientationHandler(
    event
){

    if(event.alpha === null)
        return;

    sensorAlpha =
        event.alpha || 0;

    sensorBeta =
        event.beta || 0;

    sensorGamma =
        event.gamma || 0;

    sensorAvailable =
        true;
}

const deviceEuler =
    new THREE.Euler();

const deviceQuaternion =
    new THREE.Quaternion();

const screenQuaternion =
    new THREE.Quaternion();

const zee =
    new THREE.Vector3(
        0,
        0,
        1
    );

const q1 =
    new THREE.Quaternion(
        -Math.sqrt(0.5),
        0,
        0,
        Math.sqrt(0.5)
    );

function updateGyroscope(){

    if(!sensorAvailable)
        return;

    const alpha =
        THREE.MathUtils.degToRad(
            sensorAlpha
        );

    const beta =
        THREE.MathUtils.degToRad(
            sensorBeta
        );

    const gamma =
        THREE.MathUtils.degToRad(
            sensorGamma
        );

    let orient =
        0;

    if(
        screen.orientation &&
        typeof screen.orientation.angle ===
            "number"
    ){

        orient =
            THREE.MathUtils.degToRad(
                screen.orientation.angle
            );
    }
    else if(
        typeof window.orientation ===
            "number"
    ){

        orient =
            THREE.MathUtils.degToRad(
                window.orientation
            );
    }

    deviceEuler.set(
        beta,
        alpha,
        -gamma,
        "YXZ"
    );

    deviceQuaternion
        .setFromEuler(
            deviceEuler
        );

    deviceQuaternion
        .multiply(q1);

    screenQuaternion
        .setFromAxisAngle(
            zee,
            -orient
        );

    deviceQuaternion
        .multiply(
            screenQuaternion
        );

    camera.quaternion.copy(
        deviceQuaternion
    );
}

/* =========================================================
   VERTEX SHADER
========================================================= */

const vrVertexShader = `

precision highp float;

varying vec2 vUv;

uniform vec2 eyeScale;
uniform vec2 eyeOffset;

void main(){

    vUv = uv;

    vec2 p =
        position.xy *
        eyeScale +
        eyeOffset;

    gl_Position =
        vec4(
            p.x,
            p.y,
            0.0,
            1.0
        );
}

`;

/* =========================================================
   FRAGMENT SHADER

   NE UPORABLJA KROŽNE MASKE.

   Rob je sestavljen iz:
   - zgornje krivulje
   - spodnje krivulje
   - zunanje stranice
   - notranje stranice

   Tako ostane veliko bolj podoben
   Cardboard/YouTube obliki.
========================================================= */

const vrFragmentShader = `

precision highp float;

uniform sampler2D eyeTexture;

uniform float k1;
uniform float k2;
uniform float sourceScale;

varying vec2 vUv;

void main(){

    /*
        Lokalni prostor očesa:
        -1 .. +1
    */

    vec2 p =
        vUv * 2.0 - 1.0;

    float x =
        p.x;

    float y =
        p.y;

    float ax =
        abs(x);

    float ay =
        abs(y);

    /*
        =====================================================
        MASKA OČESNEGA OKNA
        =====================================================

        Zgornji/spodnji rob sta samo
        rahlo ukrivljena.

        Pri x=0:
        meja = 1

        Pri x=1:
        meja ~0.94
    */

    float verticalLimit =
        1.0 -
        0.060 *
        pow(
            ax,
            2.35
        );

    /*
        Stranska robova.

        Na sredini sta skoraj navpična,
        proti vrhu/dnu gresta nekoliko
        navznoter.
    */

    float horizontalLimit =
        1.0 -
        0.090 *
        pow(
            ay,
            2.20
        );

    /*
        Dodatno oblikovanje samo
        v skrajnih vogalih.
    */

    float corner =
        pow(
            ax * ay,
            4.0
        );

    verticalLimit -=
        0.015 *
        corner;

    horizontalLimit -=
        0.025 *
        corner;

    /*
        Zunaj okna je ČRNA.

        Ne transparentna.
        Ne panorama.
    */

    if(
        ay > verticalLimit ||
        ax > horizontalLimit
    ){

        gl_FragColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }

    /*
        =====================================================
        OPTIČNA DEFORMACIJA
        =====================================================
    */

    vec2 q =
        p;

    /*
        Korekcija razmerja,
        da radialna funkcija ni
        preveč krožna.
    */

    q.x *=
        0.96;

    float r2 =
        dot(
            q,
            q
        );

    float distortion =
        1.0 +
        k1 * r2 +
        k2 * r2 * r2;

    q *=
        distortion;

    q.x /=
        0.96;

    /*
        sourceScale drži vzorec
        znotraj render targeta.
    */

    q *=
        sourceScale;

    vec2 uv =
        q * 0.5 +
        0.5;

    /*
        Zunaj teksture vedno črna.
    */

    if(
        uv.x < 0.0 ||
        uv.x > 1.0 ||
        uv.y < 0.0 ||
        uv.y > 1.0
    ){

        gl_FragColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }

    gl_FragColor =
        texture2D(
            eyeTexture,
            uv
        );
}

`;

/* =========================================================
   BUILD VR OUTPUT
========================================================= */

function buildCardboardOutput(){

    disposeCardboardOutput();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    /*
        Render target je za POSAMEZNO oko.
    */

    const targetWidth =
        Math.max(
            640,
            Math.round(
                innerWidth *
                0.5 *
                dpr
            )
        );

    const targetHeight =
        Math.max(
            640,
            Math.round(
                innerHeight *
                dpr
            )
        );

    leftRenderTarget =
        new THREE.WebGLRenderTarget(
            targetWidth,
            targetHeight,
            {
                minFilter:
                    THREE.LinearFilter,

                magFilter:
                    THREE.LinearFilter,

                depthBuffer:
                    true,

                stencilBuffer:
                    false
            }
        );

    rightRenderTarget =
        new THREE.WebGLRenderTarget(
            targetWidth,
            targetHeight,
            {
                minFilter:
                    THREE.LinearFilter,

                magFilter:
                    THREE.LinearFilter,

                depthBuffer:
                    true,

                stencilBuffer:
                    false
            }
        );

    /*
        PlaneGeometry je 2×2.

        Vertexi:
        x = -1 .. +1
        y = -1 .. +1
    */

    const leftGeometry =
        new THREE.PlaneGeometry(
            2,
            2
        );

    const rightGeometry =
        new THREE.PlaneGeometry(
            2,
            2
        );

    const leftMaterial =
        new THREE.ShaderMaterial({

            uniforms:{

                eyeTexture:{
                    value:
                        leftRenderTarget.texture
                },

                eyeScale:{
                    value:
                        new THREE.Vector2(
                            CARDBOARD.eyeScaleX,
                            CARDBOARD.eyeScaleY
                        )
                },

                eyeOffset:{
                    value:
                        new THREE.Vector2(
                            CARDBOARD.leftCenterX,
                            CARDBOARD.centerY
                        )
                },

                k1:{
                    value:
                        CARDBOARD.k1
                },

                k2:{
                    value:
                        CARDBOARD.k2
                },

                sourceScale:{
                    value:
                        CARDBOARD.sourceScale
                }
            },

            vertexShader:
                vrVertexShader,

            fragmentShader:
                vrFragmentShader,

            depthTest:false,

            depthWrite:false,

            transparent:false
        });

    const rightMaterial =
        new THREE.ShaderMaterial({

            uniforms:{

                eyeTexture:{
                    value:
                        rightRenderTarget.texture
                },

                eyeScale:{
                    value:
                        new THREE.Vector2(
                            CARDBOARD.eyeScaleX,
                            CARDBOARD.eyeScaleY
                        )
                },

                eyeOffset:{
                    value:
                        new THREE.Vector2(
                            CARDBOARD.rightCenterX,
                            CARDBOARD.centerY
                        )
                },

                k1:{
                    value:
                        CARDBOARD.k1
                },

                k2:{
                    value:
                        CARDBOARD.k2
                },

                sourceScale:{
                    value:
                        CARDBOARD.sourceScale
                }
            },

            vertexShader:
                vrVertexShader,

            fragmentShader:
                vrFragmentShader,

            depthTest:false,

            depthWrite:false,

            transparent:false
        });

    leftEyeMesh =
        new THREE.Mesh(
            leftGeometry,
            leftMaterial
        );

    rightEyeMesh =
        new THREE.Mesh(
            rightGeometry,
            rightMaterial
        );

    /*
        Ker vertex shader sam izračuna
        clip-space položaj, transformacije
        mesha niso potrebne.
    */

    leftEyeMesh.frustumCulled =
        false;

    rightEyeMesh.frustumCulled =
        false;

    outputScene.add(
        leftEyeMesh
    );

    outputScene.add(
        rightEyeMesh
    );
}

/* =========================================================
   DISPOSE VR OUTPUT
========================================================= */

function disposeCardboardOutput(){

    if(leftEyeMesh){

        outputScene.remove(
            leftEyeMesh
        );

        leftEyeMesh
            .geometry
            .dispose();

        leftEyeMesh
            .material
            .dispose();

        leftEyeMesh =
            null;
    }

    if(rightEyeMesh){

        outputScene.remove(
            rightEyeMesh
        );

        rightEyeMesh
            .geometry
            .dispose();

        rightEyeMesh
            .material
            .dispose();

        rightEyeMesh =
            null;
    }

    if(leftRenderTarget){

        leftRenderTarget.dispose();

        leftRenderTarget =
            null;
    }

    if(rightRenderTarget){

        rightRenderTarget.dispose();

        rightRenderTarget =
            null;
    }
}

function wrapCanvasText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    lineHeight,
    maxLines
){

    const words =
        String(text)
            .split(/\s+/);

    let line =
        "";

    let lineNumber =
        0;

    for(
        let i = 0;
        i < words.length;
        i++
    ){

        const testLine =
            line +
            words[i] +
            " ";

        const width =
            ctx.measureText(
                testLine
            ).width;

        if(
            width > maxWidth &&
            line !== ""
        ){

            ctx.fillText(
                line,
                x,
                y +
                lineNumber *
                lineHeight
            );

            lineNumber++;

            if(
                lineNumber >=
                maxLines
            ){
                return;
            }

            line =
                words[i] +
                " ";
        }
        else{

            line =
                testLine;
        }
    }

    if(
        lineNumber <
        maxLines
    ){

        ctx.fillText(
            line,
            x,
            y +
            lineNumber *
            lineHeight
        );
    }
}

/* =========================================================
   GAZE
========================================================= */

const gazeRaycaster =
    new THREE.Raycaster();

let gazeTargetId =
    null;

let gazeStartTime =
    0;

let gazeTriggered =
    false;

const GAZE_DELAY =
    1200;

function resetGaze(){

    gazeTargetId =
        null;

    gazeStartTime =
        0;

    gazeTriggered =
        false;

    reticleLeft
        .classList
        .remove("active");

    reticleRight
        .classList
        .remove("active");
}

function updateGaze(){

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward
        .applyQuaternion(
            camera.quaternion
        )
        .normalize();

    gazeRaycaster.set(
        camera.position,
        forward
    );

    const hits =
        gazeRaycaster
            .intersectObjects(
                hotspotMeshes,
                false
            );

    const id =
        hits.length
            ? hits[0]
                .object
                .userData
                .hotspotId
            : null;

    if(!id){

        resetGaze();

        return;
    }

    if(
        gazeTargetId !== id
    ){

        gazeTargetId =
            id;

        gazeStartTime =
            performance.now();

        gazeTriggered =
            false;

        reticleLeft
            .classList
            .remove("active");

        reticleRight
            .classList
            .remove("active");

        void reticleLeft.offsetWidth;

        reticleLeft
            .classList
            .add("active");

        reticleRight
            .classList
            .add("active");

        return;
    }

    if(
        !gazeTriggered &&
        performance.now() -
            gazeStartTime >=
            GAZE_DELAY
    ){

        gazeTriggered =
            true;

        const hotspot =
            getHotspot(
                gazeTargetId
            );

        if(hotspot){

            showCardboardInfo(
                hotspot
            );
        }
    }
}

async function enterCardboard(){

    if(cardboardMode)
        return;

    cardboardMode =
        true;

    toolbar.style.display =
        "none";

    popup.style.display =
        "none";

    hint.style.display =
        "none";

    cardboardUI.style.display =
        "block";

    sensorAvailable =
        false;

    window.addEventListener(
        "deviceorientation",
        orientationHandler,
        true
    );

    /*
        Najprej naredimo VR output.
    */

    buildCardboardOutput();

    /*
        Fullscreen.
    */

    try{

        if(
            !document.fullscreenElement &&
            document
                .documentElement
                .requestFullscreen
        ){

            await document
                .documentElement
                .requestFullscreen();
        }
    }
    catch(error){}

    /*
        Landscape.
    */

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen
                .orientation
                .lock(
                    "landscape"
                );
        }
    }
    catch(error){}

    requestWakeLock();

    resizeRenderer();
}

/* =========================================================
   EXIT CARDBOARD
========================================================= */

exitCardboardBtn.addEventListener(
    "click",
    exitCardboard
);

async function exitCardboard(){

    if(!cardboardMode)
        return;

    cardboardMode =
        false;

    window.removeEventListener(
        "deviceorientation",
        orientationHandler,
        true
    );

    await releaseWakeLock();

    removeCardboardInfo();

    resetGaze();

    disposeCardboardOutput();

    cardboardUI.style.display =
        "none";

    toolbar.style.display =
        "flex";

    /*
        Povrnemo normalno kamero.
    */

    camera.quaternion.identity();

    camera.rotation.set(
        0,
        0,
        0
    );

    camera.fov =
        normalFov;

    updateNormalCamera();

    resizeRenderer();

    try{

        if(
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();
        }
    }
    catch(error){}

    try{

        if(
            document.fullscreenElement &&
            document.exitFullscreen
        ){

            await document
                .exitFullscreen();
        }
    }
    catch(error){}
}

/* =========================================================
   NORMAL RENDER
========================================================= */

function renderNormal(){

    renderer.setRenderTarget(
        null
    );

    renderer.setScissorTest(
        false
    );

    /*
        CEL canvas.
    */

    renderer.setViewport(
        0,
        0,
        renderer.domElement.width,
        renderer.domElement.height
    );

    renderer.setClearColor(
        0x000000,
        1
    );

    renderer.clear(
        true,
        true,
        true
    );

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   CARDBOARD RENDER

   1. leva kamera -> leftRenderTarget
   2. desna kamera -> rightRenderTarget
   3. framebuffer -> črna
   4. outputScene -> samo dva quada

   PANORAMA SE V KORAKU 4 NE RENDERIRA.
========================================================= */

function renderCardboard(){

    if(
        !leftRenderTarget ||
        !rightRenderTarget ||
        !leftEyeMesh ||
        !rightEyeMesh
    ){
        return;
    }

    updateGyroscope();

    /*
        Perspektivna kamera predstavlja
        ENO oko, zato je aspect razmerje
        polovice fizičnega zaslona.
    */

    camera.aspect =
        (
            innerWidth * 0.5
        ) /
        innerHeight;

    camera.fov =
        CARDBOARD.fov;

    camera.updateProjectionMatrix();

    camera.updateMatrixWorld(
        true
    );

    stereoCamera.eyeSep =
        CARDBOARD.eyeSep;

    stereoCamera.update(
        camera
    );

    /* =====================================================
       LEFT EYE
    ===================================================== */

    renderer.setRenderTarget(
        leftRenderTarget
    );

    renderer.setScissorTest(
        false
    );

    renderer.setViewport(
        0,
        0,
        leftRenderTarget.width,
        leftRenderTarget.height
    );

    renderer.setClearColor(
        0x000000,
        1
    );

    renderer.clear(
        true,
        true,
        true
    );

    renderer.render(
        scene,
        stereoCamera.cameraL
    );

    /* =====================================================
       RIGHT EYE
    ===================================================== */

    renderer.setRenderTarget(
        rightRenderTarget
    );

    renderer.setViewport(
        0,
        0,
        rightRenderTarget.width,
        rightRenderTarget.height
    );

    renderer.setClearColor(
        0x000000,
        1
    );

    renderer.clear(
        true,
        true,
        true
    );

    renderer.render(
        scene,
        stereoCamera.cameraR
    );

    /* =====================================================
       FINAL OUTPUT
    ===================================================== */

    renderer.setRenderTarget(
        null
    );

    renderer.setScissorTest(
        false
    );

    /*
        To je pomembno.

        Po render targetih eksplicitno
        povrnemo viewport na CELOTEN
        fizični canvas.
    */

    renderer.setViewport(
        0,
        0,
        renderer.domElement.width,
        renderer.domElement.height
    );

    /*
        Cel framebuffer najprej ČRN.
    */

    renderer.setClearColor(
        0x000000,
        1
    );

    renderer.clear(
        true,
        true,
        true
    );

    /*
        ZDAJ se izriše SAMO outputScene.

        V outputScene sta samo:
        - leftEyeMesh
        - rightEyeMesh

        360 panorama ni v tej sceni.
    */

    renderer.render(
        outputScene,
        outputCamera
    );

    updateGaze();
}

/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
    null;

function resizeRenderer(){

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );

    renderer.setSize(
        innerWidth,
        innerHeight,
        false
    );

    if(!cardboardMode){

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.fov =
            normalFov;

        camera.updateProjectionMatrix();
    }

    /*
        Output kamera ostane vedno
        -1 .. +1.
    */

    outputCamera.left =
        -1;

    outputCamera.right =
        1;

    outputCamera.top =
        1;

    outputCamera.bottom =
        -1;

    outputCamera.updateProjectionMatrix();
}

function handleResize(){

    resizeRenderer();

    if(cardboardMode){

        clearTimeout(
            resizeTimer
        );

        resizeTimer =
            setTimeout(
                () => {

                    if(cardboardMode){

                        buildCardboardOutput();
                    }
                },
                250
            );
    }
}

window.addEventListener(
    "resize",
    handleResize
);

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            handleResize,
            350
        );
    }
);

/* =========================================================
   FULLSCREEN CHANGE

   Nekateri telefoni po prehodu v fullscreen
   spremenijo dejanske dimenzije viewporta
   nekoliko pozneje.
========================================================= */

document.addEventListener(
    "fullscreenchange",
    () => {

        setTimeout(
            handleResize,
            120
        );

        setTimeout(
            handleResize,
            500
        );
    }
);

/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key !==
            "Escape"
        ){
            return;
        }

        if(cardboardMode){

            exitCardboard();
        }
        else{

            stopAddMode();

            closePopup();
        }
    }
);

/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    if(cardboardMode){

        renderCardboard();
    }
    else{

        renderNormal();

        positionPopup();
    }
}

/* =========================================================
   START
========================================================= */

resizeRenderer();

animate();

</script>

</body>
</html>
