<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>360° Hotspot Viewer + Cardboard</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, Helvetica, sans-serif;
}

#viewer {
  position: fixed;
  inset: 0;
}

a-scene {
  width: 100%;
  height: 100%;
}

/* =========================================================
   TOOLBAR
========================================================= */

#toolbar {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 10000;

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 8px;

  border-radius: 14px;

  background: rgba(20,20,20,.84);
  backdrop-filter: blur(10px);

  box-shadow: 0 6px 25px rgba(0,0,0,.3);
}

.tool-button {
  height: 42px;
  min-width: 42px;

  padding: 0 14px;

  border: 0;
  border-radius: 9px;

  background: rgba(255,255,255,.13);
  color: white;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;
}

.tool-button:hover {
  background: rgba(255,255,255,.23);
}

#addHotspotBtn {
  background: #2563eb;
}

#addHotspotBtn.active {
  background: #16a34a;
}

#cardboardBtn {
  background: #7c3aed;
}

.separator {
  width: 1px;
  height: 26px;

  background: rgba(255,255,255,.22);
}


/* =========================================================
   NAVODILO
========================================================= */

#instruction {
  position: fixed;

  left: 50%;
  bottom: 25px;

  transform: translateX(-50%);

  z-index: 10000;

  display: none;

  padding: 11px 18px;

  max-width: calc(100% - 40px);

  border-radius: 30px;

  background: rgba(0,0,0,.82);
  color: white;

  font-size: 14px;
  text-align: center;

  pointer-events: none;
}


/* =========================================================
   POPUP
========================================================= */

#popup {
  position: fixed;

  z-index: 20000;

  display: none;

  width: 330px;
  max-width: calc(100vw - 30px);

  padding: 18px;

  border-radius: 14px;

  background: white;
  color: #222;

  box-shadow: 0 12px 40px rgba(0,0,0,.38);
}

#popup::before {
  content: "";

  position: absolute;

  left: -9px;
  top: 50%;

  transform: translateY(-50%);

  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-right: 9px solid white;
}

#popup.open-left::before {
  left: auto;
  right: -9px;

  border-right: 0;
  border-left: 9px solid white;
}

#popupClose {
  position: absolute;

  top: 9px;
  right: 9px;

  width: 30px;
  height: 30px;

  padding: 0;

  border: 0;
  border-radius: 50%;

  background: #f1f3f5;
  color: #444;

  font-size: 20px;

  cursor: pointer;
}


/* =========================================================
   READER
========================================================= */

#readerMode {
  display: none;
}

#readerTitle {
  margin: 0 35px 10px 0;

  font-size: 20px;
  line-height: 1.25;
}

#readerDescription {
  margin: 0 0 17px;

  color: #444;

  font-size: 14px;
  line-height: 1.55;

  white-space: pre-wrap;
}

#editBtn {
  width: 100%;

  padding: 10px;

  border: 0;
  border-radius: 8px;

  background: #2563eb;
  color: white;

  font-weight: bold;

  cursor: pointer;
}


/* =========================================================
   EDITOR
========================================================= */

#editorMode {
  display: none;
}

.field-label {
  display: block;

  margin: 0 0 5px;

  color: #555;

  font-size: 12px;
  font-weight: bold;
}

#titleInput,
#descriptionInput {
  width: 100%;

  padding: 10px;

  border: 1px solid #d1d5db;
  border-radius: 8px;

  font: inherit;

  outline: none;
}

#titleInput {
  margin-bottom: 12px;
}

#descriptionInput {
  min-height: 120px;

  margin-bottom: 12px;

  resize: vertical;
}

#titleInput:focus,
#descriptionInput:focus {
  border-color: #2563eb;
}

.editor-buttons {
  display: flex;
  gap: 7px;
}

.editor-buttons button {
  padding: 9px 12px;

  border: 0;
  border-radius: 8px;

  font-weight: bold;

  cursor: pointer;
}

#saveBtn {
  flex: 1;

  background: #16a34a;
  color: white;
}

#cancelBtn {
  background: #e5e7eb;
  color: #222;
}

#deleteBtn {
  background: #dc2626;
  color: white;
}


/* =========================================================
   CARDBOARD HTML UI
========================================================= */

#cardboardUI {
  position: fixed;
  inset: 0;

  z-index: 30000;

  display: none;

  pointer-events: none;
}

/* sredinska ločilna črta */

#cardboardDivider {
  position: absolute;

  left: 50%;
  top: 0;

  width: 1px;
  height: 100%;

  background: rgba(255,255,255,.12);

  transform: translateX(-50%);
}


/* gaze križca */

.gaze {
  position: absolute;

  top: 50%;

  width: 32px;
  height: 32px;

  transform: translate(-50%, -50%);

  border: 3px solid rgba(255,255,255,.95);
  border-radius: 50%;

  box-shadow:
    0 0 8px rgba(0,0,0,.8),
    inset 0 0 8px rgba(0,0,0,.35);
}

#gazeLeft {
  left: 25%;
}

#gazeRight {
  left: 75%;
}


/* notranja pika */

.gaze::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 5px;
  height: 5px;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: white;
}


/* gaze progress */

.gaze.active {
  animation: gazePulse 1.2s linear forwards;
}

@keyframes gazePulse {
  from {
    transform:
      translate(-50%, -50%)
      scale(1);

    border-width: 3px;
  }

  to {
    transform:
      translate(-50%, -50%)
      scale(1.65);

    border-width: 6px;
  }
}


/* Cardboard exit */

#exitCardboardBtn {
  position: absolute;

  top: 12px;
  right: 12px;

  z-index: 30010;

  pointer-events: auto;

  padding: 10px 14px;

  border: 0;
  border-radius: 9px;

  background: rgba(0,0,0,.75);
  color: white;

  font-weight: bold;

  cursor: pointer;
}


/* dovoljenje za orientacijo */

#permissionPanel {
  position: fixed;
  inset: 0;

  z-index: 40000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 25px;

  background: rgba(0,0,0,.82);
}

#permissionBox {
  width: 360px;
  max-width: 100%;

  padding: 24px;

  border-radius: 16px;

  background: white;
  color: #222;

  text-align: center;
}

#permissionBox h2 {
  margin-top: 0;
}

#permissionBox p {
  line-height: 1.5;
  color: #555;
}

#permissionButton {
  width: 100%;

  padding: 12px;

  border: 0;
  border-radius: 9px;

  background: #7c3aed;
  color: white;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {
  #toolbar {
    top: 10px;
    left: 10px;
    right: 10px;

    justify-content: center;
    flex-wrap: wrap;
  }

  .tool-button {
    height: 38px;

    padding: 0 11px;
  }

  #popup {
    width: 290px;
  }
}

</style>
</head>


<body>


<div id="viewer">

  <a-scene
    id="scene"

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      colorManagement: true
    "

    loading-screen="enabled: true"

    cursor="rayOrigin: mouse"

    raycaster="
      objects: .clickable;
      far: 100
    "
  >

    <!-- =============================================
         PANORAMA
    ============================================== -->

    <a-assets>

      <img
        id="panoramaImage"
        src="360.jpg"
        crossorigin="anonymous"
      >

    </a-assets>


    <a-sky
      id="sky"
      src="#panoramaImage"
      rotation="0 -90 0"
    ></a-sky>


    <!-- normalni 3D hotspoti -->

    <a-entity
      id="hotspotContainer"
    ></a-entity>


    <!-- =============================================
         NORMALNA KAMERA
    ============================================== -->

    <a-entity id="cameraRig">

      <a-camera
        id="camera"

        position="0 0 0"

        look-controls="
          enabled: true;
          magicWindowTrackingEnabled: false
        "

        wasd-controls="enabled: false"
      ></a-camera>

    </a-entity>

  </a-scene>

</div>


<!-- ======================================================
     NORMALNI TOOLBAR
======================================================= -->

<div id="toolbar">

  <button
    id="addHotspotBtn"
    class="tool-button"
  >
    + Dodaj hotspot
  </button>

  <div class="separator"></div>

  <button
    id="zoomInBtn"
    class="tool-button"
  >
    +
  </button>

  <button
    id="zoomOutBtn"
    class="tool-button"
  >
    −
  </button>

  <div class="separator"></div>

  <button
    id="fullscreenBtn"
    class="tool-button"
  >
    ⛶ Fullscreen
  </button>

  <button
    id="cardboardBtn"
    class="tool-button"
  >
    🥽 Cardboard
  </button>

</div>


<div id="instruction">
  Klikni na mesto v 360° panorami, kamor želiš dodati hotspot.
</div>


<!-- ======================================================
     NORMALNI POPUP
======================================================= -->

<div id="popup">

  <button id="popupClose">
    ×
  </button>


  <div id="readerMode">

    <h2 id="readerTitle"></h2>

    <div id="readerDescription"></div>

    <button id="editBtn">
      Uredi
    </button>

  </div>


  <div id="editorMode">

    <label class="field-label">
      Naslov
    </label>

    <input
      id="titleInput"
      type="text"
      placeholder="Naslov hotspota"
    >


    <label class="field-label">
      Opis
    </label>

    <textarea
      id="descriptionInput"
      placeholder="Vpiši opis..."
    ></textarea>


    <div class="editor-buttons">

      <button id="saveBtn">
        Shrani
      </button>

      <button id="cancelBtn">
        Prekliči
      </button>

      <button id="deleteBtn">
        Izbriši
      </button>

    </div>

  </div>

</div>


<!-- ======================================================
     CARDBOARD UI
======================================================= -->

<div id="cardboardUI">

  <div id="cardboardDivider"></div>

  <div
    id="gazeLeft"
    class="gaze"
  ></div>

  <div
    id="gazeRight"
    class="gaze"
  ></div>

  <button id="exitCardboardBtn">
    ✕ Izhod
  </button>

</div>


<!-- ======================================================
     ORIENTATION PERMISSION
======================================================= -->

<div id="permissionPanel">

  <div id="permissionBox">

    <h2>Cardboard</h2>

    <p>
      Za Cardboard način mora telefon dovoliti uporabo
      senzorjev za orientacijo.
    </p>

    <button id="permissionButton">
      Dovoli in zaženi Cardboard
    </button>

  </div>

</div>


<script>

/* =========================================================
   DOM
========================================================= */

const scene =
  document.querySelector("#scene");

const camera =
  document.querySelector("#camera");

const hotspotContainer =
  document.querySelector("#hotspotContainer");


const toolbar =
  document.querySelector("#toolbar");

const addHotspotBtn =
  document.querySelector("#addHotspotBtn");

const zoomInBtn =
  document.querySelector("#zoomInBtn");

const zoomOutBtn =
  document.querySelector("#zoomOutBtn");

const fullscreenBtn =
  document.querySelector("#fullscreenBtn");

const cardboardBtn =
  document.querySelector("#cardboardBtn");

const instruction =
  document.querySelector("#instruction");


const popup =
  document.querySelector("#popup");

const popupClose =
  document.querySelector("#popupClose");

const readerMode =
  document.querySelector("#readerMode");

const editorMode =
  document.querySelector("#editorMode");

const readerTitle =
  document.querySelector("#readerTitle");

const readerDescription =
  document.querySelector("#readerDescription");

const editBtn =
  document.querySelector("#editBtn");

const titleInput =
  document.querySelector("#titleInput");

const descriptionInput =
  document.querySelector("#descriptionInput");

const saveBtn =
  document.querySelector("#saveBtn");

const cancelBtn =
  document.querySelector("#cancelBtn");

const deleteBtn =
  document.querySelector("#deleteBtn");


const cardboardUI =
  document.querySelector("#cardboardUI");

const gazeLeft =
  document.querySelector("#gazeLeft");

const gazeRight =
  document.querySelector("#gazeRight");

const exitCardboardBtn =
  document.querySelector("#exitCardboardBtn");

const permissionPanel =
  document.querySelector("#permissionPanel");

const permissionButton =
  document.querySelector("#permissionButton");


/* =========================================================
   PODATKI
========================================================= */

const STORAGE_KEY =
  "stable-360-hotspots-v4";


let hotspots =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || [];


let selectedHotspotId = null;

let addMode = false;

let cardboardMode = false;

let gazeTargetId = null;

let gazeStartedAt = 0;

let gazeActivated = false;

const GAZE_TIME = 1200;


/* drag */

let pointerStartX = 0;
let pointerStartY = 0;
let pointerDistance = 0;


/* Cardboard THREE objekti */

let stereoRenderer = null;

let cardboardCamera = null;

let cardboardScene = null;

let cardboardAnimationId = null;


/* orientacija */

let deviceAlpha = 0;
let deviceBeta = 0;
let deviceGamma = 0;

let hasOrientation = false;


/* =========================================================
   SHRANJEVANJE
========================================================= */

function saveHotspots() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(hotspots)
  );

}


/* =========================================================
   MATEMATIKA
========================================================= */

function sphericalToVector(
  yaw,
  pitch,
  radius = 8
) {

  const x =
    radius *
    Math.cos(pitch) *
    Math.sin(yaw);

  const y =
    radius *
    Math.sin(pitch);

  const z =
    -radius *
    Math.cos(pitch) *
    Math.cos(yaw);


  return new THREE.Vector3(
    x,
    y,
    z
  );

}


function directionToSpherical(
  direction
) {

  return {

    yaw:
      Math.atan2(
        direction.x,
        -direction.z
      ),

    pitch:
      Math.asin(
        THREE.MathUtils.clamp(
          direction.y,
          -1,
          1
        )
      )

  };

}


/* =========================================================
   BILLBOARD HOTSPOT
========================================================= */

AFRAME.registerComponent(
  "face-camera",
  {

    tick: function () {

      if (cardboardMode)
        return;

      const cameraObject =
        camera.object3D;

      if (!cameraObject)
        return;


      const cameraPosition =
        new THREE.Vector3();

      cameraObject.getWorldPosition(
        cameraPosition
      );

      this.el.object3D.lookAt(
        cameraPosition
      );

    }

  }
);


/* =========================================================
   USTVARI HOTSPOT
========================================================= */

function createHotspotEntity(
  hotspot,
  number
) {

  const root =
    document.createElement(
      "a-entity"
    );


  root.dataset.id =
    hotspot.id;

  root.classList.add(
    "clickable"
  );

  root.setAttribute(
    "face-camera",
    ""
  );


  const position =
    sphericalToVector(
      hotspot.yaw,
      hotspot.pitch
    );


  root.setAttribute(
    "position",
    `${position.x} ${position.y} ${position.z}`
  );


  /* bel rob */

  const border =
    document.createElement(
      "a-circle"
    );

  border.setAttribute(
    "radius",
    "0.26"
  );

  border.setAttribute(
    "color",
    "#ffffff"
  );

  border.setAttribute(
    "material",
    "shader: flat; side: double"
  );


  /* rdeča pika */

  const dot =
    document.createElement(
      "a-circle"
    );

  dot.setAttribute(
    "radius",
    "0.20"
  );

  dot.setAttribute(
    "position",
    "0 0 0.01"
  );

  dot.setAttribute(
    "color",
    "#ef4444"
  );

  dot.setAttribute(
    "material",
    "shader: flat; side: double"
  );


  /* številka */

  const text =
    document.createElement(
      "a-text"
    );

  text.setAttribute(
    "value",
    String(number)
  );

  text.setAttribute(
    "align",
    "center"
  );

  text.setAttribute(
    "anchor",
    "center"
  );

  text.setAttribute(
    "baseline",
    "center"
  );

  text.setAttribute(
    "color",
    "#ffffff"
  );

  text.setAttribute(
    "width",
    "1"
  );

  text.setAttribute(
    "position",
    "0 0 0.025"
  );


  root.appendChild(border);
  root.appendChild(dot);
  root.appendChild(text);


  root.addEventListener(
    "click",
    event => {

      if (cardboardMode)
        return;

      event.stopPropagation();

      stopAddMode();

      openReader(
        hotspot.id
      );

    }
  );


  hotspotContainer.appendChild(
    root
  );

}


/* =========================================================
   RENDER HOTSPOTOV
========================================================= */

function renderHotspots() {

  hotspotContainer.innerHTML =
    "";

  hotspots.forEach(
    (hotspot, index) => {

      createHotspotEntity(
        hotspot,
        index + 1
      );

    }
  );

}


/* =========================================================
   SCREEN -> DIRECTION
========================================================= */

function screenToDirection(
  clientX,
  clientY
) {

  const cameraObject =
    camera.getObject3D(
      "camera"
    );

  if (!cameraObject)
    return null;


  const rect =
    scene.canvas
      .getBoundingClientRect();


  const x =
    (
      (clientX - rect.left)
      / rect.width
    ) * 2 - 1;


  const y =
    -(
      (
        (clientY - rect.top)
        / rect.height
      ) * 2 - 1
    );


  const vector =
    new THREE.Vector3(
      x,
      y,
      0.5
    );


  vector.unproject(
    cameraObject
  );


  const cameraPosition =
    new THREE.Vector3();


  cameraObject.getWorldPosition(
    cameraPosition
  );


  return vector
    .sub(cameraPosition)
    .normalize();

}


/* =========================================================
   DODAJ HOTSPOT
========================================================= */

addHotspotBtn.addEventListener(
  "click",
  () => {

    if (cardboardMode)
      return;


    addMode =
      !addMode;


    closePopup();


    if (addMode) {

      addHotspotBtn
        .classList
        .add("active");


      addHotspotBtn.textContent =
        "Klikni v panoramo";


      instruction.style.display =
        "block";

    }

    else {

      stopAddMode();

    }

  }
);


function stopAddMode() {

  addMode = false;


  addHotspotBtn
    .classList
    .remove("active");


  addHotspotBtn.textContent =
    "+ Dodaj hotspot";


  instruction.style.display =
    "none";

}


/* =========================================================
   DRAG DETEKCIJA
========================================================= */

scene.addEventListener(
  "pointerdown",
  event => {

    pointerStartX =
      event.clientX;

    pointerStartY =
      event.clientY;

    pointerDistance = 0;

  }
);


scene.addEventListener(
  "pointermove",
  event => {

    const dx =
      event.clientX -
      pointerStartX;

    const dy =
      event.clientY -
      pointerStartY;


    pointerDistance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

  }
);


/* =========================================================
   KLIK ZA NOV HOTSPOT
========================================================= */

scene.addEventListener(
  "click",
  event => {

    if (!addMode)
      return;

    if (cardboardMode)
      return;

    if (pointerDistance > 8)
      return;


    const clickedHotspot =
      event.target &&
      event.target.closest
        ? event.target.closest(
            ".clickable"
          )
        : null;


    if (clickedHotspot)
      return;


    const direction =
      screenToDirection(
        event.clientX,
        event.clientY
      );


    if (!direction)
      return;


    const spherical =
      directionToSpherical(
        direction
      );


    const hotspot = {

      id:
        "hs-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,7),

      yaw:
        spherical.yaw,

      pitch:
        spherical.pitch,

      title: "",

      description: ""

    };


    hotspots.push(
      hotspot
    );


    saveHotspots();

    stopAddMode();

    renderHotspots();

    openEditor(
      hotspot.id
    );

  }
);


/* =========================================================
   HOTSPOT -> SCREEN
========================================================= */

function getHotspotScreenPosition(
  hotspot
) {

  const cameraObject =
    camera.getObject3D(
      "camera"
    );

  if (!cameraObject)
    return null;


  const position =
    sphericalToVector(
      hotspot.yaw,
      hotspot.pitch
    );


  const cameraPosition =
    new THREE.Vector3();

  const cameraDirection =
    new THREE.Vector3();


  cameraObject.getWorldPosition(
    cameraPosition
  );

  cameraObject.getWorldDirection(
    cameraDirection
  );


  const toHotspot =
    position
      .clone()
      .sub(cameraPosition)
      .normalize();


  if (
    cameraDirection.dot(
      toHotspot
    ) <= 0
  ) {

    return null;

  }


  const projected =
    position
      .clone()
      .project(
        cameraObject
      );


  return {

    x:
      (projected.x + 1)
      / 2 *
      window.innerWidth,

    y:
      (-projected.y + 1)
      / 2 *
      window.innerHeight

  };

}


/* =========================================================
   POPUP POZICIJA
========================================================= */

function positionPopup() {

  if (
    cardboardMode ||
    !selectedHotspotId ||
    popup.style.display === "none"
  )
    return;


  const hotspot =
    hotspots.find(
      h =>
        h.id ===
        selectedHotspotId
    );


  if (!hotspot)
    return;


  const screen =
    getHotspotScreenPosition(
      hotspot
    );


  if (!screen) {

    popup.style.visibility =
      "hidden";

    return;

  }


  popup.style.visibility =
    "visible";


  const width =
    popup.offsetWidth;

  const height =
    popup.offsetHeight;

  const gap = 32;


  let left;
  let top =
    screen.y -
    height / 2;


  if (
    screen.x <
    window.innerWidth / 2
  ) {

    popup.classList.remove(
      "open-left"
    );

    left =
      screen.x +
      gap;

  }

  else {

    popup.classList.add(
      "open-left"
    );

    left =
      screen.x -
      width -
      gap;

  }


  left =
    Math.max(
      10,
      Math.min(
        left,
        window.innerWidth -
        width -
        10
      )
    );


  top =
    Math.max(
      10,
      Math.min(
        top,
        window.innerHeight -
        height -
        10
      )
    );


  popup.style.left =
    left + "px";

  popup.style.top =
    top + "px";

}


function popupLoop() {

  positionPopup();

  requestAnimationFrame(
    popupLoop
  );

}

popupLoop();

   READER
========================================================= */

      h => h.id === id
    );

  );

/* =========================================================
   ZAPRI POPUP
========================================================= */

popupClose.addEventListener(
  "click",
  closePopup
);


function closePopup() {

  popup.style.display =
    "none";

  selectedHotspotId =
    null;

}


/* =========================================================
   ZOOM
========================================================= */

function changeZoom(amount) {

  const cameraObject =
    camera.getObject3D(
      "camera"
    );


  if (!cameraObject)
    return;


  cameraObject.fov +=
    amount;


  cameraObject.fov =
    THREE.MathUtils.clamp(
      cameraObject.fov,
      30,
      100
    );


  cameraObject
    .updateProjectionMatrix();

}


zoomInBtn.addEventListener(
  "click",
  () => changeZoom(-10)
);


zoomOutBtn.addEventListener(
  "click",
  () => changeZoom(10)
);


window.addEventListener(
  "wheel",
  event => {

    if (cardboardMode)
      return;


    if (
      popup.contains(
        event.target
      )
    )
      return;


    event.preventDefault();


    changeZoom(
      event.deltaY *
      0.03
    );

  },
  {
    passive: false
  }
);


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
  "click",
  async () => {

    try {

      if (
        !document.fullscreenElement
      ) {

        await document
          .documentElement
          .requestFullscreen();

      }

      else {

        await document
          .exitFullscreen();

      }

    }

    catch (error) {

      console.log(error);

    }

  }
);


/* =========================================================
   DEVICE ORIENTATION
========================================================= */

function orientationHandler(event) {

  if (
    event.alpha === null
  )
    return;


  deviceAlpha =
    event.alpha || 0;

  deviceBeta =
    event.beta || 0;

  deviceGamma =
    event.gamma || 0;


  hasOrientation = true;

}


/* =========================================================
   ZAHTEVA ZA SENZORJE

   iPhone zahteva klik uporabnika.
========================================================= */

async function requestOrientationPermission() {

  if (
    typeof DeviceOrientationEvent !==
      "undefined" &&

    typeof DeviceOrientationEvent
      .requestPermission ===
      "function"
  ) {

    try {

      const result =
        await DeviceOrientationEvent
          .requestPermission();


      return (
        result ===
        "granted"
      );

    }

    catch (error) {

      console.error(error);

      return false;

    }

  }


  /*
    Android običajno ne potrebuje
    posebnega JS dovoljenja.
  */

  return true;

}


/* =========================================================
   CARDBOARD GUMB
========================================================= */

cardboardBtn.addEventListener(
  "click",
  async () => {

    stopAddMode();

    closePopup();


    /*
      iPhone permission panel.
    */

    if (
      typeof DeviceOrientationEvent !==
        "undefined" &&

      typeof DeviceOrientationEvent
        .requestPermission ===
        "function"
    ) {

      permissionPanel.style.display =
        "flex";

      return;

    }


    const allowed =
      await requestOrientationPermission();


    if (allowed) {

      enterCardboard();

    }

  }
);


permissionButton.addEventListener(
  "click",
  async () => {

    const allowed =
      await requestOrientationPermission();


    if (!allowed) {

      alert(
        "Telefon ni dovolil dostopa do senzorjev orientacije."
      );

      return;

    }


    permissionPanel.style.display =
      "none";


    enterCardboard();

  }
);


/* =========================================================
   FULLSCREEN + LANDSCAPE
========================================================= */

async function preparePhoneForCardboard() {

  try {

    if (
      !document.fullscreenElement &&
      document.documentElement
        .requestFullscreen
    ) {

      await document
        .documentElement
        .requestFullscreen();

    }

  }

  catch (error) {

    /*
      Nekateri mobilni browserji
      fullscreen zavrnejo.
      Cardboard lahko še vedno dela.
    */

  }


  try {

    if (
      screen.orientation &&
      screen.orientation.lock
    ) {

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch (error) {

    /*
      Uporabnik lahko telefon
      ročno obrne horizontalno.
    */

  }

}


/* =========================================================
   ENTER CARDBOARD
========================================================= */

async function enterCardboard() {

  if (cardboardMode)
    return;


  cardboardMode =
    true;


  await preparePhoneForCardboard();


  window.addEventListener(
    "deviceorientation",
    orientationHandler,
    true
  );


  toolbar.style.display =
    "none";


  popup.style.display =
    "none";


  instruction.style.display =
    "none";


  cardboardUI.style.display =
    "block";


  /*
    Uporabimo renderer in sceno,
    ki ju je ustvaril A-Frame.

    Ne nalagamo nove panorame.
  */

  stereoRenderer =
    scene.renderer;


  cardboardScene =
    scene.object3D;


  cardboardCamera =
    camera.getObject3D(
      "camera"
    );


  /*
    A-Frame normalni look controls
    v Cardboard načinu izklopimo.
  */

  camera.setAttribute(
    "look-controls",
    "enabled",
    false
  );


  /*
    Začnemo lasten stereo loop.
  */

  cardboardLoop();

}


/* =========================================================
   DEVICE ORIENTATION -> QUATERNION

   Pretvorba orientacije telefona
   v THREE quaternion.
========================================================= */

const zee =
  new THREE.Vector3(
    0,
    0,
    1
  );


const euler =
  new THREE.Euler();


const q0 =
  new THREE.Quaternion();


const q1 =
  new THREE.Quaternion(
    -Math.sqrt(0.5),
    0,
    0,
    Math.sqrt(0.5)
  );


function updateCardboardOrientation(
  object
) {

  if (!hasOrientation)
    return;


  const alpha =
    THREE.MathUtils.degToRad(
      deviceAlpha
    );


  const beta =
    THREE.MathUtils.degToRad(
      deviceBeta
    );


  const gamma =
    THREE.MathUtils.degToRad(
      deviceGamma
    );


  let orient = 0;


  if (
    screen.orientation &&
    typeof screen.orientation.angle ===
      "number"
  ) {

    orient =
      THREE.MathUtils.degToRad(
        screen.orientation.angle
      );

  }

  else if (
    typeof window.orientation ===
      "number"
  ) {

    orient =
      THREE.MathUtils.degToRad(
        window.orientation
      );

  }


  euler.set(
    beta,
    alpha,
    -gamma,
    "YXZ"
  );


  object.quaternion
    .setFromEuler(
      euler
    );


  object.quaternion
    .multiply(
      q1
    );


  object.quaternion
    .multiply(
      q0.setFromAxisAngle(
        zee,
        -orient
      )
    );

}


/* =========================================================
   CARDBOARD STEREO RENDER

   Levo in desno oko.
========================================================= */

function renderStereo() {

  if (
    !stereoRenderer ||
    !cardboardCamera ||
    !cardboardScene
  )
    return;


  const canvas =
    stereoRenderer.domElement;


  const width =
    canvas.clientWidth;

  const height =
    canvas.clientHeight;


  if (
    canvas.width !==
      Math.floor(
        width *
        window.devicePixelRatio
      ) ||

    canvas.height !==
      Math.floor(
        height *
        window.devicePixelRatio
      )
  ) {

    stereoRenderer.setSize(
      width,
      height,
      false
    );

  }


  /*
    STEREO CAMERA
  */

  if (!renderStereo.stereo) {

    renderStereo.stereo =
      new THREE.StereoCamera();


    renderStereo.stereo.eyeSep =
      0.064;

  }


  const stereo =
    renderStereo.stereo;


  cardboardCamera.aspect =
    (width / 2) /
    height;


  cardboardCamera.fov =
    75;


  cardboardCamera
    .updateProjectionMatrix();


  cardboardCamera
    .updateMatrixWorld(true);


  stereo.update(
    cardboardCamera
  );


  stereoRenderer.autoClear =
    false;


  stereoRenderer.setScissorTest(
    true
  );


  stereoRenderer.clear();


  /*
    LEVO OKO
  */

  stereoRenderer.setViewport(
    0,
    0,
    width / 2,
    height
  );


  stereoRenderer.setScissor(
    0,
    0,
    width / 2,
    height
  );


  stereoRenderer.render(
    cardboardScene,
    stereo.cameraL
  );


  /*
    DESNO OKO
  */

  stereoRenderer.setViewport(
    width / 2,
    0,
    width / 2,
    height
  );


  stereoRenderer.setScissor(
    width / 2,
    0,
    width / 2,
    height
  );


  stereoRenderer.render(
    cardboardScene,
    stereo.cameraR
  );


  stereoRenderer.setScissorTest(
    false
  );


  stereoRenderer.autoClear =
    true;

}


/* =========================================================
   HOTSPOT BILLBOARD V CARDBOARDU
========================================================= */

function orientHotspotsToCamera() {

  if (!cardboardCamera)
    return;


  const cameraPosition =
    new THREE.Vector3();


  cardboardCamera
    .getWorldPosition(
      cameraPosition
    );


  document
    .querySelectorAll(
      "#hotspotContainer > a-entity"
    )
    .forEach(
      entity => {

        entity.object3D.lookAt(
          cameraPosition
        );

      }
    );

}


/* =========================================================
   GAZE DETEKCIJA

   Ray gre iz sredine pogleda.
========================================================= */

const gazeRaycaster =
  new THREE.Raycaster();


const gazeCenter =
  new THREE.Vector2(
    0,
    0
  );


function updateGaze() {

  if (!cardboardCamera)
    return;


  gazeRaycaster.setFromCamera(
    gazeCenter,
    cardboardCamera
  );


  const targets = [];


  document
    .querySelectorAll(
      "#hotspotContainer > a-entity"
    )
    .forEach(
      entity => {

        entity.object3D.traverse(
          child => {

            if (
              child.isMesh
            ) {

              child.userData.hotspotId =
                entity.dataset.id;


              targets.push(
                child
              );

            }

          }
        );

      }
    );


  const hits =
    gazeRaycaster.intersectObjects(
      targets,
      false
    );


  let targetId = null;


  if (
    hits.length > 0
  ) {

    targetId =
      hits[0]
        .object
        .userData
        .hotspotId;

  }


  /* nič ne gledamo */

  if (!targetId) {

    resetGaze();

    return;

  }


  /* nov hotspot */

  if (
    gazeTargetId !==
    targetId
  ) {

    gazeTargetId =
      targetId;


    gazeStartedAt =
      performance.now();


    gazeActivated =
      false;


    gazeLeft.classList.remove(
      "active"
    );


    gazeRight.classList.remove(
      "active"
    );


    /*
      restart CSS animacije
    */

    void gazeLeft.offsetWidth;


    gazeLeft.classList.add(
      "active"
    );


    gazeRight.classList.add(
      "active"
    );


    return;

  }


  /*
    Isti hotspot gledamo
    dovolj dolgo.
  */

  if (
    !gazeActivated &&

    performance.now() -
      gazeStartedAt >=
      GAZE_TIME
  ) {

    gazeActivated =
      true;


    const hotspot =
      hotspots.find(
        h =>
          h.id ===
          gazeTargetId
      );


    if (hotspot) {

      showCardboardInfo(
        hotspot
      );

    }

  }

}


/* =========================================================
   RESET GAZE
========================================================= */

function resetGaze() {

  gazeTargetId =
    null;


  gazeStartedAt =
    0;


  gazeActivated =
    false;


  gazeLeft.classList.remove(
    "active"
  );


  gazeRight.classList.remove(
    "active"
  );

}


/* =========================================================
   CARDBOARD INFO

   3D panel naredimo neposredno
   v THREE sceni, zato je prikazan
   v obeh očesih.
========================================================= */

let cardboardInfoGroup =
  null;


function showCardboardInfo(
  hotspot
) {

  removeCardboardInfo();


  const group =
    new THREE.Group();


  group.name =
    "cardboard-info";


  /*
    OZADJE
  */

  const panelGeometry =
    new THREE.PlaneGeometry(
      2.8,
      1.45
    );


  const panelMaterial =
    new THREE.MeshBasicMaterial({

      color:
        0xffffff,

      transparent:
        true,

      opacity:
        0.94,

      side:
        THREE.DoubleSide

    });


  const panel =
    new THREE.Mesh(
      panelGeometry,
      panelMaterial
    );


  group.add(
    panel
  );


  /*
    Besedilo narišemo na canvas.
  */

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    1024;

  canvas.height =
    512;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
    "#111";


  ctx.font =
    "bold 54px Arial";


  drawWrappedText(
    ctx,
    hotspot.title ||
      "Brez naslova",
    70,
    85,
    880,
    65,
    2
  );


  ctx.fillStyle =
    "#333";


  ctx.font =
    "34px Arial";


  drawWrappedText(
    ctx,
    hotspot.description ||
      "Ni opisa.",
    70,
    205,
    880,
    48,
    5
  );


  const texture =
    new THREE.CanvasTexture(
      canvas
    );


  texture.colorSpace =
    THREE.SRGBColorSpace;


  const textMaterial =
    new THREE.MeshBasicMaterial({

      map:
        texture,

      transparent:
        true,

      side:
        THREE.DoubleSide

    });


  const textPlane =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        2.8,
        1.4
      ),

      textMaterial

    );


  textPlane.position.z =
    0.01;


  group.add(
    textPlane
  );


  /*
    Postavimo 2.7 m pred uporabnika.
  */

  const cameraPosition =
    new THREE.Vector3();


  const direction =
    new THREE.Vector3();


  cardboardCamera.getWorldPosition(
    cameraPosition
  );


  cardboardCamera.getWorldDirection(
    direction
  );


  group.position.copy(
    cameraPosition
      .clone()
      .add(
        direction.multiplyScalar(
          2.7
        )
      )
  );


  group.lookAt(
    cameraPosition
  );


  cardboardScene.add(
    group
  );


  cardboardInfoGroup =
    group;


  /*
    Kartica naj ne sproža novega
    hotspota takoj.
  */

  resetGaze();

}


/* =========================================================
   WRAP TEXT ZA VR PANEL
========================================================= */

function drawWrappedText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight,
  maxLines
) {

  const paragraphs =
    String(text)
      .split("\n");


  let lineNumber = 0;


  for (
    const paragraph
    of paragraphs
  ) {

    const words =
      paragraph.split(" ");


    let line = "";


    for (
      let n = 0;
      n < words.length;
      n++
    ) {

      const testLine =
        line +
        words[n] +
        " ";


      const width =
        ctx.measureText(
          testLine
        ).width;


      if (
        width >
          maxWidth &&
        line !== ""
      ) {

        ctx.fillText(
          line,
          x,
          y +
          lineNumber *
          lineHeight
        );


        lineNumber++;


        if (
          lineNumber >=
          maxLines
        )
          return;


        line =
          words[n] +
          " ";

      }

      else {

        line =
          testLine;

      }

    }


    if (
      lineNumber <
      maxLines
    ) {

      ctx.fillText(
        line,
        x,
        y +
        lineNumber *
        lineHeight
      );


      lineNumber++;

    }


    if (
      lineNumber >=
      maxLines
    )
      return;

  }

}


/* =========================================================
   ODSTRANI CARDBOARD INFO
========================================================= */

function removeCardboardInfo() {

  if (!cardboardInfoGroup)
    return;


  cardboardScene.remove(
    cardboardInfoGroup
  );


  cardboardInfoGroup.traverse(
    child => {

      if (
        child.geometry
      ) {

        child.geometry.dispose();

      }


      if (
        child.material
      ) {

        if (
          child.material.map
        ) {

          child.material.map.dispose();

        }


        child.material.dispose();

      }

    }
  );


  cardboardInfoGroup =
    null;

}


/* =========================================================
   CARDBOARD LOOP
========================================================= */

function cardboardLoop() {

  if (!cardboardMode)
    return;


  cardboardAnimationId =
    requestAnimationFrame(
      cardboardLoop
    );


  updateCardboardOrientation(
    cardboardCamera
  );


  cardboardCamera
    .updateMatrixWorld(true);


  orientHotspotsToCamera();


  updateGaze();


  renderStereo();

}


/* =========================================================
   IZHOD IZ CARDBOARDA
========================================================= */

exitCardboardBtn.addEventListener(
  "click",
  exitCardboard
);


async function exitCardboard() {

  if (!cardboardMode)
    return;


  cardboardMode =
    false;


  if (
    cardboardAnimationId
  ) {

    cancelAnimationFrame(
      cardboardAnimationId
    );

  }


  cardboardAnimationId =
    null;


  window.removeEventListener(
    "deviceorientation",
    orientationHandler,
    true
  );


  removeCardboardInfo();

  resetGaze();


  cardboardUI.style.display =
    "none";


  toolbar.style.display =
    "flex";


  /*
    Ponovno vklopimo normalno
    upravljanje pogleda.
  */

  camera.setAttribute(
    "look-controls",
    "enabled",
    true
  );


  /*
    Reset viewport/scissor,
    sicer lahko ostane pol zaslona.
  */

  if (scene.renderer) {

    scene.renderer.setScissorTest(
      false
    );


    scene.renderer.setViewport(
      0,
      0,
      scene.canvas.width,
      scene.canvas.height
    );


    scene.renderer.setSize(
      window.innerWidth,
      window.innerHeight,
      false
    );

  }


  /*
    Unlock landscape.
  */

  try {

    if (
      screen.orientation &&
      screen.orientation.unlock
    ) {

      screen.orientation.unlock();

    }

  }

  catch (error) {}


  /*
    Izhod iz fullscreen.
  */

  try {

    if (
      document.fullscreenElement
    ) {

      await document
        .exitFullscreen();

    }

  }

  catch (error) {}

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Escape"
    )
      return;


    if (cardboardMode) {

      exitCardboard();

      return;

    }


    closePopup();

    stopAddMode();

  }
);


/* =========================================================
   START
========================================================= */

scene.addEventListener(
  "loaded",
  () => {

    renderHotspots();

  }
);

</script>
