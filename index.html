<script>

/* =========================================================
   VIDEO NA DROPBOXU
   ========================================================= */

const VIDEO_URL =
"https://www.dropbox.com/scl/fi/k2d27e55jfolq551mclgz/VID_20251019_174611_00_003-2.mp4?rlkey=1k1g0dxr932r3gswj0eke07jy&st=a2nz7c35&raw=1";


/* =========================================================
   INTERAKTIVNE TOČKE
   Za začetek je seznam prazen.
   ========================================================= */

const hotspots = [

    /*
    PRIMER:

    {
        title: "Točka 1",
        description: "Tukaj je opis prve točke.",
        yaw: 0.5,
        pitch: 0,
        start: 0,
        end: 20
    }

    */

];


/* =========================================================
   ELEMENTI
   ========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");
const spotsElement = document.getElementById("spots");

const playButton = document.getElementById("play");
const muteButton = document.getElementById("mute");

const timeElement = document.getElementById("time");

const info = document.getElementById("info");
const infoTitle = document.getElementById("infoTitle");
const infoText = document.getElementById("infoText");


/* =========================================================
   360° NASTAVITVE
   ========================================================= */

let yaw = 0;
let pitch = 0;
let fov = 75;

let dragging = false;
let dragX = 0;
let dragY = 0;
let dragYaw = 0;
let dragPitch = 0;

let ready = false;

const RAD = Math.PI / 180;


/* =========================================================
   POMOŽNE FUNKCIJE
   ========================================================= */

function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
}

function formatTime(seconds) {

    if (!Number.isFinite(seconds))
        return "0:00";

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return minutes + ":" + String(secs).padStart(2, "0");
}


/* =========================================================
   CANVAS
   ========================================================= */

function resize() {

    const rect = canvas.getBoundingClientRect();

    /*
       Namenoma omejimo resolucijo canvasa,
       ker je 360° preračunavanje precej zahtevno
       predvsem na telefonu.
    */

    const scale = Math.min(
        1,
        700 / Math.max(1, rect.width),
        500 / Math.max(1, rect.height)
    );

    canvas.width =
        Math.max(1, Math.round(rect.width * scale));

    canvas.height =
        Math.max(1, Math.round(rect.height * scale));

    render();
}


/* =========================================================
   360° IZRAČUN
   ========================================================= */

function render() {

    if (!ready)
        return;

    if (video.readyState < 2)
        return;

    try {

        const source = document.createElement("canvas");

        /*
           Za telefon zmanjšamo izvorno sliko.
        */

        const maxWidth = 1536;

        const scale =
            Math.min(1, maxWidth / video.videoWidth);

        source.width =
            Math.floor(video.videoWidth * scale);

        source.height =
            Math.floor(video.videoHeight * scale);

        const sourceCtx =
            source.getContext("2d", {
                willReadFrequently: true
            });

        sourceCtx.drawImage(
            video,
            0,
            0,
            source.width,
            source.height
        );

        const src =
            sourceCtx.getImageData(
                0,
                0,
                source.width,
                source.height
            ).data;

        const width = canvas.width;
        const height = canvas.height;

        const output =
            ctx.createImageData(width, height);

        const dst = output.data;

        const aspect = width / height;

        const k =
            Math.tan(fov * RAD / 2);

        const cp = Math.cos(pitch);
        const sp = Math.sin(pitch);

        const cy = Math.cos(yaw);
        const sy = Math.sin(yaw);


        for (let y = 0; y < height; y++) {

            const vy =
                (1 - 2 * (y + 0.5) / height) * k;

            for (let x = 0; x < width; x++) {

                const vx =
                    (2 * (x + 0.5) / width - 1)
                    * aspect * k;


                const yy =
                    vy * cp + sp;

                const zz =
                    -vy * sp + cp;

                const xx =
                    vx * cy + zz * sy;

                const z =
                    -vx * sy + zz * cy;


                const length =
                    1 / Math.hypot(xx, yy, z);


                const u =
                    Math.atan2(xx, z)
                    / (2 * Math.PI)
                    + 0.5;


                const v =
                    0.5 -
                    Math.asin(
                        clamp(yy * length, -1, 1)
                    ) / Math.PI;


                const sx =
                    Math.min(
                        source.width - 1,
                        Math.max(
                            0,
                            Math.floor(u * source.width)
                        )
                    );


                const sy2 =
                    Math.min(
                        source.height - 1,
                        Math.max(
                            0,
                            Math.floor(v * source.height)
                        )
                    );


                const sourceIndex =
                    (sy2 * source.width + sx) * 4;

                const destIndex =
                    (y * width + x) * 4;


                dst[destIndex] =
                    src[sourceIndex];

                dst[destIndex + 1] =
                    src[sourceIndex + 1];

                dst[destIndex + 2] =
                    src[sourceIndex + 2];

                dst[destIndex + 3] = 255;
            }
        }


        ctx.putImageData(output, 0, 0);

        renderHotspots();

    }

    catch (error) {

        console.error(error);

        errorBox.style.display = "block";

        errorBox.textContent =
            "360° slike ni mogoče prebrati. " +
            "Najverjetneje Dropbox ne dovoljuje CORS dostopa do videa. " +
            error.message;

        video.pause();
    }
}


/* =========================================================
   ANIMACIJA
   ========================================================= */

let lastFrame = 0;

function animation(time) {

    if (
        ready &&
        !video.paused &&
        time - lastFrame > 90
    ) {

        render();

        lastFrame = time;
    }

    requestAnimationFrame(animation);
}

requestAnimationFrame(animation);


/* =========================================================
   MIŠKA / DOTIK
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        dragging = true;

        dragX = event.clientX;
        dragY = event.clientY;

        dragYaw = yaw;
        dragPitch = pitch;

        canvas.setPointerCapture(event.pointerId);
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!dragging)
            return;

        const dx =
            event.clientX - dragX;

        const dy =
            event.clientY - dragY;


        yaw =
            dragYaw -
            dx / canvas.clientWidth
            * fov * RAD * 1.7;


        pitch =
            clamp(
                dragPitch +
                dy / canvas.clientHeight
                * fov * RAD,
                -1.5,
                1.5
            );


        render();
    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        dragging = false;
    }
);


canvas.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        fov =
            clamp(
                fov +
                (event.deltaY > 0 ? 5 : -5),
                35,
                105
            );

        render();

    },
    { passive: false }
);


/* =========================================================
   HOTSPOT POLOŽAJ
   ========================================================= */

function hotspotPosition(point) {

    const dy =
        point.yaw - yaw;

    const x =
        Math.sin(dy)
        * Math.cos(point.pitch);

    const y =
        Math.sin(point.pitch);

    const z =
        Math.cos(dy)
        * Math.cos(point.pitch);


    const cp =
        Math.cos(pitch);

    const sp =
        Math.sin(pitch);


    const yy =
        y * cp - z * sp;

    const zz =
        y * sp + z * cp;


    if (zz <= 0.05)
        return null;


    const k =
        Math.tan(fov * RAD / 2);

    const aspect =
        canvas.clientWidth /
        canvas.clientHeight;


    const screenX =
        (x / zz / aspect / k + 1)
        * canvas.clientWidth / 2;


    const screenY =
        (1 - yy / zz / k)
        * canvas.clientHeight / 2;


    if (
        screenX < 0 ||
        screenX > canvas.clientWidth ||
        screenY < 0 ||
        screenY > canvas.clientHeight
    )
        return null;


    return [screenX, screenY];
}


/* =========================================================
   HOTSPOTI
   ========================================================= */

function renderHotspots() {

    spotsElement.innerHTML = "";


    for (const point of hotspots) {

        if (
            video.currentTime < point.start ||
            video.currentTime > point.end
        )
            continue;


        const position =
            hotspotPosition(point);


        if (!position)
            continue;


        const button =
            document.createElement("button");


        button.className = "spot";

        button.textContent = "i";


        button.style.left =
            position[0] + "px";

        button.style.top =
            position[1] + "px";


        button.onclick =
            event => {

                event.stopPropagation();

                video.pause();

                infoTitle.textContent =
                    point.title;

                infoText.textContent =
                    point.description;

                info.style.display =
                    "block";

                updateControls();
            };


        spotsElement.appendChild(button);
    }
}


/* =========================================================
   VIDEO
   ========================================================= */

video.src = VIDEO_URL;


video.addEventListener(
    "loadeddata",
    () => {

        ready = true;

        loading.style.display =
            "none";

        resize();

        updateControls();
    }
);


video.addEventListener(
    "error",
    () => {

        loading.style.display =
            "none";

        errorBox.style.display =
            "block";

        errorBox.textContent =
            "Videoposnetka ni mogoče naložiti iz Dropboxa.";
    }
);


/* =========================================================
   KONTROLE
   ========================================================= */

playButton.onclick =
    async () => {

        info.style.display = "none";

        if (video.paused) {

            try {

                await video.play();

            }

            catch (error) {

                alert(
                    "Predvajanja ni mogoče zagnati: "
                    + error.message
                );
            }

        }

        else {

            video.pause();
        }

        updateControls();
    };


muteButton.onclick =
    () => {

        video.muted =
            !video.muted;

        updateControls();
    };


function updateControls() {

    playButton.textContent =
        video.paused ? "▶" : "Ⅱ";


    muteButton.textContent =
        video.muted ? "🔇" : "🔊";


    timeElement.textContent =
        formatTime(video.currentTime)
        + " / "
        + formatTime(video.duration);


    renderHotspots();
}


video.addEventListener(
    "timeupdate",
    updateControls
);

video.addEventListener(
    "play",
    updateControls
);

video.addEventListener(
    "pause",
    updateControls
);

video.addEventListener(
    "seeked",
    render
);


/* =========================================================
   TELEFON
   ========================================================= */

document.body.addEventListener(
    "click",
    () => {

        /*
           Nekateri telefoni zahtevajo prvo
           uporabnikovo interakcijo, preden
           dovolijo video/audio.
        */

    },
    { once: true }
);


window.addEventListener(
    "resize",
    resize
);

</script>

</body>
</html>
