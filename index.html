<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>360° Hotspot aplikacija</title>

  <script src="https://www.marzipano.net/demos/common/marzipano.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* ==============================
       360 VIEWER
    ============================== */

    #pano {
      position: absolute;
      inset: 0;
      background: #111;
    }

    /* ==============================
       ZGORNJI UI
    ============================== */

    #topbar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;

      display: flex;
      gap: 10px;

      padding: 10px;

      background: rgba(255,255,255,.95);
      border-radius: 12px;

      box-shadow: 0 4px 20px rgba(0,0,0,.25);
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    #addBtn {
      background: #2563eb;
      color: white;
    }

    #addBtn.active {
      background: #16a34a;
    }

    /* ==============================
       HOTSPOT
    ============================== */

    .hotspot {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      background: #ef4444;

      border: 3px solid white;

      box-shadow:
        0 3px 10px rgba(0,0,0,.4),
        0 0 0 4px rgba(239,68,68,.25);

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 13px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform .15s ease,
        background .15s ease;
    }

    .hotspot:hover {
      transform: scale(1.18);
      background: #dc2626;
    }

    /* ==============================
       POPUP
    ============================== */

    .popup {
      position: absolute;

      left: 45px;
      top: 50%;

      transform: translateY(-50%);

      width: 290px;

      background: white;

      border-radius: 12px;

      padding: 18px;

      box-shadow:
        0 8px 35px rgba(0,0,0,.35);

      color: #222;

      cursor: default;

      z-index: 100;
    }

    /* če je hotspot na desni strani,
       lahko JS popup obrne na levo */

    .popup.left {
      left: auto;
      right: 45px;
    }

    .popup h3 {
      margin: 0 35px 10px 0;
      font-size: 17px;
    }

    .closeBtn {
      position: absolute;

      top: 8px;
      right: 8px;

      width: 30px;
      height: 30px;

      padding: 0;

      border-radius: 50%;

      background: #f1f1f1;

      color: #444;

      font-size: 20px;
    }

    /* ==============================
       BRALNI POGLED
    ============================== */

    .readerText {
      margin: 10px 0 15px;

      line-height: 1.5;
      font-size: 14px;

      white-space: pre-wrap;
    }

    .editBtn {
      width: 100%;

      background: #2563eb;
      color: white;
    }

    /* ==============================
       EDITOR
    ============================== */

    .editor textarea {
      width: 100%;
      min-height: 120px;

      resize: vertical;

      padding: 10px;

      margin: 5px 0 12px;

      border: 1px solid #ccc;
      border-radius: 8px;

      font-family: inherit;
      font-size: 14px;
    }

    .editorButtons {
      display: flex;
      gap: 7px;
    }

    .saveBtn {
      flex: 1;

      background: #16a34a;
      color: white;
    }

    .deleteBtn {
      background: #dc2626;
      color: white;
    }

    .cancelBtn {
      background: #e5e7eb;
      color: #222;
    }

    /* ==============================
       NAVODILO
    ============================== */

    #message {
      position: fixed;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 1000;

      padding: 10px 18px;

      background: rgba(0,0,0,.75);
      color: white;

      border-radius: 20px;

      font-size: 14px;

      display: none;
    }

  </style>
</head>

<body>

<div id="pano"></div>


<div id="topbar">

  <button id="addBtn">
    + Dodaj hotspot
  </button>

</div>


<div id="message">
  Obrni 360° sliko na želeno mesto in klikni nanjo.
</div>


<script>

/* =========================================================
   NASTAVITEV 360° SLIKE

   Če je datoteka v isti mapi kot index.html:
   panorama.jpg

   Če imaš drugo ime, spremeni SAMO spodnjo vrstico.
========================================================= */

const IMAGE = "panorama.jpg";


/* =========================================================
   MARZIPANO
========================================================= */

const panoElement =
  document.getElementById("pano");


const viewer =
  new Marzipano.Viewer(panoElement);


/*
  Equirectangular 360° slika.
*/

const source =
  Marzipano.ImageUrlSource.fromString(IMAGE);


const geometry =
  new Marzipano.EquirectGeometry([
    {
      width: 4000
    }
  ]);


const limiter =
  Marzipano.RectilinearView.limit.traditional(
    4096,
    100 * Math.PI / 180
  );


const view =
  new Marzipano.RectilinearView(
    {
      yaw: 0,
      pitch: 0,
      fov: Math.PI / 2
    },
    limiter
  );


const scene =
  viewer.createScene({
    source: source,
    geometry: geometry,
    view: view,
    pinFirstLevel: true
  });


scene.switchTo();


/* =========================================================
   PODATKI
========================================================= */

let hotspots =
  JSON.parse(
    localStorage.getItem("360-hotspots")
  ) || [];


let addMode = false;

let hotspotElements = [];


const addBtn =
  document.getElementById("addBtn");


const message =
  document.getElementById("message");


function saveData() {

  localStorage.setItem(
    "360-hotspots",
    JSON.stringify(hotspots)
  );

}


/* =========================================================
   DODAJ HOTSPOT
========================================================= */

addBtn.addEventListener("click", () => {

  addMode = !addMode;


  if (addMode) {

    addBtn.classList.add("active");

    addBtn.textContent =
      "Klikni na 360° sliko";

    message.style.display =
      "block";

  }

  else {

    stopAddMode();

  }

});


function stopAddMode() {

  addMode = false;

  addBtn.classList.remove("active");

  addBtn.textContent =
    "+ Dodaj hotspot";

  message.style.display =
    "none";

}


/* =========================================================
   KLIK NA PANORAMO
========================================================= */

panoElement.addEventListener(
  "click",
  function(event) {

    if (!addMode)
      return;


    /*
      Če kliknemo gumb ali hotspot,
      ne dodajamo nove točke.
    */

    if (
      event.target.closest(".hotspot") ||
      event.target.closest("#topbar")
    ) {
      return;
    }


    const rect =
      panoElement.getBoundingClientRect();


    /*
      Pretvorimo klik na zaslonu
      v yaw + pitch 360° panorame.
    */

    const coordinates =
      view.screenToCoordinates({
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      });


    if (!coordinates)
      return;


    const hotspot = {

      id:
        Date.now(),

      yaw:
        coordinates.yaw,

      pitch:
        coordinates.pitch,

      description:
        ""

    };


    hotspots.push(hotspot);

    saveData();


    const element =
      createHotspot(
        hotspot,
        hotspots.length
      );


    stopAddMode();


    /*
      Nov hotspot se takoj
      odpre v načinu urejanja.
    */

    openEditor(
      element,
      hotspot
    );

  }
);


/* =========================================================
   USTVARJANJE HOTSPOTA
========================================================= */

function createHotspot(
  hotspot,
  number
) {

  const element =
    document.createElement("div");


  element.className =
    "hotspot";


  element.textContent =
    number;


  /*
    Klik na obstoječi hotspot:
    BRALNI POGLED.
  */

  element.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      /*
        Če smo kliknili nekaj
        znotraj popupa, tukaj končamo.
      */

      if (
        event.target.closest(".popup")
      ) {
        return;
      }


      closeAllPopups();


      openReader(
        element,
        hotspot
      );

    }
  );


  scene.hotspotContainer()
    .createHotspot(
      element,
      {
        yaw: hotspot.yaw,
        pitch: hotspot.pitch
      }
    );


  hotspotElements.push({
    hotspot,
    element
  });


  return element;

}


/* =========================================================
   BRALNI POGLED
========================================================= */

function openReader(
  element,
  hotspot
) {

  closeAllPopups();


  const popup =
    document.createElement("div");


  popup.className =
    "popup";


  /*
    Popup lahko obrnemo na levo,
    če je hotspot na desni polovici.
  */

  setPopupSide(
    popup,
    hotspot
  );


  const title =
    document.createElement("h3");

  title.textContent =
    "Opis";


  const close =
    document.createElement("button");

  close.className =
    "closeBtn";

  close.textContent =
    "×";


  const text =
    document.createElement("div");

  text.className =
    "readerText";


  text.textContent =
    hotspot.description ||
    "Ta hotspot še nima opisa.";


  const edit =
    document.createElement("button");

  edit.className =
    "editBtn";

  edit.textContent =
    "Uredi";


  close.onclick =
    function(event) {

      event.stopPropagation();

      popup.remove();

    };


  edit.onclick =
    function(event) {

      event.stopPropagation();

      popup.remove();

      openEditor(
        element,
        hotspot
      );

    };


  popup.appendChild(title);

  popup.appendChild(close);

  popup.appendChild(text);

  popup.appendChild(edit);


  element.appendChild(popup);

}


/* =========================================================
   EDITOR
========================================================= */

function openEditor(
  element,
  hotspot
) {

  closeAllPopups();


  const popup =
    document.createElement("div");


  popup.className =
    "popup";


  setPopupSide(
    popup,
    hotspot
  );


  const title =
    document.createElement("h3");

  title.textContent =
    "Uredi hotspot";


  const close =
    document.createElement("button");

  close.className =
    "closeBtn";

  close.textContent =
    "×";


  const editor =
    document.createElement("div");

  editor.className =
    "editor";


  const textarea =
    document.createElement("textarea");


  textarea.placeholder =
    "Vpiši opis...";


  textarea.value =
    hotspot.description || "";


  const buttons =
    document.createElement("div");

  buttons.className =
    "editorButtons";


  const save =
    document.createElement("button");

  save.className =
    "saveBtn";

  save.textContent =
    "Shrani";


  const remove =
    document.createElement("button");

  remove.className =
    "deleteBtn";

  remove.textContent =
    "Izbriši";


  const cancel =
    document.createElement("button");

  cancel.className =
    "cancelBtn";

  cancel.textContent =
    "Prekliči";


  /* SHRANI */

  save.onclick =
    function(event) {

      event.stopPropagation();


      hotspot.description =
        textarea.value.trim();


      saveData();


      popup.remove();


      /*
        Po shranjevanju takoj
        pokažemo BRALNI pogled.
      */

      openReader(
        element,
        hotspot
      );

    };


  /* IZBRIŠI */

  remove.onclick =
    function(event) {

      event.stopPropagation();


      hotspots =
        hotspots.filter(
          h => h.id !== hotspot.id
        );


      saveData();


      /*
        Marzipano hotspot najlažje
        ponovno izrišemo.
      */

      location.reload();

    };


  /* PREKLIČI */

  cancel.onclick =
    function(event) {

      event.stopPropagation();

      popup.remove();

      openReader(
        element,
        hotspot
      );

    };


  /* X */

  close.onclick =
    function(event) {

      event.stopPropagation();

      popup.remove();

    };


  buttons.appendChild(save);

  buttons.appendChild(remove);

  buttons.appendChild(cancel);


  editor.appendChild(textarea);

  editor.appendChild(buttons);


  popup.appendChild(title);

  popup.appendChild(close);

  popup.appendChild(editor);


  element.appendChild(popup);


  setTimeout(
    () => textarea.focus(),
    50
  );

}


/* =========================================================
   POPUP DESNO / LEVO
========================================================= */

function setPopupSide(
  popup,
  hotspot
) {

  /*
    Pretvorimo koordinato hotspota
    nazaj v screen pozicijo.
  */

  requestAnimationFrame(() => {

    const screen =
      view.coordinatesToScreen({
        yaw: hotspot.yaw,
        pitch: hotspot.pitch
      });


    if (!screen)
      return;


    /*
      Če je hotspot na desni polovici
      ekrana, popup damo LEVO.
    */

    if (
      screen.x >
      window.innerWidth / 2
    ) {

      popup.classList.add("left");

    }

    else {

      popup.classList.remove("left");

    }

  });

}


/* =========================================================
   ZAPRI VSE POPUPE
========================================================= */

function closeAllPopups() {

  document
    .querySelectorAll(".popup")
    .forEach(
      popup => popup.remove()
    );

}


/* =========================================================
   NALOŽI SHRANJENE HOTSPOTE
========================================================= */

hotspots.forEach(
  (hotspot, index) => {

    createHotspot(
      hotspot,
      index + 1
    );

  }
);

</script>

</body>
</html>
