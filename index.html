<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>360° Hotspot Viewer</title>

  <!-- A-Frame = 360 + WebXR -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    #viewer {
      position: fixed;
      inset: 0;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    /* ========================================
       TOOLBAR
    ======================================== */

    #toolbar {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10000;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px;

      background: rgba(20,20,20,.84);
      backdrop-filter: blur(10px);

      border-radius: 14px;

      box-shadow:
        0 6px 25px rgba(0,0,0,.3);
    }

    .tool-button {
      height: 42px;
      min-width: 42px;

      padding: 0 14px;

      border: 0;
      border-radius: 9px;

      background: rgba(255,255,255,.13);
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .tool-button:hover {
      background: rgba(255,255,255,.23);
    }

    #addHotspotBtn {
      background: #2563eb;
    }

    #addHotspotBtn.active {
      background: #16a34a;
    }

    #vrBtn {
      background: #7c3aed;
    }

    #vrBtn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .separator {
      width: 1px;
      height: 26px;
      background: rgba(255,255,255,.22);
    }

    /* ========================================
       NAVODILO
    ======================================== */

    #instruction {
      position: fixed;
      z-index: 10000;

      left: 50%;
      bottom: 24px;

      transform: translateX(-50%);

      display: none;

      padding: 11px 18px;

      max-width: calc(100% - 40px);

      border-radius: 30px;

      background: rgba(0,0,0,.8);
      color: white;

      text-align: center;
      font-size: 14px;

      pointer-events: none;
    }

    /* ========================================
       HTML POPUP
       Samo za navaden način.
    ======================================== */

    #popup {
      position: fixed;

      z-index: 20000;

      display: none;

      width: 330px;
      max-width: calc(100vw - 30px);

      padding: 18px;

      background: white;
      color: #222;

      border-radius: 14px;

      box-shadow:
        0 12px 40px rgba(0,0,0,.38);
    }

    #popup::before {
      content: "";

      position: absolute;

      left: -9px;
      top: 50%;

      transform: translateY(-50%);

      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 9px solid white;
    }

    #popup.open-left::before {
      left: auto;
      right: -9px;

      border-right: 0;
      border-left: 9px solid white;
    }

    #popupClose {
      position: absolute;

      right: 9px;
      top: 9px;

      width: 30px;
      height: 30px;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: #f1f3f5;

      color: #444;

      font-size: 20px;

      cursor: pointer;
    }

    /* ========================================
       READER
    ======================================== */

    #readerMode {
      display: none;
    }

    #readerTitle {
      margin: 0 35px 10px 0;
      font-size: 20px;
    }

    #readerDescription {
      margin: 0 0 17px;

      color: #444;

      font-size: 14px;
      line-height: 1.55;

      white-space: pre-wrap;
    }

    #editBtn {
      width: 100%;

      padding: 10px;

      border: 0;
      border-radius: 8px;

      background: #2563eb;
      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    /* ========================================
       EDITOR
    ======================================== */

    #editorMode {
      display: none;
    }

    .field-label {
      display: block;

      margin: 0 0 5px;

      font-size: 12px;
      font-weight: bold;

      color: #555;
    }

    #titleInput,
    #descriptionInput {
      width: 100%;

      padding: 10px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      font: inherit;

      outline: none;
    }

    #titleInput {
      margin-bottom: 12px;
    }

    #descriptionInput {
      min-height: 120px;
      margin-bottom: 12px;
      resize: vertical;
    }

    #titleInput:focus,
    #descriptionInput:focus {
      border-color: #2563eb;
    }

    .editor-buttons {
      display: flex;
      gap: 7px;
    }

    .editor-buttons button {
      border: 0;
      border-radius: 8px;

      padding: 9px 12px;

      font-weight: bold;

      cursor: pointer;
    }

    #saveBtn {
      flex: 1;

      background: #16a34a;
      color: white;
    }

    #cancelBtn {
      background: #e5e7eb;
    }

    #deleteBtn {
      background: #dc2626;
      color: white;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 650px) {
      #toolbar {
        top: 10px;
        left: 10px;
        right: 10px;

        justify-content: center;
        flex-wrap: wrap;
      }

      .tool-button {
        height: 38px;
        padding: 0 11px;
      }

      #popup {
        width: 290px;
      }
    }
  </style>
</head>

<body>

<div id="viewer">

  <a-scene
    id="scene"

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      colorManagement: true
    "

    webxr="
      referenceSpaceType: local-floor;
      optionalFeatures: local-floor, bounded-floor
    "

    loading-screen="enabled: true"

    cursor="rayOrigin: mouse"

    raycaster="
      objects: .clickable;
      far: 100
    "
  >

    <!-- ==================================
         360° SLIKA
    =================================== -->

    <a-assets>

      <img
        id="panoramaImage"
        src="360.jpg"
        crossorigin="anonymous"
      >

    </a-assets>


    <a-sky
      id="sky"
      src="#panoramaImage"
      rotation="0 -90 0"
    ></a-sky>


    <!-- ==================================
         3D HOTSPOTI
    =================================== -->

    <a-entity
      id="hotspotContainer"
    ></a-entity>


    <!-- ==================================
         VR INFO KARTICA

         To je prava 3D kartica,
         zato je vidna v headsetu.
    =================================== -->

    <a-entity
      id="vrCard"
      visible="false"
    >

      <a-plane
        width="3.5"
        height="2"
        color="#ffffff"
        opacity="0.96"
        material="shader: flat"
      ></a-plane>

      <a-text
        id="vrCardTitle"
        value=""
        position="-1.5 0.62 0.02"
        width="3"
        color="#111111"
        align="left"
        wrap-count="28"
      ></a-text>

      <a-text
        id="vrCardDescription"
        value=""
        position="-1.5 0.25 0.02"
        width="3"
        color="#333333"
        align="left"
        baseline="top"
        wrap-count="42"
      ></a-text>

      <a-text
        value="Poglej stran, da nadaljuješ"
        position="0 -0.78 0.02"
        width="2.4"
        color="#777777"
        align="center"
      ></a-text>

    </a-entity>


    <!-- ==================================
         KAMERA
    =================================== -->

    <a-entity
      id="cameraRig"
      position="0 0 0"
    >

      <a-camera
        id="camera"

        position="0 1.6 0"

        look-controls="
          enabled: true
        "

        wasd-controls="
          enabled: false
        "
      >

        <!--
          VR GAZE RETICLE

          V normalnem načinu je skrit.
          V VR ga prikažemo.
        -->

        <a-entity
          id="gazeCursor"

          position="0 0 -1"

          visible="false"

          cursor="
            fuse: true;
            fuseTimeout: 1200
          "

          raycaster="
            objects: .vr-hotspot;
            far: 100
          "
        >

          <!-- osnovna pika -->

          <a-ring
            id="gazeRing"

            radius-inner="0.012"
            radius-outer="0.020"

            color="#ffffff"

            material="
              shader: flat;
              opacity: 0.9
            "
          ></a-ring>

        </a-entity>

      </a-camera>

    </a-entity>

  </a-scene>

</div>


<!-- ========================================
     TOOLBAR
========================================= -->

<div id="toolbar">

  <button
    id="addHotspotBtn"
    class="tool-button"
  >
    + Dodaj hotspot
  </button>

  <div class="separator"></div>

  <button
    id="zoomInBtn"
    class="tool-button"
  >
    +
  </button>

  <button
    id="zoomOutBtn"
    class="tool-button"
  >
    −
  </button>

  <div class="separator"></div>

  <button
    id="fullscreenBtn"
    class="tool-button"
  >
    ⛶ Fullscreen
  </button>

  <button
    id="vrBtn"
    class="tool-button"
  >
    🥽 VR
  </button>

</div>


<div id="instruction">
  Klikni na mesto v 360° panorami, kamor želiš dodati hotspot.
</div>


<!-- ========================================
     NORMALNI POPUP
========================================= -->

<div id="popup">

  <button id="popupClose">
    ×
  </button>


  <!-- BRANJE -->

  <div id="readerMode">

    <h2 id="readerTitle"></h2>

    <div id="readerDescription"></div>

    <button id="editBtn">
      Uredi
    </button>

  </div>


  <!-- UREJANJE -->

  <div id="editorMode">

    <label class="field-label">
      Naslov
    </label>

    <input
      id="titleInput"
      type="text"
      placeholder="Naslov hotspota"
    >


    <label class="field-label">
      Opis
    </label>

    <textarea
      id="descriptionInput"
      placeholder="Vpiši opis..."
    ></textarea>


    <div class="editor-buttons">

      <button id="saveBtn">
        Shrani
      </button>

      <button id="cancelBtn">
        Prekliči
      </button>

      <button id="deleteBtn">
        Izbriši
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   ELEMENTI
========================================================= */

const scene =
  document.querySelector("#scene");

const camera =
  document.querySelector("#camera");

const sky =
  document.querySelector("#sky");

const hotspotContainer =
  document.querySelector("#hotspotContainer");

const gazeCursor =
  document.querySelector("#gazeCursor");

const gazeRing =
  document.querySelector("#gazeRing");

const vrCard =
  document.querySelector("#vrCard");

const vrCardTitle =
  document.querySelector("#vrCardTitle");

const vrCardDescription =
  document.querySelector("#vrCardDescription");


const addHotspotBtn =
  document.querySelector("#addHotspotBtn");

const zoomInBtn =
  document.querySelector("#zoomInBtn");

const zoomOutBtn =
  document.querySelector("#zoomOutBtn");

const fullscreenBtn =
  document.querySelector("#fullscreenBtn");

const vrBtn =
  document.querySelector("#vrBtn");

const instruction =
  document.querySelector("#instruction");


const popup =
  document.querySelector("#popup");

const popupClose =
  document.querySelector("#popupClose");

const readerMode =
  document.querySelector("#readerMode");

const editorMode =
  document.querySelector("#editorMode");

const readerTitle =
  document.querySelector("#readerTitle");

const readerDescription =
  document.querySelector("#readerDescription");

const editBtn =
  document.querySelector("#editBtn");

const titleInput =
  document.querySelector("#titleInput");

const descriptionInput =
  document.querySelector("#descriptionInput");

const saveBtn =
  document.querySelector("#saveBtn");

const cancelBtn =
  document.querySelector("#cancelBtn");

const deleteBtn =
  document.querySelector("#deleteBtn");


/* =========================================================
   PODATKI
========================================================= */

const STORAGE_KEY =
  "stable-360-hotspots-v3";


let hotspots =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || [];


let selectedHotspotId = null;

let addMode = false;

let isDragging = false;

let dragStartX = 0;

let dragStartY = 0;

let dragDistance = 0;


/* =========================================================
   SHRANI
========================================================= */

function saveHotspots() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(hotspots)
  );

}


/* =========================================================
   FACE CAMERA

   Hotspot je pravi 3D objekt.

   Obrne se proti kameri.

   Ni več HTML pika, zato pri dnu
   in vrhu panorame ne trese.
========================================================= */

AFRAME.registerComponent(
  "face-camera",
  {

    tick: function () {

      const cameraObject =
        camera.object3D;


      if (!cameraObject)
        return;


      const cameraPosition =
        new THREE.Vector3();


      cameraObject.getWorldPosition(
        cameraPosition
      );


      this.el.object3D.lookAt(
        cameraPosition
      );

    }

  }
);


/* =========================================================
   YAW / PITCH -> 3D
========================================================= */

function sphericalToVector(
  yaw,
  pitch,
  radius = 8
) {

  const x =
    radius *
    Math.cos(pitch) *
    Math.sin(yaw);


  const y =
    radius *
    Math.sin(pitch);


  const z =
    -radius *
    Math.cos(pitch) *
    Math.cos(yaw);


  return new THREE.Vector3(
    x,
    y,
    z
  );

}


/* =========================================================
   3D SMER -> YAW / PITCH
========================================================= */

function directionToSpherical(
  direction
) {

  return {

    yaw:
      Math.atan2(
        direction.x,
        -direction.z
      ),

    pitch:
      Math.asin(
        THREE.MathUtils.clamp(
          direction.y,
          -1,
          1
        )
      )

  };

}


/* =========================================================
   SCREEN CLICK -> 3D SMER
========================================================= */

function screenToDirection(
  clientX,
  clientY
) {

  const cameraObject =
    camera.getObject3D("camera");


  if (!cameraObject)
    return null;


  const rect =
    scene.canvas.getBoundingClientRect();


  const x =
    (
      (clientX - rect.left)
      / rect.width
    ) * 2 - 1;


  const y =
    -(
      (
        (clientY - rect.top)
        / rect.height
      ) * 2 - 1
    );


  const vector =
    new THREE.Vector3(
      x,
      y,
      0.5
    );


  vector.unproject(
    cameraObject
  );


  const cameraPosition =
    new THREE.Vector3();


  cameraObject.getWorldPosition(
    cameraPosition
  );


  vector
    .sub(cameraPosition)
    .normalize();


  return vector;

}


/* =========================================================
   NAREDI 3D HOTSPOT
========================================================= */

function createHotspotEntity(
  hotspot,
  number
) {

  const root =
    document.createElement(
      "a-entity"
    );


  root.dataset.id =
    hotspot.id;


  root.classList.add(
    "clickable"
  );


  root.classList.add(
    "vr-hotspot"
  );


  root.setAttribute(
    "face-camera",
    ""
  );


  const position =
    sphericalToVector(
      hotspot.yaw,
      hotspot.pitch
    );


  root.setAttribute(
    "position",
    `${position.x} ${position.y} ${position.z}`
  );


  /* -------------------------------
     BEL ROB
  -------------------------------- */

  const border =
    document.createElement(
      "a-circle"
    );


  border.setAttribute(
    "radius",
    "0.26"
  );


  border.setAttribute(
    "color",
    "#ffffff"
  );


  border.setAttribute(
    "material",
    "shader: flat; side: double"
  );


  /* -------------------------------
     RDEČA PIKA
  -------------------------------- */

  const dot =
    document.createElement(
      "a-circle"
    );


  dot.setAttribute(
    "radius",
    "0.20"
  );


  dot.setAttribute(
    "position",
    "0 0 0.01"
  );


  dot.setAttribute(
    "color",
    "#ef4444"
  );


  dot.setAttribute(
    "material",
    "shader: flat; side: double"
  );


  /* -------------------------------
     ŠTEVILKA
  -------------------------------- */

  const text =
    document.createElement(
      "a-text"
    );


  text.setAttribute(
    "value",
    String(number)
  );


  text.setAttribute(
    "align",
    "center"
  );


  text.setAttribute(
    "anchor",
    "center"
  );


  text.setAttribute(
    "baseline",
    "center"
  );


  text.setAttribute(
    "color",
    "#ffffff"
  );


  text.setAttribute(
    "width",
    "1"
  );


  text.setAttribute(
    "position",
    "0 0 0.025"
  );


  root.appendChild(border);
  root.appendChild(dot);
  root.appendChild(text);


  /* =====================================================
     NORMALEN KLIK NA HOTSPOT

     Odpre samo reader.
  ===================================================== */

  root.addEventListener(
    "click",
    event => {

      event.stopPropagation();


      /*
        Če smo v VR:
        click prihaja iz gaze fuse.

        Zato pokažemo VR kartico.
      */

      if (scene.is("vr-mode")) {

        showVRCard(
          hotspot
        );

        return;

      }


      stopAddMode();


      openReader(
        hotspot.id
      );

    }
  );


  /* =====================================================
     GAZE ZAČETEK

     Cursor je začel gledati hotspot.
  ===================================================== */

  root.addEventListener(
    "mouseenter",
    () => {

      if (!scene.is("vr-mode"))
        return;


      startGazeAnimation(
        root
      );

    }
  );


  /* =====================================================
     GAZE PREKINITEV
  ===================================================== */

  root.addEventListener(
    "mouseleave",
    () => {

      if (!scene.is("vr-mode"))
        return;


      cancelGazeAnimation(
        root
      );

    }
  );


  hotspotContainer.appendChild(
    root
  );

}


/* =========================================================
   RENDER VSEH HOTSPOTOV
========================================================= */

function renderHotspots() {

  hotspotContainer.innerHTML =
    "";


  hotspots.forEach(
    (hotspot, index) => {

      createHotspotEntity(
        hotspot,
        index + 1
      );

    }
  );

}


/* =========================================================
   DODAJ HOTSPOT
========================================================= */

addHotspotBtn.addEventListener(
  "click",
  () => {

    if (scene.is("vr-mode"))
      return;


    addMode =
      !addMode;


    closePopup();


    if (addMode) {

      addHotspotBtn.classList.add(
        "active"
      );


      addHotspotBtn.textContent =
        "Klikni v panoramo";


      instruction.style.display =
        "block";

    }

    else {

      stopAddMode();

    }

  }
);


function stopAddMode() {

  addMode = false;


  addHotspotBtn.classList.remove(
    "active"
  );


  addHotspotBtn.textContent =
    "+ Dodaj hotspot";


  instruction.style.display =
    "none";

}


/* =========================================================
   DRAG DETEKCIJA

   Če uporabnik vrti panoramo,
   ne želimo ustvariti hotspota.
========================================================= */

scene.addEventListener(
  "mousedown",
  event => {

    isDragging = true;

    dragStartX =
      event.clientX;

    dragStartY =
      event.clientY;

    dragDistance = 0;

  }
);


scene.addEventListener(
  "mousemove",
  event => {

    if (!isDragging)
      return;


    const dx =
      event.clientX -
      dragStartX;


    const dy =
      event.clientY -
      dragStartY;


    dragDistance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

  }
);


window.addEventListener(
  "mouseup",
  () => {

    isDragging = false;

  }
);


/* TOUCH */

scene.addEventListener(
  "touchstart",
  event => {

    if (
      event.touches.length !== 1
    )
      return;


    dragStartX =
      event.touches[0].clientX;


    dragStartY =
      event.touches[0].clientY;


    dragDistance = 0;

  },
  {
    passive: true
  }
);


scene.addEventListener(
  "touchmove",
  event => {

    if (
      event.touches.length !== 1
    )
      return;


    const dx =
      event.touches[0].clientX -
      dragStartX;


    const dy =
      event.touches[0].clientY -
      dragStartY;


    dragDistance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

  },
  {
    passive: true
  }
);


/* =========================================================
   KLIK NA PANORAMO

   SAMO kadar je vklopljen
   "+ Dodaj hotspot".
========================================================= */

scene.addEventListener(
  "click",
  event => {

    if (!addMode)
      return;


    /*
      Če smo premikali panoramo,
      ni klik.
    */

    if (dragDistance > 8)
      return;


    /*
      Če smo kliknili obstoječ
      3D hotspot, ne dodajaj novega.
    */

    if (
      event.target &&
      event.target.closest &&
      event.target.closest(
        ".vr-hotspot"
      )
    )
      return;


    const direction =
      screenToDirection(
        event.clientX,
        event.clientY
      );


    if (!direction)
      return;


    const spherical =
      directionToSpherical(
        direction
      );


    const hotspot = {

      id:
        "hs-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,7),

      yaw:
        spherical.yaw,

      pitch:
        spherical.pitch,

      title: "",

      description: ""

    };


    hotspots.push(
      hotspot
    );


    saveHotspots();


    stopAddMode();


    renderHotspots();


    /*
      Takoj odpri editor
      ob novi piki.
    */

    openEditor(
      hotspot.id
    );

  }
);


/* =========================================================
   3D HOTSPOT -> SCREEN

   To uporabljamo SAMO za popup.

   Pika sama se NE premika s to
   funkcijo, zato ni tresenja.
========================================================= */

function getHotspotScreenPosition(
  hotspot
) {

  const cameraObject =
    camera.getObject3D("camera");


  if (!cameraObject)
    return null;


  const position =
    sphericalToVector(
      hotspot.yaw,
      hotspot.pitch
    );


  const projected =
    position
      .clone()
      .project(
        cameraObject
      );


  /*
    Za kamero.
  */

  const cameraPosition =
    new THREE.Vector3();


  cameraObject.getWorldPosition(
    cameraPosition
  );


  const cameraDirection =
    new THREE.Vector3();


  cameraObject.getWorldDirection(
    cameraDirection
  );


  const direction =
    position
      .clone()
      .sub(cameraPosition)
      .normalize();


  if (
    cameraDirection.dot(
      direction
    ) <= 0
  ) {

    return null;

  }


  return {

    x:
      (
        projected.x + 1
      ) / 2 *
      window.innerWidth,

    y:
      (
        -projected.y + 1
      ) / 2 *
      window.innerHeight

  };

}


/* =========================================================
   POSTAVI HTML POPUP OB HOTSPOT
========================================================= */

function positionPopup() {

  if (
    !selectedHotspotId ||
    popup.style.display === "none"
  )
    return;


  const hotspot =
    hotspots.find(
      h =>
        h.id ===
        selectedHotspotId
    );


  if (!hotspot)
    return;


  const screen =
    getHotspotScreenPosition(
      hotspot
    );


  if (!screen) {

    popup.style.visibility =
      "hidden";

    return;

  }


  popup.style.visibility =
    "visible";


  const gap = 32;


  const width =
    popup.offsetWidth;


  const height =
    popup.offsetHeight;


  let left;

  let top =
    screen.y -
    height / 2;


  /*
    DESNO ALI LEVO OD PIKE
  */

  if (
    screen.x <
    window.innerWidth / 2
  ) {

    popup.classList.remove(
      "open-left"
    );


    left =
      screen.x +
      gap;

  }

  else {

    popup.classList.add(
      "open-left"
    );


    left =
      screen.x -
      width -
      gap;

  }


  /*
    ROBOVI
  */

  left =
    Math.max(
      10,
      Math.min(
        left,
        window.innerWidth -
        width -
        10
      )
    );


  top =
    Math.max(
      10,
      Math.min(
        top,
        window.innerHeight -
        height -
        10
      )
    );


  popup.style.left =
    left + "px";


  popup.style.top =
    top + "px";

}


/* =========================================================
   POPUP LOOP

   Premika samo odprto okence.

   3D hotspot ostane povsem
   v WebGL sceni.
========================================================= */

function popupLoop() {

  positionPopup();


  requestAnimationFrame(
    popupLoop
  );

}


popupLoop();


/* =========================================================
   READER
========================================================= */

function openReader(id) {

  const hotspot =
    hotspots.find(
      h => h.id === id
    );


  if (!hotspot)
    return;


  selectedHotspotId =
    id;


  readerTitle.textContent =
    hotspot.title ||
    "Brez naslova";


  readerDescription.textContent =
    hotspot.description ||
    "Ni opisa.";


  editorMode.style.display =
    "none";


  readerMode.style.display =
    "block";


  popup.style.display =
    "block";


  /*
    Počakamo, da browser
    izračuna velikost.
  */

  requestAnimationFrame(
    positionPopup
  );

}


/* =========================================================
   EDITOR
========================================================= */

function openEditor(id) {

  const hotspot =
    hotspots.find(
      h => h.id === id
    );


  if (!hotspot)
    return;


  selectedHotspotId =
    id;


  titleInput.value =
    hotspot.title || "";


  descriptionInput.value =
    hotspot.description || "";


  readerMode.style.display =
    "none";


  editorMode.style.display =
    "block";


  popup.style.display =
    "block";


  requestAnimationFrame(
    positionPopup
  );


  setTimeout(
    () =>
      titleInput.focus(),
    50
  );

}


/* =========================================================
   SHRANI

   Popup OSTANE odprt.

   Samo spremeni se
   editor -> reader.
========================================================= */

saveBtn.addEventListener(
  "click",
  () => {

    const hotspot =
      hotspots.find(
        h =>
          h.id ===
          selectedHotspotId
      );


    if (!hotspot)
      return;


    hotspot.title =
      titleInput.value.trim();


    hotspot.description =
      descriptionInput
        .value
        .trim();


    saveHotspots();


    openReader(
      hotspot.id
    );

  }
);


/* =========================================================
   UREDI
========================================================= */

editBtn.addEventListener(
  "click",
  () => {

    if (!selectedHotspotId)
      return;


    openEditor(
      selectedHotspotId
    );

  }
);


/* =========================================================
   PREKLIČI
========================================================= */

cancelBtn.addEventListener(
  "click",
  () => {

    const hotspot =
      hotspots.find(
        h =>
          h.id ===
          selectedHotspotId
      );


    if (!hotspot)
      return;


    if (
      hotspot.title ||
      hotspot.description
    ) {

      openReader(
        hotspot.id
      );

    }

    else {

      closePopup();

    }

  }
);


/* =========================================================
   IZBRIŠI
========================================================= */

deleteBtn.addEventListener(
  "click",
  () => {

    if (!selectedHotspotId)
      return;


    hotspots =
      hotspots.filter(
        h =>
          h.id !==
          selectedHotspotId
      );


    saveHotspots();


    closePopup();


    renderHotspots();

  }
);


/* =========================================================
   ZAPRI
========================================================= */

popupClose.addEventListener(
  "click",
  closePopup
);


function closePopup() {

  popup.style.display =
    "none";


  selectedHotspotId =
    null;

}


/* =========================================================
   ZOOM
========================================================= */

function changeZoom(
  amount
) {

  const cameraObject =
    camera.getObject3D(
      "camera"
    );


  if (!cameraObject)
    return;


  cameraObject.fov +=
    amount;


  cameraObject.fov =
    THREE.MathUtils.clamp(
      cameraObject.fov,
      30,
      100
    );


  cameraObject
    .updateProjectionMatrix();

}


zoomInBtn.addEventListener(
  "click",
  () =>
    changeZoom(-10)
);


zoomOutBtn.addEventListener(
  "click",
  () =>
    changeZoom(10)
);


/* KOLEŠČEK */

window.addEventListener(
  "wheel",
  event => {

    if (
      popup.contains(
        event.target
      )
    )
      return;


    event.preventDefault();


    changeZoom(
      event.deltaY *
      0.03
    );

  },
  {
    passive: false
  }
);


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
  "click",
  async () => {

    try {

      if (
        !document.fullscreenElement
      ) {

        await document
          .documentElement
          .requestFullscreen();

      }

      else {

        await document
          .exitFullscreen();

      }

    }

    catch (error) {

      console.error(
        error
      );

    }

  }
);


/* =========================================================
   WEBXR PODPORA

   Preverimo, ali naprava res
   podpira immersive-vr.
========================================================= */

async function checkVRSupport() {

  /*
    WebXR zahteva secure context.
  */

  if (
    !window.isSecureContext ||
    !navigator.xr
  ) {

    vrBtn.disabled =
      true;


    vrBtn.textContent =
      "VR ni na voljo";


    return;

  }


  try {

    const supported =
      await navigator.xr
        .isSessionSupported(
          "immersive-vr"
        );


    if (!supported) {

      vrBtn.disabled =
        true;


      vrBtn.textContent =
        "VR ni na voljo";

    }

    else {

      vrBtn.disabled =
        false;


      vrBtn.textContent =
        "🥽 VR";

    }

  }

  catch (error) {

    vrBtn.disabled =
      true;


    vrBtn.textContent =
      "VR ni na voljo";

  }

}


/* =========================================================
   VR GUMB
========================================================= */

vrBtn.addEventListener(
  "click",
  async () => {

    if (vrBtn.disabled)
      return;


    try {

      if (
        scene.is(
          "vr-mode"
        )
      ) {

        await scene.exitVR();

      }

      else {

        closePopup();

        stopAddMode();


        await scene.enterVR();

      }

    }

    catch (error) {

      console.error(
        "VR napaka:",
        error
      );


      alert(
        "VR se ni mogel zagnati. Preveri WebXR podporo in HTTPS."
      );

    }

  }
);


/* =========================================================
   ENTER VR
========================================================= */

scene.addEventListener(
  "enter-vr",
  () => {

    /*
      HTML UI v headsetu ni uporaben.
    */

    toolbar.style.display =
      "none";


    popup.style.display =
      "none";


    instruction.style.display =
      "none";


    /*
      GAZE RETICLE ON.
    */

    gazeCursor.setAttribute(
      "visible",
      true
    );


    /*
      Kartica na začetku skrita.
    */

    vrCard.setAttribute(
      "visible",
      false
    );

  }
);


/* =========================================================
   EXIT VR
========================================================= */

scene.addEventListener(
  "exit-vr",
  () => {

    toolbar.style.display =
      "flex";


    gazeCursor.setAttribute(
      "visible",
      false
    );


    vrCard.setAttribute(
      "visible",
      false
    );


    resetGazeVisual();

  }
);


/* =========================================================
   GAZE ANIMACIJA

   Ko pogledaš hotspot:
   1.2 sekunde do izbire.

   A-Frame cursor bo sam sprožil
   "click" po fuseTimeout.
========================================================= */

function startGazeAnimation(
  hotspotEntity
) {

  /*
    Vizualno pokažemo,
    da je gaze aktiven.

    Hotspot se poveča.
  */

  hotspotEntity.setAttribute(
    "animation__gaze",
    {
      property:
        "scale",

      from:
        "1 1 1",

      to:
        "1.35 1.35 1.35",

      dur:
        1200,

      easing:
        "linear"
    }
  );


  /*
    Reticle prav tako raste.
  */

  gazeRing.setAttribute(
    "animation__fuse",
    {
      property:
        "scale",

      from:
        "1 1 1",

      to:
        "1.8 1.8 1.8",

      dur:
        1200,

      easing:
        "linear"
    }
  );

}


/* =========================================================
   GAZE PREKINITEV
========================================================= */

function cancelGazeAnimation(
  hotspotEntity
) {

  hotspotEntity.removeAttribute(
    "animation__gaze"
  );


  hotspotEntity.setAttribute(
    "scale",
    "1 1 1"
  );


  resetGazeVisual();

}


function resetGazeVisual() {

  gazeRing.removeAttribute(
    "animation__fuse"
  );


  gazeRing.setAttribute(
    "scale",
    "1 1 1"
  );

}


/* =========================================================
   VR KARTICA

   Ni HTML.

   Je pravi 3D element,
   zato ga headset vidi.
========================================================= */

function showVRCard(
  hotspot
) {

  vrCardTitle.setAttribute(
    "value",
    hotspot.title ||
    "Brez naslova"
  );


  vrCardDescription.setAttribute(
    "value",
    hotspot.description ||
    "Ni opisa."
  );


  /*
    Kartico postavimo pred uporabnika,
    glede na trenutno smer pogleda.
  */

  const cameraObject =
    camera.object3D;


  const cameraPosition =
    new THREE.Vector3();


  const direction =
    new THREE.Vector3();


  cameraObject.getWorldPosition(
    cameraPosition
  );


  cameraObject.getWorldDirection(
    direction
  );


  /*
    3 metre pred uporabnikom.
  */

  const position =
    cameraPosition
      .clone()
      .add(
        direction
          .clone()
          .multiplyScalar(3)
      );


  vrCard.object3D.position.copy(
    position
  );


  /*
    Obrni proti glavi.
  */

  vrCard.object3D.lookAt(
    cameraPosition
  );


  vrCard.setAttribute(
    "visible",
    true
  );


  /*
    Reset hotspotov,
    da po aktivaciji niso povečani.
  */

  document
    .querySelectorAll(
      ".vr-hotspot"
    )
    .forEach(
      element => {

        element.removeAttribute(
          "animation__gaze"
        );


        element.setAttribute(
          "scale",
          "1 1 1"
        );

      }
    );


  resetGazeVisual();

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      closePopup();

      stopAddMode();

    }

  }
);


/* =========================================================
   START
========================================================= */

scene.addEventListener(
  "loaded",
  () => {

    renderHotspots();

    checkVRSupport();

  }
);

</script>
