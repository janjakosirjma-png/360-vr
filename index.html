<script>

/* ============================================================
   CARDBOARD – DVE KOPIJI ISTEGA UKRIVLJENEGA POGLEDA
   ============================================================ */

const CB = {
    eyeSeparation: 0.064,
    fov: 78,

    /*
       Vsako oko zavzame približno 42 % zaslona.
       To pomeni:
       LEVO  = center -0.50
       DESNO = center +0.50
    */
    eyeWidth: 0.84,
    eyeHeight: 1.55,

    /*
       Ukrivljenost iz prve verzije,
       ki je na tvoji sliki izgledala pravilno.
    */
    k1: 0.20,
    k2: 0.07
};


let cardboardMode = false;

let renderer = null;
let world = null;
let vrCamera = null;
let stereoCamera = null;

let leftTarget = null;
let rightTarget = null;

let cardboardOutputScene = null;
let cardboardOutputCamera = null;

let leftEye = null;
let rightEye = null;

let cardboardAnimationId = null;

let originalFov = 80;
let originalAspect = 1;


/* ============================================================
   SHADER

   To je ista radialna deformacija kot pri tvojem velikem
   prikazu. Ne dodajamo več dodatne superellipse maske.
   ============================================================ */

const cardboardVertexShader = `

varying vec2 vUv;

void main() {

    vUv = uv;

    gl_Position = vec4(
        position.xy,
        0.0,
        1.0
    );
}

`;


const cardboardFragmentShader = `

precision highp float;

uniform sampler2D eyeTexture;

uniform float k1;
uniform float k2;

varying vec2 vUv;


void main() {

    /*
       0..1 -> -1..1
    */

    vec2 p = vUv * 2.0 - 1.0;


    /*
       Ista horizontalna korekcija kot pri
       prvem ukrivljenem prikazu.
    */

    vec2 q = p;

    q.x *= 1.04;


    float r2 = dot(q, q);


    /*
       Radialna deformacija.
    */

    float factor =
        1.0 +
        k1 * r2 +
        k2 * r2 * r2;


    vec2 distorted = q * factor;


    distorted.x /= 1.04;


    vec2 uv =
        distorted * 0.5 + 0.5;


    /*
       Kar pade izven slike je ČRNO.
       Zaradi tega dobimo ukrivljene robove,
       kot na tvoji fotografiji.
    */

    if (
        uv.x < 0.0 ||
        uv.x > 1.0 ||
        uv.y < 0.0 ||
        uv.y > 1.0
    ) {

        gl_FragColor = vec4(
            0.0,
            0.0,
            0.0,
            1.0
        );

        return;
    }


    gl_FragColor =
        texture2D(
            eyeTexture,
            uv
        );
}

`;


/* ============================================================
   USTVARI LEVO + DESNO OKO
   ============================================================ */

function createCardboardOutput() {

    const canvas = renderer.domElement;

    const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );


    /*
       Vsako oko renderiramo v svojo kakovostno teksturo.
    */

    const targetWidth = Math.max(
        700,
        Math.floor(
            canvas.clientWidth *
            0.5 *
            dpr
        )
    );


    const targetHeight = Math.max(
        700,
        Math.floor(
            canvas.clientHeight *
            dpr
        )
    );


    leftTarget =
        new THREE.WebGLRenderTarget(
            targetWidth,
            targetHeight,
            {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                depthBuffer: true
            }
        );


    rightTarget =
        new THREE.WebGLRenderTarget(
            targetWidth,
            targetHeight,
            {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                depthBuffer: true
            }
        );


    cardboardOutputScene =
        new THREE.Scene();


    cardboardOutputCamera =
        new THREE.Camera();


    /* --------------------------------------------------------
       LEVO OKO
       -------------------------------------------------------- */

    const leftMaterial =
        new THREE.ShaderMaterial({

            uniforms: {

                eyeTexture: {
                    value: leftTarget.texture
                },

                k1: {
                    value: CB.k1
                },

                k2: {
                    value: CB.k2
                }
            },

            vertexShader:
                cardboardVertexShader,

            fragmentShader:
                cardboardFragmentShader,

            depthTest: false,
            depthWrite: false
        });


    leftEye =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                CB.eyeWidth,
                CB.eyeHeight
            ),

            leftMaterial
        );


    /*
       Clip-space:

       -1 = skrajno levo
        0 = sredina
       +1 = skrajno desno

       Levo oko postavimo na -0.5.
    */

    leftEye.position.set(
        -0.50,
        0,
        0
    );


    /* --------------------------------------------------------
       DESNO OKO
       -------------------------------------------------------- */

    const rightMaterial =
        new THREE.ShaderMaterial({

            uniforms: {

                eyeTexture: {
                    value: rightTarget.texture
                },

                k1: {
                    value: CB.k1
                },

                k2: {
                    value: CB.k2
                }
            },

            vertexShader:
                cardboardVertexShader,

            fragmentShader:
                cardboardFragmentShader,

            depthTest: false,
            depthWrite: false
        });


    rightEye =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                CB.eyeWidth,
                CB.eyeHeight
            ),

            rightMaterial
        );


    rightEye.position.set(
        0.50,
        0,
        0
    );


    cardboardOutputScene.add(
        leftEye
    );


    cardboardOutputScene.add(
        rightEye
    );
}


/* ============================================================
   CARDBOARD RENDER
   ============================================================ */

function renderCardboard() {

    if (
        !renderer ||
        !vrCamera ||
        !stereoCamera ||
        !leftTarget ||
        !rightTarget
    ) {
        return;
    }


    const canvas =
        renderer.domElement;


    const width =
        Math.max(
            canvas.clientWidth,
            1
        );


    const height =
        Math.max(
            canvas.clientHeight,
            1
        );


    /*
       Kamera za POSAMEZNO oko.

       Ker ima vsako oko polovico telefona,
       mora biti aspect polovica širine.
    */

    vrCamera.aspect =
        (width * 0.5) /
        height;


    vrCamera.fov =
        CB.fov;


    vrCamera.updateProjectionMatrix();


    vrCamera.updateMatrixWorld(
        true
    );


    /*
       Three.js naredi pravi levi in desni pogled.
    */

    stereoCamera.eyeSep =
        CB.eyeSeparation;


    stereoCamera.update(
        vrCamera
    );


    /* ========================================================
       1. LEVO OKO
       ======================================================== */

    renderer.setRenderTarget(
        leftTarget
    );


    renderer.setScissorTest(
        false
    );


    renderer.setClearColor(
        0x000000,
        1
    );


    renderer.clear(
        true,
        true,
        true
    );


    renderer.render(
        world,
        stereoCamera.cameraL
    );


    /* ========================================================
       2. DESNO OKO
       ======================================================== */

    renderer.setRenderTarget(
        rightTarget
    );


    renderer.setClearColor(
        0x000000,
        1
    );


    renderer.clear(
        true,
        true,
        true
    );


    renderer.render(
        world,
        stereoCamera.cameraR
    );


    /* ========================================================
       3. OBE SLIKI NA TELEFON
       ======================================================== */

    renderer.setRenderTarget(
        null
    );


    renderer.setScissorTest(
        false
    );


    renderer.setClearColor(
        0x000000,
        1
    );


    renderer.clear(
        true,
        true,
        true
    );


    renderer.render(
        cardboardOutputScene,
        cardboardOutputCamera
    );
}


/* ============================================================
   WAKE LOCK
   ============================================================ */

let wakeLock = null;


async function requestWakeLock() {

    if (!("wakeLock" in navigator)) {

        console.log(
            "Telefon ne podpira Wake Lock API."
        );

        return;
    }


    try {

        if (
            wakeLock &&
            !wakeLock.released
        ) {
            return;
        }


        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );


        console.log(
            "Zaslon ostane prižgan."
        );


        wakeLock.addEventListener(
            "release",
            () => {

                wakeLock = null;

            }
        );

    }
    catch (error) {

        console.log(
            "Wake Lock:",
            error
        );
    }
}


async function releaseWakeLock() {

    if (!wakeLock) {
        return;
    }


    try {

        await wakeLock.release();

    }
    catch (error) {}


    wakeLock = null;
}


/*
   Če telefon za trenutek zapusti browser
   in se vrne, ponovno zahtevamo Wake Lock.
*/

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            cardboardMode &&
            document.visibilityState === "visible"
        ) {

            requestWakeLock();
        }
    }
);


/* ============================================================
   GYROSCOPE
   ============================================================ */

let deviceAlpha = 0;
let deviceBeta = 0;
let deviceGamma = 0;

let hasOrientation = false;


function orientationHandler(event) {

    if (event.alpha === null) {
        return;
    }


    deviceAlpha =
        event.alpha || 0;

    deviceBeta =
        event.beta || 0;

    deviceGamma =
        event.gamma || 0;


    hasOrientation = true;
}


const zee =
    new THREE.Vector3(
        0,
        0,
        1
    );


const orientationEuler =
    new THREE.Euler();


const orientationQ0 =
    new THREE.Quaternion();


const orientationQ1 =
    new THREE.Quaternion(
        -Math.sqrt(0.5),
        0,
        0,
        Math.sqrt(0.5)
    );


function updatePhoneOrientation(object) {

    if (
        !object ||
        !hasOrientation
    ) {
        return;
    }


    const alpha =
        THREE.MathUtils.degToRad(
            deviceAlpha
        );


    const beta =
        THREE.MathUtils.degToRad(
            deviceBeta
        );


    const gamma =
        THREE.MathUtils.degToRad(
            deviceGamma
        );


    let orient = 0;


    if (
        screen.orientation &&
        typeof screen.orientation.angle === "number"
    ) {

        orient =
            THREE.MathUtils.degToRad(
                screen.orientation.angle
            );

    }
    else if (
        typeof window.orientation === "number"
    ) {

        orient =
            THREE.MathUtils.degToRad(
                window.orientation
            );
    }


    orientationEuler.set(
        beta,
        alpha,
        -gamma,
        "YXZ"
    );


    object.quaternion.setFromEuler(
        orientationEuler
    );


    object.quaternion.multiply(
        orientationQ1
    );


    object.quaternion.multiply(

        orientationQ0.setFromAxisAngle(
            zee,
            -orient
        )

    );
}


/* ============================================================
   ENTER CARDBOARD
   ============================================================ */

async function enterCardboard() {

    if (cardboardMode) {
        return;
    }


    cardboardMode = true;


    await requestWakeLock();


    /*
       Fullscreen.
    */

    try {

        if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ) {

            await document.documentElement
                .requestFullscreen();
        }

    }
    catch (error) {}


    /*
       Landscape.
    */

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );
        }

    }
    catch (error) {}


    window.addEventListener(
        "deviceorientation",
        orientationHandler,
        true
    );


    toolbar.style.display =
        "none";


    popup.style.display =
        "none";


    instruction.style.display =
        "none";


    cardboardUI.style.display =
        "block";


    renderer =
        scene.renderer;


    world =
        scene.object3D;


    vrCamera =
        cameraEl.getObject3D(
            "camera"
        );


    if (
        !renderer ||
        !world ||
        !vrCamera
    ) {

        cardboardMode = false;

        await releaseWakeLock();

        return;
    }


    originalFov =
        vrCamera.fov;


    originalAspect =
        vrCamera.aspect;


    cameraEl.setAttribute(
        "look-controls",
        "enabled",
        false
    );


    stereoCamera =
        new THREE.StereoCamera();


    stereoCamera.eyeSep =
        CB.eyeSeparation;


    createCardboardOutput();


    cardboardLoop();
}


/* ============================================================
   CARDBOARD LOOP
   ============================================================ */

function cardboardLoop() {

    if (!cardboardMode) {
        return;
    }


    cardboardAnimationId =
        requestAnimationFrame(
            cardboardLoop
        );


    updatePhoneOrientation(
        vrCamera
    );


    vrCamera.updateMatrixWorld(
        true
    );


    /*
       Te funkcije že imaš v celi kodi:
       - orientHotspotsToCamera()
       - updateGaze()
    */

    orientHotspotsToCamera();

    updateGaze();

    renderCardboard();
}


/* ============================================================
   EXIT
   ============================================================ */

async function exitCardboard() {

    if (!cardboardMode) {
        return;
    }


    cardboardMode = false;


    if (cardboardAnimationId) {

        cancelAnimationFrame(
            cardboardAnimationId
        );
    }


    cardboardAnimationId = null;


    window.removeEventListener(
        "deviceorientation",
        orientationHandler,
        true
    );


    await releaseWakeLock();


    removeCardboardInfo();

    resetGaze();


    cardboardUI.style.display =
        "none";


    toolbar.style.display =
        "flex";


    cameraEl.setAttribute(
        "look-controls",
        "enabled",
        true
    );


    if (vrCamera) {

        vrCamera.fov =
            originalFov;


        vrCamera.aspect =
            originalAspect;


        vrCamera.updateProjectionMatrix();
    }


    if (leftTarget) {

        leftTarget.dispose();

        leftTarget = null;
    }


    if (rightTarget) {

        rightTarget.dispose();

        rightTarget = null;
    }


    if (leftEye) {

        leftEye.geometry.dispose();

        leftEye.material.dispose();

        leftEye = null;
    }


    if (rightEye) {

        rightEye.geometry.dispose();

        rightEye.material.dispose();

        rightEye = null;
    }


    cardboardOutputScene = null;
    cardboardOutputCamera = null;


    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();
        }

    }
    catch (error) {}


    try {

        if (
            document.fullscreenElement &&
            document.exitFullscreen
        ) {

            await document.exitFullscreen();
        }

    }
    catch (error) {}
}

</script>
