<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>360° interaktivna tura</title>

<style>
* { box-sizing:border-box; }

html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#viewer {
    position:fixed;
    inset:0;
}

canvas {
    display:block;
    touch-action:none;
}

/* ============================
   TOOLBAR
   ============================ */

#toolbar {
    position:fixed;
    z-index:100;
    top:8px;
    left:8px;
    right:8px;

    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;

    padding:8px;

    background:rgba(10,25,34,.90);
    border:1px solid rgba(255,255,255,.15);
    border-radius:11px;

    backdrop-filter:blur(8px);
}

.logo {
    color:white;
    font-weight:800;
    font-size:14px;
    margin-right:5px;
}

.logo span {
    color:#59ddc0;
}

.spacer {
    flex:1;
}

button {
    border:0;
    border-radius:8px;

    padding:9px 11px;

    background:#294552;
    color:white;

    font-size:13px;
    font-weight:700;

    cursor:pointer;
}

button:hover {
    background:#365c6c;
}

button.primary {
    background:#59ddc0;
    color:#06271f;
}

button.active {
    background:#ffd15b;
    color:#231b00;
}

button.danger {
    background:#793c43;
}

button:disabled {
    opacity:.45;
    cursor:default;
}

/* ============================
   NAVODILO
   ============================ */

#hint {
    position:fixed;
    z-index:80;

    top:70px;
    left:50%;
    transform:translateX(-50%);

    max-width:calc(100vw - 20px);

    padding:7px 11px;

    border-radius:8px;

    background:rgba(0,0,0,.72);
    color:white;

    font-size:12px;
    text-align:center;

    pointer-events:none;
}

/* ============================
   EDITOR
   ============================ */

#editorBackdrop {
    position:fixed;
    z-index:190;
    inset:0;

    display:none;

    background:rgba(0,0,0,.25);
}

#editor {
    position:fixed;
    z-index:200;

    top:80px;
    right:14px;

    width:330px;
    max-width:calc(100vw - 28px);

    padding:17px;

    background:rgba(13,31,41,.98);
    color:white;

    border:1px solid #52717f;
    border-radius:13px;

    box-shadow:0 15px 50px rgba(0,0,0,.55);

    display:none;
}

#editor h2 {
    margin:0 0 5px;
    font-size:19px;
}

.editorSub {
    margin:0 0 13px;

    color:#9eb8c3;
    font-size:12px;
}

label {
    display:block;

    margin-top:10px;

    color:#bdd0d8;

    font-size:12px;
    font-weight:700;
}

input,
textarea {
    width:100%;

    margin-top:5px;
    padding:10px;

    border:1px solid #526f7d;
    border-radius:8px;

    outline:none;

    background:#091b24;
    color:white;

    font:inherit;
}

input:focus,
textarea:focus {
    border-color:#59ddc0;
}

textarea {
    min-height:110px;
    resize:vertical;
}

.editorButtons {
    display:flex;
    gap:7px;

    margin-top:13px;
}

.editorButtons button {
    flex:1;
}

/* ============================
   POPUP OB OGLEDU
   ============================ */

#popup {
    position:fixed;
    z-index:180;

    left:50%;
    bottom:22px;
    transform:translateX(-50%);

    width:min(450px,calc(100vw - 24px));

    padding:18px 46px 18px 18px;

    display:none;

    background:rgba(10,28,38,.98);
    color:white;

    border:1px solid #59ddc0;
    border-radius:13px;

    box-shadow:0 15px 50px rgba(0,0,0,.55);
}

#popup h2 {
    margin:0 0 8px;
    font-size:21px;
}

#popup p {
    margin:0;

    line-height:1.5;
    white-space:pre-wrap;
}

#popupClose {
    position:absolute;

    right:6px;
    top:5px;

    padding:4px 9px;

    background:transparent;

    font-size:25px;
}

/* ============================
   VR OVERLAY
   ============================ */

#vrOverlay {
    position:fixed;
    z-index:300;
    inset:0;

    display:none;

    pointer-events:none;
}

#vrExit {
    position:absolute;

    top:calc(10px + env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);

    pointer-events:auto;

    background:rgba(10,25,34,.9);

    border:1px solid rgba(255,255,255,.4);
}

#vrDivider {
    position:absolute;

    top:0;
    bottom:0;
    left:50%;

    width:1px;

    background:rgba(255,255,255,.16);
}

/* ============================
   STATUS
   ============================ */

#status {
    position:fixed;
    z-index:60;

    left:9px;
    bottom:9px;

    padding:6px 8px;

    border-radius:6px;

    background:rgba(0,0,0,.65);
    color:white;

    font-size:11px;

    pointer-events:none;
}

#fileInput {
    display:none;
}

/* ============================
   MOBILNO
   ============================ */

@media(max-width:760px) {

    #toolbar {
        top:5px;
        left:5px;
        right:5px;
    }

    .logo {
        width:100%;
        font-size:12px;
    }

    button {
        padding:8px 8px;
        font-size:11px;
    }

    #hint {
        top:105px;
        font-size:11px;
    }

    #editor {
        top:auto;
        left:7px;
        right:7px;
        bottom:7px;

        width:auto;

        max-height:72vh;
        overflow:auto;
    }

    #status {
        display:none;
    }
}

/* Telefon VR:
   uporabniški vmesnik skrijemo. */

body.phoneVR #toolbar,
body.phoneVR #hint,
body.phoneVR #editor,
body.phoneVR #editorBackdrop,
body.phoneVR #popup,
body.phoneVR #status {
    display:none !important;
}
</style>
</head>

<body>

<div id="viewer"></div>


<div id="toolbar">

    <div class="logo">
        360° <span>INTERAKTIVNA TURA</span>
    </div>

    <button id="modeBtn">
        👁 Ogled
    </button>

    <button id="addBtn" class="primary">

    </button>

    </button>

    <div class="spacer"></div>

    <button id="gyroBtn">

    </button>

    <button id="phoneVRBtn">

    </button>

    <button id="webxrBtn">
        🥽 WebXR
    </button>

    </button>

</div>

<div id="editorBackdrop"></div>

    <h2>Hotspot</h2>

    <p class="editorSub">

        Ime hotspota

        <input

    </label>

        <button id="saveBtn" class="primary">
            ✓ Shrani
        </button>

        <button id="deleteBtn" class="danger">

<div id="popup">

</div>


<div id="vrOverlay">

    <div id="vrDivider"></div>

    <button id="vrExit">
        ✕ Izhod iz VR
    </button>

</div>


<div id="status">
    Nalagam 360.jpg ...
</div>


<input
    id="fileInput"
    type="file"

>


<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { DeviceOrientationControls }
from "three/addons/controls/DeviceOrientationControls.js";

import { StereoEffect }
from "three/addons/effects/StereoEffect.js";

import { VRButton }
from "three/addons/webxr/VRButton.js";


/* ============================================================
   NASTAVITVE
   ============================================================ */

const IMAGE_URL =
    "./360.jpg";

const STORAGE_KEY =
    "360-hotspots-final-v1";


/* ============================================================
   HTML
   ============================================================ */

const viewer =
    document.getElementById("viewer");

const hint =
    document.getElementById("hint");

const editor =
    document.getElementById("editor");

const editorBackdrop =
    document.getElementById("editorBackdrop");

const titleInput =
    document.getElementById("spotTitle");

const descriptionInput =
    document.getElementById("spotDescription");

const popup =
    document.getElementById("popup");

const popupTitle =
    document.getElementById("popupTitle");

const popupText =
    document.getElementById("popupText");

const modeBtn =
    document.getElementById("modeBtn");

const addBtn =
    document.getElementById("addBtn");

const gyroBtn =
    document.getElementById("gyroBtn");

const phoneVRBtn =
    document.getElementById("phoneVRBtn");

const webxrBtn =
    document.getElementById("webxrBtn");

const statusBox =
    document.getElementById("status");

const fileInput =
    document.getElementById("fileInput");


/* ============================================================
   THREE SCENA
   ============================================================ */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        72,
        window.innerWidth / window.innerHeight,
        0.1,
        300
    );


camera.position.set(
    0,
    0,
    0.01
);


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.xr.enabled =
    true;


viewer.appendChild(
    renderer.domElement
);


/* ============================================================
   STEREO EFEKT ZA TELEFON VR
   ============================================================ */

const stereoEffect =
    new StereoEffect(
        renderer
    );


stereoEffect.eyeSep =
    0.064;


stereoEffect.setSize(
    window.innerWidth,
    window.innerHeight
);


/* ============================================================
   360° PANORAMA
   ============================================================ */

let sphere = null;


const sphereGeometry =
    new THREE.SphereGeometry(
        100,
        64,
        40
    );


sphereGeometry.scale(
    -1,
    1,
    1
);


const textureLoader =
    new THREE.TextureLoader();


textureLoader.load(

    IMAGE_URL,

    texture => {

        texture.colorSpace =
            THREE.SRGBColorSpace;


        const material =
            new THREE.MeshBasicMaterial({
                map:texture
            });


        sphere =
            new THREE.Mesh(
                sphereGeometry,
                material
            );


        scene.add(
            sphere
        );


        statusBox.textContent =
            "360.jpg ✓";

    },

    undefined,

    error => {

        console.error(error);

        statusBox.textContent =
            "NAPAKA: 360.jpg";


        alert(
            "Ne najdem datoteke 360.jpg.\n\n" +
            "Na GitHubu morata biti index.html in 360.jpg " +
            "v isti mapi."
        );

    }

);


/* ============================================================
   NAVADNE KONTROLE
   ============================================================ */

const orbit =
    new OrbitControls(
        camera,
        renderer.domElement
    );


orbit.enableDamping =
    true;

orbit.dampingFactor =
    0.06;

orbit.enablePan =
    false;

orbit.enableZoom =
    false;

orbit.rotateSpeed =
    -0.35;


orbit.target.set(
    0,
    0,
    -1
);


orbit.update();


/* ============================================================
   ZOOM
   ============================================================ */

renderer.domElement.addEventListener(

    "wheel",

    event => {

        if (phoneVR)
            return;


        event.preventDefault();


        camera.fov +=
            event.deltaY * 0.035;


        camera.fov =
            THREE.MathUtils.clamp(
                camera.fov,
                35,
                95
            );


        camera.updateProjectionMatrix();

    },

    {
        passive:false
    }

);


/* ============================================================
   HOTSPOT PODATKI
   ============================================================ */

let hotspots = [];

let hotspotHitMeshes = [];

let selectedId = null;

let adding = false;

let editing = true;


const hotspotGroup =
    new THREE.Group();


scene.add(
    hotspotGroup
);


/* ============================================================
   SHRANJEVANJE
   ============================================================ */

function saveLocal() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(hotspots)
    );

}


function loadLocal() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!raw)
            return;


        const parsed =
            JSON.parse(raw);


        if (Array.isArray(parsed)) {

            hotspots =
                parsed;

        }

    }

    catch (error) {

        console.error(error);

    }

}


/* ============================================================
   HOTSPOT SPRITE

   Sprite je boljši od male 3D krogle:
   vedno gleda proti uporabniku in ostane dobro viden.
   ============================================================ */

function createHotspotTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        256;

    canvas.height =
        256;


    const ctx =
        canvas.getContext("2d");


    /*
       senca
    */

    ctx.beginPath();

    ctx.arc(
        128,
        128,
        83,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fill();


    /*
       beli rob
    */

    ctx.beginPath();

    ctx.arc(
        128,
        128,
        75,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();


    /*
       rumena sredina
    */

    ctx.beginPath();

    ctx.arc(
        128,
        128,
        63,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffd15b";

    ctx.fill();


    /*
       črka i
    */

    ctx.fillStyle =
        "#17252c";

    ctx.font =
        "bold 92px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "i",
        128,
        133
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


const hotspotTexture =
    createHotspotTexture();


/* ============================================================
   NARIŠI HOTSPOTE
   ============================================================ */

function rebuildHotspots() {

    hotspotGroup.clear();

    hotspotHitMeshes = [];


    for (const point of hotspots) {

        const direction =
            new THREE.Vector3(
                point.x,
                point.y,
                point.z
            )
            .normalize();


        const group =
            new THREE.Group();


        group.position
            .copy(direction)
            .multiplyScalar(91);


        /*
           Vidna ikona
        */

        const spriteMaterial =
            new THREE.SpriteMaterial({

                map:
                    hotspotTexture,

                transparent:
                    true,

                depthTest:
                    false,

                depthWrite:
                    false

            });


        const sprite =
            new THREE.Sprite(
                spriteMaterial
            );


        sprite.scale.set(
            6.5,
            6.5,
            1
        );


        sprite.renderOrder =
            50;


        group.add(
            sprite
        );


        /*
           VELIKA NEVIDNA HIT CONA.

           Uporabnik vidi ikono 6.5,
           klik območje pa je skoraj dvakrat večje.
        */

        const hitMesh =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    5.5,
                    16,
                    16
                ),

                new THREE.MeshBasicMaterial({

                    transparent:
                        true,

                    opacity:
                        0,

                    depthTest:
                        false

                })

            );


        hitMesh.userData.hotspotId =
            point.id;


        group.add(
            hitMesh
        );


        hotspotHitMeshes.push(
            hitMesh
        );


        hotspotGroup.add(
            group
        );

    }

}


/* ============================================================
   EDITOR
   ============================================================ */

function getSelectedPoint() {

    return hotspots.find(
        point =>
            point.id === selectedId
    );

}


function openEditor(point) {

    selectedId =
        point.id;


    titleInput.value =
        point.title || "";


    descriptionInput.value =
        point.description || "";


    editorBackdrop.style.display =
        "block";


    editor.style.display =
        "block";


    /*
       Na računalniku lahko uporabnik takoj piše.
       Na telefonu focus včasih neželeno odpre tipkovnico,
       zato ga damo samo pri širšem zaslonu.
    */

    if (window.innerWidth > 760) {

        setTimeout(
            () => titleInput.focus(),
            50
        );

    }

}


function closeEditor() {

    editor.style.display =
        "none";


    editorBackdrop.style.display =
        "none";

}


/* SHRANI */

document.getElementById("saveBtn")
.addEventListener(

    "click",

    () => {

        const point =
            getSelectedPoint();


        if (!point)
            return;


        point.title =
            titleInput.value.trim()
            ||
            "Hotspot";


        point.description =
            descriptionInput.value.trim();


        saveLocal();

        rebuildHotspots();

        closeEditor();


        hint.textContent =
            "Hotspot shranjen ✓";


        setTimeout(
            defaultHint,
            1400
        );

    }

);


/* IZBRIŠI */

document.getElementById("deleteBtn")
.addEventListener(

    "click",

    () => {

        if (!selectedId)
            return;


        hotspots =
            hotspots.filter(
                point =>
                    point.id !== selectedId
            );


        selectedId =
            null;


        saveLocal();

        rebuildHotspots();

        closeEditor();


        hint.textContent =
            "Hotspot izbrisan";

    }

);


/* PREKLIČI */

document.getElementById("cancelBtn")
.addEventListener(

    "click",

    () => {

        closeEditor();

    }

);


editorBackdrop.addEventListener(

    "click",

    () => {

        closeEditor();

    }

);


/* ============================================================
   POPUP ZA OGLED
   ============================================================ */

function showPopup(point) {

    popupTitle.textContent =
        point.title ||
        "Hotspot";


    popupText.textContent =
        point.description ||
        "Ni dodatnega opisa.";


    popup.style.display =
        "block";

}


document.getElementById("popupClose")
.addEventListener(

    "click",

    () => {

        popup.style.display =
            "none";

    }

);


/* ============================================================
   RAYCAST
   ============================================================ */

const raycaster =
    new THREE.Raycaster();


const pointer =
    new THREE.Vector2();


function setPointer(event) {

    const rect =
        renderer.domElement
            .getBoundingClientRect();


    pointer.x =
        (
            (
                event.clientX -
                rect.left
            )
            /
            rect.width
        )
        * 2 - 1;


    pointer.y =
        -
        (
            (
                event.clientY -
                rect.top
            )
            /
            rect.height
        )
        * 2 + 1;

}


/* ============================================================
   KLIK / DOTIK

   Posebej ločimo klik od vlečenja panorame.
   ============================================================ */

let downX = 0;
let downY = 0;
let downTime = 0;


renderer.domElement.addEventListener(

    "pointerdown",

    event => {

        downX =
            event.clientX;

        downY =
            event.clientY;

        downTime =
            performance.now();

    }

);


renderer.domElement.addEventListener(

    "pointerup",

    event => {

        if (phoneVR)
            return;


        const movement =
            Math.hypot(

                event.clientX -
                downX,

                event.clientY -
                downY

            );


        /*
           Če je uporabnik vlekel,
           ni klik.
        */

        if (movement > 12)
            return;


        setPointer(event);


        raycaster.setFromCamera(
            pointer,
            camera
        );


        /* ====================================================
           1. NAJPREJ PREVERIMO OBSTOJEČ HOTSPOT

           To je pomembno:
           hotspot ima prednost pred panoramo.
           ==================================================== */

        const hotspotHits =
            raycaster.intersectObjects(
                hotspotHitMeshes,
                false
            );


        if (hotspotHits.length) {

            const id =
                hotspotHits[0]
                    .object
                    .userData
                    .hotspotId;


            const point =
                hotspots.find(
                    item =>
                        item.id === id
                );


            if (!point)
                return;


            selectedId =
                id;


            /*
               Če smo ravno v načinu
               dodajanja novega hotspota,
               klik na star hotspot ne ustvari novega.
            */

            if (adding) {

                adding = false;

                addBtn.classList.remove(
                    "active"
                );

            }


            if (editing) {

                openEditor(
                    point
                );

            }

            else {

                showPopup(
                    point
                );

            }


            return;
        }


        /* ====================================================
           2. DODAJ NOV HOTSPOT
           ==================================================== */

        if (!adding)
            return;


        if (!sphere)
            return;


        const sphereHits =
            raycaster.intersectObject(
                sphere,
                false
            );


        if (!sphereHits.length)
            return;


        const hit =
            sphereHits[0]
                .point
                .clone()
                .normalize();


        const point = {

            id:
                Date.now().toString(36)
                +
                Math.random()
                    .toString(36)
                    .slice(2),

            title:
                "",

            description:
                "",

            x:
                hit.x,

            y:
                hit.y,

            z:
                hit.z

        };


        hotspots.push(
            point
        );


        selectedId =
            point.id;


        adding =
            false;


        addBtn.classList.remove(
            "active"
        );


        saveLocal();

        rebuildHotspots();


        hint.textContent =
            "Hotspot dodan – vnesi ime in besedilo";


        /*
           KLJUČNI DEL:
           urejevalnik se odpre TAKOJ.
        */

        openEditor(
            point
        );

    }

);


/* ============================================================
   DODAJ HOTSPOT
   ============================================================ */

addBtn.addEventListener(

    "click",

    () => {

        if (!editing) {

            editing =
                true;

            updateMode();

        }


        adding =
            !adding;


        addBtn.classList.toggle(
            "active",
            adding
        );


        popup.style.display =
            "none";


        if (adding) {

            hint.textContent =
                "Klikni predmet, kamor želiš postaviti hotspot";

        }

        else {

            defaultHint();

        }

    }

);


/* ============================================================
   UREJANJE / OGLED
   ============================================================ */

function defaultHint() {

    if (editing) {

        hint.textContent =
            "Urejanje • + Hotspot za novo točko • klikni obstoječo točko za urejanje";

    }

    else {

        hint.textContent =
            "Ogled • klikni rumeno točko za informacije";

    }

}


function updateMode() {

    adding =
        false;


    addBtn.classList.remove(
        "active"
    );


    closeEditor();


    popup.style.display =
        "none";


    if (editing) {

        modeBtn.textContent =
            "👁 Ogled";


        addBtn.style.display =
            "inline-block";

    }

    else {

        modeBtn.textContent =
            "✏️ Urejanje";


        addBtn.style.display =
            "none";

    }


    defaultHint();

}


modeBtn.addEventListener(

    "click",

    () => {

        editing =
            !editing;


        updateMode();

    }

);


updateMode();


/* ============================================================
   RESET
   ============================================================ */

document.getElementById("resetBtn")
.addEventListener(

    "click",

    () => {

        disableGyro();


        camera.fov =
            72;


        camera.quaternion.identity();


        camera.updateProjectionMatrix();


        orbit.enabled =
            true;


        orbit.target.set(
            0,
            0,
            -1
        );


        orbit.update();

    }

);


/* ============================================================
   GYROSCOPE TELEFONA
   ============================================================ */

let deviceControls = null;
let gyroEnabled = false;


async function requestOrientationPermission() {

    /*
       iOS zahteva izrecno dovoljenje
       po uporabnikovem kliku.
    */

    if (
        typeof DeviceOrientationEvent !==
        "undefined"
        &&
        typeof DeviceOrientationEvent.requestPermission ===
        "function"
    ) {

        const permission =
            await DeviceOrientationEvent
                .requestPermission();


        return permission ===
            "granted";

    }


    return true;

}


async function enableGyro() {

    try {

        const allowed =
            await requestOrientationPermission();


        if (!allowed) {

            alert(
                "Dovoljenje za senzor gibanja ni bilo odobreno."
            );

            return false;
        }


        deviceControls =
            new DeviceOrientationControls(
                camera
            );


        deviceControls.connect();


        gyroEnabled =
            true;


        orbit.enabled =
            false;


        gyroBtn.classList.add(
            "active"
        );


        gyroBtn.textContent =
            "📱 Gyro ✓";


        return true;

    }

    catch (error) {

        console.error(error);


        alert(
            "Giroskopa ni bilo mogoče vključiti. " +
            "Preveri dovoljenja brskalnika."
        );


        return false;

    }

}


function disableGyro() {

    if (deviceControls) {

        deviceControls.disconnect();

        deviceControls =
            null;

    }


    gyroEnabled =
        false;


    orbit.enabled =
        true;


    gyroBtn.classList.remove(
        "active"
    );


    gyroBtn.textContent =
        "📱 Gyro";

}


gyroBtn.addEventListener(

    "click",

    async () => {

        if (gyroEnabled) {

            disableGyro();

        }

        else {

            await enableGyro();

        }

    }

);


/* ============================================================
   TELEFON VR / CARDBOARD

   - stereo pogled
   - landscape
   - gyroscope
   - fullscreen
   ============================================================ */

let phoneVR =
    false;


async function enterPhoneVR() {

    /*
       Najprej zahtevamo senzor.
       To se zgodi neposredno iz uporabnikovega klika.
    */

    if (!gyroEnabled) {

        const ok =
            await enableGyro();


        if (!ok)
            return;

    }


    phoneVR =
        true;


    document.body.classList.add(
        "phoneVR"
    );


    document.getElementById("vrOverlay")
        .style.display =
        "block";


    /*
       Fullscreen, kjer je podprt.
    */

    try {

        if (
            !document.fullscreenElement
            &&
            document.documentElement.requestFullscreen
        ) {

            await document
                .documentElement
                .requestFullscreen();

        }

    }

    catch (error) {

        console.log(
            "Fullscreen ni na voljo:",
            error
        );

    }


    /*
       Poskus zaklepa v landscape.
       Vsi telefoni tega ne dovolijo.
    */

    try {

        if (
            screen.orientation
            &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    }

    catch (error) {

        console.log(
            "Landscape lock ni na voljo:",
            error
        );

    }


    resize();

}


async function exitPhoneVR() {

    phoneVR =
        false;


    document.body.classList.remove(
        "phoneVR"
    );


    document.getElementById("vrOverlay")
        .style.display =
        "none";


    try {

        if (
            screen.orientation
            &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();

        }

    }

    catch {}


    try {

        if (document.fullscreenElement) {

            await document.exitFullscreen();

        }

    }

    catch {}


    resize();

}


phoneVRBtn.addEventListener(

    "click",

    enterPhoneVR

);


document.getElementById("vrExit")
.addEventListener(

    "click",

    exitPhoneVR

);


/* ============================================================
   WEBXR VR

   Noben Three.js "VR NOT SUPPORTED"
   gumb ni prikazan.
   ============================================================ */

let hiddenVRButton =
    null;


async function setupWebXR() {

    if (!navigator.xr) {

        webxrBtn.style.display =
            "none";

        return;
    }


    try {

        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-vr"
                );


        if (!supported) {

            webxrBtn.style.display =
                "none";

            return;
        }


        hiddenVRButton =
            VRButton.createButton(
                renderer
            );


        hiddenVRButton.style.position =
            "fixed";

        hiddenVRButton.style.left =
            "-10000px";

        hiddenVRButton.style.top =
            "-10000px";


        document.body.appendChild(
            hiddenVRButton
        );


        webxrBtn.style.display =
            "inline-block";


        webxrBtn.addEventListener(

            "click",

            () => {

                hiddenVRButton.click();

            }

        );

    }

    catch (error) {

        console.error(error);

        webxrBtn.style.display =
            "none";

    }

}


setupWebXR();


/* ============================================================
   FULLSCREEN
   ============================================================ */

document.getElementById("fullscreenBtn")
.addEventListener(

    "click",

    async () => {

        try {

            if (!document.fullscreenElement) {

                await document
                    .documentElement
                    .requestFullscreen();

            }

            else {

                await document
                    .exitFullscreen();

            }

        }

        catch (error) {

            console.error(error);

        }

    }

);


/* ============================================================
   IZVOZ
   ============================================================ */

document.getElementById("exportBtn")
.addEventListener(

    "click",

    () => {

        const project = {

            version:
                1,

            image:
                "360.jpg",

            hotspots:
                hotspots

        };


        const blob =
            new Blob(

                [
                    JSON.stringify(
                        project,
                        null,
                        2
                    )
                ],

                {
                    type:
                        "application/json"
                }

            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "360-projekt.json";


        link.click();


        setTimeout(
            () => URL.revokeObjectURL(url),
            1000
        );

    }

);


/* ============================================================
   UVOZ
   ============================================================ */

document.getElementById("importBtn")
.addEventListener(

    "click",

    () => {

        fileInput.click();

    }

);


fileInput.addEventListener(

    "change",

    async event => {

        const file =
            event.target.files[0];


        if (!file)
            return;


        try {

            const data =
                JSON.parse(
                    await file.text()
                );


            if (
                !Array.isArray(
                    data.hotspots
                )
            ) {

                throw new Error(
                    "Datoteka nima hotspotov."
                );

            }


            hotspots =
                data.hotspots;


            selectedId =
                null;


            saveLocal();

            rebuildHotspots();


            hint.textContent =
                "Projekt uvožen ✓";


            setTimeout(
                defaultHint,
                1300
            );

        }

        catch (error) {

            alert(
                "Uvoz ni uspel:\n" +
                error.message
            );

        }


        fileInput.value =
            "";

    }

);


/* ============================================================
   RESIZE
   ============================================================ */

function resize() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    camera.aspect =
        width / height;


    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height
    );


    stereoEffect.setSize(
        width,
        height
    );

}


window.addEventListener(
    "resize",
    resize
);


/* ============================================================
   ZAGON
   ============================================================ */

loadLocal();

rebuildHotspots();

resize();


/* ============================================================
   RENDER
   ============================================================ */

renderer.setAnimationLoop(

    () => {

        /*
           Gyro
        */

        if (
            gyroEnabled
            &&
            deviceControls
        ) {

            deviceControls.update();

        }

        else if (
            !renderer.xr.isPresenting
        ) {

            orbit.update();

        }


        /*
           Telefon/Cardboard VR
        */

        if (
            phoneVR
            &&
            !renderer.xr.isPresenting
        ) {

            stereoEffect.render(
                scene,
                camera
            );

        }

        else {

            renderer.render(
                scene,
                camera
            );

        }

    }

);

</script>
