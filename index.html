<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>360 Panorama</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    touch-action: none;
}

/* =========================================================
   TOOLBAR
========================================================= */

#toolbar {
    position: fixed;
    z-index: 100;
    top: 12px;
    left: 12px;

    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;

    padding: 8px;

    background: rgba(15, 15, 15, 0.88);
    border-radius: 14px;

    box-shadow: 0 8px 30px rgba(0,0,0,.4);
}

.tool {
    min-height: 42px;
    padding: 0 13px;

    border: 0;
    border-radius: 9px;

    background: #333;
    color: #fff;

    font-weight: 700;
    cursor: pointer;
}

#addBtn {
    background: #2563eb;
}

#addBtn.active {
    background: #16a34a;
}

#cardboardBtn {
    background: #7c3aed;
}

#debugBtn {
    background: #555;
}

/* =========================================================
   HINT
========================================================= */

#hint {
    position: fixed;
    z-index: 120;

    display: none;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    padding: 11px 18px;

    background: rgba(0,0,0,.82);
    color: #fff;

    border-radius: 30px;

    pointer-events: none;
}

/* =========================================================
   POPUP
========================================================= */

#popup {
    position: fixed;
    z-index: 200;

    display: none;

    width: 330px;
    max-width: calc(100vw - 24px);

    padding: 18px;

    background: #fff;
    color: #111;

    border-radius: 14px;

    box-shadow: 0 15px 45px rgba(0,0,0,.45);
}

#popupClose {
    position: absolute;

    top: 8px;
    right: 8px;

    width: 30px;
    height: 30px;

    padding: 0;

    border: 0;
    border-radius: 50%;

    background: #eee;

    font-size: 20px;

    cursor: pointer;
}

#reader,
#editor {
    display: none;
}

#readerTitle {
    margin: 0 35px 10px 0;
}

#readerDescription {
    margin-bottom: 15px;

    line-height: 1.5;

    white-space: pre-wrap;
}

#editBtn {
    width: 100%;

    padding: 10px;

    border: 0;
    border-radius: 8px;

    background: #2563eb;
    color: white;

    font-weight: bold;

    cursor: pointer;
}

.fieldLabel {
    display: block;

    margin: 9px 0 4px;

    font-size: 12px;
    font-weight: bold;
}

#titleInput,
#descriptionInput {
    width: 100%;

    padding: 10px;

    border: 1px solid #bbb;
    border-radius: 8px;
}

#descriptionInput {
    min-height: 115px;
    resize: vertical;
}

.editorButtons {
    display: flex;
    gap: 7px;

    margin-top: 10px;
}

.editorButtons button {
    flex: 1;

    padding: 10px;

    border: 0;
    border-radius: 8px;

    font-weight: bold;

    cursor: pointer;
}

#saveBtn {
    background: #16a34a;
    color: #fff;
}

#cancelBtn {
    background: #ddd;
}

#deleteBtn {
    background: #dc2626;
    color: #fff;
}

/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;
    inset: 0;

    z-index: 500;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.94);
}

.modalBox {
    width: 390px;
    max-width: 100%;

    padding: 24px;

    background: #fff;
    color: #111;

    border-radius: 17px;

    text-align: center;
}

.modalBox h2 {
    margin-top: 0;
}

.modalBox button {
    width: 100%;

    margin-top: 8px;
    padding: 13px;

    border: 0;
    border-radius: 9px;

    font-weight: bold;

    cursor: pointer;
}

#startCardboardBtn,
#sensorBtn {
    background: #7c3aed;
    color: #fff;
}

#cancelCardboardBtn {
    background: #ddd;
}

/* =========================================================
   CARDBOARD UI
========================================================= */

#cardboardUI {
    position: fixed;
    inset: 0;

    z-index: 300;

    display: none;

    pointer-events: none;
}

.reticle {
    position: absolute;

    top: 50%;

    width: 24px;
    height: 24px;

    transform: translate(-50%, -50%);

    border: 2px solid #fff;
    border-radius: 50%;

    box-shadow:
        0 0 3px #000,
        0 0 8px #000;
}

.reticle::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 4px;

    transform: translate(-50%, -50%);

    background: #fff;

    border-radius: 50%;
}

#reticleLeft {
    left: 25%;
}

#reticleRight {
    left: 75%;
}

.reticle.active {
    animation: gazeProgress 1.2s linear forwards;
}

@keyframes gazeProgress {
    from {
        transform: translate(-50%, -50%) scale(1);
    }

    to {
        transform: translate(-50%, -50%) scale(1.75);
    }
}

#exitCardboardBtn {
    position: absolute;

    top: 10px;
    right: 10px;

    z-index: 400;

    width: 46px;
    height: 46px;

    padding: 0;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.7);
    color: #fff;

    font-size: 27px;

    pointer-events: auto;

    cursor: pointer;
}

/* =========================================================
   DEBUG
========================================================= */

#debugPanel {
    position: fixed;

    z-index: 2000;

    left: 8px;
    bottom: 8px;

    display: none;

    width: min(470px, calc(100vw - 16px));
    max-height: 45vh;

    overflow: auto;

    padding: 10px;

    background: rgba(0,0,0,.90);
    color: #7cff91;

    border: 1px solid rgba(255,255,255,.3);
    border-radius: 10px;

    font-family: monospace;
    font-size: 11px;

    white-space: pre-wrap;

    pointer-events: auto;
}

@media(max-width:700px) {

    #toolbar {
        top: 7px;
        left: 7px;
        right: 7px;

        justify-content: center;
    }

    .tool {
        min-height: 38px;

        padding: 0 9px;

        font-size: 12px;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- =========================================================
     NORMALNI GUMBI
========================================================= -->

<div id="toolbar">

    <button id="addBtn" class="tool">
        + Dodaj hotspot
    </button>

    <button id="zoomInBtn" class="tool">
        +
    </button>

    <button id="zoomOutBtn" class="tool">
        −
    </button>

    <button id="fullscreenBtn" class="tool">
        ⛶
    </button>

    <button id="cardboardBtn" class="tool">
        🥽 CARDBOARD
    </button>

    <button id="debugBtn" class="tool">
        DEBUG
    </button>

</div>

<div id="hint">
    Klikni na mesto v panorami
</div>

<!-- =========================================================
     HOTSPOT POPUP
========================================================= -->

<div id="popup">

    <button id="popupClose">
        ×
    </button>

    <div id="reader">

        <h2 id="readerTitle"></h2>

        <div id="readerDescription"></div>

        <button id="editBtn">
            Uredi
        </button>

    </div>

    <div id="editor">

        <label class="fieldLabel">
            Naslov
        </label>

        <input
            id="titleInput"
            type="text"
            placeholder="Naslov"
        >

        <label class="fieldLabel">
            Opis
        </label>

        <textarea
            id="descriptionInput"
            placeholder="Opis..."
        ></textarea>

        <div class="editorButtons">

            <button id="saveBtn">
                Shrani
            </button>

            <button id="cancelBtn">
                Prekliči
            </button>

            <button id="deleteBtn">
                Izbriši
            </button>

        </div>

    </div>

</div>

<!-- =========================================================
     CARDBOARD START
========================================================= -->

<div id="cardboardStart" class="modal">

    <div class="modalBox">

        <h2>🥽 Cardboard</h2>

        <p>
            Obrni telefon vodoravno.
        </p>

        <p>
            Prikaz bo narejen v YouTube/Cardboard načinu:
            dve ločeni ukrivljeni leči.
        </p>

        <button id="startCardboardBtn">
            ZAŽENI
        </button>

        <button id="cancelCardboardBtn">
            Prekliči
        </button>

    </div>

</div>

<!-- =========================================================
     IOS SENSOR
========================================================= -->

<div id="sensorModal" class="modal">

    <div class="modalBox">

        <h2>Senzor gibanja</h2>

        <p>
            Dovoli uporabo senzorjev telefona.
        </p>

        <button id="sensorBtn">
            DOVOLI IN ZAŽENI
        </button>

    </div>

</div>

<!-- =========================================================
     CARDBOARD OVERLAY
========================================================= -->

<div id="cardboardUI">

    <div
        id="reticleLeft"
        class="reticle">
    </div>

    <div
        id="reticleRight"
        class="reticle">
    </div>

    <button id="exitCardboardBtn">
        ×
    </button>

</div>

<div id="debugPanel"></div>

<!-- =========================================================
     THREE.JS
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   DEBUG
========================================================= */

const debugPanel =
    document.getElementById("debugPanel");

const debugBtn =
    document.getElementById("debugBtn");

let debugVisible = false;

function logDebug(message) {

    const time =
        new Date().toLocaleTimeString();

    debugPanel.textContent +=
        "[" + time + "] " +
        message +
        "\n";

    debugPanel.scrollTop =
        debugPanel.scrollHeight;
}

debugBtn.addEventListener(
    "click",
    () => {

        debugVisible =
            !debugVisible;

        debugPanel.style.display =
            debugVisible
                ? "block"
                : "none";
    }
);

window.addEventListener(
    "error",
    event => {

        logDebug(
            "JS ERROR: " +
            event.message +
            " line " +
            event.lineno
        );

        debugPanel.style.display =
            "block";
    }
);

window.addEventListener(
    "unhandledrejection",
    event => {

        logDebug(
            "PROMISE ERROR: " +
            String(event.reason)
        );

        debugPanel.style.display =
            "block";
    }
);


/* =========================================================
   ELEMENTI
========================================================= */

const canvas =
    document.getElementById("canvas");

const toolbar =
    document.getElementById("toolbar");

const addBtn =
    document.getElementById("addBtn");

const zoomInBtn =
    document.getElementById("zoomInBtn");

const zoomOutBtn =
    document.getElementById("zoomOutBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const cardboardBtn =
    document.getElementById("cardboardBtn");

const hint =
    document.getElementById("hint");

const popup =
    document.getElementById("popup");

const popupClose =
    document.getElementById("popupClose");

const reader =
    document.getElementById("reader");

const editor =
    document.getElementById("editor");

const readerTitle =
    document.getElementById("readerTitle");

const readerDescription =
    document.getElementById(
        "readerDescription"
    );

const editBtn =
    document.getElementById("editBtn");

const titleInput =
    document.getElementById("titleInput");

const descriptionInput =
    document.getElementById(
        "descriptionInput"
    );

const saveBtn =
    document.getElementById("saveBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const deleteBtn =
    document.getElementById("deleteBtn");

const cardboardStart =
    document.getElementById(
        "cardboardStart"
    );

const startCardboardBtn =
    document.getElementById(
        "startCardboardBtn"
    );

const cancelCardboardBtn =
    document.getElementById(
        "cancelCardboardBtn"
    );

const sensorModal =
    document.getElementById(
        "sensorModal"
    );

const sensorBtn =
    document.getElementById(
        "sensorBtn"
    );

const cardboardUI =
    document.getElementById(
        "cardboardUI"
    );

const reticleLeft =
    document.getElementById(
        "reticleLeft"
    );

const reticleRight =
    document.getElementById(
        "reticleRight"
    );

const exitCardboardBtn =
    document.getElementById(
        "exitCardboardBtn"
    );


/* =========================================================
   THREE
========================================================= */

if(typeof THREE === "undefined") {

    throw new Error(
        "Three.js se ni naložil."
    );
}

logDebug(
    "Three.js OK: " +
    THREE.REVISION
);

const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setClearColor(
    0x000000,
    1
);

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.01,
        200
    );

camera.position.set(
    0,
    0,
    0
);


/* =========================================================
   PANORAMA
========================================================= */

const sphereGeometry =
    new THREE.SphereGeometry(
        50,
        64,
        40
    );

sphereGeometry.scale(
    -1,
    1,
    1
);

const textureLoader =
    new THREE.TextureLoader();

const panoramaTexture =
    textureLoader.load(
        "360.jpg?v=500",

        () => {

            panoramaTexture.colorSpace =
                THREE.SRGBColorSpace;

            logDebug(
                "360.jpg naložen OK"
            );
        },

        undefined,

        error => {

            logDebug(
                "NAPAKA PRI 360.jpg"
            );

            console.error(error);

            debugPanel.style.display =
                "block";
        }
    );

const panoramaMaterial =
    new THREE.MeshBasicMaterial({
        map: panoramaTexture
    });

const panoramaSphere =
    new THREE.Mesh(
        sphereGeometry,
        panoramaMaterial
    );

scene.add(
    panoramaSphere
);


/* =========================================================
   NORMALNA KAMERA
========================================================= */

let normalYaw = 0;
let normalPitch = 0;

function updateNormalCamera() {

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        normalYaw;

    camera.rotation.x =
        normalPitch;

    camera.rotation.z =
        0;
}

updateNormalCamera();


/* =========================================================
   HOTSPOTS STORAGE
========================================================= */

const STORAGE_KEY =
    "stable-360-hotspots-v5";

let hotspots = [];

try {

    hotspots =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            )
        ) || [];

}
catch(error) {

    hotspots = [];

    logDebug(
        "localStorage parse error"
    );
}

function saveHotspots() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            hotspots
        )
    );
}


/* =========================================================
   HOTSPOT WORLD
========================================================= */

const hotspotGroup =
    new THREE.Group();

scene.add(
    hotspotGroup
);

let hotspotMeshes = [];


function sphericalToVector(
    yaw,
    pitch,
    radius = 47
) {

    return new THREE.Vector3(

        radius *
        Math.cos(pitch) *
        Math.sin(yaw),

        radius *
        Math.sin(pitch),

        -radius *
        Math.cos(pitch) *
        Math.cos(yaw)

    );
}


function directionToSpherical(
    direction
) {

    return {

        yaw:
            Math.atan2(
                direction.x,
                -direction.z
            ),

        pitch:
            Math.asin(
                THREE.MathUtils.clamp(
                    direction.y,
                    -1,
                    1
                )
            )
    };
}


/* =========================================================
   HOTSPOT TEXTURE
========================================================= */

function createHotspotTexture(
    number
) {

    const c =
        document.createElement(
            "canvas"
        );

    c.width = 256;
    c.height = 256;

    const ctx =
        c.getContext("2d");

    ctx.clearRect(
        0,
        0,
        256,
        256
    );

    ctx.beginPath();

    ctx.arc(
        128,
        128,
        113,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        128,
        128,
        91,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ef3333";

    ctx.fill();


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 100px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        String(number),
        128,
        136
    );


    const texture =
        new THREE.CanvasTexture(c);

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}


function renderHotspots() {

    hotspotMeshes.forEach(
        sprite => {

            hotspotGroup.remove(
                sprite
            );

            if(
                sprite.material.map
            ) {

                sprite.material.map
                    .dispose();
            }

            sprite.material
                .dispose();
        }
    );

    hotspotMeshes = [];


    hotspots.forEach(
        (hotspot, index) => {

            const texture =
                createHotspotTexture(
                    index + 1
                );

            const material =
                new THREE.SpriteMaterial({

                    map: texture,

                    transparent: true,

                    depthTest: false,

                    depthWrite: false
                });

            const sprite =
                new THREE.Sprite(
                    material
                );

            sprite.position.copy(

                sphericalToVector(
                    hotspot.yaw,
                    hotspot.pitch
                )

            );

            sprite.scale.set(
                2.35,
                2.35,
                1
            );

            sprite.userData.hotspotId =
                hotspot.id;

            hotspotGroup.add(
                sprite
            );

            hotspotMeshes.push(
                sprite
            );
        }
    );

    logDebug(
        "Hotspoti: " +
        hotspots.length
    );
}

renderHotspots();


/* =========================================================
   POPUP
========================================================= */

let selectedHotspotId =
    null;


function getHotspot(
    id
) {

    return hotspots.find(
        h => h.id === id
    );
}


function openReader(
    id
) {

    const hotspot =
        getHotspot(id);

    if(!hotspot)
        return;


    selectedHotspotId =
        id;


    readerTitle.textContent =
        hotspot.title ||
        "Brez naslova";


    readerDescription.textContent =
        hotspot.description ||
        "Ni opisa.";


    editor.style.display =
        "none";


    reader.style.display =
        "block";


    popup.style.display =
        "block";


    positionPopup();
}


function openEditor(
    id
) {

    const hotspot =
        getHotspot(id);

    if(!hotspot)
        return;


    selectedHotspotId =
        id;


    titleInput.value =
        hotspot.title || "";


    descriptionInput.value =
        hotspot.description || "";


    reader.style.display =
        "none";


    editor.style.display =
        "block";


    popup.style.display =
        "block";


    positionPopup();
}


function closePopup() {

    popup.style.display =
        "none";

    selectedHotspotId =
        null;
}


popupClose.addEventListener(
    "click",
    closePopup
);


editBtn.addEventListener(
    "click",
    () => {

        if(
            selectedHotspotId
        ) {

            openEditor(
                selectedHotspotId
            );
        }
    }
);


saveBtn.addEventListener(
    "click",
    () => {

        const hotspot =
            getHotspot(
                selectedHotspotId
            );

        if(!hotspot)
            return;


        hotspot.title =
            titleInput.value.trim();


        hotspot.description =
            descriptionInput.value.trim();


        saveHotspots();

        openReader(
            hotspot.id
        );
    }
);


cancelBtn.addEventListener(
    "click",
    () => {

        const hotspot =
            getHotspot(
                selectedHotspotId
            );


        if(
            hotspot &&
            (
                hotspot.title ||
                hotspot.description
            )
        ) {

            openReader(
                hotspot.id
            );

        }
        else {

            closePopup();
        }
    }
);


deleteBtn.addEventListener(
    "click",
    () => {

        if(
            !selectedHotspotId
        )
            return;


        hotspots =
            hotspots.filter(
                h =>
                    h.id !==
                    selectedHotspotId
            );


        saveHotspots();

        closePopup();

        renderHotspots();
    }
);


/* =========================================================
   POPUP SCREEN POSITION
========================================================= */

function positionPopup() {

    if(
        cardboardMode ||
        !selectedHotspotId ||
        popup.style.display ===
        "none"
    ) {

        return;
    }


    const hotspot =
        getHotspot(
            selectedHotspotId
        );

    if(!hotspot)
        return;


    const worldPosition =
        sphericalToVector(
            hotspot.yaw,
            hotspot.pitch
        );


    const cameraForward =
        new THREE.Vector3();

    camera.getWorldDirection(
        cameraForward
    );


    const direction =
        worldPosition
            .clone()
            .normalize();


    if(
        cameraForward.dot(
            direction
        ) <= 0
    ) {

        popup.style.visibility =
            "hidden";

        return;
    }


    popup.style.visibility =
        "visible";


    const projected =
        worldPosition.clone();

    projected.project(
        camera
    );


    const x =
        (
            projected.x + 1
        ) *
        0.5 *
        innerWidth;


    const y =
        (
            -projected.y + 1
        ) *
        0.5 *
        innerHeight;


    const width =
        popup.offsetWidth;


    const height =
        popup.offsetHeight;


    let left;


    if(
        x <
        innerWidth / 2
    ) {

        left =
            x + 30;

    }
    else {

        left =
            x -
            width -
            30;
    }


    let top =
        y -
        height / 2;


    left =
        THREE.MathUtils.clamp(
            left,
            8,
            innerWidth -
            width -
            8
        );


    top =
        THREE.MathUtils.clamp(
            top,
            8,
            innerHeight -
            height -
            8
        );


    popup.style.left =
        left + "px";


    popup.style.top =
        top + "px";
}


/* =========================================================
   ADD MODE
========================================================= */

let addMode =
    false;


function stopAddMode() {

    addMode =
        false;


    addBtn.classList.remove(
        "active"
    );


    addBtn.textContent =
        "+ Dodaj hotspot";


    hint.style.display =
        "none";
}


addBtn.addEventListener(
    "click",
    () => {

        if(cardboardMode)
            return;


        closePopup();


        addMode =
            !addMode;


        if(addMode) {

            );

/* =========================================================
   NORMAL POINTER
========================================================= */

let pointerDown =
    false;

let pointerMoved =
    false;

let pointerStartX =
    0;

let pointerStartY =
    0;

let pointerLastX =
    0;

let pointerLastY =
    0;


canvas.addEventListener(
    "pointerdown",
    event => {

        if(cardboardMode)
            return;


        pointerDown =
            true;

        pointerMoved =
            false;


        pointerStartX =
            pointerLastX =
            event.clientX;


        pointerStartY =
            pointerLastY =
            event.clientY;


        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        }
        catch(error) {}
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if(
            !pointerDown ||
            cardboardMode
        )
            return;


        const dx =
            event.clientX -
            pointerLastX;


        const dy =
            event.clientY -
            pointerLastY;


        const totalDistance =
            Math.hypot(

                event.clientX -
                pointerStartX,

                event.clientY -
                pointerStartY
            );


        if(
            totalDistance > 6
        ) {

            pointerMoved =
                true;
        }


        /*
           Ko dodajamo hotspot,
           panorama ostane pri miru.
        */

        if(!addMode) {

            normalYaw -=
                dx * 0.004;


            normalPitch -=
                dy * 0.004;


            normalPitch =
                THREE.MathUtils.clamp(

                    normalPitch,

                    -Math.PI / 2 +
                    0.05,

                    Math.PI / 2 -
                    0.05
                );


            updateNormalCamera();
        }


        pointerLastX =
            event.clientX;


        pointerLastY =
            event.clientY;
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        if(cardboardMode)
            return;


        pointerDown =
            false;


        if(pointerMoved)
            return;


        const rect =
            canvas.getBoundingClientRect();


        const mouse =
            new THREE.Vector2(

                (
                    (
                        event.clientX -
                        rect.left
                    ) /
                    rect.width
                ) * 2 - 1,

                -(
                    (
                        event.clientY -
                        rect.top
                    ) /
                    rect.height
                ) * 2 + 1

            );


        const raycaster =
            new THREE.Raycaster();


        raycaster.setFromCamera(
            mouse,
            camera
        );


        /*
           Najprej obstoječ hotspot.
        */

        if(!addMode) {

            const hits =
                raycaster
                    .intersectObjects(
                        hotspotMeshes,
                        false
                    );


            if(
                hits.length > 0
            ) {

                openReader(

                    hits[0]
                        .object
                        .userData
                        .hotspotId

                );

                return;
            }
        }


        /*
           Nov hotspot.
        */

        if(!addMode)
            return;


        const direction =
            raycaster.ray.direction
                .clone()
                .normalize();


        const spherical =
            directionToSpherical(
                direction
            );


        const hotspot = {

            id:
                "hs-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2,7),

            yaw:
                spherical.yaw,

            pitch:
                spherical.pitch,

            title:
                "",

            description:
                ""
        };


        hotspots.push(
            hotspot
        );


        saveHotspots();

        renderHotspots();

        stopAddMode();

        openEditor(
            hotspot.id
        );
    }
);

let wakeLock =
    null;


async function requestWakeLock() {

    if(
        !("wakeLock" in navigator)
    ) {

        logDebug(
            "Wake Lock ni podprt"
        );

        return;
    }


    try {

        if(
            wakeLock &&
            !wakeLock.released
        ) {

            return;
        }


        wakeLock =
            await navigator
                .wakeLock
                .request("screen");


        logDebug(
            "Wake Lock ON"
        );


        wakeLock.addEventListener(
            "release",
            () => {

                wakeLock =
                    null;

                logDebug(
                    "Wake Lock released"
                );
            }
        );

    }
    catch(error) {

        logDebug(
            "Wake Lock error: " +
            error.message
        );
    }
}


async function releaseWakeLock() {

    if(!wakeLock)
        return;


    try {

        await wakeLock.release();

    }
    catch(error) {}


    wakeLock =
        null;
}


document.addEventListener(
    "visibilitychange",
    () => {

        if(
            cardboardMode &&
            document.visibilityState ===
            "visible"
        ) {

            requestWakeLock();

);


/* =========================================================
   PHONE SENSOR
========================================================= */

let sensorAlpha =
    0;

let sensorBeta =
    0;

let sensorGamma =
    0;

let sensorAvailable =
    false;


function orientationHandler(
    event
) {

    if(
        event.alpha === null
    ) {

        return;
    }


    sensorAlpha =
        event.alpha || 0;


    sensorBeta =
        event.beta || 0;


    sensorGamma =
        event.gamma || 0;


    if(!sensorAvailable) {

        sensorAvailable =
            true;

        logDebug(
            "Device orientation deluje"
        );
    }
}


const orientationEuler =
    new THREE.Euler();


const orientationQuaternion =
    new THREE.Quaternion();


const screenQuaternion =
    new THREE.Quaternion();


const orientationZ =
    new THREE.Vector3(
        0,
        0,
        1
    );


const orientationFix =
    new THREE.Quaternion(

        -Math.sqrt(0.5),

        0,

        0,

        Math.sqrt(0.5)

    );


function updateGyroscope() {

    if(!sensorAvailable)
        return;


    const alpha =
        THREE.MathUtils.degToRad(
            sensorAlpha
        );


    const beta =
        THREE.MathUtils.degToRad(
            sensorBeta
        );


    const gamma =
        THREE.MathUtils.degToRad(
            sensorGamma
        );


    let screenOrientation =
        0;


    if(
        screen.orientation &&
        typeof screen.orientation.angle ===
        "number"
    ) {

        screenOrientation =
            THREE.MathUtils.degToRad(

                screen.orientation.angle

            );

    }
    else if(
        typeof window.orientation ===
        "number"
    ) {

        screenOrientation =
            THREE.MathUtils.degToRad(

                window.orientation

            );
    }


    orientationEuler.set(

        beta,

        alpha,

        -gamma,

        "YXZ"

    );


    orientationQuaternion
        .setFromEuler(
            orientationEuler
        );


    orientationQuaternion.multiply(
        orientationFix
    );


    screenQuaternion
        .setFromAxisAngle(

            orientationZ,

            -screenOrientation

        );


    orientationQuaternion.multiply(
        screenQuaternion
    );


    camera.quaternion.copy(
        orientationQuaternion
    );
}


/* =========================================================
   CARDBOARD
========================================================= */

let cardboardMode =
    false;


const stereoCamera =
    new THREE.StereoCamera();


stereoCamera.eyeSep =
    0.064;


let leftRenderTarget =
    null;


let rightRenderTarget =
    null;


const outputScene =
    new THREE.Scene();


const outputCamera =
    new THREE.Camera();


let leftEyeMesh =
    null;


let rightEyeMesh =
    null;


/*
   To je pomembni del.

   Geometrija je full-screen quad 2 x 2.

   eyeScale in eyeOffset določita,
   kam na zaslon gre posamezna ukrivljena leča.

   PREJ je bila napaka, ker shader ni upošteval
   mesh.position in sta bili sliki ena čez drugo.
*/

const cardboardVertexShader = `

varying vec2 vUv;

uniform vec2 eyeScale;
uniform vec2 eyeOffset;

void main() {

    vUv = uv;

    vec2 clipPosition =
        position.xy *
        eyeScale +
        eyeOffset;

    gl_Position =
        vec4(
            clipPosition,
            0.0,
            1.0
        );
}

`;


/*
   Ukrivljenost je ista logika kot pri tisti
   prvi sliki, ki si rekla, da je bila prava.

   To NI navaden split-screen.
*/

const cardboardFragmentShader = `

precision highp float;

uniform sampler2D eyeTexture;

uniform float k1;
uniform float k2;

varying vec2 vUv;

void main() {

    vec2 p =
        vUv * 2.0 - 1.0;


    vec2 q =
        p;


    q.x *=
        1.04;


    float r2 =
        dot(
            q,
            q
        );


    float factor =
        1.0 +
        k1 * r2 +
        k2 * r2 * r2;


    vec2 distorted =
        q * factor;


    distorted.x /=
        1.04;


    vec2 uv =
        distorted * 0.5 +
        0.5;


    /*
       Radialno ukrivljeni robovi.
    */

    if(
        uv.x < 0.0 ||
        uv.x > 1.0 ||
        uv.y < 0.0 ||
        uv.y > 1.0
    ) {

        gl_FragColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }


    /*
       Ista maska kot pri prvem Cardboard
       poskusu, ki si ga pokazala.
    */

    vec2 maskP =
        p;


    maskP.x *=
        0.91;


    float maskR =
        dot(
            maskP,
            maskP
        );


    if(
        maskR >
        1.30
    ) {

        gl_FragColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }


    gl_FragColor =
        texture2D(
            eyeTexture,
            uv
        );
}

`;


/* =========================================================
   BUILD YOUTUBE/CARDBOARD EYES
========================================================= */

function buildCardboardOutput() {

    disposeCardboardOutput();


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const targetWidth =
        Math.max(

            640,

            Math.floor(

                innerWidth *
                0.5 *
                dpr

            )
        );


    const targetHeight =
        Math.max(

            640,

            Math.floor(

                innerHeight *
                dpr

            )
        );


    leftRenderTarget =
        new THREE.WebGLRenderTarget(

            targetWidth,

            targetHeight,

            {
                minFilter:
                    THREE.LinearFilter,

                magFilter:
                    THREE.LinearFilter,

                depthBuffer:
                    true
            }
        );


    rightRenderTarget =
        new THREE.WebGLRenderTarget(

            targetWidth,

            targetHeight,

            {
                minFilter:
                    THREE.LinearFilter,

                magFilter:
                    THREE.LinearFilter,

                depthBuffer:
                    true
            }
        );


    /*
       PlaneGeometry(2,2):
       position gre od -1 do +1.

       eyeScale.x = 0.43 pomeni:
       posamezno oko zasede 43 % CELOTNE širine.

       center:
       leva = -0.50
       desna = +0.50

       Zato sta obe leči ločeni.
    */

    const geometry =
        new THREE.PlaneGeometry(
            2,
            2
        );


    const leftMaterial =
        new THREE.ShaderMaterial({

            uniforms: {

                eyeTexture: {
                    value:
                        leftRenderTarget.texture
                },

                eyeScale: {
                    value:
                        new THREE.Vector2(
                            0.43,
                            0.76
                        )
                },

                eyeOffset: {
                    value:
                        new THREE.Vector2(
                            -0.50,
                            0.0
                        )
                },

                k1: {
                    value:
                        0.20
                },

                k2: {
                    value:
                        0.07
                }
            },

            vertexShader:
                cardboardVertexShader,

            fragmentShader:
                cardboardFragmentShader,

            depthTest:
                false,

            depthWrite:
                false
        });


    const rightMaterial =
        new THREE.ShaderMaterial({

            uniforms: {

                eyeTexture: {
                    value:
                        rightRenderTarget.texture
                },

                eyeScale: {
                    value:
                        new THREE.Vector2(
                            0.43,
                            0.76
                        )
                },

                eyeOffset: {
                    value:
                        new THREE.Vector2(
                            0.50,
                            0.0
                        )
                },

                k1: {
                    value:
                        0.20
                },

                k2: {
                    value:
                        0.07
                }
            },

            vertexShader:
                cardboardVertexShader,

            fragmentShader:
                cardboardFragmentShader,

            depthTest:
                false,

            depthWrite:
                false
        });


    leftEyeMesh =
        new THREE.Mesh(
            geometry,
            leftMaterial
        );


    rightEyeMesh =
        new THREE.Mesh(
            geometry.clone(),
            rightMaterial
        );


    outputScene.add(
        leftEyeMesh
    );


    outputScene.add(
        rightEyeMesh
    );


    logDebug(
        "Cardboard output zgrajen: dve YT leči"
    );
}


/* =========================================================
   DISPOSE CARDBOARD
========================================================= */

function disposeCardboardOutput() {

    if(leftEyeMesh) {

        outputScene.remove(
            leftEyeMesh
        );


        leftEyeMesh.geometry
            .dispose();


        leftEyeMesh.material
            .dispose();


        leftEyeMesh =
            null;
    }


    if(rightEyeMesh) {

        outputScene.remove(
            rightEyeMesh
        );


        rightEyeMesh.geometry
            .dispose();


        rightEyeMesh.material
            .dispose();


        rightEyeMesh =
            null;
    }


    if(leftRenderTarget) {

        leftRenderTarget
            .dispose();


        leftRenderTarget =
            null;
    }


    if(rightRenderTarget) {

        rightRenderTarget
            .dispose();


        rightRenderTarget =
            null;
    }
}

let cardboardInfoGroup =

function removeCardboardInfo() {

    if(!cardboardInfoGroup)
        return;


    scene.remove(
        cardboardInfoGroup
    );


    cardboardInfoGroup.traverse(
        object => {

            if(object.geometry) {

                object.geometry

            }


            if(object.material) {

                if(
                    object.material.map
                ) {

                    object.material.map
                        .dispose();
                }


                object.material
                    .dispose();
            }
        }
    );


    cardboardInfoGroup =
        null;
}


function wrapCanvasText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    lineHeight,
    maxLines
) {

    const words =
        String(text)
            .split(/\s+/);


    let line =
        "";


    let lineNumber =
        0;


    for(
        let i = 0;
        i < words.length;
        i++
    ) {

        const testLine =
            line +
            words[i] +
            " ";


        if(
            ctx.measureText(
                testLine
            ).width >
            maxWidth &&
            line !== ""
        ) {

            ctx.fillText(
                line,
                x,
                y +
                lineNumber *
                lineHeight
            );


            lineNumber++;


            if(
                lineNumber >=
                maxLines
            ) {

                return;
            }


            line =
                words[i] +
                " ";

        }
        else {

            line =
                testLine;
        }
    }


    if(
        lineNumber <
        maxLines
    ) {

        ctx.fillText(
            line,
            x,
            y +
            lineNumber *
            lineHeight
        );
    }
}

    group.lookAt(

    );


    scene.add(
        group
    );


    cardboardInfoGroup =
        group;
}


/* =========================================================
   GAZE
========================================================= */

const gazeRaycaster =
    new THREE.Raycaster();


let gazeTargetId =
    null;


let gazeStartTime =
    0;


let gazeTriggered =
    false;


const GAZE_DELAY =
    1200;


function resetGaze() {

    gazeTargetId =
        null;


    gazeStartTime =
        0;


    gazeTriggered =
        false;


    reticleLeft.classList.remove(
        "active"
    );


    reticleRight.classList.remove(
        "active"
    );
}


function updateGaze() {

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        )
        .applyQuaternion(
            camera.quaternion
        )
        .normalize();


    gazeRaycaster.set(
        camera.position,
        forward
    );


    const hits =
        gazeRaycaster
            .intersectObjects(
                hotspotMeshes,
                false
            );


    const id =
        hits.length > 0
            ? hits[0]
                .object
                .userData
                .hotspotId
            : null;


    if(!id) {

        resetGaze();

        return;
    }


    if(
        gazeTargetId !==
        id
    ) {

        gazeTargetId =
            id;


        gazeStartTime =
            performance.now();


        gazeTriggered =
            false;


        reticleLeft
            .classList
            .remove(
                "active"
            );


        reticleRight
            .classList
            .remove(
                "active"
            );


        void reticleLeft
            .offsetWidth;


        reticleLeft
            .classList
            .add(
                "active"
            );


        reticleRight
            .classList
            .add(
                "active"
            );


        return;
    }


    if(
        !gazeTriggered &&
        performance.now() -
        gazeStartTime >=
        GAZE_DELAY
    ) {

        gazeTriggered =
            true;


        const hotspot =
            getHotspot(
                gazeTargetId
            );


        if(hotspot) {

            showCardboardInfo(
                hotspot
            );
        }
    }
}

async function enterCardboard() {

    if(cardboardMode)
        return;


    logDebug(
        "ENTER CARDBOARD"
    );


    cardboardMode =
        true;


    toolbar.style.display =
        "none";


    popup.style.display =
        "none";


    hint.style.display =
        "none";


    cardboardUI.style.display =
        "block";


    window.addEventListener(
        "deviceorientation",
        orientationHandler,
        true
    );


    /*
       Najprej naredimo output,
       tako da Cardboard deluje tudi,
       če fullscreen/orientation lock odpovesta.
    */

    buildCardboardOutput();


    requestWakeLock();


    try {

        if(
            !document.fullscreenElement &&
            document.documentElement
                .requestFullscreen
        ) {

            await document
                .documentElement
                .requestFullscreen();


            logDebug(
                "Fullscreen ON"
            );
        }

    }
    catch(error) {

        logDebug(
            "Fullscreen ni uspel: " +
            error.message
        );
    }


    try {

        if(
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );


            logDebug(
                "Landscape lock OK"
            );
        }

    }
    catch(error) {

        logDebug(
            "Landscape lock ni uspel"
        );
    }


    resizeRenderer();
}


/* =========================================================
   EXIT CARDBOARD
========================================================= */

exitCardboardBtn.addEventListener(
    "click",
    exitCardboard
);


async function exitCardboard() {

    if(!cardboardMode)
        return;


    cardboardMode =
        false;


    logDebug(
        "EXIT CARDBOARD"
    );


    window.removeEventListener(
        "deviceorientation",
        orientationHandler,
        true
    );


    await releaseWakeLock();


    removeCardboardInfo();

    resetGaze();

    disposeCardboardOutput();


    cardboardUI.style.display =
        "none";


    toolbar.style.display =
        "flex";


    /*
       Povrnemo normalen pogled.
    */

    camera.quaternion.identity();

    camera.rotation.set(
        0,
        0,
        0
    );

    updateNormalCamera();


    camera.fov =
        75;


    resizeRenderer();


    try {

        if(
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();
        }

    }
    catch(error) {}


    try {

        if(
            document.fullscreenElement &&
            document.exitFullscreen
        ) {

            await document
                .exitFullscreen();
        }

    }
    catch(error) {}
}


/* =========================================================
   NORMAL RENDER
========================================================= */

function renderNormal() {

    renderer.setRenderTarget(
        null
    );


    renderer.setScissorTest(
        false
    );


    renderer.setClearColor(
        0x000000,
        1
    );


    renderer.clear(
        true,
        true,
        true
    );


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   YOUTUBE/CARDBOARD RENDER
========================================================= */

function renderCardboard() {

    if(
        !leftRenderTarget ||
        !rightRenderTarget ||
        !leftEyeMesh ||
        !rightEyeMesh
    ) {

        return;
    }


    updateGyroscope();


    /*
       Aspect je za ENO polovico telefona,
       ne za cel telefon.
    */

    camera.aspect =
        (
            innerWidth *
            0.5
        ) /
        innerHeight;


    camera.fov =
        80;


    camera.updateProjectionMatrix();


    camera.updateMatrixWorld(
        true
    );


    stereoCamera.eyeSep =
        0.064;


    stereoCamera.update(
        camera
    );


    /*
       LEVO OKO
    */

    renderer.setRenderTarget(
        leftRenderTarget
    );


    renderer.setScissorTest(
        false
    );


    renderer.setClearColor(
        0x000000,
        1
    );


    renderer.clear(
        true,
        true,
        true
    );


    renderer.render(
        scene,
        stereoCamera.cameraL
    );


    /*
       DESNO OKO
    */

    renderer.setRenderTarget(
        rightRenderTarget
    );


    renderer.clear(
        true,
        true,
        true
    );


    renderer.render(
        scene,
        stereoCamera.cameraR
    );


    /*
       Zdaj NE renderiramo navaden split screen.

       Renderiramo output shader:
       dve ločeni radialno ukrivljeni leči.
    */

    renderer.setRenderTarget(
        null
    );


    renderer.setScissorTest(
        false
    );


    renderer.setClearColor(
        0x000000,
        1
    );


    renderer.clear(
        true,
        true,
        true
    );


    renderer.render(
        outputScene,
        outputCamera
    );


    updateGaze();
}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if(cardboardMode) {

        renderCardboard();

    }
    else {

        renderNormal();

        positionPopup();
    }
}

animate();


/* =========================================================
   RESIZE
========================================================= */

function resizeRenderer() {

    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio || 1,
            2
        )

    );


    renderer.setSize(
        innerWidth,
        innerHeight,
        false
    );


    if(!cardboardMode) {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();
    }
}


window.addEventListener(
    "resize",
    () => {

        resizeRenderer();


        /*
           Če se telefon obrne med Cardboardom,
           ponovno naredimo targeta v novi velikosti.
        */

        if(cardboardMode) {

            buildCardboardOutput();
        }
    }
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            () => {

                resizeRenderer();


                if(cardboardMode) {

                    buildCardboardOutput();
                }

            },
            250
        );
    }
);


resizeRenderer();


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key !==
            "Escape"
        )
            return;


        if(cardboardMode) {

            exitCardboard();

        }
        else {

            stopAddMode();

            closePopup();
        }
    }
);


/* =========================================================
   START STATUS
========================================================= */

logDebug(
    "Aplikacija zagnana"
);

logDebug(
    "WebGL: " +
    renderer.capabilities
        .isWebGL2
);

logDebug(
    "Screen: " +
    innerWidth +
    " x " +
    innerHeight
);

</script>

</body>
</html>
