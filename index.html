<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>360° Hotspot Viewer</title>

  <!-- A-Frame: 360 + WebXR / VR -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    /* =========================================
       360 VIEWER
    ========================================= */

    #viewer {
      position: fixed;
      inset: 0;
      background: #111;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    /* =========================================
       ZGORNJA ORODNA VRSTICA
    ========================================= */

    #toolbar {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10000;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px;

      border-radius: 14px;

      background: rgba(20, 20, 20, 0.82);
      backdrop-filter: blur(10px);

      box-shadow: 0 6px 25px rgba(0,0,0,.28);
    }

    .tool-button {
      height: 42px;
      min-width: 42px;

      border: 0;
      border-radius: 9px;

      padding: 0 14px;

      background: rgba(255,255,255,.12);
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background .15s ease,
        transform .15s ease;
    }

    .tool-button:hover {
      background: rgba(255,255,255,.22);
    }

    .tool-button:active {
      transform: scale(.96);
    }

    #addHotspotBtn {
      background: #2563eb;
    }

    #addHotspotBtn.active {
      background: #16a34a;
    }

    .separator {
      width: 1px;
      height: 26px;
      background: rgba(255,255,255,.22);
      margin: 0 2px;
    }

    /* =========================================
       NAVODILO
    ========================================= */

    #instruction {
      position: fixed;

      left: 50%;
      bottom: 24px;

      transform: translateX(-50%);

      z-index: 10000;

      display: none;

      max-width: calc(100% - 40px);

      padding: 11px 18px;

      border-radius: 30px;

      background: rgba(0,0,0,.78);
      color: white;

      font-size: 14px;
      text-align: center;

      pointer-events: none;
    }

    /* =========================================
       HOTSPOT HTML OVERLAY
    ========================================= */

    #hotspotLayer {
      position: fixed;
      inset: 0;

      z-index: 5000;

      pointer-events: none;
    }

    .hotspot-wrapper {
      position: absolute;

      width: 0;
      height: 0;

      pointer-events: none;
    }

    .hotspot-dot {
      position: absolute;

      left: 0;
      top: 0;

      width: 36px;
      height: 36px;

      transform: translate(-50%, -50%);

      border: 3px solid white;
      border-radius: 50%;

      background: #ef4444;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 13px;
      font-weight: bold;

      cursor: pointer;
      pointer-events: auto;

      box-shadow:
        0 4px 14px rgba(0,0,0,.45),
        0 0 0 4px rgba(239,68,68,.25);

      transition:
        transform .15s ease,
        background .15s ease;
    }

    .hotspot-dot:hover {
      transform:
        translate(-50%, -50%)
        scale(1.15);

      background: #dc2626;
    }

    /* =========================================
       POPUP

       Popup je del istega wrapperja kot pika,
       zato je vedno vezan na hotspot.
    ========================================= */

    .hotspot-popup {
      position: absolute;

      left: 28px;
      top: 0;

      transform: translateY(-50%);

      width: 320px;
      max-width: calc(100vw - 40px);

      padding: 18px;

      border-radius: 14px;

      background: white;
      color: #222;

      pointer-events: auto;

      box-shadow:
        0 12px 40px rgba(0,0,0,.35);
    }

    .hotspot-popup.open-left {
      left: auto;
      right: 28px;
    }

    .popup-close {
      position: absolute;

      right: 9px;
      top: 9px;

      width: 30px;
      height: 30px;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: #f1f3f5;
      color: #444;

      font-size: 20px;
      line-height: 30px;

      cursor: pointer;
    }

    /* =========================================
       BRALNI NAČIN
    ========================================= */

    .reader-title {
      margin: 0 35px 10px 0;

      font-size: 19px;
      line-height: 1.25;
    }

    .reader-description {
      margin: 0 0 16px;

      color: #444;

      font-size: 14px;
      line-height: 1.55;

      white-space: pre-wrap;
    }

    .edit-button {
      width: 100%;

      padding: 10px 14px;

      border: 0;
      border-radius: 8px;

      background: #2563eb;
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    /* =========================================
       EDITOR
    ========================================= */

    .field-label {
      display: block;

      margin: 0 0 5px;

      font-size: 12px;
      font-weight: 700;
      color: #555;
    }

    .title-input,
    .description-input {
      width: 100%;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      padding: 10px;

      font: inherit;

      outline: none;
    }

    .title-input {
      margin-bottom: 12px;
    }

    .description-input {
      min-height: 115px;

      resize: vertical;

      margin-bottom: 12px;
    }

    .title-input:focus,
    .description-input:focus {
      border-color: #2563eb;
    }

    .editor-buttons {
      display: flex;
      gap: 7px;
    }

    .editor-buttons button {
      border: 0;
      border-radius: 8px;

      padding: 9px 12px;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .save-button {
      flex: 1;

      background: #16a34a;
      color: white;
    }

    .cancel-button {
      background: #e5e7eb;
      color: #222;
    }

    .delete-button {
      background: #dc2626;
      color: white;
    }

    /* =========================================
       MOBILNI PRIKAZ
    ========================================= */

    @media (max-width: 650px) {

      #toolbar {
        top: 10px;
        left: 10px;
        right: 10px;

        justify-content: center;

        flex-wrap: wrap;
      }

      .tool-button {
        height: 38px;
        padding: 0 11px;
      }

      .hotspot-popup {
        width: 280px;
      }

    }
  </style>
</head>

<body>

  <!-- =====================================
       360 VIEWER
  ====================================== -->

  <div id="viewer">

    <a-scene
      id="scene"
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; colorManagement: true"
      loading-screen="enabled: true"
    >

      <!--
        SPREMENI SAMO src, če se tvoja
        360 slika imenuje drugače.
      -->

      <a-assets>
        <img
          id="panoramaImage"
          src="360.jpg"
          crossorigin="anonymous"
        >
      </a-assets>


      <!-- 360° equirectangular panorama -->

      <a-sky
        id="sky"
        src="#panoramaImage"
        rotation="0 -90 0"
      ></a-sky>


      <!-- Kamera -->

      <a-entity
        id="cameraRig"
        position="0 0 0"
      >

        <a-camera
          id="camera"
          position="0 0 0"
          look-controls="enabled: true"
          wasd-controls="enabled: false"
          zoom-control
        ></a-camera>

      </a-entity>

    </a-scene>

  </div>


  <!-- =====================================
       HOTSPOT HTML LAYER
  ====================================== -->

  <div id="hotspotLayer"></div>


  <!-- =====================================
       KONTROLE
  ====================================== -->

  <div id="toolbar">

    <button
      id="addHotspotBtn"
      class="tool-button"
    >
      + Dodaj hotspot
    </button>


    <div class="separator"></div>


    <button
      id="zoomInBtn"
      class="tool-button"
      title="Približaj"
    >
      +
    </button>


    <button
      id="zoomOutBtn"
      class="tool-button"
      title="Oddalji"
    >
      −
    </button>


    <div class="separator"></div>


    <button
      id="fullscreenBtn"
      class="tool-button"
    >
      ⛶ Fullscreen
    </button>


    <button
      id="vrBtn"
      class="tool-button"
    >
      🥽 VR
    </button>

  </div>


  <div id="instruction">
    Obrni pogled na želeno mesto in klikni v panoramo.
  </div>


<script>

/* ==========================================================
   ELEMENTI
========================================================== */

const scene =
  document.querySelector("#scene");

const camera =
  document.querySelector("#camera");

const sky =
  document.querySelector("#sky");

const hotspotLayer =
  document.querySelector("#hotspotLayer");

const addHotspotBtn =
  document.querySelector("#addHotspotBtn");

const zoomInBtn =
  document.querySelector("#zoomInBtn");

const zoomOutBtn =
  document.querySelector("#zoomOutBtn");

const fullscreenBtn =
  document.querySelector("#fullscreenBtn");

const vrBtn =
  document.querySelector("#vrBtn");

const instruction =
  document.querySelector("#instruction");


/* ==========================================================
   PODATKI
========================================================== */

const STORAGE_KEY =
  "panorama-360-hotspots-v1";


let hotspots =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || [];


let addMode = false;

let openHotspotId = null;


/* ==========================================================
   SHRANJEVANJE
========================================================== */

function saveHotspots() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(hotspots)
  );

}


/* ==========================================================
   ZOOM COMPONENT
========================================================== */

AFRAME.registerComponent(
  "zoom-control",
  {

    init: function () {

      const cameraObject =
        this.el.getObject3D("camera");


      window.addEventListener(
        "wheel",
        event => {

          if (
            event.target.closest &&
            (
              event.target.closest(".hotspot-popup") ||
              event.target.closest("#toolbar")
            )
          ) {
            return;
          }


          event.preventDefault();


          cameraObject.fov +=
            event.deltaY * 0.03;


          cameraObject.fov =
            THREE.MathUtils.clamp(
              cameraObject.fov,
              30,
              100
            );


          cameraObject.updateProjectionMatrix();

        },
        {
          passive: false
        }
      );

    }

  }
);


/* ==========================================================
   ZOOM GUMBA
========================================================== */

function changeZoom(amount) {

  const cameraObject =
    camera.getObject3D("camera");


  if (!cameraObject)
    return;


  cameraObject.fov += amount;


  cameraObject.fov =
    THREE.MathUtils.clamp(
      cameraObject.fov,
      30,
      100
    );


  cameraObject.updateProjectionMatrix();

}


zoomInBtn.addEventListener(
  "click",
  () => changeZoom(-10)
);


zoomOutBtn.addEventListener(
  "click",
  () => changeZoom(10)
);


/* ==========================================================
   FULLSCREEN
========================================================== */

fullscreenBtn.addEventListener(
  "click",
  async () => {

    try {

      if (!document.fullscreenElement) {

        await document.documentElement
          .requestFullscreen();

      }

      else {

        await document.exitFullscreen();

      }

    }

    catch (error) {

      console.error(
        "Fullscreen ni na voljo:",
        error
      );

    }

  }
);


/* ==========================================================
   VR / WEBXR
========================================================== */

vrBtn.addEventListener(
  "click",
  async () => {

    /*
      A-Frame uporablja WebXR.

      VR bo deloval samo:
      - v podprtem brskalniku,
      - prek HTTPS,
      - na WebXR napravi.
    */

    try {

      if (scene.is("vr-mode")) {

        scene.exitVR();

        return;

      }


      await scene.enterVR();

    }

    catch (error) {

      alert(
        "VR na tej napravi ali v tem brskalniku ni na voljo."
      );

      console.error(error);

    }

  }
);


/* ==========================================================
   NAČIN DODAJANJA
========================================================== */

addHotspotBtn.addEventListener(
  "click",
  event => {

    event.stopPropagation();


    addMode = !addMode;


    closePopup();


    if (addMode) {

      addHotspotBtn.classList.add(
        "active"
      );

      addHotspotBtn.textContent =
        "Klikni v panoramo";

      instruction.style.display =
        "block";

    }

    else {

      stopAddMode();

    }

  }
);


function stopAddMode() {

  addMode = false;


  addHotspotBtn.classList.remove(
    "active"
  );


  addHotspotBtn.textContent =
    "+ Dodaj hotspot";


  instruction.style.display =
    "none";

}


/* ==========================================================
   KLIK V PANORAMO

   Ta klik ustvari hotspot SAMO,
   če je aktiven "Dodaj hotspot".
========================================================== */

scene.addEventListener(
  "click",
  event => {

    if (!addMode)
      return;


    /*
      Če klik prihaja iz HTML UI,
      ga ignoriramo.
    */

    if (
      event.target.closest &&
      (
        event.target.closest("#toolbar") ||
        event.target.closest(".hotspot-popup") ||
        event.target.closest(".hotspot-dot")
      )
    ) {
      return;
    }


    /*
      Uporabimo trenutno smer pogleda.

      Hotspot nastane v centru pogleda,
      oziroma zelo blizu mesta,
      kamor uporabnik gleda.

      Za natančen klik spodaj dodatno
      upoštevamo položaj miške.
    */

    const mouseX =
      event.clientX;

    const mouseY =
      event.clientY;


    if (
      typeof mouseX !== "number" ||
      typeof mouseY !== "number"
    ) {
      return;
    }


    const direction =
      screenPointToDirection(
        mouseX,
        mouseY
      );


    if (!direction)
      return;


    const spherical =
      directionToSpherical(
        direction
      );


    const hotspot = {

      id:
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2),

      yaw:
        spherical.yaw,

      pitch:
        spherical.pitch,

      title: "",

      description: ""

    };


    hotspots.push(hotspot);


    saveHotspots();


    stopAddMode();


    /*
      Nariši novo piko.
    */

    renderHotspots();


    /*
      KLJUČNI FLOW:

      ob ustvarjanju se editor
      takoj odpre ob novi piki.
    */

    openEditor(
      hotspot.id
    );

  }
);


/* ==========================================================
   PRETVORBA SCREEN KLIKA V 3D SMER
========================================================== */

function screenPointToDirection(
  clientX,
  clientY
) {

  const cameraObject =
    camera.getObject3D("camera");


  if (!cameraObject)
    return null;


  const rect =
    scene.getBoundingClientRect();


  const x =
    ((clientX - rect.left)
      / rect.width) * 2 - 1;


  const y =
    -(
      ((clientY - rect.top)
        / rect.height) * 2 - 1
    );


  const vector =
    new THREE.Vector3(
      x,
      y,
      0.5
    );


  vector.unproject(
    cameraObject
  );


  vector
    .sub(
      cameraObject
        .getWorldPosition(
          new THREE.Vector3()
        )
    )
    .normalize();


  return vector;

}


/* ==========================================================
   3D SMER -> YAW / PITCH
========================================================== */

function directionToSpherical(
  direction
) {

  const yaw =
    Math.atan2(
      direction.x,
      -direction.z
    );


  const pitch =
    Math.asin(
      THREE.MathUtils.clamp(
        direction.y,
        -1,
        1
      )
    );


  return {
    yaw,
    pitch
  };

}


/* ==========================================================
   YAW / PITCH -> 3D TOČKA
========================================================== */

function sphericalToVector(
  yaw,
  pitch,
  radius = 10
) {

  const x =
    radius *
    Math.cos(pitch) *
    Math.sin(yaw);


  const y =
    radius *
    Math.sin(pitch);


  const z =
    -radius *
    Math.cos(pitch) *
    Math.cos(yaw);


  return new THREE.Vector3(
    x,
    y,
    z
  );

}


/* ==========================================================
   3D HOTSPOT -> POZICIJA NA ZASLONU
========================================================== */

function hotspotToScreen(
  hotspot
) {

  const cameraObject =
    camera.getObject3D("camera");


  if (!cameraObject)
    return null;


  const worldPosition =
    sphericalToVector(
      hotspot.yaw,
      hotspot.pitch
    );


  /*
    Preverimo, ali je hotspot
    pred ali za kamero.
  */

  const cameraPosition =
    new THREE.Vector3();


  cameraObject.getWorldPosition(
    cameraPosition
  );


  const cameraDirection =
    new THREE.Vector3();


  cameraObject.getWorldDirection(
    cameraDirection
  );


  const toPoint =
    worldPosition
      .clone()
      .sub(cameraPosition)
      .normalize();


  const dot =
    cameraDirection.dot(
      toPoint
    );


  if (dot <= 0)
    return null;


  const projected =
    worldPosition
      .clone()
      .project(cameraObject);


  const width =
    window.innerWidth;


  const height =
    window.innerHeight;


  const x =
    (projected.x + 1)
    / 2
    * width;


  const y =
    (-projected.y + 1)
    / 2
    * height;


  return {
    x,
    y
  };

}


/* ==========================================================
   RENDER HOTSPOTOV
========================================================== */

function renderHotspots() {

  hotspotLayer.innerHTML = "";


  hotspots.forEach(
    (hotspot, index) => {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "hotspot-wrapper";


      wrapper.dataset.id =
        hotspot.id;


      const dot =
        document.createElement("button");


      dot.className =
        "hotspot-dot";


      dot.textContent =
        index + 1;


      dot.title =
        hotspot.title ||
        "Hotspot";


      /*
        KLIK NA PIKO:

        vedno odpre BRALNI način.

        Nikoli editor neposredno.
      */

      dot.addEventListener(
        "click",
        event => {

          event.stopPropagation();


          stopAddMode();


          openReader(
            hotspot.id
          );

        }
      );


      wrapper.appendChild(dot);


      hotspotLayer.appendChild(
        wrapper
      );

    }
  );


  updateHotspotPositions();

}


/* ==========================================================
   POSODABLJANJE POZICIJ

   Teče vsak frame, zato pike sledijo
   360° panorami med obračanjem.
========================================================== */

function updateHotspotPositions() {

  document
    .querySelectorAll(
      ".hotspot-wrapper"
    )
    .forEach(wrapper => {

      const id =
        wrapper.dataset.id;


      const hotspot =
        hotspots.find(
          h => h.id === id
        );


      if (!hotspot)
        return;


      const screen =
        hotspotToScreen(
          hotspot
        );


      if (!screen) {

        wrapper.style.display =
          "none";

        return;

      }


      /*
        Če je daleč izven zaslona,
        skrijemo.
      */

      if (
        screen.x < -100 ||
        screen.x >
          window.innerWidth + 100 ||
        screen.y < -100 ||
        screen.y >
          window.innerHeight + 100
      ) {

        wrapper.style.display =
          "none";

        return;

      }


      wrapper.style.display =
        "block";


      wrapper.style.left =
        screen.x + "px";


      wrapper.style.top =
        screen.y + "px";


      /*
        Popup vedno ostane ob piki.

        Če je pika na desni strani,
        popup odpremo LEVO.
      */

      const popup =
        wrapper.querySelector(
          ".hotspot-popup"
        );


      if (popup) {

        if (
          screen.x >
          window.innerWidth / 2
        ) {

          popup.classList.add(
            "open-left"
          );

        }

        else {

          popup.classList.remove(
            "open-left"
          );

        }


        /*
          Popravek vertikalnega roba.
        */

        requestAnimationFrame(
          () => {

            const popupRect =
              popup.getBoundingClientRect();


            let offsetY = 0;


            if (
              popupRect.top < 10
            ) {

              offsetY =
                10 -
                popupRect.top;

            }


            if (
              popupRect.bottom >
              window.innerHeight - 10
            ) {

              offsetY -=
                popupRect.bottom -
                (
                  window.innerHeight -
                  10
                );

            }


            popup.style.marginTop =
              offsetY + "px";

          }
        );

      }

    });

}


/* ==========================================================
   BRALNI POPUP
========================================================== */

function openReader(id) {

  closePopup();


  const hotspot =
    hotspots.find(
      h => h.id === id
    );


  if (!hotspot)
    return;


  openHotspotId = id;


  const wrapper =
    document.querySelector(
      `.hotspot-wrapper[data-id="${id}"]`
    );


  if (!wrapper)
    return;


  const popup =
    document.createElement("div");


  popup.className =
    "hotspot-popup";


  popup.addEventListener(
    "click",
    event =>
      event.stopPropagation()
  );


  /* X */

  const close =
    document.createElement("button");


  close.className =
    "popup-close";


  close.textContent =
    "×";


  close.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      closePopup();

    }
  );


  /* NASLOV */

  const title =
    document.createElement("h2");


  title.className =
    "reader-title";


  title.textContent =
    hotspot.title ||
    "Brez naslova";


  /* OPIS */

  const description =
    document.createElement("div");


  description.className =
    "reader-description";


  description.textContent =
    hotspot.description ||
    "Ni opisa.";


  /* UREDI */

  const edit =
    document.createElement("button");


  edit.className =
    "edit-button";


  edit.textContent =
    "Uredi";


  edit.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      openEditor(id);

    }
  );


  popup.append(
    close,
    title,
    description,
    edit
  );


  wrapper.appendChild(
    popup
  );


  updateHotspotPositions();

}


/* ==========================================================
   EDITOR POPUP
========================================================== */

function openEditor(id) {

  closePopup();


  const hotspot =
    hotspots.find(
      h => h.id === id
    );


  if (!hotspot)
    return;


  openHotspotId = id;


  const wrapper =
    document.querySelector(
      `.hotspot-wrapper[data-id="${id}"]`
    );


  if (!wrapper)
    return;


  const popup =
    document.createElement("div");


  popup.className =
    "hotspot-popup";


  popup.addEventListener(
    "click",
    event =>
      event.stopPropagation()
  );


  /* X */

  const close =
    document.createElement("button");


  close.className =
    "popup-close";


  close.textContent =
    "×";


  close.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      /*
        Če je popolnoma nov hotspot
        brez vsebine, ga samo zapremo.
        Pika ostane.
      */

      closePopup();

    }
  );


  /* NASLOV */

  const titleLabel =
    document.createElement("label");


  titleLabel.className =
    "field-label";


  titleLabel.textContent =
    "Naslov";


  const titleInput =
    document.createElement("input");


  titleInput.className =
    "title-input";


  titleInput.type =
    "text";


  titleInput.placeholder =
    "Naslov hotspota";


  titleInput.value =
    hotspot.title || "";


  /* OPIS */

  const descriptionLabel =
    document.createElement("label");


  descriptionLabel.className =
    "field-label";


  descriptionLabel.textContent =
    "Opis";


  const descriptionInput =
    document.createElement(
      "textarea"
    );


  descriptionInput.className =
    "description-input";


  descriptionInput.placeholder =
    "Vpiši opis...";


  descriptionInput.value =
    hotspot.description || "";


  /* GUMBI */

  const buttons =
    document.createElement("div");


  buttons.className =
    "editor-buttons";


  const save =
    document.createElement("button");


  save.className =
    "save-button";


  save.textContent =
    "Shrani";


  const cancel =
    document.createElement("button");


  cancel.className =
    "cancel-button";


  cancel.textContent =
    "Prekliči";


  const remove =
    document.createElement("button");


  remove.className =
    "delete-button";


  remove.textContent =
    "Izbriši";


  /* SHRANI */

  save.addEventListener(
    "click",
    event => {

      event.stopPropagation();


      hotspot.title =
        titleInput.value.trim();


      hotspot.description =
        descriptionInput.value.trim();


      saveHotspots();


      /*
        TOČNO TVOJ FLOW:

        popup se NE zapre.

        Samo iz editorja preide
        v BRALNI način.
      */

      openReader(id);

    }
  );


  /* PREKLIČI */

  cancel.addEventListener(
    "click",
    event => {

      event.stopPropagation();


      /*
        Ne shranimo sprememb.

        Če že obstaja vsebina,
        gremo nazaj v reader.
      */

      if (
        hotspot.title ||
        hotspot.description
      ) {

        openReader(id);

      }

      else {

        closePopup();

      }

    }
  );


  /* IZBRIŠI */

  remove.addEventListener(
    "click",
    event => {

      event.stopPropagation();


      hotspots =
        hotspots.filter(
          h => h.id !== id
        );


      saveHotspots();


      openHotspotId = null;


      renderHotspots();

    }
  );


  buttons.append(
    save,
    cancel,
    remove
  );


  popup.append(
    close,

    titleLabel,
    titleInput,

    descriptionLabel,
    descriptionInput,

    buttons
  );


  wrapper.appendChild(
    popup
  );


  updateHotspotPositions();


  setTimeout(
    () => titleInput.focus(),
    50
  );

}


/* ==========================================================
   ZAPRI POPUP
========================================================== */

function closePopup() {

  document
    .querySelectorAll(
      ".hotspot-popup"
    )
    .forEach(
      popup => popup.remove()
    );


  openHotspotId = null;

}


/* ==========================================================
   ESC
========================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {

      closePopup();

      stopAddMode();

    }

  }
);


/* ==========================================================
   ANIMATION LOOP

   Hotspoti sledijo kameri.
========================================================== */

function animationLoop() {

  updateHotspotPositions();

  requestAnimationFrame(
    animationLoop
  );

}


/* ==========================================================
   START
========================================================== */

scene.addEventListener(
  "loaded",
  () => {

    renderHotspots();

    animationLoop();

  }
);

</script>

</body>
</html>
