<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover">

<title>360° VR Panorama</title>

<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

#toolbar{
    position:fixed;
    z-index:10000;
    top:12px;
    left:12px;

    display:flex;
    gap:7px;
    flex-wrap:wrap;

    padding:8px;

    background:rgba(15,15,15,.88);
    border-radius:14px;
}

.tool{
    min-height:42px;
    padding:0 13px;

    border:0;
    border-radius:9px;

    background:#333;
    color:#fff;

    font-weight:700;
    cursor:pointer;
}

#addBtn{
    background:#2563eb;
}

#addBtn.active{
    background:#16a34a;
}

#vrBtn{
    background:#7c3aed;
}

#hint{
    position:fixed;
    z-index:10001;

    display:none;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    padding:11px 18px;

    background:rgba(0,0,0,.82);
    color:#fff;

    border-radius:30px;

    pointer-events:none;
}

#popup{
    position:fixed;
    z-index:20000;

    display:none;

    width:330px;
    max-width:calc(100vw - 24px);

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    padding:18px;

    background:#fff;
    color:#111;

    border-radius:14px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);
}

#popupClose{
    position:absolute;

    top:8px;
    right:8px;

    width:30px;
    height:30px;

    border:0;
    border-radius:50%;

    background:#eee;

    font-size:20px;

    cursor:pointer;
}

#reader,
#editor{
    display:none;
}

#readerTitle{
    margin:0 35px 10px 0;
}

#readerDescription{
    margin-bottom:15px;

    line-height:1.5;
    white-space:pre-wrap;
}

#editBtn{
    width:100%;

    padding:10px;

    border:0;
    border-radius:8px;

    background:#2563eb;
    color:#fff;

    font-weight:bold;

    cursor:pointer;
}

.fieldLabel{
    display:block;

    margin:9px 0 4px;

    font-size:12px;
    font-weight:bold;
}

#titleInput,
#descriptionInput{
    width:100%;

    box-sizing:border-box;

    padding:10px;

    border:1px solid #bbb;
    border-radius:8px;
}

#descriptionInput{
    min-height:115px;
    resize:vertical;
}

.editorButtons{
    display:flex;

    gap:7px;

    margin-top:10px;
}

.editorButtons button{
    flex:1;

    padding:10px;

    border:0;
    border-radius:8px;

    font-weight:bold;

    cursor:pointer;
}

#saveBtn{
    background:#16a34a;
    color:#fff;
}

#cancelBtn{
    background:#ddd;
}

#deleteBtn{
    background:#dc2626;
    color:#fff;
}

@media(max-width:700px){

    #toolbar{
        top:7px;
        left:7px;
        right:7px;

        justify-content:center;
    }

    .tool{
        min-height:38px;
        padding:0 9px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<div id="toolbar">

    <button
        id="addBtn"
        class="tool">
        + Dodaj hotspot
    </button>

    <button
        id="zoomInBtn"
        class="tool">
        +
    </button>

    <button
        id="zoomOutBtn"
        class="tool">
        −
    </button>

    <button
        id="fullscreenBtn"
        class="tool">
        ⛶
    </button>

    <button
        id="vrBtn"
        class="tool">
        🥽 VR
    </button>

</div>


<div id="hint">
    Poglej oziroma klikni mesto v panorami
</div>


<div id="popup">

    <button id="popupClose">
        ×
    </button>

    <div id="reader">

        <h2 id="readerTitle"></h2>

        <div id="readerDescription"></div>

        <button id="editBtn">
            Uredi
        </button>

    </div>


    <div id="editor">

        <label class="fieldLabel">
            Naslov
        </label>

        <input
            id="titleInput"
            type="text"
            placeholder="Naslov">


        <label class="fieldLabel">
            Opis
        </label>

        <textarea
            id="descriptionInput"
            placeholder="Opis..."></textarea>


        <div class="editorButtons">

            <button id="saveBtn">
                Shrani
            </button>

            <button id="cancelBtn">
                Prekliči
            </button>

            <button id="deleteBtn">
                Izbriši
            </button>

        </div>

    </div>

</div>


<a-scene
    id="scene"
    embedded
    background="color: #000"
    vr-mode-ui="enabled: false"
    renderer="
        antialias: true;
        colorManagement: true;
        highRefreshRate: true;
    ">

    <a-assets>

        <img
            id="panorama"
            src="360.jpg"
            crossorigin="anonymous">

    </a-assets>


    <!--
        PRAVA EQUIRECTANGULAR 360° SLIKA.

        Brez custom shaderja.
        Brez k1/k2.
        Brez ročnega raztezanja slike.
    -->

    <a-sky
        id="sky"
        src="#panorama"
        radius="100"
        rotation="0 -90 0">
    </a-sky>


    <!-- HOTSPOTI -->

    <a-entity id="hotspots"></a-entity>


    <!-- KAMERA -->

    <a-entity
        id="cameraRig"
        position="0 0 0">

        <a-camera
            id="camera"
            position="0 0 0"

            camera="
                fov:75;
                near:0.01;
                far:200;
            "

            look-controls="
                enabled:true;
                magicWindowTrackingEnabled:true;
                mouseEnabled:true;
                touchEnabled:true;
            "

            wasd-controls-enabled="false">

            <!-- CENTER RETICLE -->

            <a-entity
                id="cursor"

                cursor="
                    fuse:true;
                    fuseTimeout:1200;
                    rayOrigin:entity;
                "

                raycaster="
                    objects:.hotspot;
                    far:100;
                "

                position="0 0 -1"

                geometry="
                    primitive:ring;
                    radiusInner:0.008;
                    radiusOuter:0.013;
                "

                material="
                    color:white;
                    shader:flat;
                    opacity:0.95;
                ">
            </a-entity>

        </a-camera>

    </a-entity>

</a-scene>


<script>
"use strict";


/* =========================================================
   ELEMENTI
========================================================= */

const scene =
    document.getElementById("scene");

const sky =
    document.getElementById("sky");

const camera =
    document.getElementById("camera");

const hotspotsEntity =
    document.getElementById("hotspots");


const toolbar =
    document.getElementById("toolbar");

const addBtn =
    document.getElementById("addBtn");

const zoomInBtn =
    document.getElementById("zoomInBtn");

const zoomOutBtn =
    document.getElementById("zoomOutBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const vrBtn =
    document.getElementById("vrBtn");

const hint =
    document.getElementById("hint");


const popup =
    document.getElementById("popup");

const popupClose =
    document.getElementById("popupClose");

const reader =
    document.getElementById("reader");

const editor =
    document.getElementById("editor");

const readerTitle =
    document.getElementById("readerTitle");

const readerDescription =
    document.getElementById("readerDescription");

const editBtn =
    document.getElementById("editBtn");

const titleInput =
    document.getElementById("titleInput");

const descriptionInput =
    document.getElementById("descriptionInput");

const saveBtn =
    document.getElementById("saveBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const deleteBtn =
    document.getElementById("deleteBtn");


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "stable-360-hotspots-v5";


let hotspots = [];


try{

    hotspots =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            )
        ) || [];

}
catch(error){

    hotspots = [];
}


function saveHotspots(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            hotspots
        )
    );
}


/* =========================================================
   SPHERICAL POSITION
========================================================= */

function sphericalToPosition(
    yaw,
    pitch,
    radius = 20
){

    return {

        x:
            radius *
            Math.cos(pitch) *
            Math.sin(yaw),

        y:
            radius *
            Math.sin(pitch),

        z:
            -radius *
            Math.cos(pitch) *
            Math.cos(yaw)

    };
}


/* =========================================================
   HOTSPOT
========================================================= */

function createHotspotTexture(
    number
){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 256;
    canvas.height = 256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        256,
        256
    );


    ctx.beginPath();

    ctx.arc(
        128,
        128,
        113,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        128,
        128,
        91,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ef3333";

    ctx.fill();


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 100px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        String(number),
        128,
        136
    );


    return canvas.toDataURL();
}


/* =========================================================
   RENDER HOTSPOTS
========================================================= */

function renderHotspots(){

    while(
        hotspotsEntity.firstChild
    ){

        hotspotsEntity.removeChild(
            hotspotsEntity.firstChild
        );
    }


    hotspots.forEach(
        (hotspot,index) => {

            const position =
                sphericalToPosition(
                    hotspot.yaw,
                    hotspot.pitch
                );


            const entity =
                document.createElement(
                    "a-image"
                );


            entity.setAttribute(
                "class",
                "hotspot"
            );


            entity.setAttribute(
                "src",
                createHotspotTexture(
                    index + 1
                )
            );


            entity.setAttribute(
                "position",
                `${position.x} ${position.y} ${position.z}`
            );


            entity.setAttribute(
                "width",
                "1.25"
            );

            entity.setAttribute(
                "height",
                "1.25"
            );


            entity.setAttribute(
                "look-at-camera",
                ""
            );


            entity.dataset.id =
                hotspot.id;


            entity.addEventListener(
                "click",
                () => {

                    if(addMode)
                        return;

                    openReader(
                        hotspot.id
                    );
                }
            );


            entity.addEventListener(
                "mouseenter",
                () => {

                    entity.setAttribute(
                        "scale",
                        "1.18 1.18 1.18"
                    );
                }
            );


            entity.addEventListener(
                "mouseleave",
                () => {

                    entity.setAttribute(
                        "scale",
                        "1 1 1"
                    );
                }
            );


            hotspotsEntity.appendChild(
                entity
            );
        }
    );
}


/* =========================================================
   LOOK AT CAMERA COMPONENT
========================================================= */

AFRAME.registerComponent(
    "look-at-camera",
    {

        tick:function(){

            if(
                !camera ||
                !camera.object3D
            )
                return;


            const cameraPosition =
                new THREE.Vector3();


            camera.object3D.getWorldPosition(
                cameraPosition
            );


            this.el.object3D.lookAt(
                cameraPosition
            );
        }
    }
);


/* =========================================================
   POPUP
========================================================= */

let selectedHotspotId =
    null;


function getHotspot(
    id
){

    return hotspots.find(
        hotspot =>
            hotspot.id === id
    );
}


function openReader(
    id
){

    const hotspot =
        getHotspot(id);


    if(!hotspot)
        return;


    selectedHotspotId =
        id;


    readerTitle.textContent =
        hotspot.title ||
        "Brez naslova";


    readerDescription.textContent =
        hotspot.description ||
        "Ni opisa.";


    editor.style.display =
        "none";


    reader.style.display =
        "block";


    popup.style.display =
        "block";
}


function openEditor(
    id
){

    const hotspot =
        getHotspot(id);


    if(!hotspot)
        return;


    selectedHotspotId =
        id;


    titleInput.value =
        hotspot.title || "";


    descriptionInput.value =
        hotspot.description || "";


    reader.style.display =
        "none";


    editor.style.display =
        "block";


    popup.style.display =
        "block";
}


function closePopup(){

    popup.style.display =
        "none";

    selectedHotspotId =
        null;
}


popupClose.addEventListener(
    "click",
    closePopup
);


editBtn.addEventListener(
    "click",
    () => {

        if(selectedHotspotId){

            openEditor(
                selectedHotspotId
            );
        }
    }
);


saveBtn.addEventListener(
    "click",
    () => {

        const hotspot =
            getHotspot(
                selectedHotspotId
            );


        if(!hotspot)
            return;


        hotspot.title =
            titleInput.value.trim();


        hotspot.description =
            descriptionInput.value.trim();


        saveHotspots();

        renderHotspots();

        openReader(
            hotspot.id
        );
    }
);


cancelBtn.addEventListener(
    "click",
    () => {

        const hotspot =
            getHotspot(
                selectedHotspotId
            );


        if(
            hotspot &&
            (
                hotspot.title ||
                hotspot.description
            )
        ){

            openReader(
                hotspot.id
            );

        }
        else{

            closePopup();
        }
    }
);


deleteBtn.addEventListener(
    "click",
    () => {

        if(!selectedHotspotId)
            return;


        hotspots =
            hotspots.filter(
                hotspot =>
                    hotspot.id !==
                    selectedHotspotId
            );


        saveHotspots();

        closePopup();

        renderHotspots();
    }
);


/* =========================================================
   ADD HOTSPOT
========================================================= */

let addMode =
    false;


function stopAddMode(){

    addMode =
        false;


    addBtn.classList.remove(
        "active"
    );


    addBtn.textContent =
        "+ Dodaj hotspot";


    hint.style.display =
        "none";
}


addBtn.addEventListener(
    "click",
    () => {

        closePopup();


        addMode =
            !addMode;


        if(addMode){

            addBtn.classList.add(
                "active"
            );


            addBtn.textContent =
                "Klikni v panoramo";


            hint.style.display =
                "block";

        }
        else{

            stopAddMode();
        }
    }
);


/* =========================================================
   CLICK PANORAMA -> ADD HOTSPOT
========================================================= */

scene.addEventListener(
    "loaded",
    () => {

        const canvas =
            scene.canvas;


        canvas.addEventListener(
            "click",
            event => {

                if(!addMode)
                    return;


                const rect =
                    canvas.getBoundingClientRect();


                const mouse =
                    new THREE.Vector2(

                        (
                            (
                                event.clientX -
                                rect.left
                            ) /
                            rect.width
                        ) * 2 - 1,

                        -(
                            (
                                event.clientY -
                                rect.top
                            ) /
                            rect.height
                        ) * 2 + 1
                    );


                const threeCamera =
                    camera.getObject3D(
                        "camera"
                    );


                if(!threeCamera)
                    return;


                const raycaster =
                    new THREE.Raycaster();


                raycaster.setFromCamera(
                    mouse,
                    threeCamera
                );


                const direction =
                    raycaster.ray.direction
                        .clone()
                        .normalize();


                const yaw =
                    Math.atan2(
                        direction.x,
                        -direction.z
                    );


                const pitch =
                    Math.asin(
                        THREE.MathUtils.clamp(
                            direction.y,
                            -1,
                            1
                        )
                    );


                const hotspot = {

                    id:
                        "hs-" +
                        Date.now() +
                        "-" +
                        Math.random()
                            .toString(36)
                            .slice(2,7),

                    yaw:
                        yaw,

                    pitch:
                        pitch,

                    title:
                        "",

                    description:
                        ""
                };


                hotspots.push(
                    hotspot
                );


                saveHotspots();

                renderHotspots();

                stopAddMode();

                openEditor(
                    hotspot.id
                );
            }
        );


        renderHotspots();
    }
);


/* =========================================================
   ZOOM
========================================================= */

let currentFov =
    75;


function setFov(
    value
){

    currentFov =
        THREE.MathUtils.clamp(
            value,
            30,
            100
        );


    camera.setAttribute(
        "camera",
        "fov",
        currentFov
    );
}


zoomInBtn.addEventListener(
    "click",
    () => {

        setFov(
            currentFov - 8
        );
    }
);


zoomOutBtn.addEventListener(
    "click",
    () => {

        setFov(
            currentFov + 8
        );
    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try{

            if(
                !document.fullscreenElement
            ){

                await document
                    .documentElement
                    .requestFullscreen();

            }
            else{

                await document
                    .exitFullscreen();
            }

        }
        catch(error){

            console.warn(
                error
            );
        }
    }
);


/* =========================================================
   VR
========================================================= */

vrBtn.addEventListener(
    "click",
    async () => {

        closePopup();

        stopAddMode();


        try{

            /*
                A-Frame/WebXR naredi stereo kameri
                in VR projekcijo.

                360.jpg ostane normalna
                equirectangular panorama.
            */

            await scene.enterVR();

        }
        catch(error){

            console.error(
                "VR:",
                error
            );


            alert(
                "VR način na tem brskalniku ali napravi ni na voljo."
            );
        }
    }
);


/* =========================================================
   VR UI
========================================================= */

scene.addEventListener(
    "enter-vr",
    () => {

        toolbar.style.display =
            "none";

        popup.style.display =
            "none";
    }
);


scene.addEventListener(
    "exit-vr",
    () => {

        toolbar.style.display =
            "flex";
    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            closePopup();

            stopAddMode();
        }
    }
);

</script>

</body>
</html>
