<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>360° VR ogled</title>

<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

a-scene{
  position:fixed !important;
  inset:0;
  width:100% !important;
  height:100% !important;
}

/* =========================================================
   TOOLBAR
========================================================= */

#toolbar{
  position:fixed;
  z-index:10000;

  top:max(10px,env(safe-area-inset-top));
  left:max(10px,env(safe-area-inset-left));

  display:flex;
  gap:7px;
  flex-wrap:wrap;

  padding:8px;

  border-radius:14px;
  background:rgba(0,0,0,.82);
}

button{
  min-height:42px;
  padding:0 13px;

  border:0;
  border-radius:9px;

  background:#333;
  color:#fff;

  font-size:14px;
  font-weight:700;

  cursor:pointer;
  touch-action:manipulation;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
#popup:focus-visible{
  outline:3px solid #facc15;
  outline-offset:3px;
}

#addBtn{
  background:#2563eb;
}

#addBtn.active{
  background:#16a34a;
}

#vrBtn{
  background:#7c3aed;
}

#hint{
  position:fixed;
  z-index:10001;

  display:none;

  left:50%;
  bottom:max(22px,env(safe-area-inset-bottom));

  transform:translateX(-50%);

  width:max-content;
  max-width:calc(100vw - 30px);

  padding:11px 18px;

  border-radius:30px;

  background:rgba(0,0,0,.88);
  color:#fff;

  text-align:center;
  pointer-events:none;
}

/* =========================================================
   NORMAL HOTSPOT POPUP
========================================================= */

#popup{
  position:fixed;
  z-index:10002;

  display:none;

  width:330px;
  max-width:calc(100vw - 20px);

  padding:18px;

  border-radius:14px;

  background:#fff;
  color:#111;

  box-shadow:0 12px 45px rgba(0,0,0,.5);
}

#popupClose{
  position:absolute;

  right:8px;
  top:8px;

  width:34px;
  height:34px;
  min-height:0;

  padding:0;

  border-radius:50%;

  background:#e5e5e5;
  color:#111;

  font-size:23px;
  line-height:1;
}

#reader,
#editor{
  display:none;
}

#readerTitle{
  margin:0 40px 10px 0;
  line-height:1.2;
}

#readerDescription{
  margin-bottom:15px;

  white-space:pre-wrap;
  line-height:1.5;
}

#editBtn{
  width:100%;
  background:#2563eb;
}

.fieldLabel{
  display:block;

  margin:9px 0 4px;

  font-size:13px;
  font-weight:700;
}

#titleInput,
#descriptionInput{
  width:100%;

  padding:11px;

  border:1px solid #aaa;
  border-radius:8px;

  font:inherit;
}

#descriptionInput{
  min-height:110px;
  resize:vertical;
}

.editorButtons{
  display:flex;
  gap:6px;

  margin-top:10px;
}

.editorButtons button{
  flex:1;
}

#saveBtn{
  background:#16a34a;
}

#cancelBtn{
  background:#666;
}

#deleteBtn{
  background:#dc2626;
}

/* =========================================================
   SCREEN READER LIVE REGION
========================================================= */

.sr-only{
  position:absolute !important;

  width:1px !important;
  height:1px !important;

  padding:0 !important;
  margin:-1px !important;

  overflow:hidden !important;

  clip:rect(0,0,0,0) !important;
  clip-path:inset(50%) !important;

  white-space:nowrap !important;

  border:0 !important;
}

/* =========================================================
   VR START
========================================================= */

#vrStart{
  position:fixed;
  inset:0;
  z-index:20000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.94);
}

#vrStartBox{
  width:390px;
  max-width:100%;

  padding:24px;

  border-radius:16px;

  background:#fff;
  color:#111;

  text-align:center;
}

#vrStartBox h2{
  margin-top:0;
}

#vrStartBox button{
  width:100%;
  margin-top:8px;
}

#startVRBtn{
  background:#7c3aed;
}

#cancelVRBtn{
  background:#666;
}

/* =========================================================
   ROTATE WARNING
========================================================= */

#rotateWarning{
  position:fixed;
  inset:0;
  z-index:30000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:30px;

  background:#000;
  color:#fff;

  text-align:center;

  font-size:22px;
  font-weight:bold;
}

/* uporabljamo svoj Cardboard gumb */
.a-enter-vr{
  display:none !important;
}
</style>
</head>

<body>

<!-- =======================================================
     A-FRAME
======================================================== -->

<a-scene
  id="scene"

  embedded

  vr-mode-ui="enabled:true"

  device-orientation-permission-ui="enabled:true"

  renderer="
    antialias:true;
    colorManagement:true;
    highRefreshRate:true;
    physicallyCorrectLights:false;
  "

  background="color:#000000">


  <!-- =====================================================
       ASSETS
  ====================================================== -->

  <a-assets timeout="20000">

    <img
      id="panoramaImage"
      src="360.jpg"
      crossorigin="anonymous">

  </a-assets>


  <!-- =====================================================
       PANORAMA
  ====================================================== -->

  <a-sky
    id="sky"
    src="#panoramaImage"
    rotation="0 0 0">
  </a-sky>


  <!-- =====================================================
       HOTSPOTS
  ====================================================== -->

  <a-entity id="hotspotContainer"></a-entity>


  <!-- =====================================================
       VR INFO CARD

       Kartica ima:
       - belo ozadje
       - naslov
       - opis
       - X za zapiranje
  ====================================================== -->

  <a-entity
    id="vrInfo"
    visible="false"
    vr-card-face-camera>


    <!-- OZADJE -->

    <a-plane
      width="3.4"
      height="1.9"

      color="#ffffff"

      material="
        shader:flat;
        opacity:0.97;
        transparent:true;
      ">
    </a-plane>


    <!-- NASLOV -->

    <a-text
      id="vrInfoTitle"

      value=""

      color="#111111"

      width="3"

      align="center"
      anchor="center"

      wrap-count="30"

      position="0 0.47 0.02">
    </a-text>


    <!-- OPIS -->

    <a-text
      id="vrInfoDescription"

      value=""

      color="#333333"

      width="2.8"

      align="center"
      anchor="center"

      wrap-count="42"

      position="0 -0.15 0.02">
    </a-text>


    <!-- ===============================================
         VR CLOSE BUTTON
    ================================================ -->

    <a-circle
      id="vrCloseButton"

      class="vr-close"

      radius="0.18"

      color="#222222"

      material="
        shader:flat;
        opacity:0.95;
        transparent:true;
      "

      position="1.42 0.70 0.04">


      <a-text
        value="X"

        color="#ffffff"

        width="0.65"

        align="center"
        anchor="center"

        position="0 -0.01 0.01">
      </a-text>

    </a-circle>

  </a-entity>


  <!-- =====================================================
       CAMERA
  ====================================================== -->

  <a-entity
    id="cameraRig"
    position="0 0 0">

    <a-camera
      id="camera"

      position="0 0 0"

      wasd-controls="enabled:false"

      look-controls="
        enabled:true;
        magicWindowTrackingEnabled:true;
        touchEnabled:true;
        mouseEnabled:true;
        pointerLockEnabled:false;
      ">


      <!--
        RETICLE

        Zdaj raycaster zazna:
        .hotspot
        .vr-close
      -->

      <a-entity
        id="reticle"

        position="0 0 -1"

        cursor="
          fuse:true;
          fuseTimeout:1200;
        "

        raycaster="
          objects:.hotspot, .vr-close;
          far:100;
          interval:50;
        "

        geometry="
          primitive:ring;
          radiusInner:0.012;
          radiusOuter:0.019;
        "

        material="
          color:#ffffff;
          shader:flat;
          opacity:0.95;
        ">
      </a-entity>

    </a-camera>

  </a-entity>

</a-scene>


<!-- =======================================================
     TOOLBAR
======================================================== -->

<div
  id="toolbar"
  role="toolbar"
  aria-label="Orodja za 360 stopinjski ogled">

  <button
    id="addBtn"
    type="button">

    + Dodaj hotspot

  </button>


  <button
    id="zoomInBtn"
    type="button"
    aria-label="Povečaj pogled">

    +

  </button>


  <button
    id="zoomOutBtn"
    type="button"
    aria-label="Pomanjšaj pogled">

    −

  </button>


  <button
    id="fullscreenBtn"
    type="button"
    aria-label="Celozaslonski način">

    ⛶

  </button>


  <button
    id="vrBtn"
    type="button">

    🥽 CARDBOARD

  </button>

</div>


<div
  id="hint"
  role="status"
  aria-live="polite">

  Tapni točno mesto v panorami

</div>


<!-- =======================================================
     NORMAL HOTSPOT POPUP

     ACCESSIBILITY:
     role="dialog"
     aria-labelledby
     aria-describedby
     tabindex="-1"
======================================================== -->

<div
  id="popup"

  role="dialog"
  aria-modal="true"

  aria-labelledby="readerTitle"
  aria-describedby="readerDescription"

  tabindex="-1">


  <button
    id="popupClose"
    type="button"
    aria-label="Zapri vsebino hotspota">

    ×

  </button>


  <!-- =====================================================
       READER
  ====================================================== -->

  <div id="reader">

    <h2
      id="readerTitle"
      tabindex="-1">
    </h2>


    <div
      id="readerDescription">
    </div>


    <button
      id="editBtn"
      type="button">

      Uredi

    </button>

  </div>


  <!-- =====================================================
       EDITOR
  ====================================================== -->

  <div id="editor">

    <label
      class="fieldLabel"
      for="titleInput">

      Naslov

    </label>


    <input
      id="titleInput"
      type="text"
      autocomplete="off">


    <label
      class="fieldLabel"
      for="descriptionInput">

      Opis

    </label>


    <textarea
      id="descriptionInput">
    </textarea>


    <div class="editorButtons">

      <button
        id="saveBtn"
        type="button">

        Shrani

      </button>


      <button
        id="cancelBtn"
        type="button">

        Prekliči

      </button>


      <button
        id="deleteBtn"
        type="button">

        Izbriši

      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     SCREEN READER ANNOUNCEMENT
======================================================== -->

<div
  id="screenReaderAnnouncement"
  class="sr-only"
  aria-live="polite"
  aria-atomic="true">
</div>


<!-- =======================================================
     VR START
======================================================== -->

<div id="vrStart">

  <div id="vrStartBox">

    <h2>
      Samsung Galaxy A36
    </h2>

    <p>
      Obrni telefon vodoravno in ga vstavi v Cardboard očala.
    </p>


    <button
      id="startVRBtn"
      type="button">

      ZAŽENI CARDBOARD

    </button>


    <button
      id="cancelVRBtn"
      type="button">

      Prekliči

    </button>

  </div>

</div>


<div id="rotateWarning">
  Obrni Samsung Galaxy A36 vodoravno
</div>


<script>
"use strict";

/* =========================================================
   A-FRAME COMPONENTS
========================================================= */

AFRAME.registerComponent(
  "look-at-center",
  {

    tick:function(){

      if(!this.el.object3D){
        return;
      }

      this.el.object3D.lookAt(
        0,
        0,
        0
      );

    }

  }
);


/*
  VR kartica je vedno obrnjena proti kameri.
*/

AFRAME.registerComponent(
  "vr-card-face-camera",
  {

    tick:function(){

      const cameraEl =
        document.getElementById(
          "camera"
        );

      if(
        !this.el.object3D ||
        !cameraEl ||
        !cameraEl.object3D
      ){
        return;
      }


      const cameraPosition =
        new THREE.Vector3();


      cameraEl.object3D.getWorldPosition(
        cameraPosition
      );


      this.el.object3D.lookAt(
        cameraPosition
      );

    }

  }
);


/* =========================================================
   DOM
========================================================= */

const $ =
  id =>
    document.getElementById(id);


const scene =
  $("scene");

const camera =
  $("camera");

const hotspotContainer =
  $("hotspotContainer");

const reticle =
  $("reticle");

const vrInfo =
  $("vrInfo");

const vrInfoTitle =
  $("vrInfoTitle");

const vrInfoDescription =
  $("vrInfoDescription");

const vrCloseButton =
  $("vrCloseButton");


const toolbar =
  $("toolbar");

const addBtn =
  $("addBtn");

const zoomInBtn =
  $("zoomInBtn");

const zoomOutBtn =
  $("zoomOutBtn");

const fullscreenBtn =
  $("fullscreenBtn");

const vrBtn =
  $("vrBtn");

const hint =
  $("hint");


const popup =
  $("popup");

const popupClose =
  $("popupClose");

const reader =
  $("reader");

const editor =
  $("editor");

const readerTitle =
  $("readerTitle");

const readerDescription =
  $("readerDescription");

const editBtn =
  $("editBtn");

const titleInput =
  $("titleInput");

const descriptionInput =
  $("descriptionInput");

const saveBtn =
  $("saveBtn");

const cancelBtn =
  $("cancelBtn");

const deleteBtn =
  $("deleteBtn");


const screenReaderAnnouncement =
  $("screenReaderAnnouncement");


const vrStart =
  $("vrStart");

const startVRBtn =
  $("startVRBtn");

const cancelVRBtn =
  $("cancelVRBtn");

const rotateWarning =
  $("rotateWarning");


/* =========================================================
   STORAGE

   ISTI KLJUČ KOT PREJ.
========================================================= */

const STORAGE_KEY =
  "stable-360-hotspots-v5";


let hotspots = [];


try{

  hotspots =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

}
catch(e){

  hotspots = [];

}


function saveHotspots(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      hotspots
    )
  );

}


function getHotspot(id){

  return hotspots.find(
    hotspot =>
      hotspot.id === id
  );

}


/* =========================================================
   SPHERICAL COORDINATES
========================================================= */

function sphericalToVector(
  yaw,
  pitch,
  radius=8
){

  return{

    x:
      radius *
      Math.cos(pitch) *
      Math.sin(yaw),

    y:
      radius *
      Math.sin(pitch),

    z:
      -radius *
      Math.cos(pitch) *
      Math.cos(yaw)

  };

}


function vectorToSpherical(v){

  const length =
    Math.sqrt(
      v.x*v.x +
      v.y*v.y +
      v.z*v.z
    );


  if(!length){

    return{
      yaw:0,
      pitch:0
    };

  }


  const x =
    v.x/length;

  const y =
    v.y/length;

  const z =
    v.z/length;


  return{

    yaw:
      Math.atan2(
        x,
        -z
      ),

    pitch:
      Math.asin(
        THREE.MathUtils.clamp(
          y,
          -1,
          1
        )
      )

  };

}


/* =========================================================
   HOTSPOT IMAGE
========================================================= */

function makeHotspotCanvas(number){

  const c =
    document.createElement(
      "canvas"
    );


  c.width = 256;
  c.height = 256;


  const ctx =
    c.getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    256,
    256
  );


  /* WHITE BORDER */

  ctx.beginPath();

  ctx.arc(
    128,
    128,
    112,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.fill();


  /* RED CENTER */

  ctx.beginPath();

  ctx.arc(
    128,
    128,
    91,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#ef3333";

  ctx.fill();


  /* NUMBER */

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "bold 100px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.fillText(
    String(number),
    128,
    136
  );


  return c;

}


/* =========================================================
   HOTSPOTS
========================================================= */

function renderHotspots(){

  while(
    hotspotContainer.firstChild
  ){

    hotspotContainer.removeChild(
      hotspotContainer.firstChild
    );

  }


  hotspots.forEach(
    (hotspot,index)=>{

      const position =
        sphericalToVector(
          hotspot.yaw,
          hotspot.pitch,
          8
        );


      const marker =
        document.createElement(
          "a-image"
        );


      marker.setAttribute(
        "src",
        makeHotspotCanvas(
          index+1
        ).toDataURL(
          "image/png"
        )
      );


      marker.setAttribute(
        "position",
        `${position.x} ${position.y} ${position.z}`
      );


      marker.setAttribute(
        "width",
        "0.55"
      );


      marker.setAttribute(
        "height",
        "0.55"
      );


      marker.setAttribute(
        "material",
        "shader:flat; transparent:true; alphaTest:0.05"
      );


      marker.setAttribute(
        "look-at-center",
        ""
      );


      marker.classList.add(
        "hotspot"
      );


      marker.dataset.hotspotId =
        hotspot.id;


      /*
        Dostopno ime hotspota.
      */

      marker.setAttribute(
        "aria-label",
        hotspot.title
          ? "Hotspot: "+hotspot.title
          : "Hotspot "+(index+1)
      );


      marker.addEventListener(
        "click",
        ()=>{

          if(addMode){
            return;
          }


          if(
            scene.is(
              "vr-mode"
            )
          ){

            showVRInfo(
              hotspot.id
            );

          }
          else{

            openReader(
              hotspot.id
            );

          }

        }
      );


      hotspotContainer.appendChild(
        marker
      );

    }
  );

}


/* =========================================================
   ACCESSIBLE POPUP
========================================================= */

let selectedHotspotId =
  null;


/*
  Element, na katerem je bil fokus pred odprtjem readerja.
  Ko popup zapremo, poskusimo fokus vrniti.
*/

let focusBeforePopup =
  null;


function announceToScreenReader(text){

  screenReaderAnnouncement.textContent =
    "";


  /*
    Kratek zamik pomaga bralnikom zaznati spremembo.
  */

  setTimeout(
    ()=>{

      screenReaderAnnouncement.textContent =
        text;

    },
    40
  );

}


function closePopup(){

  const previousFocus =
    focusBeforePopup;


  popup.style.display =
    "none";


  popup.style.visibility =
    "visible";


  selectedHotspotId =
    null;


  focusBeforePopup =
    null;


  if(
    previousFocus &&
    typeof previousFocus.focus ===
      "function"
  ){

    try{

      previousFocus.focus();

    }
    catch(e){}

  }

}


function openReader(id){

  const hotspot =
    getHotspot(id);


  if(!hotspot){
    return;
  }


  if(
    popup.style.display ===
      "none"
  ){

    focusBeforePopup =
      document.activeElement;

  }


  selectedHotspotId =
    id;


  const title =
    hotspot.title ||
    "Brez naslova";


  const description =
    hotspot.description ||
    "Ni opisa.";


  readerTitle.textContent =
    title;


  readerDescription.textContent =
    description;


  /*
    Dialog zdaj opisujeta dejanska naslov in opis.
  */

  popup.setAttribute(
    "aria-labelledby",
    "readerTitle"
  );


  popup.setAttribute(
    "aria-describedby",
    "readerDescription"
  );


  editor.style.display =
    "none";


  reader.style.display =
    "block";


  popup.style.display =
    "block";


  popup.style.visibility =
    "visible";


  positionPopup();


  /*
    Fokus na naslov.

    Bralnik zaslona tako pride neposredno v vsebino
    odprtega hotspota.
  */

  requestAnimationFrame(
    ()=>{

      readerTitle.focus({
        preventScroll:true
      });

    }
  );


  /*
    Dodatna live-region objava.
  */

  announceToScreenReader(
    title+". "+description
  );

}


function openEditor(id){

  const hotspot =
    getHotspot(id);


  if(!hotspot){
    return;
  }


  selectedHotspotId =
    id;


  titleInput.value =
    hotspot.title || "";


  descriptionInput.value =
    hotspot.description || "";


  /*
    V editorju dialog nima reader description.
  */

  popup.removeAttribute(
    "aria-describedby"
  );


  popup.setAttribute(
    "aria-label",
    "Urejanje hotspota"
  );


  reader.style.display =
    "none";


  editor.style.display =
    "block";


  popup.style.display =
    "block";


  popup.style.visibility =
    "visible";


  positionPopup();


  /*
    Na računalniku fokusiramo prvo polje.
    Na telefonu tega ne naredimo avtomatsko,
    da se tipkovnica ne odpre sama.
  */

  const isTouchDevice =
    navigator.maxTouchPoints > 0;


  if(!isTouchDevice){

    requestAnimationFrame(
      ()=>{

        titleInput.focus({
          preventScroll:true
        });

      }
    );

  }

}


/* =========================================================
   POPUP BUTTONS
========================================================= */

popupClose.addEventListener(
  "click",
  closePopup
);


editBtn.addEventListener(
  "click",
  ()=>{

    if(selectedHotspotId){

      openEditor(
        selectedHotspotId
      );

    }

  }
);


saveBtn.addEventListener(
  "click",
  ()=>{

    const hotspot =
      getHotspot(
        selectedHotspotId
      );


    if(!hotspot){
      return;
    }


    hotspot.title =
      titleInput.value.trim();


    hotspot.description =
      descriptionInput.value.trim();


    saveHotspots();


    renderHotspots();


    /*
      Po Shrani se vrnemo v reader.
    */

    popup.removeAttribute(
      "aria-label"
    );


    openReader(
      hotspot.id
    );

  }
);


cancelBtn.addEventListener(
  "click",
  ()=>{

    const hotspot =
      getHotspot(
        selectedHotspotId
      );


    popup.removeAttribute(
      "aria-label"
    );


    if(
      hotspot &&
      (
        hotspot.title ||
        hotspot.description
      )
    ){

      openReader(
        hotspot.id
      );

    }
    else{

      closePopup();

    }

  }
);


deleteBtn.addEventListener(

    if(!selectedHotspotId){

    hotspots =

/* =========================================================
   KEYBOARD ACCESSIBILITY
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    /*
      ESC zapre normalni reader/editor.
    */

    if(
      event.key === "Escape" &&
      popup.style.display !==
        "none"
    ){

      event.preventDefault();

      closePopup();

      return;

    }


    /*
      Če je dialog odprt, zadržimo TAB znotraj njega.
    */

    if(
      event.key !== "Tab" ||
      popup.style.display ===
        "none"
    ){

      return;

    }


    const focusable =
      [...popup.querySelectorAll(
        "button:not([disabled]), input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])"
      )]
      .filter(
        element =>
          element.offsetParent !== null
      );


    if(!focusable.length){
      return;
    }


    const first =
      focusable[0];


    const last =
      focusable[
        focusable.length-1
      ];


    if(
      event.shiftKey &&
      document.activeElement === first
    ){

      event.preventDefault();

      last.focus();

    }
    else if(
      !event.shiftKey &&
      document.activeElement === last
    ){

      event.preventDefault();

      first.focus();

    }

  }
);


/* =========================================================
   POPUP POSITION
========================================================= */

function positionPopup(){

  if(
    !selectedHotspotId ||
    popup.style.display === "none" ||
    scene.is("vr-mode")
  ){
    return;
  }


  const marker =
    [...hotspotContainer.children]
      .find(
        element =>
          element.dataset.hotspotId ===
          selectedHotspotId
      );


  if(
    !marker ||
    !marker.object3D ||
    !scene.camera
  ){
    return;
  }


  const worldPosition =
    new THREE.Vector3();


  marker.object3D.getWorldPosition(
    worldPosition
  );


  const cameraPosition =
    new THREE.Vector3();


  scene.camera.getWorldPosition(
    cameraPosition
  );


  const cameraDirection =
    new THREE.Vector3();


  scene.camera.getWorldDirection(
    cameraDirection
  );


  const markerDirection =
    worldPosition
      .clone()
      .sub(
        cameraPosition
      )
      .normalize();


  if(
    cameraDirection.dot(
      markerDirection
    ) <= 0
  ){

    popup.style.visibility =
      "hidden";

    return;

  }


  popup.style.visibility =
    "visible";


  worldPosition.project(
    scene.camera
  );


  const x =
    (
      worldPosition.x+1
    ) *
    0.5 *
    innerWidth;


  const y =
    (
      -worldPosition.y+1
    ) *
    0.5 *
    innerHeight;


  const width =
    popup.offsetWidth;


  const height =
    popup.offsetHeight;


  let left;


  if(
    x <
    innerWidth/2
  ){

    left =
      x+28;

  }
  else{

    left =
      x-width-28;

  }


  let top =
    y-height/2;


  left =
    THREE.MathUtils.clamp(
      left,
      8,
      innerWidth-width-8
    );


  top =
    THREE.MathUtils.clamp(
      top,
      8,
      innerHeight-height-8
    );


  popup.style.left =
    left+"px";


  popup.style.top =
    top+"px";

}

/* =========================================================
   POINTER HOTSPOT PLACEMENT
========================================================= */

let sceneCanvas =
  null;


let pointerTracking =
  false;


let pointerStartX =
  0;


let pointerStartY =
  0;


let pointerStartTime =
  0;


let pointerWasDrag =
  false;


const TAP_MOVE_LIMIT =
  14;


const TAP_TIME_LIMIT =
  650;


/* =========================================================
   CREATE HOTSPOT
========================================================= */

function createHotspotAtScreenPoint(
  clientX,
  clientY
){

  if(
    !sceneCanvas ||
    !scene.camera
  ){
    return;
  }


  const rect =
    sceneCanvas.getBoundingClientRect();


  if(
    clientX < rect.left ||
    clientX > rect.right ||
    clientY < rect.top ||
    clientY > rect.bottom
  ){
    return;
  }


  const ndc =
    new THREE.Vector2(

      (
        (
          clientX -
          rect.left
        ) /
        rect.width
      ) *
      2 -
      1,

      -(
        (
          clientY -
          rect.top
        ) /
        rect.height
      ) *
      2 +
      1

    );


  const raycaster =
    new THREE.Raycaster();


  raycaster.setFromCamera(
    ndc,
    scene.camera
  );


  const direction =
    raycaster
      .ray
      .direction
      .clone()
      .normalize();


  const spherical =
    vectorToSpherical(
      direction
    );


  const hotspot = {

    id:
      "hs-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2,7),

    yaw:
      spherical.yaw,

    pitch:
      spherical.pitch,

    title:"",

    description:""

  };


  hotspots.push(
    hotspot
  );


  saveHotspots();


  renderHotspots();


  stopAddMode();


  requestAnimationFrame(
    ()=>{

      requestAnimationFrame(
        ()=>{

          openEditor(
            hotspot.id
          );

        }
      );

    }
  );

}


/* =========================================================
   POINTER EVENTS
========================================================= */

function installPointerControls(){

  sceneCanvas =
    scene.canvas;


  if(!sceneCanvas){
    return;
  }


  sceneCanvas.addEventListener(
    "pointerdown",
    event=>{

      if(
        !addMode ||
        scene.is(
          "vr-mode"
        )
      ){
        return;
      }


      if(
        event.pointerType === "mouse" &&
        event.button !== 0
      ){
        return;
      }


      pointerTracking =
        true;


      pointerWasDrag =
        false;


      pointerStartX =
        event.clientX;


      pointerStartY =
        event.clientY;


      pointerStartTime =
        performance.now();

    },
    true
  );


  sceneCanvas.addEventListener(
    "pointermove",
    event=>{

      if(
        !pointerTracking ||
        !addMode
      ){
        return;
      }


      const distance =
        Math.hypot(

          event.clientX -
          pointerStartX,

          event.clientY -
          pointerStartY

        );


      if(
        distance >
        TAP_MOVE_LIMIT
      ){

        pointerWasDrag =
          true;

      }

    },
    true
  );


  sceneCanvas.addEventListener(
    "pointercancel",
    ()=>{

      pointerTracking =
        false;


      pointerWasDrag =
        false;

    },
    true
  );


  sceneCanvas.addEventListener(
    "pointerup",
    event=>{

      if(
        !pointerTracking
      ){
        return;
      }


      pointerTracking =
        false;


      if(
        !addMode ||
        scene.is(
          "vr-mode"
        )
      ){
        return;
      }


      const duration =
        performance.now() -
        pointerStartTime;


      const distance =
        Math.hypot(

          event.clientX -
          pointerStartX,

          event.clientY -
          pointerStartY

        );


      if(
        pointerWasDrag ||
        distance >
        TAP_MOVE_LIMIT ||
        duration >
        TAP_TIME_LIMIT
      ){

        pointerWasDrag =
          false;

        return;

      }


      pointerWasDrag =
        false;


      createHotspotAtScreenPoint(
        event.clientX,
        event.clientY
      );

    },
    true
  );

}


/* =========================================================
   ZOOM
========================================================= */

let normalFov =
  80;


function setFov(value){

  normalFov =
    THREE.MathUtils.clamp(
      value,
      35,
      100
    );


  if(
    camera &&
    camera.components &&
    camera.components.camera &&
    camera.components.camera.camera
  ){

    const threeCamera =
      camera
        .components
        .camera
        .camera;


    threeCamera.fov =
      normalFov;


    threeCamera.updateProjectionMatrix();

  }

}


zoomInBtn.addEventListener(
  "click",
  ()=>{

    setFov(
      normalFov-8
    );

  }
);


zoomOutBtn.addEventListener(
  "click",
  ()=>{

    setFov(
      normalFov+8
    );

  }
);


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener(
  "click",
  async ()=>{

    try{

      if(
        !document.fullscreenElement
      ){

        if(
          document.documentElement
            .requestFullscreen
        ){

          await document
            .documentElement
            .requestFullscreen();

        }

      }
      else if(
        document.exitFullscreen
      ){

        await document
          .exitFullscreen();

      }

    }
    catch(e){}

  }
);


/* =========================================================
   VR INFO CARD
========================================================= */

function hideVRInfo(){

  vrInfo.setAttribute(
    "visible",
    false
  );


  /*
    Če je bil X obarvan zaradi gaze,
    ga ponastavimo.
  */

  vrCloseButton.setAttribute(
    "color",
    "#222222"
  );


  reticle.setAttribute(
    "material",
    "color",
    "#ffffff"
  );

}


function showVRInfo(id){

  const hotspot =
    getHotspot(id);


  if(!hotspot){
    return;
  }


  vrInfoTitle.setAttribute(
    "value",
    hotspot.title ||
    "Brez naslova"
  );


  vrInfoDescription.setAttribute(
    "value",
    hotspot.description ||
    "Ni opisa."
  );


  if(!scene.camera){
    return;
  }


  const cameraPosition =
    new THREE.Vector3();


  const direction =
    new THREE.Vector3();


  scene.camera.getWorldPosition(
    cameraPosition
  );


  scene.camera.getWorldDirection(
    direction
  );


  /*
    Kartica 2.6 m pred uporabnikom.
  */

  const position =
    cameraPosition
      .clone()
      .add(

        direction
          .clone()
          .multiplyScalar(
            2.6
          )

      );


  vrInfo.object3D.position.copy(
    position
  );


  vrInfo.object3D.lookAt(
    cameraPosition
  );


  vrInfo.setAttribute(
    "visible",
    true
  );

}


/* =========================================================
   VR CLOSE X

   Pogled v X sproži A-Frame fuse click po 1.2 sekunde.
========================================================= */

vrCloseButton.addEventListener(
  "fusing",

    );

);


vrCloseButton.addEventListener(

/* =========================================================
   GAZE HOTSPOTS
========================================================= */

reticle.addEventListener(
  "fusing",
  event=>{

    reticle.setAttribute(
      "material",
      "color",
      "#22c55e"
    );

  }
);


reticle.addEventListener(
  "mouseleave",
  ()=>{

    reticle.setAttribute(
      "material",
      "color",
      "#ffffff"
    );

  }
);


reticle.addEventListener(
  "click",
  event=>{

    if(
      !scene.is(
        "vr-mode"
      )
    ){
      return;
    }


    const target =
      event.detail &&
      event.detail.intersectedEl;


    if(!target){
      return;
    }


    /*
      CLOSE X
    */

    if(
      target.classList.contains(
        "vr-close"
      )
    ){

      hideVRInfo();

      return;

    }


    /*
      HOTSPOT
    */

    if(
      target.classList.contains(
        "hotspot"
      )
    ){

      showVRInfo(
        target.dataset.hotspotId
      );

    }

  }
);


/* =========================================================
   WAKE LOCK
========================================================= */

let wakeLock =
  null;


async function acquireWakeLock(){

  if(
    !(
      "wakeLock" in
      navigator
    )
  ){
    return;
  }


  try{

    if(
      wakeLock &&
      !wakeLock.released
    ){
      return;
    }


    wakeLock =
      await navigator
        .wakeLock
        .request(
          "screen"
        );


    wakeLock.addEventListener(
      "release",
      ()=>{

        wakeLock =
          null;

      }
    );

  }
  catch(e){}

}


async function releaseWakeLock(){

  if(!wakeLock){
    return;
  }


  try{

    await wakeLock.release();

  }
  catch(e){}


  wakeLock =
    null;

}


/* =========================================================
   CARDBOARD
========================================================= */

vrBtn.addEventListener(
  "click",
  ()=>{

    closePopup();

    stopAddMode();


    vrStart.style.display =
      "flex";


    startVRBtn.focus();

  }
);


cancelVRBtn.addEventListener(
  "click",
  ()=>{

    vrStart.style.display =
      "none";


    vrBtn.focus();

  }
);


startVRBtn.addEventListener(
  "click",
  async ()=>{

    /*
      iOS motion permission.
    */

    if(
      typeof DeviceOrientationEvent !==
        "undefined" &&

      typeof DeviceOrientationEvent
        .requestPermission ===
        "function"
    ){

      try{

        const permission =
          await DeviceOrientationEvent
            .requestPermission();


        if(
          permission !==
          "granted"
        ){

          alert(
            "Dovoljenje za senzor gibanja ni bilo odobreno."
          );

          return;

        }

      }
      catch(e){

        return;

      }

    }


    vrStart.style.display =
      "none";


    /*
      Landscape.
    */

    try{

      if(
        screen.orientation &&
        screen.orientation.lock
      ){

        await screen.orientation.lock(
          "landscape"
        );

      }

    }
    catch(e){}


    /*
      A-FRAME PREVZAME CARDBOARD.
    */

    try{

      await scene.enterVR();

    }
    catch(e){

      alert(
        "Brskalnik ni uspel zagnati VR načina."
      );

    }

  }
);


/* =========================================================
   ENTER VR
========================================================= */

scene.addEventListener(
  "enter-vr",
  async ()=>{

    stopAddMode();

    closePopup();


    toolbar.style.display =
      "none";


    hint.style.display =
      "none";


    hideVRInfo();


    await acquireWakeLock();


    checkOrientation();

  }
);


/* =========================================================
   EXIT VR
========================================================= */

scene.addEventListener(
  "exit-vr",
  async ()=>{

    toolbar.style.display =
      "flex";


    rotateWarning.style.display =
      "none";


    hideVRInfo();


    await releaseWakeLock();


    try{

      if(
        screen.orientation &&
        screen.orientation.unlock
      ){

        screen.orientation.unlock();

      }

    }
    catch(e){}

  }
);


/* =========================================================
   ORIENTATION
========================================================= */

function checkOrientation(){

  if(
    !scene.is(
      "vr-mode"
    )
  ){

    rotateWarning.style.display =
      "none";

    return;

  }


  if(
    innerHeight >
    innerWidth
  ){

    rotateWarning.style.display =
      "flex";

  }
  else{

    rotateWarning.style.display =
      "none";

  }

}


window.addEventListener(
  "resize",
  checkOrientation
);


window.addEventListener(
  "orientationchange",
  ()=>{

    setTimeout(
      checkOrientation,
      300
    );

  }
);


/* =========================================================
   WAKE LOCK RETURN
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState ===
        "visible" &&

      scene.is(
        "vr-mode"
      )
    ){

      acquireWakeLock();

    }

  }
);


/* =========================================================
   SCENE READY
========================================================= */

scene.addEventListener(
  "loaded",
  ()=>{

    renderHotspots();


    installPointerControls();


    setFov(
      normalFov
    );


    /*
      Desktop mouse wheel zoom.
    */

    if(scene.canvas){

      scene.canvas.addEventListener(
        "wheel",
        event=>{

          if(
            scene.is(
              "vr-mode"
            )
          ){
            return;
          }


          event.preventDefault();


          setFov(

            normalFov +

            (
              event.deltaY > 0
                ? 4
                : -4
            )

          );

        },

        {
          passive:false
        }
      );

    }

  }
);


/* =========================================================
   UI LOOP
========================================================= */

function uiLoop(){

  requestAnimationFrame(
    uiLoop
  );


  if(
    !scene.is(
      "vr-mode"
    )
  ){

    positionPopup();

  }

}


uiLoop();
