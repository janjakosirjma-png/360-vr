<body>

<div id="app">

    <canvas id="canvas"></canvas>

    <div id="spots"></div>

    <video
        id="video"
        playsinline
        webkit-playsinline
        preload="auto"
        crossorigin="anonymous">
    </video>

</div>


<div id="startScreen">

    <div class="startBox">

        <h1>360° VIDEO</h1>

        <p>
            Video je shranjen na Dropboxu.
            Klikni spodaj za začetek ogleda.
        </p>

        <button id="startButton">
            Odpri 360° video
        </button>

    </div>

</div>


<div id="hint" style="display:none">
    Povleci po zaslonu za obračanje pogleda
</div>


<div id="controls" style="display:none">

    <button

    </button>

        type="range"

    </span>

    </button>

</div>


<div id="info">

    <button id="closeInfo">×</button>

    <h2 id="infoTitle"></h2>

    <p id="infoDescription"></p>

</div>


<div id="error"></div>


<script>

/* ============================================================
   DROPBOX VIDEO

   To je DIREKTNA povezava, ki si jo preverila na telefonu.
   ============================================================ */

const VIDEO_URL =
"https://dl.dropboxusercontent.com/scl/fi/k2d27e55jfolq551mclgz/VID_20251019_174611_00_003-2.mp4?rlkey=1k1g0dxr932r3gswj0eke07jy";


/* ============================================================
   TOČKE

   Zaenkrat so tri testne točke.

   yaw   = levo/desno
   pitch = gor/dol
   start = kdaj se pojavi
   end   = kdaj izgine
   ============================================================ */

const HOTSPOTS = [

    {
        title: "Točka 1",
        description: "To je prva testna točka.",
        yaw: 0,
        pitch: 0,
        start: 0,
        end: 15
    },

    {
        title: "Točka 2",
        description: "Druga testna informacija.",
        yaw: 1.0,
        pitch: 0,
        start: 5,
        end: 30
    },

    {
        title: "Točka 3",
        description: "Tretja testna točka.",
        yaw: -1.0,
        pitch: 0.15,
        start: 10,
        end: 60
    }

];


/* ============================================================
   ELEMENTI
   ============================================================ */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });

const spots =
    document.getElementById("spots");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const controls =
    document.getElementById("controls");

const hint =
    document.getElementById("hint");

const playButton =
    document.getElementById("play");

const muteButton =
    document.getElementById("mute");

const seek =
    document.getElementById("seek");

const timeLabel =
    document.getElementById("time");

const info =
    document.getElementById("info");

const infoTitle =
    document.getElementById("infoTitle");

const infoDescription =
    document.getElementById("infoDescription");

const closeInfo =
    document.getElementById("closeInfo");

const errorBox =
    document.getElementById("error");


/* ============================================================
   360° PARAMETRI
   ============================================================ */

const RAD =
    Math.PI / 180;

let yaw = 0;
let pitch = 0;

let fov = 80;

let ready = false;

let sourceCanvas = null;
let sourceContext = null;

let dragging = false;

let dragStartX = 0;
let dragStartY = 0;

let dragStartYaw = 0;
let dragStartPitch = 0;

let lastFrame = 0;


/* ============================================================
   POMOŽNE FUNKCIJE
   ============================================================ */

function clamp(value, minimum, maximum) {

    return Math.min(
        maximum,
        Math.max(minimum, value)
    );
}


function formatTime(seconds) {

    if (!Number.isFinite(seconds))
        return "0:00";

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        minutes +
        ":" +
        String(secs).padStart(2, "0")
    );
}


function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";
}


/* ============================================================
   VELIKOST CANVASA
   ============================================================ */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    /*
       Manjša interna resolucija je namenoma uporabljena,
       ker je ta način 360° prikaza precej zahteven za telefon.
    */

    const scale =
        Math.min(
            1,
            720 / Math.max(1, rect.width),
            520 / Math.max(1, rect.height)
        );

    canvas.width =
        Math.max(
            1,
            Math.round(rect.width * scale)
        );

    canvas.height =
        Math.max(
            1,
            Math.round(rect.height * scale)
        );

    render360();
}


/* ============================================================
   360° RENDER
   ============================================================ */

function render360() {

    if (!ready)
        return;

    if (video.readyState < 2)
        return;

    try {

        sourceContext.drawImage(
            video,
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
        );


        const sourceImage =
            sourceContext.getImageData(
                0,
                0,
                sourceCanvas.width,
                sourceCanvas.height
            );


        const src =
            sourceImage.data;


        const width =
            canvas.width;

        const height =
            canvas.height;


        const output =
            ctx.createImageData(
                width,
                height
            );


        const dst =
            output.data;


        const aspect =
            width / height;


        const perspective =
            Math.tan(
                fov * RAD / 2
            );


        const cosPitch =
            Math.cos(pitch);

        const sinPitch =
            Math.sin(pitch);


        const cosYaw =
            Math.cos(yaw);

        const sinYaw =
            Math.sin(yaw);


        for (
            let screenY = 0;
            screenY < height;
            screenY++
        ) {

            const viewY =
                (
                    1 -
                    2 *
                    (screenY + 0.5) /
                    height
                )
                *
                perspective;


            for (
                let screenX = 0;
                screenX < width;
                screenX++
            ) {

                const viewX =
                    (
                        2 *
                        (screenX + 0.5) /
                        width
                        -
                        1
                    )
                    *
                    aspect
                    *
                    perspective;


                const rotatedY =
                    viewY * cosPitch
                    +
                    sinPitch;


                const rotatedZ =
                    -viewY * sinPitch
                    +
                    cosPitch;


                const worldX =
                    viewX * cosYaw
                    +
                    rotatedZ * sinYaw;


                const worldZ =
                    -viewX * sinYaw
                    +
                    rotatedZ * cosYaw;


                const inverseLength =
                    1 /
                    Math.hypot(
                        worldX,
                        rotatedY,
                        worldZ
                    );


                const u =
                    Math.atan2(
                        worldX,
                        worldZ
                    )
                    /
                    (2 * Math.PI)
                    +
                    0.5;


                const v =
                    0.5
                    -
                    Math.asin(
                        clamp(
                            rotatedY *
                            inverseLength,
                            -1,
                            1
                        )
                    )
                    /
                    Math.PI;


                const sourceX =
                    Math.min(
                        sourceCanvas.width - 1,
                        Math.max(
                            0,
                            Math.floor(
                                u *
                                sourceCanvas.width
                            )
                        )
                    );


                const sourceY =
                    Math.min(
                        sourceCanvas.height - 1,
                        Math.max(
                            0,
                            Math.floor(
                                v *
                                sourceCanvas.height
                            )
                        )
                    );


                const sourceIndex =
                    (
                        sourceY *
                        sourceCanvas.width
                        +
                        sourceX
                    )
                    *
                    4;


                const destinationIndex =
                    (
                        screenY *
                        width
                        +
                        screenX
                    )
                    *
                    4;


                dst[destinationIndex] =
                    src[sourceIndex];

                dst[destinationIndex + 1] =
                    src[sourceIndex + 1];

                dst[destinationIndex + 2] =
                    src[sourceIndex + 2];

                dst[destinationIndex + 3] =
                    255;
            }
        }


        ctx.putImageData(
            output,
            0,
            0
        );


        renderHotspots();

    }

    catch (error) {

        console.error(error);

        ready = false;

        showError(
            "Video se sicer naloži, vendar brskalnik ne dovoli " +
            "360° obdelave slike. Napaka: " +
            error.message
        );
    }
}


/* ============================================================
   ANIMACIJA
   ============================================================ */

function animationLoop(time) {

    if (
        ready &&
        !video.paused &&
        time - lastFrame > 85
    ) {

        render360();

        lastFrame = time;
    }

    requestAnimationFrame(
        animationLoop
    );
}


requestAnimationFrame(
    animationLoop
);


/* ============================================================
   POLOŽAJ TOČKE
   ============================================================ */

function projectHotspot(point) {

    const relativeYaw =
        point.yaw - yaw;


    const x =
        Math.sin(relativeYaw)
        *
        Math.cos(point.pitch);


    const y =
        Math.sin(point.pitch);


    const z =
        Math.cos(relativeYaw)
        *
        Math.cos(point.pitch);


    const cosPitch =
        Math.cos(pitch);

    const sinPitch =
        Math.sin(pitch);


    const rotatedY =
        y * cosPitch
        -
        z * sinPitch;


    const rotatedZ =
        y * sinPitch
        +
        z * cosPitch;


    if (rotatedZ <= 0.05)
        return null;


    const perspective =
        Math.tan(
            fov * RAD / 2
        );


    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    const aspect =
        width / height;


    const screenX =
        (
            x /
            rotatedZ /
            aspect /
            perspective
            +
            1
        )
        *
        width /
        2;


    const screenY =
        (
            1
            -
            rotatedY /
            rotatedZ /
            perspective
        )
        *
        height /
        2;


    if (
        screenX < 0 ||
        screenX > width ||
        screenY < 0 ||
        screenY > height
    ) {

        return null;
    }


    return [
        screenX,
        screenY
    ];
}


/* ============================================================
   PRIKAZ TOČK
   ============================================================ */

function renderHotspots() {

    spots.replaceChildren();


    for (const point of HOTSPOTS) {

        if (
            video.currentTime <
            point.start
            ||
            video.currentTime >
            point.end
        ) {

            continue;
        }


        const position =
            projectHotspot(point);


        if (!position)
            continue;


        const button =
            document.createElement("button");


        button.className =
            "spot";


        button.textContent =
            "i";


        button.style.left =
            position[0] + "px";


        button.style.top =
            position[1] + "px";


        button.onclick =
            event => {

                event.stopPropagation();

                video.pause();

                infoTitle.textContent =
                    point.title;

                infoDescription.textContent =
                    point.description;

                info.style.display =
                    "block";

                updateControls();
            };


        spots.appendChild(
            button
        );
    }
}


/* ============================================================
   PREMIKANJE POGLEDA
   ============================================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        dragging = true;

        dragStartX =
            event.clientX;

        dragStartY =
            event.clientY;

        dragStartYaw =
            yaw;

        dragStartPitch =
            pitch;

        canvas.setPointerCapture(
            event.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!dragging)
            return;


        const deltaX =
            event.clientX -
            dragStartX;


        const deltaY =
            event.clientY -
            dragStartY;


        yaw =
            dragStartYaw
            -
            deltaX /
            canvas.clientWidth
            *
            fov *
            RAD *
            1.7;


        pitch =
            clamp(
                dragStartPitch
                +
                deltaY /
                canvas.clientHeight
                *
                fov *
                RAD,
                -1.5,
                1.5
            );


        render360();
    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        dragging = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        dragging = false;
    }
);


/* ============================================================
   ZOOM NA RAČUNALNIKU
   ============================================================ */

canvas.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        if (event.deltaY > 0)
            fov += 5;
        else
            fov -= 5;


        fov =
            clamp(
                fov,
                35,
                105
            );


        render360();

    },
    {
        passive: false
    }
);


/* ============================================================
   VIDEO
   ============================================================ */

video.src =
    VIDEO_URL;


video.addEventListener(
    "loadeddata",
    () => {

        if (
            !video.videoWidth ||
            !video.videoHeight
        ) {

            showError(
                "Video se je naložil, vendar nima veljavne video slike."
            );

            return;
        }


        /*
           Ustvarimo manjšo kopijo video slike.
        */

        const maximumWidth =
            1536;


        const scale =
            Math.min(
                1,
                maximumWidth /
                video.videoWidth
            );


        sourceCanvas =
            document.createElement(
                "canvas"
            );


        sourceCanvas.width =
            Math.max(
                1,
                Math.floor(
                    video.videoWidth *
                    scale
                )
            );


        sourceCanvas.height =
            Math.max(
                1,
                Math.floor(
                    video.videoHeight *
                    scale
                )
            );


        sourceContext =
            sourceCanvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );


        ready = true;


        resizeCanvas();

        updateControls();
    }
);


video.addEventListener(
    "error",
    () => {

        showError(
            "Dropbox video se ni naložil."
        );
    }
);


/* ============================================================
   START
   ============================================================ */

startButton.addEventListener(
    "click",
    async () => {

        startScreen.style.display =
            "none";


        controls.style.display =
            "flex";


        hint.style.display =
            "block";


        /*
           Na telefonu video zaženemo šele po kliku
           uporabnika.
        */

        try {

            await video.play();

        }

        catch (error) {

            console.log(error);

            /*
               Tudi če autoplay ne uspe,
               lahko uporabnik pritisne PLAY.
            */

        }


        render360();

        updateControls();
    }
);


/* ============================================================
   PLAY
   ============================================================ */

playButton.addEventListener(
    "click",
    async () => {

        info.style.display =
            "none";


        if (video.paused) {

            try {

                await video.play();

            }

            catch (error) {

                showError(
                    "Videoposnetka ni mogoče zagnati: " +
                    error.message
                );
            }

        }

        else {

            video.pause();
        }


        updateControls();
    }
);


/* ============================================================
   MUTE
   ============================================================ */

muteButton.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        updateControls();
    }
);


/* ============================================================
   ČASOVNICA
   ============================================================ */

seek.addEventListener(
    "input",
    () => {

        if (!video.duration)
            return;


        video.currentTime =
            (
                Number(seek.value)
                /
                1000
            )
            *
            video.duration;


        render360();
    }
);


/* ============================================================
   KONTROLE
   ============================================================ */

function updateControls() {

    playButton.textContent =
        video.paused
        ? "▶"
        : "Ⅱ";


    muteButton.textContent =
        video.muted
        ? "🔇"
        : "🔊";


    timeLabel.textContent =
        formatTime(
            video.currentTime
        )
        +
        " / "
        +
        formatTime(
            video.duration
        );


    if (video.duration) {

        seek.value =
            Math.round(
                video.currentTime
                /
                video.duration
                *
                1000
            );
    }


    renderHotspots();
}


video.addEventListener(
    "timeupdate",
    updateControls
);


video.addEventListener(
    "play",
    updateControls
);


video.addEventListener(
    "pause",
    updateControls
);


video.addEventListener(
    "seeked",
    () => {

        render360();

        updateControls();
    }
);


/* ============================================================
   INFO
   ============================================================ */

closeInfo.addEventListener(
    "click",
    () => {

        info.style.display =
            "none";
    }
);


/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
</html>
