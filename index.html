<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>360° interaktivna tura</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#viewer{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* TOOLBAR */

#toolbar{
    position:fixed;
    z-index:100;
    top:8px;
    left:8px;
    right:8px;

    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;

    padding:8px;

    background:rgba(10,25,34,.92);
    border:1px solid rgba(255,255,255,.15);
    border-radius:11px;
}

.logo{
    color:white;
    font-weight:800;
    margin-right:5px;
}

.logo span{
    color:#59ddc0;
}

.spacer{
    flex:1;
}

button{
    border:0;
    border-radius:8px;

    padding:9px 11px;

    background:#294552;
    color:white;

    font-weight:700;
    cursor:pointer;
}

button.primary{
    background:#59ddc0;
    color:#06271f;
}

button.active{
    background:#ffd15b;
    color:#201800;
}

button.danger{
    background:#783c43;
}

/* NAVODILO */

#hint{
    position:fixed;
    z-index:80;

    top:70px;
    left:50%;
    transform:translateX(-50%);

    max-width:calc(100vw - 20px);

    padding:7px 11px;

    border-radius:8px;

    background:rgba(0,0,0,.72);
    color:white;

    text-align:center;
    font-size:12px;

    pointer-events:none;
}

/* EDITOR */

#backdrop{
    position:fixed;
    z-index:190;
    inset:0;

    display:none;

    background:rgba(0,0,0,.35);
}

#editor{
    position:fixed;
    z-index:200;

    top:80px;
    right:14px;

    width:340px;
    max-width:calc(100vw - 28px);

    display:none;

    padding:17px;

    background:#102833;
    color:white;

    border:1px solid #5a7885;
    border-radius:13px;

    box-shadow:0 15px 50px rgba(0,0,0,.55);
}

#editor h2{
    margin:0 0 13px;
}

label{
    display:block;
    margin-top:11px;

    font-size:12px;
    font-weight:bold;
    color:#c3d5dc;
}

input,textarea{
    width:100%;

    margin-top:5px;
    padding:10px;

    border:1px solid #58737f;
    border-radius:8px;

    background:#081a22;
    color:white;

    font:inherit;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.editorButtons{
    display:flex;
    gap:7px;
    margin-top:14px;
}

.editorButtons button{
    flex:1;
}

/* INFO POPUP */

#popup{
    position:fixed;
    z-index:180;

    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    width:min(460px,calc(100vw - 24px));

    display:none;

    padding:18px 48px 18px 18px;

    background:#102833;
    color:white;

    border:2px solid #59ddc0;
    border-radius:13px;

    box-shadow:0 15px 50px rgba(0,0,0,.55);
}

#popup h2{
    margin:0 0 8px;
}

#popup p{
    margin:0;
    line-height:1.5;
    white-space:pre-wrap;
}

#popupClose{
    position:absolute;
    right:6px;
    top:4px;

    background:transparent;
    font-size:25px;
}

/* STATUS */

#status{
    position:fixed;
    z-index:70;

    left:10px;
    bottom:10px;

    padding:6px 9px;

    border-radius:7px;

    background:rgba(0,0,0,.7);
    color:white;

    font-size:11px;
}

/* VR */

#vrUI{
    position:fixed;
    z-index:300;
    inset:0;

    display:none;
    pointer-events:none;
}

#vrDivider{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;

    width:1px;

    background:rgba(255,255,255,.15);
}

#exitVR{
    position:absolute;

    top:12px;
    left:50%;
    transform:translateX(-50%);

    pointer-events:auto;

    background:rgba(10,25,34,.92);
    border:1px solid rgba(255,255,255,.4);
}

#fileInput{
    display:none;
}

body.vrmode #toolbar,
body.vrmode #hint,
body.vrmode #status,
body.vrmode #editor,
body.vrmode #backdrop,
body.vrmode #popup{
    display:none!important;
}

@media(max-width:760px){

    #toolbar{
        top:5px;
        left:5px;
        right:5px;
    }

    .logo{
        width:100%;
        font-size:12px;
    }

    button{
        padding:8px;
        font-size:11px;
    }

    #hint{
        top:105px;
    }

    #editor{
        top:auto;
        left:7px;
        right:7px;
        bottom:7px;

        width:auto;
    }

    #status{
        display:none;
    }
}
</style>
</head>

<body>

<div id="viewer"></div>

<div id="toolbar">

    <div class="logo">
        360° <span>INTERAKTIVNA TURA</span>
    </div>

    <button id="modeBtn">👁 Ogled</button>

    <button id="addBtn" class="primary">
        ＋ Hotspot
    </button>

    <button id="resetBtn">
        ↻ Pogled
    </button>

    <div class="spacer"></div>

    <button id="gyroBtn">
        📱 Gyro
    </button>

    <button id="vrBtn">
        🥽 Telefon VR
    </button>

    <button id="fullscreenBtn">
        ⛶
    </button>

    <button id="exportBtn">
        Izvoz
    </button>

    <button id="importBtn">
        Uvoz
    </button>

</div>


<div id="hint">
    Povleci za obračanje • kolešček za zoom
</div>


<div id="backdrop"></div>


<div id="editor">

    <h2>Uredi hotspot</h2>

    <label>
        Ime
        <input
            id="titleInput"
            type="text"
            placeholder="Npr. Omara"
        >
    </label>

    <label>
        Opis
        <textarea
            id="descriptionInput"
            placeholder="Vnesi besedilo..."
        ></textarea>
    </label>

    <div class="editorButtons">

        <button id="saveBtn" class="primary">
            Shrani
        </button>

        <button id="deleteBtn" class="danger">
            Izbriši
        </button>

        <button id="cancelBtn">
            Zapri
        </button>

    </div>

</div>


<div id="popup">

    <button id="popupClose">×</button>

    <h2 id="popupTitle"></h2>

    <p id="popupText"></p>

</div>


<div id="status">
    Nalagam 360.jpg ...
</div>


<div id="vrUI">

    <div id="vrDivider"></div>

    <button id="exitVR">
        ✕ Izhod iz VR
    </button>

</div>


<input
    id="fileInput"
    type="file"
    accept=".json,application/json"
>


<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import { StereoEffect }
from "three/addons/effects/StereoEffect.js";


/* =====================================================
   ELEMENTI
===================================================== */

const viewer =
    document.getElementById("viewer");

const hint =
    document.getElementById("hint");

const statusBox =
    document.getElementById("status");

const editor =
    document.getElementById("editor");

const backdrop =
    document.getElementById("backdrop");

const titleInput =
    document.getElementById("titleInput");

const descriptionInput =
    document.getElementById("descriptionInput");

const popup =
    document.getElementById("popup");

const popupTitle =
    document.getElementById("popupTitle");

const popupText =
    document.getElementById("popupText");

const modeBtn =
    document.getElementById("modeBtn");

const addBtn =
    document.getElementById("addBtn");

const gyroBtn =
    document.getElementById("gyroBtn");

const vrBtn =
    document.getElementById("vrBtn");

const fileInput =
    document.getElementById("fileInput");


/* =====================================================
   THREE
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        200
    );


camera.position.set(
    0,
    0,
    0
);


camera.rotation.order =
    "YXZ";


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);


renderer.setSize(
    innerWidth,
    innerHeight
);


viewer.appendChild(
    renderer.domElement
);


/* =====================================================
   STEREO VR
===================================================== */

const stereo =
    new StereoEffect(renderer);


stereo.setEyeSeparation(
    0.064
);


stereo.setSize(
    innerWidth,
    innerHeight
);


/* =====================================================
   PANORAMA
===================================================== */

let panorama = null;


const geometry =
    new THREE.SphereGeometry(
        100,
        64,
        40
    );


geometry.scale(
    -1,
    1,
    1
);


const loader =
    new THREE.TextureLoader();


loader.load(

    "./360.jpg",

    texture => {

        texture.colorSpace =
            THREE.SRGBColorSpace;


        const material =
            new THREE.MeshBasicMaterial({
                map:texture
            });


        panorama =
            new THREE.Mesh(
                geometry,
                material
            );


        scene.add(
            panorama
        );


        statusBox.textContent =
            "360.jpg ✓";

    },

    progress => {

        if (
            progress.total &&
            progress.loaded
        ){

            const percent =
                Math.round(
                    progress.loaded /
                    progress.total *
                    100
                );


            statusBox.textContent =
                "Nalagam: " +
                percent +
                "%";
        }

    },

    error => {

        console.error(
            "NAPAKA 360.jpg:",
            error
        );


        statusBox.textContent =
            "360.jpg NI NALOŽENA";


        alert(
            "360.jpg se ni naložila.\n\n" +
            "Preveri, da sta index.html in 360.jpg " +
            "v isti mapi in da je ime slike TOČNO: 360.jpg"
        );

    }

);


/* =====================================================
   POGLED
===================================================== */

let lon = 0;
let lat = 0;

let gyroEnabled = false;
let phoneVR = false;

let sensorAlpha = null;
let sensorBeta = null;
let sensorGamma = null;


/* =====================================================
   MIŠKA / DOTIK
===================================================== */

let dragging = false;

let startX = 0;
let startY = 0;

let startLon = 0;
let startLat = 0;

let moved = false;


renderer.domElement.addEventListener(

    "pointerdown",

    event => {

        if (phoneVR)
            return;


        dragging = true;

        moved = false;

        startX =
            event.clientX;

        startY =
            event.clientY;

        startLon =
            lon;

        startLat =
            lat;


        renderer.domElement
            .setPointerCapture?.(
                event.pointerId
            );

    }

);


renderer.domElement.addEventListener(

    "pointermove",

    event => {

        if (
            !dragging ||
            gyroEnabled ||
            phoneVR
        )
            return;


        const dx =
            event.clientX -
            startX;

        const dy =
            event.clientY -
            startY;


        if (
            Math.abs(dx) > 4 ||
            Math.abs(dy) > 4
        ){
            moved = true;
        }


        lon =
            startLon -
            dx * 0.12;


        lat =
            startLat +
            dy * 0.12;


        lat =
            Math.max(
                -85,
                Math.min(
                    85,
                    lat
                )
            );

    }

);


renderer.domElement.addEventListener(

    "pointerup",

    event => {

        if (phoneVR)
            return;


        dragging = false;


        if (!moved){

            handleClick(
                event
            );

        }

    }

);


/* =====================================================
   ZOOM
===================================================== */

renderer.domElement.addEventListener(

    "wheel",

    event => {

        event.preventDefault();


        camera.fov +=
            event.deltaY * 0.04;


        camera.fov =
            THREE.MathUtils.clamp(
                camera.fov,
                35,
                95
            );


        camera.updateProjectionMatrix();

    },

    { passive:false }

);


/* =====================================================
   HOTSPOTI
===================================================== */

const STORAGE_KEY =
    "360-tour-hotspots-v5";


let hotspots = [];

let hotspotSprites = [];

let selectedId = null;

let adding = false;

let editing = true;


const hotspotGroup =
    new THREE.Group();


scene.add(
    hotspotGroup
);


/* =====================================================
   HOTSPOT IKONA
===================================================== */

function makeHotspotTexture(){

    const c =
        document.createElement(
            "canvas"
        );


    c.width =
        256;

    c.height =
        256;


    const ctx =
        c.getContext("2d");


    ctx.beginPath();

    ctx.arc(
        128,
        128,
        92,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.4)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        128,
        128,
        78,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "white";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        128,
        128,
        67,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffd15b";

    ctx.fill();


    ctx.fillStyle =
        "#14252c";

    ctx.font =
        "bold 100px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "i",
        128,
        134
    );


    return new THREE.CanvasTexture(
        c
    );

}


const hotspotTexture =
    makeHotspotTexture();


/* =====================================================
   SHRANI
===================================================== */

function saveHotspots(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            hotspots
        )
    );

}


function loadHotspots(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved)
            return;


        const data =
            JSON.parse(saved);


        if (Array.isArray(data))
            hotspots = data;

    }
    catch(error){

        console.error(error);

    }

}


/* =====================================================
   NARIŠI HOTSPOTE
===================================================== */

function rebuildHotspots(){

    hotspotGroup.clear();

    hotspotSprites = [];


    hotspots.forEach(
        point => {

            const direction =
                new THREE.Vector3(
                    point.x,
                    point.y,
                    point.z
                )
                .normalize();


            const material =
                new THREE.SpriteMaterial({

                    map:
                        hotspotTexture,

                    transparent:
                        true,

                    depthTest:
                        false,

                    depthWrite:
                        false

                });


            const sprite =
                new THREE.Sprite(
                    material
                );


            sprite.position
                .copy(direction)
                .multiplyScalar(90);


            /*
               Večja ikona = lažji klik
               tudi na telefonu.
            */

            sprite.scale.set(
                9,
                9,
                1
            );


            sprite.userData.hotspotId =
                point.id;


            sprite.renderOrder =
                100;


            hotspotGroup.add(
                sprite
            );


            hotspotSprites.push(
                sprite
            );

        }

    );

}


/* =====================================================
   RAYCAST
===================================================== */

const raycaster =
    new THREE.Raycaster();


const mouse =
    new THREE.Vector2();


function handleClick(event){

    const rect =
        renderer.domElement
            .getBoundingClientRect();


    mouse.x =
        (
            (
                event.clientX -
                rect.left
            )
            /
            rect.width
        )
        * 2 - 1;


    mouse.y =
        -
        (
            (
                event.clientY -
                rect.top
            )
            /
            rect.height
        )
        * 2 + 1;


    raycaster.setFromCamera(
        mouse,
        camera
    );


    /* -----------------------------------------
       NAJPREJ PREVERI OBSTOJEČ HOTSPOT
    ----------------------------------------- */

    const spotHits =
        raycaster.intersectObjects(
            hotspotSprites,
            false
        );


    if (spotHits.length){

        const id =
            spotHits[0]
                .object
                .userData
                .hotspotId;


        const point =
            hotspots.find(
                h => h.id === id
            );


        if (!point)
            return;


        selectedId =
            id;


        adding =
            false;


        addBtn.classList.remove(
            "active"
        );


        if (editing){

            openEditor(
                point
            );

        }
        else{

            openPopup(
                point
            );

        }


        return;

    }


    /* -----------------------------------------
       NOV HOTSPOT
    ----------------------------------------- */

    if (!adding)
        return;


    if (!panorama)
        return;


    const hits =
        raycaster.intersectObject(
            panorama,
            false
        );


    if (!hits.length)
        return;


    const direction =
        hits[0]
            .point
            .clone()
            .normalize();


    const point = {

        id:
            Date.now().toString(36)
            +
            Math.random()
                .toString(36)
                .slice(2),

        title:
            "",

        description:
            "",

        x:
            direction.x,

        y:
            direction.y,

        z:
            direction.z

    };


    hotspots.push(
        point
    );


    selectedId =
        point.id;


    adding =
        false;


    addBtn.classList.remove(
        "active"
    );


    saveHotspots();

    rebuildHotspots();


    /*
       TAKOJ ODPRE OKNO.
    */

    openEditor(
        point
    );

}


/* =====================================================
   EDITOR
===================================================== */

function openEditor(point){

    selectedId =
        point.id;


    titleInput.value =
        point.title || "";


    descriptionInput.value =
        point.description || "";


    backdrop.style.display =
        "block";


    editor.style.display =
        "block";

}


function closeEditor(){

    backdrop.style.display =
        "none";


    editor.style.display =
        "none";

}


document.getElementById("saveBtn")
.addEventListener(

    "click",

    () => {

        const point =
            hotspots.find(
                h =>
                    h.id === selectedId
            );


        if (!point)
            return;


        point.title =
            titleInput.value.trim()
            ||
            "Hotspot";


        point.description =
            descriptionInput.value.trim();


        saveHotspots();

        rebuildHotspots();

        closeEditor();


        hint.textContent =
            "Hotspot shranjen ✓";


        setTimeout(
            defaultHint,
            1300
        );

    }

);


document.getElementById("deleteBtn")
.addEventListener(

    "click",

    () => {

        hotspots =
            hotspots.filter(
                h =>
                    h.id !== selectedId
            );


        selectedId =
            null;


        saveHotspots();

        rebuildHotspots();

        closeEditor();


        defaultHint();

    }

);


document.getElementById("cancelBtn")
.addEventListener(

    "click",
    closeEditor

);


backdrop.addEventListener(

    "click",
    closeEditor

);


/* =====================================================
   INFO POPUP
===================================================== */

function openPopup(point){

    popupTitle.textContent =
        point.title ||
        "Hotspot";


    popupText.textContent =
        point.description ||
        "Ni dodatnega opisa.";


    popup.style.display =
        "block";

}


document.getElementById("popupClose")
.addEventListener(

    "click",

    () => {

        popup.style.display =
            "none";

    }

);


/* =====================================================
   DODAJ HOTSPOT
===================================================== */

addBtn.addEventListener(

    "click",

    () => {

        if (!editing){

            editing = true;

            updateMode();

        }


        adding =
            !adding;


        addBtn.classList.toggle(
            "active",
            adding
        );


        if (adding){

            hint.textContent =
                "Klikni predmet, kamor želiš postaviti hotspot";

        }
        else{

            defaultHint();

        }

    }

);


/* =====================================================
   OGLED / UREJANJE
===================================================== */

function defaultHint(){

    if (editing){

        hint.textContent =
            "Urejanje • + Hotspot za novo točko • klik na rumeno točko za urejanje";

    }
    else{

        hint.textContent =
            "Ogled • klikni rumeno točko za informacije";

    }

}


function updateMode(){

    adding = false;


    addBtn.classList.remove(
        "active"
    );


    closeEditor();


    popup.style.display =
        "none";


    if (editing){

        modeBtn.textContent =
            "👁 Ogled";


        addBtn.style.display =
            "";

    }
    else{

        modeBtn.textContent =
            "✏️ Urejanje";


        addBtn.style.display =
            "none";

    }


    defaultHint();

}


modeBtn.addEventListener(

    "click",

    () => {

        editing =
            !editing;


        updateMode();

    }

);


/* =====================================================
   RESET
===================================================== */

document.getElementById("resetBtn")
.addEventListener(

    "click",

    () => {

        gyroEnabled =
            false;


        gyroBtn.classList.remove(
            "active"
        );


        gyroBtn.textContent =
            "📱 Gyro";


        lon = 0;
        lat = 0;


        camera.fov =
            75;


        camera.updateProjectionMatrix();

    }

);


/* =====================================================
   GYROSCOPE

   Brez DeviceOrientationControls importa.
===================================================== */

window.addEventListener(

    "deviceorientation",

    event => {

        if (
            event.alpha === null
        )
            return;


        sensorAlpha =
            event.alpha || 0;

        sensorBeta =
            event.beta || 0;

        sensorGamma =
            event.gamma || 0;

    },

    true

);


/* Pretvorba orientacije telefona v kamero */

const zee =
    new THREE.Vector3(
        0,
        0,
        1
    );


const euler =
    new THREE.Euler();


const q0 =
    new THREE.Quaternion();


const q1 =
    new THREE.Quaternion(
        -Math.sqrt(0.5),
        0,
        0,
        Math.sqrt(0.5)
    );


function updateGyroCamera(){

    if (
        sensorAlpha === null
    )
        return;


    const alpha =
        THREE.MathUtils.degToRad(
            sensorAlpha
        );


    const beta =
        THREE.MathUtils.degToRad(
            sensorBeta
        );


    const gamma =
        THREE.MathUtils.degToRad(
            sensorGamma
        );


    const orientation =
        window.screen.orientation
        ?
        window.screen.orientation.angle
        :
        window.orientation || 0;


    const orient =
        THREE.MathUtils.degToRad(
            orientation
        );


    euler.set(
        beta,
        alpha,
        -gamma,
        "YXZ"
    );


    camera.quaternion
        .setFromEuler(
            euler
        );


    camera.quaternion
        .multiply(
            q1
        );


    camera.quaternion
        .multiply(
            q0.setFromAxisAngle(
                zee,
                -orient
            )
        );

}


/* =====================================================
   DOVOLJENJE ZA SENZOR
===================================================== */

async function enableGyro(){

    try{

        if (
            typeof DeviceOrientationEvent !==
            "undefined"
            &&
            typeof DeviceOrientationEvent.requestPermission ===
            "function"
        ){

            const result =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                result !==
                "granted"
            ){

                alert(
                    "Dovoljenje za gibanje telefona ni bilo odobreno."
                );

                return false;

            }

        }


        gyroEnabled =
            true;


        gyroBtn.classList.add(
            "active"
        );


        gyroBtn.textContent =
            "📱 Gyro ✓";


        return true;

    }
    catch(error){

        console.error(error);


        alert(
            "Giroskopa ni mogoče vključiti v tem brskalniku."
        );


        return false;

    }

}


gyroBtn.addEventListener(

    "click",

    async () => {

        if (gyroEnabled){

            gyroEnabled =
                false;


            gyroBtn.classList.remove(
                "active"
            );


            gyroBtn.textContent =
                "📱 Gyro";

        }
        else{

            await enableGyro();

        }

    }

);


/* =====================================================
   TELEFON VR / CARDBOARD
===================================================== */

async function enterPhoneVR(){

    if (!gyroEnabled){

        const success =
            await enableGyro();


        if (!success)
            return;

    }


    phoneVR =
        true;


    document.body.classList.add(
        "vrmode"
    );


    document.getElementById("vrUI")
        .style.display =
        "block";


    /*
       Poskus fullscreen.
    */

    try{

        if (
            !document.fullscreenElement
            &&
            document.documentElement
                .requestFullscreen
        ){

            await document
                .documentElement
                .requestFullscreen();

        }

    }
    catch(error){

        console.log(
            "Fullscreen:",
            error
        );

    }


    /*
       Poskus landscape.
    */

    try{

        if (
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation
                .lock(
                    "landscape"
                );

        }

    }
    catch(error){

        console.log(
            "Orientation lock:",
            error
        );

    }


    resize();

}


async function exitPhoneVR(){

    phoneVR =
        false;


    document.body.classList.remove(
        "vrmode"
    );


    document.getElementById("vrUI")
        .style.display =
        "none";


    try{

        if (
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }
    catch{}


    try{

        if (
            document.fullscreenElement
        ){

            await document
                .exitFullscreen();

        }

    }
    catch{}


    resize();

}


vrBtn.addEventListener(

    "click",
    enterPhoneVR

);


document.getElementById("exitVR")
.addEventListener(

    "click",
    exitPhoneVR

);


/* =====================================================
   FULLSCREEN
===================================================== */

document.getElementById("fullscreenBtn")
.addEventListener(

    "click",

    async () => {

        try{

            if (
                !document.fullscreenElement
            ){

                await document
                    .documentElement
                    .requestFullscreen();

            }
            else{

                await document
                    .exitFullscreen();

            }

        }
        catch(error){

            console.error(error);

        }

    }

);


/* =====================================================
   IZVOZ
===================================================== */

document.getElementById("exportBtn")
.addEventListener(

    "click",

    () => {

        const data = {

            version:1,

            image:"360.jpg",

            hotspots:
                hotspots

        };


        const blob =
            new Blob(

                [
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                ],

                {
                    type:
                        "application/json"
                }

            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            "360-projekt.json";


        a.click();


        URL.revokeObjectURL(
            url
        );

    }

);


/* =====================================================
   UVOZ
===================================================== */

document.getElementById("importBtn")
.addEventListener(

    "click",

    () => {

        fileInput.click();

    }

);


fileInput.addEventListener(

    "change",

    async event => {

        const file =
            event.target.files[0];


        if (!file)
            return;


        try{

            const data =
                JSON.parse(
                    await file.text()
                );


            if (
                !Array.isArray(
                    data.hotspots
                )
            ){

                throw new Error(
                    "Ni veljavnih hotspotov."
                );

            }


            hotspots =
                data.hotspots;


            saveHotspots();

            rebuildHotspots();


            hint.textContent =
                "Projekt uvožen ✓";


            setTimeout(
                defaultHint,
                1200
            );

        }
        catch(error){

            alert(
                "Napaka pri uvozu:\n" +
                error.message
            );

        }


        fileInput.value =
            "";

    }

);


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    const width =
        innerWidth;

    const height =
        innerHeight;


    camera.aspect =
        width / height;


    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height
    );


    stereo.setSize(
        width,
        height
    );

}


addEventListener(
    "resize",
    resize
);


/* =====================================================
   KAMERA
===================================================== */

function updateNormalCamera(){

    const phi =
        THREE.MathUtils.degToRad(
            90 - lat
        );


    const theta =
        THREE.MathUtils.degToRad(
            lon
        );


    const target =
        new THREE.Vector3();


    target.setFromSphericalCoords(
        1,
        phi,
        theta
    );


    camera.lookAt(
        target
    );

}


/* =====================================================
   START
===================================================== */

loadHotspots();

rebuildHotspots();

updateMode();

resize();


/* =====================================================
   ANIMACIJA
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    if (gyroEnabled){

        updateGyroCamera();

    }
    else{

        updateNormalCamera();

    }


    if (phoneVR){

        stereo.render(
            scene,
            camera
        );

    }
    else{

        renderer.render(
            scene,
            camera
        );

    }

}


animate();

</script>
