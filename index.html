<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>360° interaktivna tura</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#viewer {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

/* =========================
   ORODNA VRSTICA
   ========================= */

#toolbar {
    position: fixed;
    z-index: 30;
    top: 10px;
    left: 10px;
    right: 10px;

    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;

    padding: 9px;

    background: rgba(15, 29, 37, .91);
    backdrop-filter: blur(8px);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 11px;
}

.logo {
    color: white;
    font-weight: 800;
    margin-right: 8px;
}

.logo span {
    color: #5ce0c2;
}

.spacer {
    flex: 1;
}

button {
    border: 0;
    border-radius: 8px;

    padding: 9px 12px;

    background: #294250;
    color: white;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;
}

button:hover {
    background: #365868;
}

button.primary {
    background: #5ce0c2;
    color: #08261f;
}

button.active {
    background: #ffd15c;
    color: #241c00;
}

button.danger {
    background: #713b42;
}

/* =========================
   NAVODILO
   ========================= */

#hint {
    position: fixed;
    z-index: 20;

    top: 74px;
    left: 50%;
    transform: translateX(-50%);

    background: rgba(0,0,0,.72);
    color: white;

    border-radius: 8px;

    padding: 7px 11px;

    font-size: 12px;

    pointer-events: none;
}

/* =========================
   EDITOR
   ========================= */

#editor {
    position: fixed;
    z-index: 40;

    top: 78px;
    right: 14px;

    width: 320px;

    padding: 16px;

    background: rgba(14, 31, 41, .96);
    color: white;

    border: 1px solid #526e7c;
    border-radius: 12px;

    display: none;

    box-shadow: 0 10px 35px rgba(0,0,0,.45);
}

#editor h2 {
    margin: 0 0 12px;
    font-size: 18px;
}

label {
    display: block;
    margin-top: 10px;

    color: #bed0d8;
    font-size: 12px;
}

input,
textarea {
    width: 100%;

    margin-top: 5px;
    padding: 9px;

    border: 1px solid #506c79;
    border-radius: 7px;

    background: #0b1c25;
    color: white;

    font: inherit;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.editorButtons {
    display: flex;
    gap: 8px;
    margin-top: 13px;
}

.editorButtons button {
    flex: 1;
}

/* =========================
   INFO POPUP
   ========================= */

#popup {
    position: fixed;
    z-index: 50;

    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);

    width: min(440px, calc(100vw - 30px));

    padding: 17px 45px 17px 17px;

    background: rgba(12, 29, 39, .97);
    color: white;

    border: 1px solid #5ce0c2;
    border-radius: 12px;

    display: none;

    box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

#popup h2 {
    margin: 0 0 7px;
}

#popup p {
    margin: 0;
    line-height: 1.5;
    white-space: pre-wrap;
}

#popupClose {
    position: absolute;
    top: 5px;
    right: 6px;

    background: transparent;

    font-size: 24px;
}

/* =========================
   STATUS
   ========================= */

#status {
    position: fixed;
    z-index: 20;

    left: 10px;
    bottom: 10px;

    padding: 6px 9px;

    background: rgba(0,0,0,.65);
    color: white;

    border-radius: 7px;

    font-size: 11px;

    pointer-events: none;
}

#fileInput {
    display: none;
}

/* =========================
   MOBILNO
   ========================= */

@media (max-width: 720px) {

    #toolbar {
        top: 5px;
        left: 5px;
        right: 5px;
    }

    .logo {
        width: 100%;
        font-size: 13px;
    }

    button {
        padding: 8px 9px;
        font-size: 11px;
    }

    #hint {
        top: 108px;
        max-width: calc(100vw - 20px);
        text-align: center;
    }

    #editor {
        top: auto;
        left: 8px;
        right: 8px;
        bottom: 8px;

        width: auto;

        max-height: 55vh;
        overflow: auto;
    }

    #status {
        display: none;
    }
}
</style>
</head>

<body>

<div id="viewer"></div>

<div id="toolbar">

    <div class="logo">
        360° <span>INTERAKTIVNA TURA</span>
    </div>

    <button id="modeBtn">
        👁 Ogled
    </button>

    <button id="addBtn" class="primary">
        ＋ Hotspot
    </button>

    <button id="resetBtn">
        ↻ Pogled
    </button>

    <div class="spacer"></div>

    <button id="vrBtn">
        🥽 VR
    </button>

    <button id="fullscreenBtn">
        ⛶
    </button>

    <button id="exportBtn">
        Izvoz
    </button>

    <button id="importBtn">
        Uvoz
    </button>

</div>


<div id="hint">
    Povleci za obračanje • kolešček za zoom
</div>


<div id="editor">

    <h2>Uredi hotspot</h2>

    <label>
        Naslov
        <input
            id="spotTitle"
            type="text"
            placeholder="Npr. Omara"
        >
    </label>

    <label>
        Opis
        <textarea
            id="spotDescription"
            placeholder="Vnesi opis..."
        ></textarea>
    </label>

    <div class="editorButtons">

        <button id="saveBtn" class="primary">
            Shrani
        </button>

        <button id="deleteBtn" class="danger">
            Izbriši
        </button>

    </div>

</div>


<div id="popup">

    <button id="popupClose">×</button>

    <h2 id="popupTitle"></h2>

    <p id="popupText"></p>

</div>


<div id="status">
    360.jpg
</div>


<input
    id="fileInput"
    type="file"
    accept=".json,application/json"
>


<!-- THREE.JS -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { VRButton }
from "three/addons/webxr/VRButton.js";


/* ============================================================
   NASTAVITVE
   ============================================================ */

const IMAGE_URL = "./360.jpg";

const STORAGE_KEY =
    "360-interaktivna-tura-v3";


/* ============================================================
   HTML ELEMENTI
   ============================================================ */

const viewer =
    document.getElementById("viewer");

const hint =
    document.getElementById("hint");

const editor =
    document.getElementById("editor");

const spotTitle =
    document.getElementById("spotTitle");

const spotDescription =
    document.getElementById("spotDescription");

const popup =
    document.getElementById("popup");

const popupTitle =
    document.getElementById("popupTitle");

const popupText =
    document.getElementById("popupText");

const addBtn =
    document.getElementById("addBtn");

const modeBtn =
    document.getElementById("modeBtn");

const vrBtn =
    document.getElementById("vrBtn");

const fileInput =
    document.getElementById("fileInput");


/* ============================================================
   SCENA
   ============================================================ */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        72,
        window.innerWidth / window.innerHeight,
        0.1,
        200
    );


camera.position.set(
    0,
    0,
    0.01
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.xr.enabled = true;


viewer.appendChild(
    renderer.domElement
);


/* ============================================================
   360° SFERA
   ============================================================ */

let sphere = null;


const sphereGeometry =
    new THREE.SphereGeometry(
        100,
        64,
        40
    );


sphereGeometry.scale(
    -1,
    1,
    1
);


const loader =
    new THREE.TextureLoader();


loader.load(

    IMAGE_URL,

    texture => {

        texture.colorSpace =
            THREE.SRGBColorSpace;


        const material =
            new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.FrontSide
            });


        sphere =
            new THREE.Mesh(
                sphereGeometry,
                material
            );


        scene.add(
            sphere
        );


        document.getElementById("status")
            .textContent =
            "360.jpg ✓";

    },

    undefined,

    error => {

        console.error(error);

        document.getElementById("status")
            .textContent =
            "NAPAKA: 360.jpg";

        alert(
            "Slike 360.jpg ni mogoče naložiti.\n\n" +
            "Datoteki index.html in 360.jpg morata biti " +
            "v isti mapi na GitHubu."
        );

    }

);


/* ============================================================
   KONTROLE POGLEDA
   ============================================================ */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );


controls.enableDamping = true;

controls.dampingFactor = 0.06;

controls.enablePan = false;

controls.enableZoom = false;

controls.rotateSpeed = -0.35;


controls.target.set(
    0,
    0,
    -1
);


controls.update();


/* ============================================================
   ZOOM
   ============================================================ */

renderer.domElement.addEventListener(

    "wheel",

    event => {

        event.preventDefault();


        camera.fov +=
            event.deltaY * 0.035;


        camera.fov =
            THREE.MathUtils.clamp(
                camera.fov,
                35,
                95
            );


        camera.updateProjectionMatrix();

    },

    {
        passive: false
    }

);


/* ============================================================
   PODATKI HOTSPOTOV
   ============================================================ */

let hotspots = [];

let hotspotMeshes = [];

let selectedId = null;

let adding = false;

/*
   true  = lahko dodajamo/urejamo
   false = obiskovalec gleda turo
*/

let editing = true;


const hotspotGroup =
    new THREE.Group();


scene.add(
    hotspotGroup
);


/* ============================================================
   SHRANJEVANJE
   ============================================================ */

function saveLocal() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(hotspots)
    );

}


function loadLocal() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!saved)
            return;


        const data =
            JSON.parse(saved);


        if (Array.isArray(data)) {

            hotspots = data;

        }

    }

    catch (error) {

        console.error(error);

    }

}


/* ============================================================
   HOTSPOT IKONA
   ============================================================ */

function createHotspotMesh(point) {

    const group =
        new THREE.Group();


    /*
       Shranjeni položaj je smer.
       Hotspot postavimo na radij 92.
    */

    group.position.set(
        point.x,
        point.y,
        point.z
    );


    group.position
        .normalize()
        .multiplyScalar(92);


    /*
       Rumena sredina
    */

    const ball =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.55,
                24,
                24
            ),

            new THREE.MeshBasicMaterial({

                color: 0xffd15c,

                depthTest: false,

                depthWrite: false

            })

        );


    ball.userData.hotspotId =
        point.id;


    ball.renderOrder = 20;


    group.add(
        ball
    );


    /*
       Beli obroč
    */

    const ring =
        new THREE.Mesh(

            new THREE.RingGeometry(
                1.8,
                2.25,
                32
            ),

            new THREE.MeshBasicMaterial({

                color: 0xffffff,

                side: THREE.DoubleSide,

                transparent: true,

                depthTest: false,

                depthWrite: false

            })

        );


    ring.renderOrder = 21;


    group.add(
        ring
    );


    hotspotMeshes.push(
        ball
    );


    return group;

}


/* ============================================================
   PONOVNO NARIŠI HOTSPOTE
   ============================================================ */

function rebuildHotspots() {

    hotspotGroup.clear();

    hotspotMeshes = [];


    for (const point of hotspots) {

        hotspotGroup.add(
            createHotspotMesh(point)
        );

    }

}


/* ============================================================
   RAYCASTER
   ============================================================ */

const raycaster =
    new THREE.Raycaster();


const pointer =
    new THREE.Vector2();


function updatePointer(event) {

    const rect =
        renderer.domElement
            .getBoundingClientRect();


    pointer.x =
        (
            (
                event.clientX -
                rect.left
            )
            /
            rect.width
        )
        *
        2
        -
        1;


    pointer.y =
        -
        (
            (
                event.clientY -
                rect.top
            )
            /
            rect.height
        )
        *
        2
        +
        1;

}


/* ============================================================
   KLIK ALI PREMIK
   ============================================================ */

let pointerStartX = 0;
let pointerStartY = 0;


renderer.domElement.addEventListener(

    "pointerdown",

    event => {

        pointerStartX =
            event.clientX;

        pointerStartY =
            event.clientY;

    }

);


renderer.domElement.addEventListener(

    "pointerup",

    event => {

        /*
           Če je uporabnik vlekel panoramo,
           dogodka ne obravnavamo kot klik.
        */

        const distance =
            Math.hypot(

                event.clientX -
                pointerStartX,

                event.clientY -
                pointerStartY

            );


        if (distance > 8)
            return;


        updatePointer(event);


        raycaster.setFromCamera(
            pointer,
            camera
        );


        /* ====================================================
           DODAJ NOV HOTSPOT
           ==================================================== */

        if (adding) {

            if (!sphere)
                return;


            /*
               Dejansko prestrežemo 360° sfero.
               Tako dobimo natančno mesto klika.
            */

            const sphereHits =
                raycaster.intersectObject(
                    sphere,
                    false
                );


            if (!sphereHits.length)
                return;


            const hit =
                sphereHits[0]
                    .point
                    .clone()
                    .normalize();


            const point = {

                id:
                    Date.now().toString(36)
                    +
                    Math.random()
                        .toString(36)
                        .slice(2),

                title:
                    "Nova točka",

                description:
                    "",

                x:
                    hit.x,

                y:
                    hit.y,

                z:
                    hit.z

            };


            hotspots.push(
                point
            );


            selectedId =
                point.id;


            adding = false;


            addBtn.classList.remove(
                "active"
            );


            saveLocal();

            rebuildHotspots();


            hint.textContent =
                "Hotspot dodan – vnesi naslov in opis";


            openEditor(
                point
            );


            return;
        }


        /* ====================================================
           KLIK NA OBSTOJEČ HOTSPOT
           ==================================================== */

        const hotspotHits =
            raycaster.intersectObjects(
                hotspotMeshes,
                false
            );


        if (!hotspotHits.length)
            return;


        const id =
            hotspotHits[0]
                .object
                .userData
                .hotspotId;


        const point =
            hotspots.find(
                item =>
                    item.id === id
            );


        if (!point)
            return;


        selectedId =
            id;


        if (editing) {

            openEditor(
                point
            );

        }

        else {

            showPopup(
                point
            );

        }

    }

);


/* ============================================================
   EDITOR
   ============================================================ */

function openEditor(point) {

    selectedId =
        point.id;


    spotTitle.value =
        point.title || "";


    spotDescription.value =
        point.description || "";


    editor.style.display =
        "block";

}


/* SHRANI */

document.getElementById("saveBtn")
    .addEventListener(

        "click",

        () => {

            const point =
                hotspots.find(
                    item =>
                        item.id === selectedId
                );


            if (!point)
                return;


            point.title =
                spotTitle.value.trim()
                ||
                "Točka";


            point.description =
                spotDescription.value.trim();


            saveLocal();

            rebuildHotspots();


            editor.style.display =
                "none";


            hint.textContent =
                "Hotspot shranjen ✓";



            setTimeout(

                () => {

                    hint.textContent =
                        "Povleci za obračanje • kolešček za zoom";

                },

                1600

            );

        }

    );


/* IZBRIŠI */

document.getElementById("deleteBtn")
    .addEventListener(

        "click",

        () => {

            if (!selectedId)
                return;


            hotspots =
                hotspots.filter(
                    item =>
                        item.id !== selectedId
                );


            selectedId = null;


            saveLocal();

            rebuildHotspots();


            editor.style.display =
                "none";


            hint.textContent =
                "Hotspot izbrisan";

        }

    );


/* ============================================================
   DODAJ HOTSPOT
   ============================================================ */

addBtn.addEventListener(

    "click",

    () => {

        /*
           Če smo v načinu Ogled,
           avtomatsko preklopimo v urejanje.
        */

        if (!editing) {

            editing = true;

            updateMode();

        }


        adding =
            !adding;


        addBtn.classList.toggle(
            "active",
            adding
        );


        if (adding) {

            editor.style.display =
                "none";


            popup.style.display =
                "none";


            hint.textContent =
                "Klikni predmet, kamor želiš postaviti hotspot";

        }

        else {

            hint.textContent =
                "Povleci za obračanje • kolešček za zoom";

        }

    }

);


/* ============================================================
   UREJANJE / OGLED
   ============================================================ */

function updateMode() {

    if (editing) {

        modeBtn.textContent =
            "👁 Ogled";


        addBtn.style.display =
            "inline-block";


        hint.textContent =
            "Urejanje • dodajaj in urejaj hotspote";

    }

    else {

        modeBtn.textContent =
            "✏️ Urejanje";


        addBtn.style.display =
            "none";


        editor.style.display =
            "none";


        hint.textContent =
            "Ogled • klikni hotspot za informacije";

    }


    adding = false;


    addBtn.classList.remove(
        "active"
    );

}


modeBtn.addEventListener(

    "click",

    () => {

        editing =
            !editing;


        popup.style.display =
            "none";


        editor.style.display =
            "none";


        updateMode();

    }

);


updateMode();


/* ============================================================
   POPUP
   ============================================================ */

function showPopup(point) {

    popupTitle.textContent =
        point.title || "Točka";


    popupText.textContent =
        point.description || "";


    popup.style.display =
        "block";

}


document.getElementById("popupClose")
    .addEventListener(

        "click",

        () => {

            popup.style.display =
                "none";

        }

    );


/* ============================================================
   RESET POGLEDA
   ============================================================ */

document.getElementById("resetBtn")
    .addEventListener(

        "click",

        () => {

            camera.fov =
                72;


            camera.updateProjectionMatrix();


            controls.target.set(
                0,
                0,
                -1
            );


            controls.update();

        }

    );


/* ============================================================
   FULLSCREEN
   ============================================================ */

document.getElementById("fullscreenBtn")
    .addEventListener(

        "click",

        async () => {

            try {

                if (!document.fullscreenElement) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }

                else {

                    await document
                        .exitFullscreen();

                }

            }

            catch (error) {

                console.error(error);

            }

        }

    );


/* ============================================================
   VR / WEBXR

   Pomembno:
   Three.js VR gumba NE pokažemo uporabniku,
   dokler ne vemo, da immersive-vr obstaja.

   Zato ni več napisa:
   "VR NOT SUPPORTED"
   ============================================================ */

let threeVRButton = null;


async function setupVR() {

    /*
       Brez WebXR
    */

    if (!("xr" in navigator)) {

        vrBtn.textContent =
            "📱 360°";


        vrBtn.title =
            "WebXR VR na tej napravi ni na voljo";


        vrBtn.onclick =
            () => {

                alert(
                    "Ta naprava ali brskalnik ne podpira WebXR VR.\n\n" +
                    "Običajni 360° ogled še vedno deluje."
                );

            };


        return;
    }


    try {

        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-vr"
                );


        /*
           WebXR obstaja, vendar ni VR naprave.
        */

        if (!supported) {

            vrBtn.textContent =
                "📱 360°";


            vrBtn.title =
                "VR očala niso na voljo";


            vrBtn.onclick =
                () => {

                    alert(
                        "VR način na tej napravi trenutno ni na voljo.\n\n" +
                        "360° panoramo lahko normalno uporabljaš z miško ali prstom."
                    );

                };


            return;
        }


        /*
           VR je podprt.
        */

        threeVRButton =
            VRButton.createButton(
                renderer
            );


        /*
           Three.js gumb potrebujemo samo kot
           WebXR mehanizem. Uporabniku ga skrijemo.
        */

        threeVRButton.style.position =
            "fixed";

        threeVRButton.style.left =
            "-10000px";

        threeVRButton.style.top =
            "-10000px";

        threeVRButton.style.opacity =
            "0";

        threeVRButton.style.pointerEvents =
            "none";


        document.body.appendChild(
            threeVRButton
        );


        vrBtn.textContent =
            "🥽 Vstopi v VR";


        vrBtn.onclick =
            () => {

                /*
                   Za trenutek omogočimo klik,
                   ker VR seja potrebuje uporabnikovo gesto.
                */

                threeVRButton.style.pointerEvents =
                    "auto";


                threeVRButton.click();


                threeVRButton.style.pointerEvents =
                    "none";

            };

    }

    catch (error) {

        console.error(error);


        vrBtn.textContent =
            "📱 360°";

    }

}


setupVR();


/* ============================================================
   IZVOZ PROJEKTA
   ============================================================ */

document.getElementById("exportBtn")
    .addEventListener(

        "click",

        () => {

            const project = {

                version: 1,

                image:
                    "360.jpg",

                hotspots:
                    hotspots

            };


            const blob =
                new Blob(

                    [
                        JSON.stringify(
                            project,
                            null,
                            2
                        )
                    ],

                    {
                        type:
                            "application/json"
                    }

                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "360-projekt.json";


            link.click();


            setTimeout(

                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },

                1000

            );

        }

    );


/* ============================================================
   UVOZ PROJEKTA
   ============================================================ */

document.getElementById("importBtn")
    .addEventListener(

        "click",

        () => {

            fileInput.click();

        }

    );


fileInput.addEventListener(

    "change",

    async event => {

        const file =
            event.target.files[0];


        if (!file)
            return;


        try {

            const project =
                JSON.parse(
                    await file.text()
                );


            if (
                !Array.isArray(
                    project.hotspots
                )
            ) {

                throw new Error(
                    "Datoteka nima veljavnih hotspotov."
                );

            }


            hotspots =
                project.hotspots;


            selectedId =
                null;


            saveLocal();

            rebuildHotspots();


            hint.textContent =
                "Projekt uvožen ✓";

        }

        catch (error) {

            alert(
                "Uvoz ni uspel:\n" +
                error.message
            );

        }


        fileInput.value =
            "";

    }

);


/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener(

    "resize",

    () => {

        camera.aspect =
            window.innerWidth
            /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }

);


/* ============================================================
   ZAGON
   ============================================================ */

loadLocal();

rebuildHotspots();


/* ============================================================
   ANIMACIJA
   ============================================================ */

renderer.setAnimationLoop(

    () => {

        if (!renderer.xr.isPresenting) {

            controls.update();

        }


        /*
           Obroči hotspotov so vedno obrnjeni
           proti sredini/kameri.
        */

        for (
            const group
            of hotspotGroup.children
        ) {

            const ring =
                group.children[1];


            if (ring) {

                ring.lookAt(
                    camera.position
                );

            }

        }


        renderer.render(
            scene,
            camera
        );

    }

);

</script>

</body>
</html>
