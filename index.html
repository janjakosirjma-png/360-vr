<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover">

<title>360 Panorama + Cardboard</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

#c{
  position:fixed;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  background:#000;
  touch-action:none;
}

/* =========================================================
   TOOLBAR
========================================================= */

#toolbar{
  position:fixed;
  z-index:20;
  left:12px;
  top:12px;

  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;

  padding:8px;

  border-radius:14px;
  background:rgba(15,15,15,.88);
}

.tool{
  min-height:42px;
  padding:0 13px;

  border:0;
  border-radius:9px;

  background:#333;
  color:#fff;

  font-weight:700;
  cursor:pointer;
}

#addBtn{
  background:#2563eb;
}

#addBtn.active{
  background:#16a34a;
}

#cardboardBtn{
  background:#7c3aed;
}

/* =========================================================
   HINT
========================================================= */

#hint{
  position:fixed;
  z-index:25;

  display:none;

  left:50%;
  bottom:24px;

  transform:translateX(-50%);

  padding:11px 18px;

  border-radius:30px;

  background:rgba(0,0,0,.82);
  color:#fff;

  pointer-events:none;
}

/* =========================================================
   HOTSPOT POPUP
========================================================= */

#popup{
  position:fixed;
  z-index:40;

  display:none;

  width:330px;
  max-width:calc(100vw - 24px);

  padding:18px;

  border-radius:14px;

  background:#fff;
  color:#111;

  box-shadow:0 15px 45px rgba(0,0,0,.45);
}

#popupClose{
  position:absolute;
  top:8px;
  right:8px;

  width:30px;
  height:30px;

  padding:0;

  border:0;
  border-radius:50%;

  background:#eee;
  color:#111;

  font-size:20px;
  cursor:pointer;
}

#reader,
#editor{
  display:none;
}

#readerTitle{
  margin:0 35px 10px 0;
}

#readerDescription{
  margin-bottom:15px;
  line-height:1.5;
  white-space:pre-wrap;
}

#editBtn{
  width:100%;
  padding:10px;

  border:0;
  border-radius:8px;

  background:#2563eb;
  color:#fff;

  font-weight:bold;
  cursor:pointer;
}

.fieldLabel{
  display:block;
  margin:9px 0 4px;

  font-size:12px;
  font-weight:bold;
}

#titleInput,
#descriptionInput{
  width:100%;
  padding:10px;

  border:1px solid #bbb;
  border-radius:8px;
}

#descriptionInput{
  min-height:115px;
  resize:vertical;
}

.editorButtons{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.editorButtons button{
  flex:1;
  padding:10px;

  border:0;
  border-radius:8px;

  font-weight:bold;
  cursor:pointer;
}

#saveBtn{
  background:#16a34a;
  color:#fff;
}

#cancelBtn{
  background:#ddd;
}

#deleteBtn{
  background:#dc2626;
  color:#fff;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.94);
}

.modalBox{
  width:390px;
  max-width:100%;

  padding:24px;

  border-radius:17px;

  background:#fff;
  color:#111;

  text-align:center;
}

.modalBox h2{
  margin-top:0;
}

.modalBox button{
  width:100%;
  margin-top:8px;
  padding:13px;

  border:0;
  border-radius:9px;

  font-weight:bold;
  cursor:pointer;
}

#startCardboardBtn,
#sensorBtn{
  background:#7c3aed;
  color:#fff;
}

#cancelCardboardBtn{
  background:#ddd;
}

/* =========================================================
   CARDBOARD UI
========================================================= */

#vrUI{
  position:fixed;
  inset:0;
  z-index:60;

  display:none;

  pointer-events:none;
}

.reticle{
  position:absolute;
  top:50%;

  width:22px;
  height:22px;

  transform:translate(-50%,-50%);

  border:2px solid #fff;
  border-radius:50%;

  box-shadow:
    0 0 3px #000,
    0 0 7px #000;
}

.reticle::after{
  content:"";

  position:absolute;
  left:50%;
  top:50%;

  width:4px;
  height:4px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#fff;
}

.reticle.active{
  animation:gaze 1.2s linear forwards;
}

@keyframes gaze{
  from{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  to{
    transform:
      translate(-50%,-50%)
      scale(1.7);
  }
}

#exitVR{
  position:absolute;
  z-index:70;

  top:
    max(
      10px,
      env(safe-area-inset-top)
    );

  right:
    max(
      10px,
      env(safe-area-inset-right)
    );

  width:46px;
  height:46px;

  padding:0;

  border:0;
  border-radius:50%;

  background:rgba(0,0,0,.72);
  color:#fff;

  font-size:28px;

  pointer-events:auto;
  cursor:pointer;
}

@media(max-width:700px){
  #toolbar{
    top:7px;
    left:7px;
    right:7px;
    justify-content:center;
  }

  .tool{
    min-height:38px;
    padding:0 9px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="toolbar">

  <button
    type="button"
    id="addBtn"
    class="tool">
    + Dodaj hotspot
  </button>

  <button
    type="button"
    id="zoomInBtn"
    class="tool">
    +
  </button>

  <button
    type="button"
    id="zoomOutBtn"
    class="tool">
    −
  </button>

  <button
    type="button"
    id="fullscreenBtn"
    class="tool">
    ⛶
  </button>

  <button
    type="button"
    id="cardboardBtn"
    class="tool">
    🥽 CARDBOARD
  </button>

</div>

<div id="hint">
  Klikni na mesto v panorami
</div>

<div id="popup">

  <button
    type="button"
    id="popupClose">
    ×
  </button>

  <div id="reader">

    <h2 id="readerTitle"></h2>

    <div id="readerDescription"></div>

    <button
      type="button"
      id="editBtn">
      Uredi
    </button>

  </div>

  <div id="editor">

    <label
      class="fieldLabel"
      for="titleInput">
      Naslov
    </label>

    <input
      id="titleInput"
      type="text"
      placeholder="Naslov">

    <label
      class="fieldLabel"
      for="descriptionInput">
      Opis
    </label>

    <textarea
      id="descriptionInput"
      placeholder="Opis..."></textarea>

    <div class="editorButtons">

      <button
        type="button"
        id="saveBtn">
        Shrani
      </button>

      <button
        type="button"
        id="cancelBtn">
        Prekliči
      </button>

      <button
        type="button"
        id="deleteBtn">
        Izbriši
      </button>

    </div>

  </div>

</div>

<div
  id="cardboardStart"
  class="modal">

  <div class="modalBox">

    <h2>🥽 Cardboard</h2>

    <p>
      Obrni Samsung Galaxy A36 vodoravno.
      Nato zaženi Cardboard način.
    </p>

    <button
      type="button"
      id="startCardboardBtn">
      ZAŽENI
    </button>

    <button
      type="button"
      id="cancelCardboardBtn">
      Prekliči
    </button>

  </div>

</div>

<div
  id="sensorModal"
  class="modal">

  <div class="modalBox">

    <h2>Senzor gibanja</h2>

    <p>
      Dovoli uporabo senzorjev telefona.
    </p>

    <button
      type="button"
      id="sensorBtn">
      DOVOLI IN ZAŽENI
    </button>

  </div>

</div>

<div id="vrUI">

  <div
    id="reticleLeft"
    class="reticle">
  </div>

  <div
    id="reticleRight"
    class="reticle">
  </div>

  <button
    type="button"
    id="exitVR">
    ×
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   DOM
========================================================= */

const $ =
  id => document.getElementById(id);

const canvas =
  $("c");

const toolbar =
  $("toolbar");

const addBtn =
  $("addBtn");

const zoomInBtn =
  $("zoomInBtn");

const zoomOutBtn =
  $("zoomOutBtn");

const fullscreenBtn =
  $("fullscreenBtn");

const cardboardBtn =
  $("cardboardBtn");

const hint =
  $("hint");

const popup =
  $("popup");

const popupClose =
  $("popupClose");

const reader =
  $("reader");

const editor =
  $("editor");

const readerTitle =
  $("readerTitle");

const readerDescription =
  $("readerDescription");

const editBtn =
  $("editBtn");

const titleInput =
  $("titleInput");

const descriptionInput =
  $("descriptionInput");

const saveBtn =
  $("saveBtn");

const cancelBtn =
  $("cancelBtn");

const deleteBtn =
  $("deleteBtn");

const cardboardStart =
  $("cardboardStart");

const startCardboardBtn =
  $("startCardboardBtn");

const cancelCardboardBtn =
  $("cancelCardboardBtn");

const sensorModal =
  $("sensorModal");

const sensorBtn =
  $("sensorBtn");

const vrUI =
  $("vrUI");

const reticleLeft =
  $("reticleLeft");

const reticleRight =
  $("reticleRight");

const exitVR =
  $("exitVR");

/* =========================================================
   THREE
========================================================= */

if(typeof THREE === "undefined"){
  alert("Three.js se ni naložil.");
  throw new Error("Three.js missing");
}

const renderer =
  new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:false,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio || 1,
    2
  )
);

renderer.setClearColor(
  0x000000,
  1
);

renderer.autoClear = false;

/* =========================================================
   MAIN SCENE
========================================================= */

const scene =
  new THREE.Scene();

const camera =
  new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.01,
    200
  );

camera.position.set(
  0,
  0,
  0
);

/* =========================================================
   360.jpg
========================================================= */

const sphereGeometry =
  new THREE.SphereGeometry(
    50,
    64,
    40
  );

sphereGeometry.scale(
  -1,
  1,
  1
);

const panoramaMaterial =
  new THREE.MeshBasicMaterial({
    color:0xffffff
  });

const panorama =
  new THREE.Mesh(
    sphereGeometry,
    panoramaMaterial
  );

scene.add(panorama);

new THREE.TextureLoader().load(

  "360.jpg",

  texture => {

    texture.colorSpace =
      THREE.SRGBColorSpace;

    texture.minFilter =
      THREE.LinearFilter;

    texture.magFilter =
      THREE.LinearFilter;

    panoramaMaterial.map =
      texture;

    panoramaMaterial.needsUpdate =
      true;
  },

  undefined,

  () => {

    alert(
      "360.jpg se ni naložil. " +
      "Datoteka mora biti v isti mapi kot index.html."
    );
  }
);

/* =========================================================
   NORMAL VIEW
========================================================= */

let yaw =
  0;

let pitch =
  0;

let normalFov =
  75;

function updateNormalCamera(){

  camera.rotation.order =
    "YXZ";

  camera.rotation.set(
    pitch,
    yaw,
    0
  );
}

updateNormalCamera();

/* =========================================================
   HOTSPOTS
========================================================= */

const STORAGE_KEY =
  "stable-360-hotspots-v5";

let hotspots = [];

try{

  hotspots =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];
}
catch(e){

  hotspots = [];
}

function saveHotspots(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(hotspots)
  );
}

const hotspotGroup =
  new THREE.Group();

scene.add(
  hotspotGroup
);

let hotspotMeshes =
  [];

function sphericalToVector(
  hotspotYaw,
  hotspotPitch,
  radius = 47
){

  return new THREE.Vector3(

    radius *
    Math.cos(hotspotPitch) *
    Math.sin(hotspotYaw),

    radius *
    Math.sin(hotspotPitch),

    -radius *
    Math.cos(hotspotPitch) *
    Math.cos(hotspotYaw)
  );
}

function directionToSpherical(
  direction
){

  return {

    yaw:
      Math.atan2(
        direction.x,
        -direction.z
      ),

    pitch:
      Math.asin(
        THREE.MathUtils.clamp(
          direction.y,
          -1,
          1
        )
      )
  };
}

function createHotspotTexture(
  number
){

  const c =
    document.createElement(
      "canvas"
    );

  c.width =
    256;

  c.height =
    256;

  const ctx =
    c.getContext("2d");

  ctx.clearRect(
    0,
    0,
    256,
    256
  );

  ctx.beginPath();

  ctx.arc(
    128,
    128,
    113,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#fff";

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    128,
    128,
    91,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ef3333";

  ctx.fill();

  ctx.fillStyle =
    "#fff";

  ctx.font =
    "bold 100px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    String(number),
    128,
    136
  );

  const texture =
    new THREE.CanvasTexture(c);

  texture.colorSpace =
    THREE.SRGBColorSpace;

  return texture;
}

function renderHotspots(){

  for(const sprite of hotspotMeshes){

    hotspotGroup.remove(
      sprite
    );

    if(sprite.material.map){
      sprite.material.map.dispose();
    }

    sprite.material.dispose();
  }

  hotspotMeshes =
    [];

  hotspots.forEach(
    (hotspot,index) => {

      const material =
        new THREE.SpriteMaterial({

          map:
            createHotspotTexture(
              index + 1
            ),

          transparent:true,
          depthTest:false,
          depthWrite:false
        });

      const sprite =
        new THREE.Sprite(
          material
        );

      sprite.position.copy(

        sphericalToVector(
          hotspot.yaw,
          hotspot.pitch
        )
      );

      sprite.scale.set(
        2.35,
        2.35,
        1
      );

      sprite.userData.hotspotId =
        hotspot.id;

      hotspotGroup.add(
        sprite
      );

      hotspotMeshes.push(
        sprite
      );
    }
  );
}

renderHotspots();

/* =========================================================
   HOTSPOT POPUP
========================================================= */

let selectedHotspotId =
  null;

function getHotspot(id){

  return hotspots.find(
    hotspot =>
      hotspot.id === id
  );
}

function openReader(id){

  const hotspot =
    getHotspot(id);

  if(!hotspot){
    return;
  }

  selectedHotspotId =
    id;

  readerTitle.textContent =
    hotspot.title ||
    "Brez naslova";

  readerDescription.textContent =
    hotspot.description ||
    "Ni opisa.";

  editor.style.display =
    "none";

  reader.style.display =
    "block";

  popup.style.display =
    "block";

  popup.style.visibility =
    "visible";

  positionPopup();
}

function openEditor(id){

  const hotspot =
    getHotspot(id);

  if(!hotspot){
    return;
  }

  selectedHotspotId =
    id;

  titleInput.value =
    hotspot.title || "";

  descriptionInput.value =
    hotspot.description || "";

  reader.style.display =
    "none";

  editor.style.display =
    "block";

  popup.style.display =
    "block";

  popup.style.visibility =
    "visible";

  positionPopup();
}

function closePopup(){

  popup.style.display =
    "none";

  popup.style.visibility =
    "visible";

  selectedHotspotId =
    null;
}

popupClose.onclick =
  closePopup;

editBtn.onclick =
  () => {

    if(selectedHotspotId){

      openEditor(
        selectedHotspotId
      );
    }
  };

saveBtn.onclick =
  () => {

    const hotspot =
      getHotspot(
        selectedHotspotId
      );

    if(!hotspot){
      return;
    }

    hotspot.title =
      titleInput.value.trim();

    hotspot.description =
      descriptionInput.value.trim();

    saveHotspots();

    openReader(
      hotspot.id
    );
  };

cancelBtn.onclick =
  () => {

    const hotspot =
      getHotspot(
        selectedHotspotId
      );

    if(
      hotspot &&
      (
        hotspot.title ||
        hotspot.description
      )
    ){

      openReader(
        hotspot.id
      );
    }
    else{

      closePopup();
    }
  };

deleteBtn.onclick =
  () => {

    if(!selectedHotspotId){
      return;
    }

    hotspots =
      hotspots.filter(
        hotspot =>
          hotspot.id !==
          selectedHotspotId
      );

    saveHotspots();

    closePopup();

    renderHotspots();
  };

/* =========================================================
   POPUP POSITION
========================================================= */

function positionPopup(){

  if(
    vrMode ||
    !selectedHotspotId ||
    popup.style.display === "none"
  ){
    return;
  }

  const hotspot =
    getHotspot(
      selectedHotspotId
    );

  if(!hotspot){
    return;
  }

  const world =
    sphericalToVector(
      hotspot.yaw,
      hotspot.pitch
    );

  const forward =
    new THREE.Vector3();

  camera.getWorldDirection(
    forward
  );

  if(
    forward.dot(
      world.clone().normalize()
    ) <= 0
  ){

    popup.style.visibility =
      "hidden";

    return;
  }

  popup.style.visibility =
    "visible";

  const projected =
    world.clone();

  projected.project(
    camera
  );

  const x =
    (
      projected.x + 1
    ) *
    0.5 *
    innerWidth;

  const y =
    (
      -projected.y + 1
    ) *
    0.5 *
    innerHeight;

  const pw =
    popup.offsetWidth;

  const ph =
    popup.offsetHeight;

  let left =
    x < innerWidth / 2
      ? x + 30
      : x - pw - 30;

  let top =
    y - ph / 2;

  left =
    THREE.MathUtils.clamp(
      left,
      8,
      innerWidth - pw - 8
    );

  top =
    THREE.MathUtils.clamp(
      top,
      8,
      innerHeight - ph - 8
    );

  popup.style.left =
    left + "px";

  popup.style.top =
    top + "px";
}

/* =========================================================
   ADD HOTSPOT
========================================================= */

let addMode =
  false;

function stopAddMode(){

  addMode =
    false;

  addBtn.classList.remove(
    "active"
  );

  addBtn.textContent =
    "+ Dodaj hotspot";

  hint.style.display =
    "none";
}

addBtn.onclick =
  () => {

    if(vrMode){
      return;
    }

    closePopup();

    addMode =
      !addMode;

    if(addMode){

      addBtn.classList.add(
        "active"
      );

      addBtn.textContent =
        "Klikni v panoramo";

      hint.style.display =
        "block";
    }
    else{

      stopAddMode();
    }
  };

/* =========================================================
   NORMAL POINTER
========================================================= */

let pointerDown =
  false;

let pointerMoved =
  false;

let startX =
  0;

let startY =
  0;

let lastX =
  0;

let lastY =
  0;

canvas.addEventListener(
  "pointerdown",
  event => {

    if(vrMode){
      return;
    }

    pointerDown =
      true;

    pointerMoved =
      false;

    startX =
      lastX =
      event.clientX;

    startY =
      lastY =
      event.clientY;

    try{

      canvas.setPointerCapture(
        event.pointerId
      );
    }
    catch(e){}
  }
);

canvas.addEventListener(
  "pointermove",
  event => {

    if(
      !pointerDown ||
      vrMode
    ){
      return;
    }

    const dx =
      event.clientX -
      lastX;

    const dy =
      event.clientY -
      lastY;

    if(
      Math.hypot(
        event.clientX - startX,
        event.clientY - startY
      ) > 6
    ){

      pointerMoved =
        true;
    }

    if(!addMode){

      yaw -=
        dx * 0.004;

      pitch -=
        dy * 0.004;

      pitch =
        THREE.MathUtils.clamp(
          pitch,
          -Math.PI / 2 + 0.05,
          Math.PI / 2 - 0.05
        );

      updateNormalCamera();
    }

    lastX =
      event.clientX;

    lastY =
      event.clientY;
  }
);

canvas.addEventListener(
  "pointerup",
  event => {

    if(vrMode){
      return;
    }

    pointerDown =
      false;

    if(pointerMoved){
      return;
    }

    const rect =
      canvas.getBoundingClientRect();

    const pointer =
      new THREE.Vector2(

        (
          (
            event.clientX -
            rect.left
          ) /
          rect.width
        ) * 2 - 1,

        -(
          (
            event.clientY -
            rect.top
          ) /
          rect.height
        ) * 2 + 1
      );

    const raycaster =
      new THREE.Raycaster();

    raycaster.setFromCamera(
      pointer,
      camera
    );

    if(!addMode){

      const hits =
        raycaster.intersectObjects(
          hotspotMeshes,
          false
        );

      if(hits.length){

        openReader(
          hits[0]
            .object
            .userData
            .hotspotId
        );

        return;
      }
    }

    if(!addMode){
      return;
    }

    const direction =
      raycaster
        .ray
        .direction
        .clone()
        .normalize();

    const spherical =
      directionToSpherical(
        direction
      );

    const hotspot = {

      id:
        "hs-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,7),

      yaw:
        spherical.yaw,

      pitch:
        spherical.pitch,

      title:"",

      description:""
    };

    hotspots.push(
      hotspot
    );

    saveHotspots();

    renderHotspots();

    stopAddMode();

    openEditor(
      hotspot.id
    );
  }
);

/* =========================================================
   DEVICE ORIENTATION
========================================================= */

let alpha =
  0;

let beta =
  0;

let gamma =
  0;

let sensorReady =
  false;

function onOrientation(event){

  if(event.alpha == null){
    return;
  }

  alpha =
    event.alpha || 0;

  beta =
    event.beta || 0;

  gamma =
    event.gamma || 0;

  sensorReady =
    true;
}

const deviceEuler =
  new THREE.Euler();

const deviceQuat =
  new THREE.Quaternion();

const screenQuat =
  new THREE.Quaternion();

const zee =
  new THREE.Vector3(
    0,
    0,
    1
  );

const q1 =
  new THREE.Quaternion(
    -Math.sqrt(0.5),
    0,
    0,
    Math.sqrt(0.5)
  );

function updateDeviceOrientation(){

  if(!sensorReady){
    return;
  }

  const a =
    THREE.MathUtils.degToRad(
      alpha
    );

  const b =
    THREE.MathUtils.degToRad(
      beta
    );

  const g =
    THREE.MathUtils.degToRad(
      gamma
    );

  let orientation =
    0;

  if(
    screen.orientation &&
    typeof screen.orientation.angle ===
      "number"
  ){

    orientation =
      THREE.MathUtils.degToRad(
        screen.orientation.angle
      );
  }
  else if(
    typeof window.orientation ===
      "number"
  ){

    orientation =
      THREE.MathUtils.degToRad(
        window.orientation
      );
  }

  deviceEuler.set(
    b,
    a,
    -g,
    "YXZ"
  );

  deviceQuat
    .setFromEuler(
      deviceEuler
    );

  deviceQuat.multiply(
    q1
  );

  screenQuat
    .setFromAxisAngle(
      zee,
      -orientation
    );

  deviceQuat.multiply(
    screenQuat
  );

  camera.quaternion.copy(
    deviceQuat
  );
}

let wakeLock =
  null;

async function acquireWakeLock(){

  if(
    !("wakeLock" in navigator)
  ){
    return;
  }

  try{

    if(
      wakeLock &&
      !wakeLock.released
    ){
      return;
    }

    wakeLock =
      await navigator
        .wakeLock
        .request("screen");

    wakeLock.addEventListener(
      "release",
      () => {
        wakeLock = null;
      }
    );
  }
  catch(e){}
}

async function releaseWakeLock(){

  if(!wakeLock){
    return;
  }

  try{

    await wakeLock.release();
  }
  catch(e){}

  wakeLock =
    null;
}

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      vrMode &&
      document.visibilityState ===
        "visible"
    ){

      acquireWakeLock();
    }
  }
);

   VR / CARDBOARD
========================================================= */

  false;

/*
  ==========================================================
  POMEMBNO

  Te številke NISO piksli računalniškega zaslona.

  To so relativni deleži DEJANSKEGA landscape viewporta
  telefona.

  Na Samsungu se ob vsakem resize/fullscreen/orientationchange
  ponovno izračunajo.
  ==========================================================
*/

const VR_LAYOUT = {

  /*
    Črn zunanji rob levo/desno.

    YT referenca ima očesni površini
    odmaknjeni od zunanjega roba.
  */

  outerMarginRatio:
    0.055,

  /*
    Sredinski črni razmik med očesoma.

    2.2 % celotne širine telefona.
  */

  centerGapRatio:
    0.022,

  /*
    Očesno okno ne gre do vrha/dna.

    Črn rob skupaj zavzame približno
    13 % višine.
  */

  verticalMarginRatio:
    0.065,

  /*
    Optična distorzija.
  */

  k1:
    0.20,

  k2:
    0.07,

  /*
    FOV posameznega očesa.
  */

  fov:
    90,

  /*
    Stereo camera separation v 3D sceni.
  */

  eyeSep:
    0.064
};

/* =========================================================
   PHONE-LAYOUT CALCULATION
========================================================= */

function getVRLayout(){

  /*
    To sta DEJANSKA CSS viewporta telefona
    po fullscreen/orientation spremembi.
  */

  const W =
    Math.max(
      1,
      window.innerWidth
    );

  const H =
    Math.max(
      1,
      window.innerHeight
    );

  const outer =
    W *
    VR_LAYOUT.outerMarginRatio;

  const gap =
    W *
    VR_LAYOUT.centerGapRatio;

  /*
    Razpoložljiva širina po odstranitvi:

    levi zunanji rob
    desni zunanji rob
    sredinski gap
  */

  const eyeWidth =
    (
      W -
      outer * 2 -
      gap
    ) / 2;

  const verticalMargin =
    H *
    VR_LAYOUT.verticalMarginRatio;

  const eyeHeight =
    H -
    verticalMargin * 2;

  /*
    PIXEL center levega/desnega očesa.
  */

  const leftCenterPx =
    outer +
    eyeWidth / 2;

  const rightCenterPx =
    W -
    outer -
    eyeWidth / 2;

  /*
    Pretvorba v WebGL clip space.

    clip X:
      -1 = levi rob
      +1 = desni rob

    Ker PlaneGeometry(2,2) že teče
    -1 .. +1, eyeScale predstavlja
    POL širine quada v clip-space.

    width/W * 2 = celotna clip širina.
    Ker position že meri 2 enoti,
    scale je width/W.
  */

  const eyeScaleX =
    eyeWidth / W;

  const eyeScaleY =
    eyeHeight / H;

  const leftOffsetX =
    (
      leftCenterPx / W
    ) * 2 - 1;

  const rightOffsetX =
    (
      rightCenterPx / W
    ) * 2 - 1;

  return {

    W,
    H,

    outer,
    gap,

    eyeWidth,
    eyeHeight,

    leftCenterPx,
    rightCenterPx,

    eyeScaleX,
    eyeScaleY,

    leftOffsetX,
    rightOffsetX,

    centerY:0
  };
}

/* =========================================================
   VERTEX SHADER
========================================================= */

const vrVertexShader = `

precision highp float;

varying vec2 vUv;

uniform vec2 eyeScale;
uniform vec2 eyeOffset;

void main(){

  vUv = uv;

  vec2 p =
    position.xy *
    eyeScale +
    eyeOffset;

  gl_Position =
    vec4(
      p,
      0.0,
      1.0
    );
}

`;

/* =========================================================
   CARDBOARD WARP

   Namenoma ni eliptična maska.

   Oblika je:
   - skoraj raven notranji rob
   - ukrivljen zunanji rob
   - zgoraj/spodaj rahlo izbočeno
   - zaobljeni vogali
========================================================= */

const vrFragmentShader = `

precision highp float;

uniform sampler2D eyeTexture;

uniform float k1;
uniform float k2;

varying vec2 vUv;

void main(){

  vec2 p =
    vUv * 2.0 - 1.0;

  float ax =
    abs(p.x);

  float ay =
    abs(p.y);

  /*
    ---------------------------------------------------------
    YT/CARDBOARD SHAPE
    ---------------------------------------------------------
  */

  float verticalLimit =
    1.0 -
    0.050 *
    pow(
      ax,
      2.35
    );

  float horizontalLimit =
    1.0 -
    0.085 *
    pow(
      ay,
      2.40
    );

  /*
    Dodatna zaokrožitev samo v vogalih.
  */

  float corner =
    pow(
      ax * ay,
      4.0
    );

  verticalLimit -=
    corner * 0.020;

  horizontalLimit -=
    corner * 0.025;

  if(
    ay > verticalLimit ||
    ax > horizontalLimit
  ){

    gl_FragColor =
      vec4(
        0.0,
        0.0,
        0.0,
        1.0
      );

    return;
  }

  /*
    ---------------------------------------------------------
    LENS WARP
    ---------------------------------------------------------
  */

  vec2 q =
    p;

  /*
    Rahla horizontalna optična
    korekcija.
  */

  q.x *=
    1.04;

  float r2 =
    dot(
      q,
      q
    );

  float factor =
    1.0 +
    k1 * r2 +
    k2 * r2 * r2;

  vec2 warped =
    q * factor;

  warped.x /=
    1.04;

  /*
    Kompenzacija, da po warp-u
    ne odrežemo teksture.
  */

  warped *=
    0.78;

  vec2 uv =
    warped * 0.5 +
    0.5;

  if(
    uv.x < 0.0 ||
    uv.x > 1.0 ||
    uv.y < 0.0 ||
    uv.y > 1.0
  ){

    gl_FragColor =
      vec4(
        0.0,
        0.0,
        0.0,
        1.0
      );

    return;
  }

  gl_FragColor =
    texture2D(
      eyeTexture,
      uv
    );
}

`;

/* =========================================================
   BUILD VR FOR CURRENT PHONE VIEWPORT
========================================================= */

function disposeVR(){

  if(leftQuad){

    outputScene.remove(
      leftQuad
    );

    leftQuad.geometry.dispose();
    leftQuad.material.dispose();

    leftQuad =
      null;
  }

  if(rightQuad){

    outputScene.remove(
      rightQuad
    );

    rightQuad.geometry.dispose();
    rightQuad.material.dispose();

    rightQuad =
      null;
  }

  if(leftRT){

    leftRT.dispose();

    leftRT =
      null;
  }

  if(rightRT){

    rightRT.dispose();

    rightRT =
      null;
  }
}

function buildVR(){

  disposeVR();

  const layout =
    getVRLayout();

  const dpr =
    Math.min(
      devicePixelRatio || 1,
      2
    );

  /*
    Render target je vezan na
    DEJANSKO velikost očesnega okna
    telefona, ne na računalniško
    referenco.
  */

  const targetWidth =
    Math.max(
      512,
      Math.round(
        layout.eyeWidth *
        dpr
      )
    );

  const targetHeight =
    Math.max(
      512,
      Math.round(
        layout.eyeHeight *
        dpr
      )
    );

  leftRT =
    new THREE.WebGLRenderTarget(
      targetWidth,
      targetHeight,
      {
        minFilter:
          THREE.LinearFilter,

        magFilter:
          THREE.LinearFilter,

        depthBuffer:true,

        stencilBuffer:false
      }
    );

  rightRT =
    new THREE.WebGLRenderTarget(
      targetWidth,
      targetHeight,
      {
        minFilter:
          THREE.LinearFilter,

        magFilter:
          THREE.LinearFilter,

        depthBuffer:true,

        stencilBuffer:false
      }
    );

  const geometryLeft =
    new THREE.PlaneGeometry(
      2,
      2
    );

  const geometryRight =
    new THREE.PlaneGeometry(
      2,
      2
    );

  const makeMaterial =
    (
      texture,
      offsetX
    ) => {

      return new THREE.ShaderMaterial({

        uniforms:{

          eyeTexture:{
            value:texture
          },

          eyeScale:{
            value:
              new THREE.Vector2(
                layout.eyeScaleX,
                layout.eyeScaleY
              )
          },

          eyeOffset:{
            value:
              new THREE.Vector2(
                offsetX,
                layout.centerY
              )
          },

          k1:{
            value:
              VR_LAYOUT.k1
          },

          k2:{
            value:
              VR_LAYOUT.k2
          }
        },

        vertexShader:
          vrVertexShader,

        fragmentShader:
          vrFragmentShader,

        depthTest:false,
        depthWrite:false,
        transparent:false
      });
    };

  leftQuad =
    new THREE.Mesh(

      geometryLeft,

      makeMaterial(
        leftRT.texture,
        layout.leftOffsetX
      )
    );

  rightQuad =
    new THREE.Mesh(

      geometryRight,

      makeMaterial(
        rightRT.texture,
        layout.rightOffsetX
      )
    );

  leftQuad.frustumCulled =
    false;

  rightQuad.frustumCulled =
    false;

  outputScene.add(
    leftQuad
  );

  outputScene.add(
    rightQuad
  );

  /*
    Reticle se prav tako postavi
    na dejanski center očesnih
    površin telefona.
  */

  reticleLeft.style.left =
    (
      layout.leftCenterPx /
      layout.W *
      100
    ) + "%";

  reticleRight.style.left =
    (
      layout.rightCenterPx /
      layout.W *
      100
    ) + "%";

  reticleLeft.style.top =
    "50%";

  reticleRight.style.top =
    "50%";
}

let vrInfo =

function removeVRInfo(){

  if(!vrInfo){
    return;
  }

  scene.remove(
    vrInfo
  );

  vrInfo.traverse(
    object => {

      if(object.geometry){
        object.geometry.dispose();
      }

      if(object.material){

        if(object.material.map){
          object.material.map.dispose();
        }

        object.material.dispose();
      }
    }
  );

  vrInfo =
    null;
}

function wrapText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight,
  maxLines
){

  const words =
    String(text)
      .split(/\s+/);

  let line =
    "";

  let lineNo =
    0;

  for(const word of words){

    const test =
      line + word + " ";

    if(
      ctx.measureText(test).width >
        maxWidth &&
      line
    ){

      ctx.fillText(
        line,
        x,
        y +
        lineNo *
        lineHeight
      );

      lineNo++;

      if(lineNo >= maxLines){
        return;
      }

      line =
        word + " ";
    }
    else{

      line =
        test;
    }
  }

  if(lineNo < maxLines){

    ctx.fillText(
      line,
      x,
      y +
      lineNo *
      lineHeight
    );
  }
}

function showVRInfo(
  hotspot
){

  removeVRInfo();

  const infoCanvas =
    document.createElement(
      "canvas"

  infoCanvas.width =
    1024;

  infoCanvas.height =

  const ctx =
    infoCanvas.getContext(
      "2d"
    );

  ctx.fillStyle =
    "rgba(255,255,255,.96)";

  ctx.fillRect(
    0,
    0,
    1024,
    512
  );

  ctx.fillStyle =
    "#111";

  ctx.font =
    "bold 56px Arial";

  wrapText(
    ctx,
    hotspot.title ||
      "Brez naslova",
    60,
    90,
    900,
    65,
    2
  );

  ctx.fillStyle =
    "#333";

  ctx.font =
    "34px Arial";

  wrapText(
    ctx,
    hotspot.description ||
      "Ni opisa.",
    60,
    235,
    900,
    48,
    5
  );

  const texture =
    new THREE.CanvasTexture(
      infoCanvas
    );

  texture.colorSpace =
    THREE.SRGBColorSpace;

  const material =
    new THREE.MeshBasicMaterial({
      map:texture,
      transparent:true,
      side:THREE.DoubleSide
    });

  const card =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        2.8,
        1.4
      ),

      material
    );

  const group =
    new THREE.Group();

  group.add(
    card
  );

  const forward =
    new THREE.Vector3();

  camera.getWorldDirection(
    forward
  );

  group.position.copy(

    camera.position
      .clone()
      .add(
        forward.multiplyScalar(3)
      )
  );

  group.lookAt(
    camera.position
  );

  scene.add(
    group
  );

  vrInfo =
    group;
}

/* =========================================================
   GAZE
========================================================= */

const gazeRay =
  new THREE.Raycaster();

let gazeId =
  null;

let gazeStart =
  0;

let gazeDone =
  false;

const GAZE_TIME =
  1200;

function resetGaze(){

  gazeId =
    null;

  gazeStart =
    0;

  gazeDone =
    false;

  reticleLeft.classList.remove(
    "active"
  );

  reticleRight.classList.remove(
    "active"
  );
}

function updateGaze(){

  const forward =
    new THREE.Vector3(
      0,
      0,
      -1
    )
    .applyQuaternion(
      camera.quaternion
    )
    .normalize();

  gazeRay.set(
    camera.position,
    forward
  );

  const hits =
    gazeRay.intersectObjects(
      hotspotMeshes,
      false
    );

  const id =
    hits.length
      ? hits[0]
          .object
          .userData
          .hotspotId
      : null;

  if(!id){

    resetGaze();

    return;
  }

  if(id !== gazeId){

    gazeId =
      id;

    gazeStart =
      performance.now();

    gazeDone =
      false;

    reticleLeft.classList.remove(
      "active"
    );

    reticleRight.classList.remove(
      "active"
    );

    void reticleLeft.offsetWidth;

    reticleLeft.classList.add(
      "active"
    );

    reticleRight.classList.add(
      "active"
    );

    return;
  }

  if(
    !gazeDone &&
    performance.now() -
      gazeStart >=
      GAZE_TIME
  ){

    gazeDone =
      true;

    const hotspot =
      getHotspot(id);

    if(hotspot){

      showVRInfo(
        hotspot
      );
    }
  }
}

/* =========================================================

========================================================= */

async function enterVR(){

  if(vrMode){
    return;
  }

  vrMode =
    true;

  toolbar.style.display =
    "none";

  popup.style.display =
    "none";

  hint.style.display =
    "none";

  vrUI.style.display =
    "block";

  sensorReady =
    false;

  window.addEventListener(
    "deviceorientation",
    onOrientation,
    true
  );

  /*
    Fullscreen najprej.
  */

  try{

    if(
      !document.fullscreenElement &&
      document.documentElement
        .requestFullscreen
    ){

      await document
        .documentElement
        .requestFullscreen();
    }
  }
  catch(e){}

  /*
    Nato landscape lock.
  */

  try{

    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      await screen.orientation.lock(
        "landscape"
      );
    }
  }
  catch(e){}

  /*
    Telefon po fullscreen/landscape
    potrebuje trenutek, da posodobi
    innerWidth/innerHeight.

    Zato NE uporabljamo desktop
    dimenzij pred prehodom.
  */

  setTimeout(
    () => {

      resizeRenderer();

      buildVR();
    },
    250
  );

  setTimeout(
    () => {

      if(vrMode){

        resizeRenderer();

        buildVR();
      }
    },
    650
  );

  acquireWakeLock();
}

   EXIT VR
========================================================= */

exitVR.onclick =
  exitCardboard;

async function exitCardboard(){

  if(!vrMode){
    return;
  }

  vrMode =
    false;

  window.removeEventListener(
    "deviceorientation",
    onOrientation,
    true
  );

  await releaseWakeLock();

  removeVRInfo();

  resetGaze();

  disposeVR();

  vrUI.style.display =
    "none";

  toolbar.style.display =
    "flex";

  camera.quaternion.identity();

  camera.rotation.set(
    0,
    0,
    0
  );

  camera.fov =
    normalFov;

  updateNormalCamera();

  try{

    if(
      screen.orientation &&
      screen.orientation.unlock
    ){

      screen.orientation.unlock();
    }
  }
  catch(e){}

  try{

    if(
      document.fullscreenElement &&
      document.exitFullscreen
    ){

      await document.exitFullscreen();
    }
  }
  catch(e){}

  setTimeout(
    resizeRenderer,
    100
  );
}

/* =========================================================
   NORMAL RENDER
========================================================= */

function renderNormal(){

  renderer.setRenderTarget(
    null
  );

  renderer.setScissorTest(
    false
  );

  renderer.setViewport(
    0,
    0,
    renderer.domElement.width,
    renderer.domElement.height
  );

  renderer.setClearColor(
    0x000000,
    1
  );

  renderer.clear(
    true,
    true,
    true
  );

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
   VR RENDER
========================================================= */

function renderVR(){

  if(
    !leftRT ||
    !rightRT ||
    !leftQuad ||
    !rightQuad
  ){
    return;
  }

  updateDeviceOrientation();

  const layout =
    getVRLayout();

  /*
    Kamera posameznega očesa uporablja
    aspect dejanskega očesnega render
    targeta telefona.
  */

  camera.aspect =
    layout.eyeWidth /
    layout.eyeHeight;

  camera.fov =
    VR_LAYOUT.fov;

  camera.updateProjectionMatrix();

  camera.updateMatrixWorld(
    true
  );

  stereoCamera.eyeSep =
    VR_LAYOUT.eyeSep;

  stereoCamera.update(
    camera
  );

  /* -------------------------
     LEFT
  ------------------------- */

  renderer.setRenderTarget(
    leftRT
  );

  renderer.setScissorTest(
    false
  );

  renderer.setViewport(
    0,
    0,
    leftRT.width,
    leftRT.height
  );

  renderer.setClearColor(
    0x000000,
    1
  );

  renderer.clear(
    true,
    true,
    true
  );

  renderer.render(
    scene,
    stereoCamera.cameraL
  );

  /* -------------------------
     RIGHT
  ------------------------- */

  renderer.setRenderTarget(
    rightRT
  );

  renderer.setViewport(
    0,
    0,
    rightRT.width,
    rightRT.height
  );

  renderer.setClearColor(
    0x000000,
    1
  );

  renderer.clear(
    true,
    true,
    true
  );

  renderer.render(
    scene,
    stereoCamera.cameraR
  );

  /* -------------------------
     PHONE DISPLAY
  ------------------------- */

  renderer.setRenderTarget(
    null
  );

  renderer.setScissorTest(
    false
  );

  renderer.setViewport(
    0,
    0,
    renderer.domElement.width,
    renderer.domElement.height
  );

  /*
    Vedno najprej črn cel zaslon.
  */

  renderer.setClearColor(
    0x000000,
    1
  );

  renderer.clear(
    true,
    true,
    true
  );

  /*
    Na zaslon gre SAMO outputScene.

    Torej:
    - levo Cardboard oko
    - desno Cardboard oko
    - črna okolica

    Nikoli neposredno 360 panorama.
  */

  renderer.render(
    outputScene,
    outputCamera
  );

  updateGaze();
}

/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
  null;

function resizeRenderer(){

  renderer.setPixelRatio(
    Math.min(
      devicePixelRatio || 1,
      2
    )
  );

  renderer.setSize(
    innerWidth,
    innerHeight,
    false
  );

  if(!vrMode){

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.fov =
      normalFov;

    camera.updateProjectionMatrix();
  }
}

function handlePhoneResize(){

  resizeRenderer();

  if(!vrMode){
    return;
  }

  clearTimeout(
    resizeTimer
  );

  /*
    Android Chrome/Samsung Internet
    med rotacijo večkrat spremeni
    viewport.

    VR ponovno zgradimo šele,
    ko se dimenzije umirijo.
  */

  resizeTimer =
    setTimeout(
      () => {

        if(vrMode){

          buildVR();
        }
      },
      300
    );
}

window.addEventListener(
  "resize",
  handlePhoneResize
);

window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      handlePhoneResize,
      350
    );

    setTimeout(
      handlePhoneResize,
      700
    );
  }
);

document.addEventListener(
  "fullscreenchange",
  () => {

    setTimeout(
      handlePhoneResize,
      150
    );

    setTimeout(
      handlePhoneResize,
      500
    );
  }
);

/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key !== "Escape"){
      return;
    }

    if(vrMode){

      exitCardboard();
    }
    else{

      stopAddMode();

      closePopup();
    }
  }
);

/* =========================================================
   LOOP
========================================================= */

function loop(){

  requestAnimationFrame(
    loop
  );

  if(vrMode){

    renderVR();
  }
  else{

    renderNormal();

    positionPopup();
  }
}

/* =========================================================
   START
========================================================= */

resizeRenderer();

loop();

</script>

</html>
