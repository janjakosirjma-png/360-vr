<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>360 Panorama</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
button,input,textarea{font:inherit}

#app,#gl{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}
#gl{
  display:block;
  touch-action:none;
}

/* TOOLBAR */
#toolbar{
  position:fixed;
  z-index:20;
  top:12px;
  left:12px;
  display:flex;
  gap:7px;
  padding:8px;
  border-radius:13px;
  background:rgba(10,10,10,.84);
}
.btn{
  border:0;
  border-radius:8px;
  min-height:42px;
  padding:0 13px;
  background:#333;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
#addBtn{background:#2563eb}
#addBtn.active{background:#16a34a}
#cardboardBtn{background:#7c3aed}

#hint{
  position:fixed;
  z-index:21;
  display:none;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  padding:10px 18px;
  border-radius:30px;
  background:rgba(0,0,0,.82);
  color:#fff;
  pointer-events:none;
}

/* POPUP */
#popup{
  position:fixed;
  z-index:30;
  display:none;
  width:330px;
  max-width:calc(100vw - 24px);
  padding:18px;
  border-radius:14px;
  background:#fff;
  color:#111;
  box-shadow:0 12px 45px rgba(0,0,0,.45);
}
#closePopup{
  position:absolute;
  right:8px;
  top:8px;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}
#reader,#editor{display:none}
#readerTitle{margin:0 35px 10px 0}
#readerText{white-space:pre-wrap;line-height:1.45;margin-bottom:15px}
#editBtn{
  width:100%;
  padding:10px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
}
label{
  display:block;
  margin:8px 0 4px;
  font-size:12px;
  font-weight:bold;
}
input,textarea{
  width:100%;
  padding:10px;
  border:1px solid #bbb;
  border-radius:8px;
}
textarea{height:115px;resize:vertical}
.row{
  display:flex;
  gap:7px;
  margin-top:10px;
}
.row button{
  flex:1;
  padding:10px;
  border:0;
  border-radius:8px;
  font-weight:bold;
}
#saveBtn{background:#16a34a;color:#fff}
#deleteBtn{background:#dc2626;color:#fff}

/* CARDBOARD START */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.92);
}
.box{
  width:390px;
  max-width:100%;
  padding:22px;
  border-radius:16px;
  background:#fff;
  text-align:center;
}
.box button{
  width:100%;
  margin-top:8px;
  padding:13px;
  border:0;
  border-radius:9px;
  font-weight:bold;
}
#startVR,#sensorBtn{background:#7c3aed;color:#fff}

/* CARDBOARD OVERLAY */
#vrUI{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  pointer-events:none;
}
.reticle{
  position:absolute;
  top:50%;
  width:24px;
  height:24px;
  transform:translate(-50%,-50%);
  border:2px solid #fff;
  border-radius:50%;
  box-shadow:0 0 5px #000;
}
.reticle:after{
  content:"";
  position:absolute;
  width:4px;
  height:4px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#fff;
}
#retL{left:25%}
#retR{left:75%}

.reticle.loading{
  animation:gaze 1.2s linear forwards;
}
@keyframes gaze{
  from{transform:translate(-50%,-50%) scale(1)}
  to{transform:translate(-50%,-50%) scale(1.8)}
}

#exitVR{
  position:absolute;
  top:10px;
  right:10px;
  pointer-events:auto;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:25px;
}

/* INFO CARD IN VR */
#vrCard{
  position:absolute;
  display:none;
  top:50%;
  width:31%;
  min-height:115px;
  transform:translate(-50%,-50%);
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.94);
  color:#111;
  overflow:hidden;
}
#vrCard.left{left:25%}
#vrCard.right{left:75%}
#vrCard h3{margin:0 0 7px;font-size:16px}
#vrCard p{margin:0;font-size:12px;line-height:1.35}

#vrCard2{
  position:absolute;
  display:none;
  top:50%;
  left:75%;
  width:31%;
  min-height:115px;
  transform:translate(-50%,-50%);
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.94);
  color:#111;
}
#vrCard2 h3{margin:0 0 7px;font-size:16px}
#vrCard2 p{margin:0;font-size:12px;line-height:1.35}

@media(max-width:700px){
  #toolbar{
    top:7px;
    left:7px;
    right:7px;
    justify-content:center;
  }
  .btn{
    min-height:38px;
    padding:0 9px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="app">
  <canvas id="gl"></canvas>
</div>

<div id="toolbar">
  <button class="btn" id="addBtn">+ Dodaj hotspot</button>
  <button class="btn" id="zoomIn">+</button>
  <button class="btn" id="zoomOut">−</button>
  <button class="btn" id="fullscreen">⛶</button>
  <button class="btn" id="cardboardBtn">🥽 CARDBOARD</button>
</div>

<div id="hint">Klikni na mesto v panorami.</div>

<div id="popup">
  <button id="closePopup">×</button>

  <div id="reader">
    <h2 id="readerTitle"></h2>
    <div id="readerText"></div>
    <button id="editBtn">Uredi</button>
  </div>

  <div id="editor">
    <label>Naslov</label>
    <input id="titleInput">

    <label>Opis</label>
    <textarea id="descriptionInput"></textarea>

    <div class="row">
      <button id="saveBtn">Shrani</button>
      <button id="cancelBtn">Prekliči</button>
      <button id="deleteBtn">Izbriši</button>
    </div>
  </div>
</div>

<div id="vrStart" class="modal">
  <div class="box">
    <h2>🥽 Cardboard</h2>
    <p>Telefon obrni vodoravno.</p>
    <p>
      Prikaz bo imel dve ukrivljeni sliki,
      eno za vsako oko.
    </p>
    <button id="startVR">ZAŽENI</button>
    <button id="cancelVR">Prekliči</button>
  </div>
</div>

<div id="sensorModal" class="modal">
  <div class="box">
    <h2>Senzor gibanja</h2>
    <p>Dovoli uporabo giroskopa telefona.</p>
    <button id="sensorBtn">DOVOLI</button>
  </div>
</div>

<div id="vrUI">
  <div class="reticle" id="retL"></div>
  <div class="reticle" id="retR"></div>

  <div id="vrCard">
    <h3 id="vrTitle1"></h3>
    <p id="vrText1"></p>
  </div>

  <div id="vrCard2">
    <h3 id="vrTitle2"></h3>
    <p id="vrText2"></p>
  </div>

  <button id="exitVR">×</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const canvas = document.getElementById("gl");

const toolbar = document.getElementById("toolbar");
const addBtn = document.getElementById("addBtn");
const zoomInBtn = document.getElementById("zoomIn");
const zoomOutBtn = document.getElementById("zoomOut");
const fullscreenBtn = document.getElementById("fullscreen");
const cardboardBtn = document.getElementById("cardboardBtn");
const hint = document.getElementById("hint");

const popup = document.getElementById("popup");
const closePopupBtn = document.getElementById("closePopup");
const reader = document.getElementById("reader");
const editor = document.getElementById("editor");
const readerTitle = document.getElementById("readerTitle");
const readerText = document.getElementById("readerText");
const editBtn = document.getElementById("editBtn");
const titleInput = document.getElementById("titleInput");
const descriptionInput = document.getElementById("descriptionInput");
const saveBtn = document.getElementById("saveBtn");
const cancelBtn = document.getElementById("cancelBtn");
const deleteBtn = document.getElementById("deleteBtn");

const vrStart = document.getElementById("vrStart");
const startVRBtn = document.getElementById("startVR");
const cancelVRBtn = document.getElementById("cancelVR");

const sensorModal = document.getElementById("sensorModal");
const sensorBtn = document.getElementById("sensorBtn");

const vrUI = document.getElementById("vrUI");
const exitVRBtn = document.getElementById("exitVR");

const retL = document.getElementById("retL");
const retR = document.getElementById("retR");

const vrCard1 = document.getElementById("vrCard");
const vrCard2 = document.getElementById("vrCard2");

const vrTitle1 = document.getElementById("vrTitle1");
const vrText1 = document.getElementById("vrText1");
const vrTitle2 = document.getElementById("vrTitle2");
const vrText2 = document.getElementById("vrText2");


/* =========================================================
   THREE.JS
========================================================= */

const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);

renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  0.01,
  200
);

camera.position.set(0,0,0);


/* =========================================================
   PANORAMA
========================================================= */

const sphereGeometry = new THREE.SphereGeometry(
  50,
  64,
  40
);

sphereGeometry.scale(-1,1,1);

const textureLoader = new THREE.TextureLoader();

const panoramaTexture = textureLoader.load(
  "360.jpg?v=301",
  () => {
    panoramaTexture.colorSpace = THREE.SRGBColorSpace;
  }
);

const sphereMaterial = new THREE.MeshBasicMaterial({
  map: panoramaTexture
});

const panorama = new THREE.Mesh(
  sphereGeometry,
  sphereMaterial
);

scene.add(panorama);


/* =========================================================
   NORMAL CAMERA
========================================================= */

let yaw = 0;
let pitch = 0;

let dragging = false;
let moved = false;

let downX = 0;
let downY = 0;

let lastX = 0;
let lastY = 0;

function updateNormalCamera(){

  camera.rotation.order = "YXZ";

  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}


/* =========================================================
   HOTSPOTS
========================================================= */

const STORAGE_KEY = "stable-360-hotspots-v5";

let hotspots = [];

try{
  hotspots =
    JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
}catch(e){
  hotspots = [];
}

let hotspotMeshes = [];

const hotspotGroup = new THREE.Group();

scene.add(hotspotGroup);

function saveHotspots(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(hotspots)
  );
}

function sphericalToVector(yawValue,pitchValue,radius=47){

  return new THREE.Vector3(
    radius * Math.cos(pitchValue) * Math.sin(yawValue),
    radius * Math.sin(pitchValue),
    -radius * Math.cos(pitchValue) * Math.cos(yawValue)
  );
}

function directionToSpherical(dir){

  return {
    yaw: Math.atan2(dir.x,-dir.z),
    pitch: Math.asin(
      THREE.MathUtils.clamp(dir.y,-1,1)
    )
  };
}


/* =========================================================
   HOTSPOT TEXTURE
========================================================= */

function makeHotspotTexture(number){

  const c = document.createElement("canvas");

  c.width = 256;
  c.height = 256;

  const ctx = c.getContext("2d");

  ctx.clearRect(0,0,256,256);

  ctx.beginPath();
  ctx.arc(128,128,112,0,Math.PI*2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(128,128,91,0,Math.PI*2);
  ctx.fillStyle = "#ef3333";
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold 100px Arial";

  ctx.fillText(
    String(number),
    128,
    137
  );

  const texture = new THREE.CanvasTexture(c);

  texture.colorSpace = THREE.SRGBColorSpace;

  return texture;
}


function renderHotspots(){

  hotspotMeshes.forEach(mesh => {

    hotspotGroup.remove(mesh);

    if(mesh.material.map){
      mesh.material.map.dispose();
    }

    mesh.material.dispose();
  });

  hotspotMeshes = [];

  hotspots.forEach((h,index) => {

    const texture =
      makeHotspotTexture(index+1);

    const material =
      new THREE.SpriteMaterial({
        map:texture,
        transparent:true,
        depthTest:false
      });

    const sprite =
      new THREE.Sprite(material);

    sprite.position.copy(
      sphericalToVector(
        h.yaw,
        h.pitch
      )
    );

    sprite.scale.set(
      2.3,
      2.3,
      1
    );

    sprite.userData.hotspotId =
      h.id;

    hotspotGroup.add(sprite);

    hotspotMeshes.push(sprite);
  });
}


/* =========================================================
   POPUP
========================================================= */

let selectedId = null;

function hotspotById(id){
  return hotspots.find(h => h.id === id);
}

function openReader(id){

  const h = hotspotById(id);

  if(!h) return;

  selectedId = id;

  readerTitle.textContent =
    h.title || "Brez naslova";

  readerText.textContent =
    h.description || "Ni opisa.";

  editor.style.display = "none";
  reader.style.display = "block";
  popup.style.display = "block";

  positionPopup();
}

function openEditor(id){

  const h = hotspotById(id);

  if(!h) return;

  selectedId = id;

  titleInput.value =
    h.title || "";

  descriptionInput.value =
    h.description || "";

  reader.style.display = "none";
  editor.style.display = "block";
  popup.style.display = "block";

  positionPopup();
}

function closePopup(){

  popup.style.display = "none";

  selectedId = null;
}

closePopupBtn.onclick = closePopup;

editBtn.onclick = () => {

  if(selectedId){
    openEditor(selectedId);
  }
};

saveBtn.onclick = () => {

  const h = hotspotById(selectedId);

  if(!h) return;

  h.title = titleInput.value.trim();
  h.description = descriptionInput.value.trim();

  saveHotspots();

  openReader(h.id);
};

cancelBtn.onclick = () => {

  const h = hotspotById(selectedId);

  if(
    h &&
    (h.title || h.description)
  ){
    openReader(h.id);
  }else{
    closePopup();
  }
};

deleteBtn.onclick = () => {

  if(!selectedId) return;

  hotspots =
    hotspots.filter(
      h => h.id !== selectedId
    );

  saveHotspots();

  closePopup();

  renderHotspots();
};


/* =========================================================
   POPUP POSITION
========================================================= */

function positionPopup(){

  if(
    !selectedId ||
    popup.style.display === "none" ||
    cardboardMode
  ){
    return;
  }

  const h = hotspotById(selectedId);

  if(!h) return;

  const p =
    sphericalToVector(
      h.yaw,
      h.pitch
    );

  const forward =
    new THREE.Vector3();

  camera.getWorldDirection(forward);

  const dir =
    p.clone().normalize();

  if(forward.dot(dir) <= 0){

    popup.style.visibility =
      "hidden";

    return;
  }

  popup.style.visibility =
    "visible";

  p.project(camera);

  const x =
    (p.x + 1) *
    0.5 *
    innerWidth;

  const y =
    (-p.y + 1) *
    0.5 *
    innerHeight;

  const w =
    popup.offsetWidth;

  const hgt =
    popup.offsetHeight;

  let left;

  if(x < innerWidth/2){
    left = x + 28;
  }else{
    left = x - w - 28;
  }

  let top =
    y - hgt/2;

  left =
    THREE.MathUtils.clamp(
      left,
      8,
      innerWidth-w-8
    );

  top =
    THREE.MathUtils.clamp(
      top,
      8,
      innerHeight-hgt-8
    );

  popup.style.left =
    left+"px";

  popup.style.top =
    top+"px";
}


/* =========================================================
   ADD HOTSPOT
========================================================= */

let addMode = false;

function stopAddMode(){

  addMode = false;

  addBtn.classList.remove("active");

  addBtn.textContent =
    "+ Dodaj hotspot";

  hint.style.display =
    "none";
}

addBtn.onclick = () => {

  closePopup();

  addMode = !addMode;

  if(addMode){

    addBtn.classList.add("active");

    addBtn.textContent =
      "Klikni v panoramo";

    hint.style.display =
      "block";

  }else{

    stopAddMode();
  }
};


/* =========================================================
   MOUSE / TOUCH
========================================================= */

canvas.addEventListener(
  "pointerdown",
  e => {

    if(cardboardMode) return;

    dragging = true;
    moved = false;

    downX = lastX = e.clientX;
    downY = lastY = e.clientY;

    canvas.setPointerCapture(
      e.pointerId
    );
  }
);

canvas.addEventListener(
  "pointermove",
  e => {

    if(
      !dragging ||
      cardboardMode
    ) return;

    const dx =
      e.clientX-lastX;

    const dy =
      e.clientY-lastY;

    if(
      Math.hypot(
        e.clientX-downX,
        e.clientY-downY
      ) > 6
    ){
      moved = true;
    }

    if(!addMode){

      yaw -= dx*0.004;

      pitch -= dy*0.004;

      pitch =
        THREE.MathUtils.clamp(
          pitch,
          -Math.PI/2+0.05,
          Math.PI/2-0.05
        );

      updateNormalCamera();
    }

    lastX = e.clientX;
    lastY = e.clientY;
  }
);

canvas.addEventListener(
  "pointerup",
  e => {

    if(cardboardMode) return;

    dragging = false;

    if(moved) return;

    const rect =
      canvas.getBoundingClientRect();

    const mouse =
      new THREE.Vector2(
        ((e.clientX-rect.left)/rect.width)*2-1,
        -((e.clientY-rect.top)/rect.height)*2+1
      );

    const raycaster =
      new THREE.Raycaster();

    raycaster.setFromCamera(
      mouse,
      camera
    );

    /* Existing hotspot first */

    const hits =
      raycaster.intersectObjects(
        hotspotMeshes,
        false
      );

    if(
      hits.length &&
      !addMode
    ){

      openReader(
        hits[0].object.userData.hotspotId
      );

      return;
    }

    if(!addMode) return;

    const dir =
      raycaster.ray.direction
        .clone()
        .normalize();

    const spherical =
      directionToSpherical(dir);

    const hotspot = {
      id:
        "hs-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2,7),

      yaw:spherical.yaw,
      pitch:spherical.pitch,

      title:"",
      description:""
    };

    hotspots.push(hotspot);

    saveHotspots();
    renderHotspots();
    stopAddMode();

    openEditor(hotspot.id);
  }
);


/* =========================================================
   ZOOM
========================================================= */

function zoom(amount){

  if(cardboardMode) return;

  camera.fov =
    THREE.MathUtils.clamp(
      camera.fov + amount,
      30,
      100
    );

  camera.updateProjectionMatrix();
}

zoomInBtn.onclick =
  () => zoom(-8);

zoomOutBtn.onclick =
  () => zoom(8);

canvas.addEventListener(
  "wheel",
  e => {

    if(cardboardMode) return;

    e.preventDefault();

    zoom(
      e.deltaY > 0
        ? 4
        : -4
    );
  },
  {passive:false}
);


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.onclick =
async () => {

  try{

    if(!document.fullscreenElement){

      await document.documentElement
        .requestFullscreen();

    }else{

      await document.exitFullscreen();
    }

  }catch(e){}
};


/* =========================================================
   WAKE LOCK
========================================================= */

let wakeLock = null;

async function keepScreenAwake(){

  if(!("wakeLock" in navigator)){
    return;
  }

  try{

    if(
      wakeLock &&
      !wakeLock.released
    ){
      return;
    }

    wakeLock =
      await navigator.wakeLock
        .request("screen");

    wakeLock.addEventListener(
      "release",
      () => {
        wakeLock = null;
      }
    );

  }catch(e){}
}

async function releaseWakeLock(){

  if(!wakeLock) return;

  try{
    await wakeLock.release();
  }catch(e){}

  wakeLock = null;
}

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      cardboardMode &&
      document.visibilityState === "visible"
    ){
      keepScreenAwake();
    }
  }
);


/* =========================================================
   PHONE ORIENTATION
========================================================= */

let alpha = 0;
let beta = 0;
let gamma = 0;
let sensorReady = false;

function deviceOrientation(e){

  if(e.alpha === null) return;

  alpha = e.alpha || 0;
  beta = e.beta || 0;
  gamma = e.gamma || 0;

  sensorReady = true;
}

const orientEuler =
  new THREE.Euler();

const orientQ =
  new THREE.Quaternion();

const screenQ =
  new THREE.Quaternion();

const zee =
  new THREE.Vector3(0,0,1);

const q1 =
  new THREE.Quaternion(
    -Math.sqrt(.5),
    0,
    0,
    Math.sqrt(.5)
  );

function updateGyro(){

  if(!sensorReady) return;

  const a =
    THREE.MathUtils.degToRad(alpha);

  const b =
    THREE.MathUtils.degToRad(beta);

  const g =
    THREE.MathUtils.degToRad(gamma);

  let orientation = 0;

  if(
    screen.orientation &&
    typeof screen.orientation.angle === "number"
  ){
    orientation =
      THREE.MathUtils.degToRad(
        screen.orientation.angle
      );
  }else if(
    typeof window.orientation === "number"
  ){
    orientation =
      THREE.MathUtils.degToRad(
        window.orientation
      );
  }

  orientEuler.set(
    b,
    a,
    -g,
    "YXZ"
  );

  orientQ.setFromEuler(
    orientEuler
  );

  orientQ.multiply(q1);

  screenQ.setFromAxisAngle(
    zee,
    -orientation
  );

  orientQ.multiply(screenQ);

  camera.quaternion.copy(
    orientQ
  );
}


/* =========================================================
   CARDBOARD

   Pomembno:
   tokrat ne uporabljamo drugega A-Frame render loopa.
   Obstaja samo EN renderer.
========================================================= */

let cardboardMode = false;

const stereo =
  new THREE.StereoCamera();

stereo.eyeSep = 0.064;

const vrFov = 78;

/*
  Vsako oko je najprej renderirano
  v svojo teksturo.
*/

let leftTarget = null;
let rightTarget = null;

const outputScene =
  new THREE.Scene();

const outputCamera =
  new THREE.Camera();

let leftQuad = null;
let rightQuad = null;


/* =========================================================
   YT-LIKE DISTORTION SHADER

   To je ista osnovna oblika:
   ena ukrivljena slika, skrčena na levo polovico,
   in druga enaka na desno polovico.
========================================================= */

const vertexShader = `
varying vec2 vUv;

void main(){
  vUv = uv;

  gl_Position =
    vec4(
      position.xy,
      0.0,
      1.0
    );
}
`;

const fragmentShader = `
precision highp float;

uniform sampler2D map;
varying vec2 vUv;

void main(){

  vec2 p =
    vUv * 2.0 - 1.0;

  /*
     Radialna pred-deformacija.
  */

  float r2 =
    dot(p,p);

  float factor =
    1.0 +
    0.18*r2 +
    0.055*r2*r2;

  vec2 d =
    p * factor;

  vec2 uv =
    d*0.5 + 0.5;

  /*
     Izven ukrivljenega pogleda = črno.
  */

  if(
    uv.x < 0.0 ||
    uv.x > 1.0 ||
    uv.y < 0.0 ||
    uv.y > 1.0
  ){
    gl_FragColor =
      vec4(0.0,0.0,0.0,1.0);

    return;
  }

  gl_FragColor =
    texture2D(map,uv);
}
`;


function buildCardboard(){

  disposeCardboard();

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  const eyeW =
    Math.max(
      512,
      Math.floor(
        innerWidth *
        0.5 *
        dpr
      )
    );

  const eyeH =
    Math.max(
      512,
      Math.floor(
        innerHeight *
        dpr
      )
    );

  leftTarget =
    new THREE.WebGLRenderTarget(
      eyeW,
      eyeH,
      {
        minFilter:THREE.LinearFilter,
        magFilter:THREE.LinearFilter,
        depthBuffer:true
      }
    );

  rightTarget =
    new THREE.WebGLRenderTarget(
      eyeW,
      eyeH,
      {
        minFilter:THREE.LinearFilter,
        magFilter:THREE.LinearFilter,
        depthBuffer:true
      }
    );

  const leftMat =
    new THREE.ShaderMaterial({
      uniforms:{
        map:{
          value:leftTarget.texture
        }
      },
      vertexShader,
      fragmentShader,
      depthTest:false,
      depthWrite:false
    });

  const rightMat =
    new THREE.ShaderMaterial({
      uniforms:{
        map:{
          value:rightTarget.texture
        }
      },
      vertexShader,
      fragmentShader,
      depthTest:false,
      depthWrite:false
    });

  /*
    Clip-space cel zaslon:
    -1 do +1.

    Posamezna slika je široka 0.88.
    Središči sta -0.5 in +0.5.

    Tako dobimo:
       [ ukrivljena LEVA ] [ ukrivljena DESNA ]
  */

  leftQuad =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        0.88,
        1.62
      ),
      leftMat
    );

  rightQuad =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        0.88,
        1.62
      ),
      rightMat
    );

  leftQuad.position.x =
    -0.5;

  rightQuad.position.x =
    0.5;

  outputScene.add(leftQuad);
  outputScene.add(rightQuad);
}


function disposeCardboard(){

  if(leftQuad){

    outputScene.remove(leftQuad);

    leftQuad.geometry.dispose();
    leftQuad.material.dispose();

    leftQuad = null;
  }

  if(rightQuad){

    outputScene.remove(rightQuad);

    rightQuad.geometry.dispose();
    rightQuad.material.dispose();

    rightQuad = null;
  }

  if(leftTarget){

    leftTarget.dispose();

    leftTarget = null;
  }

  if(rightTarget){

    rightTarget.dispose();

    rightTarget = null;
  }
}


/* =========================================================
   START CARDBOARD
========================================================= */

cardboardBtn.onclick = () => {

  closePopup();
  stopAddMode();

  vrStart.style.display =
    "flex";
};

cancelVRBtn.onclick = () => {

  vrStart.style.display =
    "none";
};

startVRBtn.onclick =
async () => {

  vrStart.style.display =
    "none";

  /*
    iOS zahteva dovoljenje.
  */

  if(
    typeof DeviceOrientationEvent !== "undefined" &&
    typeof DeviceOrientationEvent.requestPermission === "function"
  ){

    sensorModal.style.display =
      "flex";

    return;
  }

  await enterCardboard();
};

sensorBtn.onclick =
async () => {

  try{

    const permission =
      await DeviceOrientationEvent
        .requestPermission();

    if(permission !== "granted"){

      alert(
        "Senzor gibanja ni dovoljen."
      );

      return;
    }

    sensorModal.style.display =
      "none";

    await enterCardboard();

  }catch(e){

    alert(
      "Senzorja ni bilo mogoče zagnati."
    );
  }
};


async function enterCardboard(){

  if(cardboardMode) return;

  cardboardMode = true;

  toolbar.style.display =
    "none";

  popup.style.display =
    "none";

  hint.style.display =
    "none";

  vrUI.style.display =
    "block";

  vrCard1.style.display =
    "none";

  vrCard2.style.display =
    "none";

  /*
    Zaslon ostane prižgan.
  */

  keepScreenAwake();

  /*
    Senzor.
  */

  window.addEventListener(
    "deviceorientation",
    deviceOrientation,
    true
  );

  /*
    Fullscreen.
  */

  try{

    if(
      !document.fullscreenElement &&
      document.documentElement.requestFullscreen
    ){
      await document.documentElement
        .requestFullscreen();
    }

  }catch(e){}

  /*
    Landscape.
  */

  try{

    if(
      screen.orientation &&
      screen.orientation.lock
    ){
      await screen.orientation.lock(
        "landscape"
      );
    }

  }catch(e){}

  buildCardboard();

  resize();
}


/* =========================================================
   EXIT CARDBOARD
========================================================= */

exitVRBtn.onclick =
  exitCardboard;

async function exitCardboard(){

  if(!cardboardMode) return;

  cardboardMode = false;

  window.removeEventListener(
    "deviceorientation",
    deviceOrientation,
    true
  );

  releaseWakeLock();

  disposeCardboard();

  vrUI.style.display =
    "none";

  vrCard1.style.display =
    "none";

  vrCard2.style.display =
    "none";

  toolbar.style.display =
    "flex";

  resetGaze();

  /*
    Vrnemo normalen pogled.
  */

  camera.rotation.set(0,0,0);

  camera.quaternion.identity();

  updateNormalCamera();

  camera.fov = 75;

  resize();

  try{

    if(
      screen.orientation &&
      screen.orientation.unlock
    ){
      screen.orientation.unlock();
    }

  }catch(e){}

  try{

    if(
      document.fullscreenElement &&
      document.exitFullscreen
    ){
      await document.exitFullscreen();
    }

  }catch(e){}
}


/* =========================================================
   GAZE
========================================================= */

const gazeRaycaster =
  new THREE.Raycaster();

let gazeId = null;
let gazeTime = 0;
let gazeTriggered = false;

const GAZE_DELAY = 1200;

function resetGaze(){

  gazeId = null;
  gazeTime = 0;
  gazeTriggered = false;

  retL.classList.remove(
    "loading"
  );

  retR.classList.remove(
    "loading"
  );
}

function updateGaze(){

  gazeRaycaster.set(
    camera.position,
    new THREE.Vector3(0,0,-1)
      .applyQuaternion(
        camera.quaternion
      )
      .normalize()
  );

  const hits =
    gazeRaycaster.intersectObjects(
      hotspotMeshes,
      false
    );

  const id =
    hits.length
      ? hits[0].object.userData.hotspotId
      : null;

  if(!id){

    resetGaze();

    return;
  }

  if(id !== gazeId){

    gazeId = id;
    gazeTime = performance.now();
    gazeTriggered = false;

    retL.classList.remove(
      "loading"
    );

    retR.classList.remove(
      "loading"
    );

    void retL.offsetWidth;

    retL.classList.add(
      "loading"
    );

    retR.classList.add(
      "loading"
    );

    return;
  }

  if(
    !gazeTriggered &&
    performance.now()-gazeTime >=
    GAZE_DELAY
  ){

    gazeTriggered = true;

    showVRInfo(id);
  }
}


function showVRInfo(id){

  const h = hotspotById(id);

  if(!h) return;

  const title =
    h.title || "Brez naslova";

  const text =
    h.description || "Ni opisa.";

  vrTitle1.textContent =
    title;

  vrText1.textContent =
    text;

  vrTitle2.textContent =
    title;

  vrText2.textContent =
    text;

  /*
    Enaka kartica v obeh očesih.
  */

  vrCard1.className =
    "left";

  vrCard1.style.display =
    "block";

  vrCard2.style.display =
    "block";

  resetGaze();
}


/* =========================================================
   RENDER NORMAL
========================================================= */

function renderNormal(){

  renderer.setRenderTarget(null);

  renderer.setScissorTest(false);

  renderer.setClearColor(
    0x000000,
    1
  );

  renderer.clear();

  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   RENDER CARDBOARD
========================================================= */

function renderCardboard(){

  if(
    !leftTarget ||
    !rightTarget ||
    !leftQuad ||
    !rightQuad
  ){
    return;
  }

  /*
    Gyro najprej premakne kamero.
  */

  updateGyro();

  camera.aspect =
    (innerWidth * .5) /
    innerHeight;

  camera.fov =
    vrFov;

  camera.updateProjectionMatrix();

  camera.updateMatrixWorld(true);

  stereo.eyeSep =
    0.064;

  stereo.update(camera);

  /*
    LEVO OKO.
  */

  renderer.setRenderTarget(
    leftTarget
  );

  renderer.setScissorTest(false);

  renderer.setClearColor(
    0x000000,
    1
  );

  renderer.clear();

  renderer.render(
    scene,
    stereo.cameraL
  );

  /*
    DESNO OKO.
  */

  renderer.setRenderTarget(
    rightTarget
  );

  renderer.clear();

  renderer.render(
    scene,
    stereo.cameraR
  );

  /*
    OBE UKRIVLJENI SLIKI NA TELEFON.
  */

  renderer.setRenderTarget(null);

  renderer.setScissorTest(false);

  renderer.setClearColor(
    0x000000,
    1
  );

  renderer.clear();

  renderer.render(
    outputScene,
    outputCamera
  );

  updateGaze();
}


/* =========================================================
   MAIN LOOP

   SAMO EN requestAnimationFrame.
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(cardboardMode){

    renderCardboard();

  }else{

    renderNormal();

    positionPopup();
  }
}

animate();


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  renderer.setSize(
    innerWidth,
    innerHeight,
    false
  );

  if(!cardboardMode){

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();
  }
}

window.addEventListener(
  "resize",
  resize
);

window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      resize,
      250
    );
  }
);

resize();

renderHotspots();

updateNormalCamera();


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  e => {

    if(e.key !== "Escape")
      return;

    if(cardboardMode){

      exitCardboard();

    }else{

      closePopup();

      stopAddMode();
    }
  }
);

</script>
