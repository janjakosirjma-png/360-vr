<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slika 260 – Hotspoti</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    header {
      padding: 16px 24px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .toolbar {
      padding: 12px 24px;
      background: white;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    #addModeBtn {
      background: #2563eb;
      color: white;
    }

    #addModeBtn.active {
      background: #16a34a;
    }

    .workspace {
      padding: 25px;
      display: flex;
      justify-content: center;
    }

    /* Kontejner slike */
    #imageContainer {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }

    #mainImage {
      display: block;
      max-width: 100%;
      height: auto;
      user-select: none;
    }

    /* Hotspot */
    .hotspot {
      position: absolute;
      width: 28px;
      height: 28px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #ef4444;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
      cursor: pointer;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.15);
    }

    /* Popup */
    #popup {
      position: absolute;
      display: none;
      width: 280px;
      background: white;
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,.25);
      z-index: 20;
    }

    #popup textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 8px;
      margin: 10px 0;
      font-family: inherit;
    }

    .popupButtons {
      display: flex;
      gap: 7px;
    }

    #saveBtn {
      background: #16a34a;
      color: white;
    }

    #deleteBtn {
      background: #dc2626;
      color: white;
    }

    #closeBtn {
      background: #e5e7eb;
    }

    .hint {
      padding: 8px 24px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>Slika 260</h1>
  <p>Interaktivna slika z opisnimi točkami</p>
</header>

<div class="toolbar">
  <button id="addModeBtn">+ Dodaj hotspot</button>
</div>

<div class="hint">
  Klikni »Dodaj hotspot«, nato klikni na želeno mesto na sliki.
</div>

<div class="workspace">

  <div id="imageContainer">

    <!-- TUKAJ ZAMENJAJ SVOJO SLIKO -->
    <img id="mainImage" src="slika260.jpg" alt="Slika 260">

    <div id="popup">
      <strong>Opis hotspota</strong>

      <textarea
        id="description"
        placeholder="Vpiši opis..."
      ></textarea>

      <div class="popupButtons">
        <button id="saveBtn">Shrani</button>
        <button id="deleteBtn">Izbriši</button>
        <button id="closeBtn">Zapri</button>
      </div>
    </div>

  </div>

</div>

<script>
  const container = document.getElementById("imageContainer");
  const image = document.getElementById("mainImage");

  const addModeBtn = document.getElementById("addModeBtn");

  const popup = document.getElementById("popup");
  const description = document.getElementById("description");

  const saveBtn = document.getElementById("saveBtn");
  const deleteBtn = document.getElementById("deleteBtn");
  const closeBtn = document.getElementById("closeBtn");

  let addMode = false;
  let selectedHotspotId = null;

  // Naloži shranjene hotspote
  let hotspots = JSON.parse(
    localStorage.getItem("slika260-hotspots")
  ) || [];

  function saveHotspots() {
    localStorage.setItem(
      "slika260-hotspots",
      JSON.stringify(hotspots)
    );
  }

  // ------------------------------------
  // NAČIN DODAJANJA
  // ------------------------------------

  addModeBtn.addEventListener("click", () => {

    addMode = !addMode;

    if (addMode) {
      addModeBtn.textContent = "Klikni na sliko...";
      addModeBtn.classList.add("active");
    } else {
      addModeBtn.textContent = "+ Dodaj hotspot";
      addModeBtn.classList.remove("active");
    }

  });


  // ------------------------------------
  // KLIK NA SLIKO
  // ------------------------------------

  image.addEventListener("click", (event) => {

    if (!addMode) return;

    const rect = image.getBoundingClientRect();

    // Uporabimo procente, da hotspot ostane
    // na pravem mestu tudi pri resize slike.
    const x =
      ((event.clientX - rect.left) / rect.width) * 100;

    const y =
      ((event.clientY - rect.top) / rect.height) * 100;

    const hotspot = {
      id: Date.now(),
      x: x,
      y: y,
      description: ""
    };

    hotspots.push(hotspot);

    saveHotspots();
    renderHotspots();

    addMode = false;

    addModeBtn.textContent = "+ Dodaj hotspot";
    addModeBtn.classList.remove("active");

    // Takoj odpri opis
    openPopup(hotspot);

  });


  // ------------------------------------
  // PRIKAZ HOTSPOTOV
  // ------------------------------------

  function renderHotspots() {

    document
      .querySelectorAll(".hotspot")
      .forEach(el => el.remove());

    hotspots.forEach((hotspot, index) => {

      const el = document.createElement("div");

      el.className = "hotspot";

      el.style.left = hotspot.x + "%";
      el.style.top = hotspot.y + "%";

      el.textContent = index + 1;

      el.addEventListener("click", (event) => {

        event.stopPropagation();

        openPopup(hotspot);

      });

      container.appendChild(el);

    });

  }


  // ------------------------------------
  // ODPIRANJE POPUPA
  // ------------------------------------

  function openPopup(hotspot) {

    selectedHotspotId = hotspot.id;

    description.value = hotspot.description;

    popup.style.display = "block";

    // Položaj popup okna
    popup.style.left =
      "calc(" + hotspot.x + "% + 20px)";

    popup.style.top =
      "calc(" + hotspot.y + "% + 20px)";

  }


  // ------------------------------------
  // SHRANI OPIS
  // ------------------------------------

  saveBtn.addEventListener("click", () => {

    const hotspot = hotspots.find(
      h => h.id === selectedHotspotId
    );

    if (!hotspot) return;

    hotspot.description = description.value;

    saveHotspots();

    popup.style.display = "none";

  });


  // ------------------------------------
  // IZBRIŠI HOTSPOT
  // ------------------------------------

  deleteBtn.addEventListener("click", () => {

    hotspots = hotspots.filter(
      h => h.id !== selectedHotspotId
    );

    saveHotspots();

    popup.style.display = "none";

    renderHotspots();

  });


  // ------------------------------------
  // ZAPRI POPUP
  // ------------------------------------

  closeBtn.addEventListener("click", () => {

    popup.style.display = "none";

  });


  // Začetni prikaz
  renderHotspots();

</script>

</body>
</html>
