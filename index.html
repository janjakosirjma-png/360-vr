<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>360° VR ogled</title>

<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

a-scene{
  position:fixed !important;
  inset:0;
  width:100% !important;
  height:100% !important;
}

/* =========================================================
   TOOLBAR
========================================================= */

#toolbar{
  position:fixed;
  z-index:10000;
  top:max(10px,env(safe-area-inset-top));
  left:max(10px,env(safe-area-inset-left));
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  padding:8px;
  border-radius:14px;
  background:rgba(0,0,0,.82);
}

button{
  min-height:42px;
  padding:0 13px;
  border:0;
  border-radius:9px;
  background:#333;
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
#popup:focus-visible{
  outline:3px solid #facc15;
  outline-offset:3px;
}

#addBtn{
  background:#2563eb;
}

#addBtn.active{
  background:#16a34a;
}

#vrBtn{
  background:#7c3aed;
}

#hint{
  position:fixed;
  z-index:10001;
  display:none;
  left:50%;
  bottom:max(22px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:max-content;
  max-width:calc(100vw - 30px);
  padding:11px 18px;
  border-radius:30px;
  background:rgba(0,0,0,.88);
  color:#fff;
  text-align:center;
  pointer-events:none;
}

/* =========================================================
   HOTSPOT POPUP
========================================================= */

#popup{
  position:fixed;
  z-index:10002;
  display:none;

  width:360px;
  max-width:calc(100vw - 20px);

  padding:20px;
  padding-top:22px;

  border-radius:14px;

  background:#fff;
  color:#111;

  box-shadow:0 12px 45px rgba(0,0,0,.5);
}

/* =========================================================
   KRIŽEC V DESNEM ZGORNJEM KOTU POPUPA
========================================================= */

#popupClose{
  position:absolute;

  top:8px;
  right:8px;

  z-index:20;

  width:36px;
  height:36px;
  min-width:36px;
  min-height:36px;

  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:50%;

  background:#222;
  color:#fff;

  font-family:Arial,Helvetica,sans-serif;
  font-size:25px;
  font-weight:400;
  line-height:1;

  cursor:pointer;
}

#popupClose:hover{
  background:#dc2626;
}

#popupClose:active{
  transform:scale(.94);
}

#reader,
#editor{
  display:none;
}

#readerTitle{
  margin:0 45px 10px 0;
  line-height:1.2;
}

#readerDescription{
  margin:0 0 15px 0;
  padding-right:5px;

  white-space:pre-wrap;
  line-height:1.5;
}

.readerButtons{
  display:flex;
  gap:7px;
}

.readerButtons button{
  flex:1;
}

#speakBtn{
  background:#16a34a;
}

#editBtn{
  background:#2563eb;
}

/* =========================================================
   EDITOR
========================================================= */

.fieldLabel{
  display:block;
  margin:10px 0 5px;
  font-size:13px;
  font-weight:700;
}

.inputRow{
  display:flex;
  gap:6px;
  align-items:stretch;
}

.inputRow input,
.inputRow textarea{
  flex:1;
  min-width:0;
}

#titleInput,
#descriptionInput{
  width:100%;
  padding:11px;
  border:1px solid #aaa;
  border-radius:8px;
  font:inherit;
}

#descriptionInput{
  min-height:115px;
  resize:vertical;
}

.dictateBtn{
  flex:0 0 auto;
  min-width:52px;
  padding:0 10px;
  background:#7c3aed;
  font-size:19px;
}

.dictateBtn.listening{
  background:#dc2626;
}

#dictationStatus{
  min-height:22px;
  margin-top:8px;
  font-size:13px;
  font-weight:700;
  color:#444;
}

#dictationStatus.listening{
  color:#dc2626;
}

.editorButtons{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.editorButtons button{
  flex:1;
}

#saveBtn{
  background:#16a34a;
}

#cancelBtn{
  background:#666;
}

#deleteBtn{
  background:#dc2626;
}

/* =========================================================
   SCREEN READER
========================================================= */

.sr-only{
  position:absolute !important;
  width:1px !important;
  height:1px !important;
  padding:0 !important;
  margin:-1px !important;
  overflow:hidden !important;
  clip:rect(0,0,0,0) !important;
  clip-path:inset(50%) !important;
  white-space:nowrap !important;
  border:0 !important;
}

/* =========================================================
   VR START
========================================================= */

#vrStart{
  position:fixed;
  inset:0;
  z-index:20000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.94);
}

#vrStartBox{
  width:390px;
  max-width:100%;
  padding:24px;
  border-radius:16px;
  background:#fff;
  color:#111;
  text-align:center;
}

#vrStartBox h2{
  margin-top:0;
}

#vrStartBox button{
  width:100%;
  margin-top:8px;
}

#startVRBtn{
  background:#7c3aed;
}

#cancelVRBtn{
  background:#666;
}

/* =========================================================
   ROTATE WARNING
========================================================= */

#rotateWarning{
  position:fixed;
  inset:0;
  z-index:30000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:#000;
  color:#fff;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.a-enter-vr{
  display:none !important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  #popup{
    width:calc(100vw - 20px);
  }

  .editorButtons,
  .readerButtons{
    flex-wrap:wrap;
  }

  .dictateBtn{
    min-width:58px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     A-FRAME
======================================================== -->

<a-scene
  id="scene"
  embedded
  vr-mode-ui="enabled:true"
  device-orientation-permission-ui="enabled:true"
  renderer="
    antialias:true;
    colorManagement:true;
    highRefreshRate:true;
    physicallyCorrectLights:false;
  "
  background="color:#000000">

  <a-assets timeout="20000">

    <img
      id="panoramaImage"
      src="360.jpg"
      crossorigin="anonymous">

  </a-assets>

  <a-sky
    id="sky"
    src="#panoramaImage"
    rotation="0 0 0">
  </a-sky>

  <a-entity id="hotspotContainer"></a-entity>

  <!-- =====================================================
       VR INFO CARD
  ====================================================== -->

  <a-entity
    id="vrInfo"
    visible="false"
    vr-card-face-camera>

    <a-plane
      width="3.4"
      height="1.9"
      color="#ffffff"
      material="
        shader:flat;
        opacity:0.97;
        transparent:true;
      ">
    </a-plane>

    <a-text
      id="vrInfoTitle"
      value=""
      color="#111111"
      width="3"
      align="center"
      anchor="center"
      wrap-count="30"
      position="0 0.47 0.02">
    </a-text>

    <a-text
      id="vrInfoDescription"
      value=""
      color="#333333"
      width="2.8"
      align="center"
      anchor="center"
      wrap-count="42"
      position="0 -0.15 0.02">
    </a-text>

    <!-- VR X -->

    <a-circle
      id="vrCloseButton"
      class="vr-close"
      radius="0.18"
      color="#222222"
      material="
        shader:flat;
        opacity:0.95;
        transparent:true;
      "
      position="1.42 0.70 0.04">

      <a-text
        value="X"
        color="#ffffff"
        width="0.65"
        align="center"
        anchor="center"
        position="0 -0.01 0.01">
      </a-text>

    </a-circle>

  </a-entity>

  <!-- =====================================================
       CAMERA
  ====================================================== -->

  <a-entity
    id="cameraRig"
    position="0 0 0">

    <a-camera
      id="camera"
      position="0 0 0"
      wasd-controls="enabled:false"
      look-controls="
        enabled:true;
        magicWindowTrackingEnabled:true;
        touchEnabled:true;
        mouseEnabled:true;
        pointerLockEnabled:false;
      ">

      <a-entity
        id="reticle"
        position="0 0 -1"
        cursor="
          fuse:true;
          fuseTimeout:1200;
        "
        raycaster="
          objects:.hotspot, .vr-close;
          far:100;
          interval:50;
        "
        geometry="
          primitive:ring;
          radiusInner:0.012;
          radiusOuter:0.019;
        "
        material="
          color:#ffffff;
          shader:flat;
          opacity:0.95;
        ">
      </a-entity>

    </a-camera>

  </a-entity>

</a-scene>

<!-- =======================================================
     TOOLBAR
======================================================== -->

<div
  id="toolbar"
  role="toolbar"
  aria-label="Orodja za 360 stopinjski ogled">

  <button
    id="addBtn"
    type="button"
    aria-pressed="false">
    + Dodaj hotspot
  </button>

  <button
    id="zoomInBtn"
    type="button"
    aria-label="Povečaj pogled">
    +
  </button>

  <button
    id="zoomOutBtn"
    type="button"
    aria-label="Pomanjšaj pogled">
    −
  </button>

  <button
    id="fullscreenBtn"
    type="button"
    aria-label="Celozaslonski način">
    ⛶
  </button>

  <button
    id="vrBtn"
    type="button">
    🥽 CARDBOARD
  </button>

</div>

<div
  id="hint"
  role="status"
  aria-live="polite">
  Tapni točno mesto v panorami
</div>

<!-- =======================================================
     HOTSPOT POPUP
======================================================== -->

<div
  id="popup"
  role="dialog"
  aria-modal="true"
  aria-labelledby="readerTitle"
  aria-describedby="readerDescription"
  tabindex="-1">

  <!--
    KRIŽEC ZA ZAPIRANJE POPUPA
  -->

  <button
    id="popupClose"
    type="button"
    aria-label="Zapri vsebino hotspota"
    title="Zapri">
    ×
  </button>

  <!-- READER -->

  <div id="reader">

    <h2
      id="readerTitle"
      tabindex="-1">
    </h2>

    <div id="readerDescription"></div>

    <div class="readerButtons">

      <button
        id="speakBtn"
        type="button"
        aria-label="Glasno preberi naslov in opis hotspota">
        🔊 Preberi
      </button>

      <button
        id="editBtn"
        type="button">
        Uredi
      </button>

    </div>

  </div>

  <!-- EDITOR -->

  <div id="editor">

    <label
      class="fieldLabel"
      for="titleInput">
      Naslov
    </label>

    <div class="inputRow">

      <input
        id="titleInput"
        type="text"
        lang="sl"
        autocomplete="off">

      <button
        id="dictateTitleBtn"
        class="dictateBtn"
        type="button"
        aria-label="Začni slovenski narek naslova"
        title="Narek naslova">
        🎤
      </button>

    </div>

    <label
      class="fieldLabel"
      for="descriptionInput">
      Opis
    </label>

    <div class="inputRow">

      <textarea
        id="descriptionInput"
        lang="sl"></textarea>

      <button
        id="dictateDescriptionBtn"
        class="dictateBtn"
        type="button"
        aria-label="Začni slovenski narek opisa"
        title="Narek opisa">
        🎤
      </button>

    </div>

    <div
      id="dictationStatus"
      role="status"
      aria-live="polite">
      Narek je pripravljen.
    </div>

    <div class="editorButtons">

      <button
        id="saveBtn"
        type="button">
        Shrani
      </button>

      <button
        id="cancelBtn"
        type="button">
        Prekliči
      </button>

      <button
        id="deleteBtn"
        type="button">
        Izbriši
      </button>

    </div>

  </div>

</div>

<!-- SCREEN READER -->

<div
  id="screenReaderAnnouncement"
  class="sr-only"
  aria-live="polite"
  aria-atomic="true">
</div>

<!-- =======================================================
     VR START
======================================================== -->

<div id="vrStart">

  <div id="vrStartBox">

    <h2>Samsung Galaxy A36</h2>

    <p>
      Obrni telefon vodoravno in ga vstavi v Cardboard očala.
    </p>

    <button
      id="startVRBtn"
      type="button">
      ZAŽENI CARDBOARD
    </button>

    <button
      id="cancelVRBtn"
      type="button">
      Prekliči
    </button>

  </div>

</div>

<div id="rotateWarning">
  Obrni Samsung Galaxy A36 vodoravno
</div>

<script>
"use strict";

/* =========================================================
   A-FRAME COMPONENTS
========================================================= */

AFRAME.registerComponent(
  "look-at-center",
  {

    tick:function(){

      if(!this.el.object3D){
        return;
      }

      this.el.object3D.lookAt(
        0,
        0,
        0
      );

    }

  }
);


AFRAME.registerComponent(
  "vr-card-face-camera",
  {

    tick:function(){

      const cameraEl =
        document.getElementById(
          "camera"
        );

      if(
        !this.el.object3D ||
        !cameraEl ||
        !cameraEl.object3D
      ){
        return;
      }

      const cameraPosition =
        new THREE.Vector3();

      cameraEl.object3D.getWorldPosition(
        cameraPosition
      );

      this.el.object3D.lookAt(
        cameraPosition
      );

    }

  }
);


/* =========================================================
   DOM
========================================================= */

const $ =
  id =>
    document.getElementById(id);


const scene =
  $("scene");

const camera =
  $("camera");

const hotspotContainer =
  $("hotspotContainer");

const reticle =
  $("reticle");

const vrInfo =
  $("vrInfo");

const vrInfoTitle =
  $("vrInfoTitle");

const vrInfoDescription =
  $("vrInfoDescription");

const vrCloseButton =
  $("vrCloseButton");


const toolbar =
  $("toolbar");

const addBtn =
  $("addBtn");

const zoomInBtn =
  $("zoomInBtn");

const zoomOutBtn =
  $("zoomOutBtn");

const fullscreenBtn =
  $("fullscreenBtn");

const vrBtn =
  $("vrBtn");

const hint =
  $("hint");


const popup =
  $("popup");

const popupClose =
  $("popupClose");

const reader =
  $("reader");

const editor =
  $("editor");

const readerTitle =
  $("readerTitle");

const readerDescription =
  $("readerDescription");

const speakBtn =
  $("speakBtn");

const editBtn =
  $("editBtn");


const titleInput =
  $("titleInput");

const descriptionInput =
  $("descriptionInput");

const dictateTitleBtn =
  $("dictateTitleBtn");

const dictateDescriptionBtn =
  $("dictateDescriptionBtn");

const dictationStatus =
  $("dictationStatus");


const saveBtn =
  $("saveBtn");

const cancelBtn =
  $("cancelBtn");

const deleteBtn =
  $("deleteBtn");


const screenReaderAnnouncement =
  $("screenReaderAnnouncement");


const vrStart =
  $("vrStart");

const startVRBtn =
  $("startVRBtn");

const cancelVRBtn =
  $("cancelVRBtn");

const rotateWarning =
  $("rotateWarning");


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
  "stable-360-hotspots-v5";


let hotspots = [];


try{

  hotspots =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

}
catch(e){

  hotspots = [];

}


function saveHotspots(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      hotspots
    )
  );

}


function getHotspot(id){

  return hotspots.find(
    hotspot =>
      hotspot.id === id
  );

}


/* =========================================================
   SPHERICAL
========================================================= */

function sphericalToVector(
  yaw,
  pitch,
  radius=8
){

  return{

    x:
      radius *
      Math.cos(pitch) *
      Math.sin(yaw),

    y:
      radius *
      Math.sin(pitch),

    z:
      -radius *
      Math.cos(pitch) *
      Math.cos(yaw)

  };

}


function vectorToSpherical(v){

  const length =
    Math.sqrt(
      v.x*v.x +
      v.y*v.y +
      v.z*v.z
    );


  if(!length){

    return{
      yaw:0,
      pitch:0
    };

  }


  const x =
    v.x/length;

  const y =
    v.y/length;

  const z =
    v.z/length;


  return{

    yaw:
      Math.atan2(
        x,
        -z
      ),

    pitch:
      Math.asin(
        THREE.MathUtils.clamp(
          y,
          -1,
          1
        )
      )

  };

}


/* =========================================================
   HOTSPOT IMAGE
========================================================= */

function makeHotspotCanvas(number){

  const c =
    document.createElement(
      "canvas"
    );


  c.width = 256;
  c.height = 256;


  const ctx =
    c.getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    256,
    256
  );


  ctx.beginPath();

  ctx.arc(
    128,
    128,
    112,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    128,
    128,
    91,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#ef3333";

  ctx.fill();


  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "bold 100px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.fillText(
    String(number),
    128,
    136
  );


  return c;

}


/* =========================================================
   HOTSPOTS
========================================================= */

function renderHotspots(){

  while(
    hotspotContainer.firstChild
  ){

    hotspotContainer.removeChild(
      hotspotContainer.firstChild
    );

  }


  hotspots.forEach(
    (hotspot,index)=>{

      const position =
        sphericalToVector(
          hotspot.yaw,
          hotspot.pitch,
          8
        );


      const marker =
        document.createElement(
          "a-image"
        );


      marker.setAttribute(
        "src",
        makeHotspotCanvas(
          index+1
        ).toDataURL(
          "image/png"
        )
      );


      marker.setAttribute(
        "position",
        `${position.x} ${position.y} ${position.z}`
      );


      marker.setAttribute(
        "width",
        "0.55"
      );


      marker.setAttribute(
        "height",
        "0.55"
      );


      marker.setAttribute(
        "material",
        "shader:flat; transparent:true; alphaTest:0.05"
      );


      marker.setAttribute(
        "look-at-center",
        ""
      );


      marker.classList.add(
        "hotspot"
      );


      marker.dataset.hotspotId =
        hotspot.id;


      marker.setAttribute(
        "aria-label",
        hotspot.title
          ? "Hotspot: "+hotspot.title
          : "Hotspot "+(index+1)
      );


      marker.addEventListener(
        "click",
        ()=>{

          if(addMode){
            return;
          }


          if(
            scene.is(
              "vr-mode"
            )
          ){

            showVRInfo(
              hotspot.id
            );

          }
          else{

            openReader(
              hotspot.id
            );

          }

        }
      );


      hotspotContainer.appendChild(
        marker
      );

    }
  );

}


/* =========================================================
   SCREEN READER
========================================================= */

function announceToScreenReader(text){

  screenReaderAnnouncement.textContent =
    "";


  setTimeout(
    ()=>{

      screenReaderAnnouncement.textContent =
        text;

    },
    40
  );

}


/* =========================================================
   POPUP
========================================================= */

let selectedHotspotId =
  null;


let focusBeforePopup =
  null;


function closePopup(){

  stopDictation();
  stopSpeaking();


  const previousFocus =
    focusBeforePopup;


  popup.style.display =
    "none";


  popup.style.visibility =
    "visible";


  selectedHotspotId =
    null;


  focusBeforePopup =
    null;


  announceToScreenReader(
    "Vsebina hotspota je zaprta."
  );


  if(
    previousFocus &&
    typeof previousFocus.focus ===
      "function"
  ){

    try{

      previousFocus.focus();

    }
    catch(e){}

  }

}


/* =========================================================
   KRIŽEC POPUPA
========================================================= */

popupClose.addEventListener(
  "click",
  event=>{

    event.preventDefault();
    event.stopPropagation();

    closePopup();

  }
);


/* =========================================================
   READER
========================================================= */

function openReader(id){

  const hotspot =
    getHotspot(id);


  if(!hotspot){
    return;
  }


  stopDictation();


  if(
    popup.style.display ===
      "none"
  ){

    focusBeforePopup =
      document.activeElement;

  }


  selectedHotspotId =
    id;


  const title =
    hotspot.title ||
    "Brez naslova";


  const description =
    hotspot.description ||
    "Ni opisa.";


  readerTitle.textContent =
    title;


  readerDescription.textContent =
    description;


  popup.removeAttribute(
    "aria-label"
  );


  popup.setAttribute(
    "aria-labelledby",
    "readerTitle"
  );


  popup.setAttribute(
    "aria-describedby",
    "readerDescription"
  );


  editor.style.display =
    "none";


  reader.style.display =
    "block";


  popup.style.display =
    "block";


  popup.style.visibility =
    "visible";


  positionPopup();


  requestAnimationFrame(
    ()=>{

      readerTitle.focus({
        preventScroll:true
      });

    }
  );


  announceToScreenReader(
    title+". "+description
  );

}


/* =========================================================
   EDITOR
========================================================= */

function openEditor(id){

  const hotspot =
    getHotspot(id);


  if(!hotspot){
    return;
  }


  stopSpeaking();


  selectedHotspotId =

/* =========================================================

========================================================= */

const SpeechRecognitionClass =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


const speechRecognitionSupported =
  !!SpeechRecognitionClass;


let recognition =
  null;


let dictationTarget =
  null;


let dictationButton =
  null;


let dictationRunning =
  false;


if(!speechRecognitionSupported){

  dictateTitleBtn.style.display =
    "none";


  dictateDescriptionBtn.style.display =
    "none";

}


/* =========================================================
   START DICTATION
========================================================= */

function startDictation(
  target,
  button
){

  if(
    dictationRunning &&
    dictationTarget === target
  ){

    stopDictation();

    return;

  }


  if(dictationRunning){

    stopDictation();

  }


  if(!speechRecognitionSupported){

    dictationStatus.textContent =
      "Narek v tem brskalniku ni podprt.";


    announceToScreenReader(
      "Narek v tem brskalniku ni podprt."
    );


    return;

  }


  recognition =
    new SpeechRecognitionClass();


  recognition.lang =
    "sl-SI";


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  dictationTarget =
    target;


  dictationButton =
    button;


  let originalText =
    target.value;


  let finalTranscript =
    "";


  recognition.onstart =
    ()=>{

      dictationRunning =
        true;


      button.classList.add(
        "listening"
      );


      button.textContent =
        "■";


      button.setAttribute(
        "aria-label",
        "Ustavi slovenski narek"
      );


      dictationStatus.classList.add(
        "listening"
      );


      dictationStatus.textContent =
        "🔴 Poslušam ... govori slovensko.";


      announceToScreenReader(
        "Narek je vključen. Govorite slovensko."
      );

    };


  recognition.onresult =
    event=>{

      let interimTranscript =
        "";


      for(
        let i=event.resultIndex;
        i<event.results.length;
        i++
      ){

        const transcript =
          event.results[i][0]
            .transcript;


        if(
          event.results[i].isFinal
        ){

          finalTranscript +=
            transcript+" ";

        }
        else{

          interimTranscript +=
            transcript;

        }

      }


      const separator =
        originalText.trim()
          ? " "
          : "";


      target.value =
        originalText +
        separator +
        finalTranscript +
        interimTranscript;


      try{

        target.selectionStart =
          target.value.length;


        target.selectionEnd =
          target.value.length;

      }
      catch(e){}

    };


  recognition.onerror =
    event=>{

      let message =
        "Napaka pri nareku.";


      if(
        event.error ===
        "not-allowed"
      ){

        message =
          "Mikrofon ni dovoljen. Brskalniku dovoli uporabo mikrofona.";

      }
      else if(
        event.error ===
        "no-speech"
      ){

        message =
          "Govora nisem zaznal.";

      }
      else if(
        event.error ===
        "audio-capture"
      ){

        message =
          "Mikrofon ni na voljo.";

      }
      else if(
        event.error ===
        "network"
      ){

        message =
          "Narek trenutno nima povezave s storitvijo za prepoznavanje govora.";

      }


      dictationStatus.textContent =
        message;


      announceToScreenReader(
        message
      );

    };


  recognition.onend =
    ()=>{

      dictationRunning =
        false;


      if(dictationButton){

        dictationButton.classList.remove(
          "listening"
        );


        dictationButton.textContent =
          "🎤";


        if(
          dictationButton ===
          dictateTitleBtn
        ){

          dictationButton.setAttribute(
            "aria-label",
            "Začni slovenski narek naslova"
          );

        }
        else{

          dictationButton.setAttribute(
            "aria-label",
            "Začni slovenski narek opisa"
          );

        }

      }


      dictationStatus.classList.remove(
        "listening"
      );


      if(
        dictationStatus.textContent.includes(
          "Poslušam"
        )
      ){

        dictationStatus.textContent =
          "Narek je ustavljen.";

      }


      dictationTarget =
        null;


      dictationButton =
        null;


      recognition =
        null;

    };


  try{

    recognition.start();

  }
  catch(e){

    dictationStatus.textContent =
      "Nareka ni bilo mogoče zagnati.";

  }

}


/* =========================================================
   STOP DICTATION
========================================================= */

function stopDictation(){

  if(recognition){

    try{

      recognition.stop();

    }

  }


  dictationRunning =

let speaking =
  false;


function findSlovenianVoice(){

  if(
    !(
      "speechSynthesis" in window
    )
  ){

    return null;

  }


  const voices =
    speechSynthesis.getVoices();


  let voice =
    voices.find(
      item =>
        item.lang &&
        item.lang.toLowerCase() ===
        "sl-si"
    );


  if(!voice){

    voice =
      voices.find(
        item =>
          item.lang &&
          item.lang
            .toLowerCase()
            .startsWith(
              "sl"
            )
      );

  }


  return voice || null;

}


function stopSpeaking(){

  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.cancel();

  }


  speaking =
    false;


  speakBtn.textContent =
    "🔊 Preberi";


  speakBtn.setAttribute(
    "aria-label",
    "Glasno preberi naslov in opis hotspota"
  );

}

/* =========================================================
   KEYBOARD ACCESSIBILITY
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    /*
      ESC = zapri popup
    */

    if(
      event.key === "Escape" &&
      popup.style.display !==
        "none"
    ){

      event.preventDefault();

      closePopup();

      return;

    }


    if(
      event.key !== "Tab" ||
      popup.style.display ===
        "none"
    ){

      return;

    }


    const focusable =
      [...popup.querySelectorAll(
        "button:not([disabled]), input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])"
      )]
      .filter(
        element =>
          element.offsetParent !== null
      );


    if(!focusable.length){
      return;
    }


    const first =
      focusable[0];


    const last =
      focusable[
        focusable.length-1
      ];


    if(
      event.shiftKey &&
      document.activeElement === first
    ){

      event.preventDefault();

      last.focus();

    }
    else if(
      !event.shiftKey &&
      document.activeElement === last
    ){

      event.preventDefault();

      first.focus();

    }

  }
);


/* =========================================================
   POPUP POSITION
========================================================= */

function positionPopup(){

  if(
    !selectedHotspotId ||
    popup.style.display === "none" ||
    scene.is("vr-mode")
  ){
    return;
  }


  const marker =
    [...hotspotContainer.children]
      .find(
        element =>
          element.dataset.hotspotId ===
          selectedHotspotId
      );


  if(
    !marker ||
    !marker.object3D ||
    !scene.camera
  ){
    return;
  }


  const worldPosition =
    new THREE.Vector3();


  marker.object3D.getWorldPosition(
    worldPosition
  );


  const cameraPosition =
    new THREE.Vector3();


  scene.camera.getWorldPosition(
    cameraPosition
  );


  const cameraDirection =
    new THREE.Vector3();


  scene.camera.getWorldDirection(
    cameraDirection
  );


  const markerDirection =
    worldPosition
      .clone()
      .sub(
        cameraPosition
      )
      .normalize();


  if(
    cameraDirection.dot(
      markerDirection
    ) <= 0
  ){

    popup.style.visibility =
      "hidden";

    return;

  }


  popup.style.visibility =
    "visible";


  worldPosition.project(
    scene.camera
  );


  const x =
    (
      worldPosition.x+1
    ) *
    0.5 *
    innerWidth;


  const y =
    (
      -worldPosition.y+1
    ) *
    0.5 *
    innerHeight;


  const width =
    popup.offsetWidth;


  const height =
    popup.offsetHeight;


  let left;


  if(
    x <
    innerWidth/2
  ){

    left =
      x+28;

  }
  else{

    left =
      x-width-28;

  }


  let top =
    y-height/2;


  left =
    THREE.MathUtils.clamp(
      left,
      8,
      innerWidth-width-8
    );


  top =
    THREE.MathUtils.clamp(
      top,
      8,
      innerHeight-height-8
    );


  popup.style.left =
    left+"px";


  popup.style.top =
    top+"px";

}

/* =========================================================
   POINTER HOTSPOT PLACEMENT
========================================================= */

let sceneCanvas =
  null;


let pointerTracking =
  false;


let pointerStartX =
  0;


let pointerStartY =
  0;


let pointerStartTime =
  0;


let pointerWasDrag =
  false;


const TAP_MOVE_LIMIT =
  14;


const TAP_TIME_LIMIT =
  650;


/* =========================================================
   CREATE HOTSPOT
========================================================= */

function createHotspotAtScreenPoint(
  clientX,
  clientY
){

  if(
    !sceneCanvas ||
    !scene.camera
  ){
    return;
  }


  const rect =
    sceneCanvas.getBoundingClientRect();


  if(
    clientX < rect.left ||
    clientX > rect.right ||
    clientY < rect.top ||
    clientY > rect.bottom
  ){
    return;
  }


  const ndc =
    new THREE.Vector2(

      (
        (
          clientX -
          rect.left
        ) /
        rect.width
      ) *
      2 -
      1,

      -(
        (
          clientY -
          rect.top
        ) /
        rect.height
      ) *
      2 +
      1

    );


  const raycaster =
    new THREE.Raycaster();


  raycaster.setFromCamera(
    ndc,
    scene.camera
  );


  const direction =
    raycaster
      .ray
      .direction
      .clone()
      .normalize();


  const spherical =
    vectorToSpherical(
      direction
    );


  const hotspot = {

    id:
      "hs-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2,7),

    yaw:
      spherical.yaw,

    pitch:
      spherical.pitch,

    title:"",

    description:""

  };


  hotspots.push(
    hotspot
  );


  saveHotspots();


  renderHotspots();


  stopAddMode();


  requestAnimationFrame(
    ()=>{

      requestAnimationFrame(
        ()=>{

          openEditor(
            hotspot.id
          );

        }
      );

    }
  );

}


/* =========================================================
   POINTER EVENTS
========================================================= */

function installPointerControls(){

  sceneCanvas =
    scene.canvas;


  if(!sceneCanvas){
    return;
  }


  sceneCanvas.addEventListener(
    "pointerdown",
    event=>{

      if(
        !addMode ||
        scene.is(
          "vr-mode"
        )
      ){
        return;
      }


      if(
        event.pointerType === "mouse" &&
        event.button !== 0
      ){
        return;
      }


      pointerTracking =
        true;


      pointerWasDrag =
        false;


      pointerStartX =
        event.clientX;


      pointerStartY =
        event.clientY;


      pointerStartTime =
        performance.now();

    },
    true
  );


  sceneCanvas.addEventListener(
    "pointermove",
    event=>{

      if(
        !pointerTracking ||
        !addMode
      ){
        return;
      }


      const distance =
        Math.hypot(

          event.clientX -
          pointerStartX,

          event.clientY -
          pointerStartY

        );


      if(
        distance >
        TAP_MOVE_LIMIT
      ){

        pointerWasDrag =
          true;

      }

    },
    true
  );


  sceneCanvas.addEventListener(
    "pointercancel",
    ()=>{

      pointerTracking =
        false;


      pointerWasDrag =
        false;

    },
    true
  );


  sceneCanvas.addEventListener(
    "pointerup",
    event=>{

      if(
        !pointerTracking
      ){
        return;
      }


      pointerTracking =
        false;


      if(
        !addMode ||
        scene.is(
          "vr-mode"
        )
      ){
        return;
      }


      const duration =
        performance.now() -
        pointerStartTime;


      const distance =
        Math.hypot(

          event.clientX -
          pointerStartX,

          event.clientY -
          pointerStartY

        );


      if(
        pointerWasDrag ||
        distance >
        TAP_MOVE_LIMIT ||
        duration >
        TAP_TIME_LIMIT
      ){

        pointerWasDrag =
          false;

        return;

      }


      pointerWasDrag =
        false;


      createHotspotAtScreenPoint(
        event.clientX,
        event.clientY
      );

    },
    true
  );

}

let normalFov =

function setFov(value){

  normalFov =
    THREE.MathUtils.clamp(
      value,
      35,
      100
    );


  if(
    camera &&
    camera.components &&
    camera.components.camera &&
    camera.components.camera.camera
  ){

    const threeCamera =
      camera
        .components
        .camera
        .camera;


    threeCamera.fov =
      normalFov;


    threeCamera.updateProjectionMatrix();

  }

}

    }


    if(
      target.classList.contains(
        "vr-close"
      )
    ){

      hideVRInfo();

      return;

    }


    if(
      target.classList.contains(
        "hotspot"
      )
    ){

      showVRInfo(
        target.dataset.hotspotId
      );

    }

  }
);


/* =========================================================
   WAKE LOCK
========================================================= */

let wakeLock =
  null;


async function acquireWakeLock(){

  if(
    !(
      "wakeLock" in navigator
    )
  ){
    return;
  }


  try{

    if(
      wakeLock &&
      !wakeLock.released
    ){
      return;
    }


    wakeLock =
      await navigator
        .wakeLock
        .request(
          "screen"
        );


    wakeLock.addEventListener(
      "release",
      ()=>{

        wakeLock =
          null;

      }
    );

  }
  catch(e){}

}


async function releaseWakeLock(){

  if(!wakeLock){
    return;
  }


  try{

    await wakeLock.release();

  }
  catch(e){}


  wakeLock =
    null;

}


/* =========================================================
   CARDBOARD
========================================================= */

vrBtn.addEventListener(
  "click",
  ()=>{

    stopSpeaking();
    stopDictation();

    closePopup();

    stopAddMode();


    vrStart.style.display =
      "flex";


    startVRBtn.focus();

  }
);


cancelVRBtn.addEventListener(
  "click",
  ()=>{

    vrStart.style.display =
      "none";


    vrBtn.focus();

  }
);


startVRBtn.addEventListener(
  "click",
  async ()=>{

    if(
      typeof DeviceOrientationEvent !==
        "undefined" &&

      typeof DeviceOrientationEvent
        .requestPermission ===
        "function"
    ){

      try{

        const permission =
          await DeviceOrientationEvent
            .requestPermission();


        if(
          permission !==
          "granted"
        ){

          alert(
            "Dovoljenje za senzor gibanja ni bilo odobreno."
          );

          return;

        }

      }
      catch(e){

        return;

      }

    }


    vrStart.style.display =
      "none";


    try{

      if(
        screen.orientation &&
        screen.orientation.lock
      ){

        await screen.orientation.lock(
          "landscape"
        );

      }

    }
    catch(e){}


    try{

      await scene.enterVR();

    }
    catch(e){

      alert(
        "Brskalnik ni uspel zagnati VR načina."
      );

    }

  }
);


/* =========================================================
   ENTER VR
========================================================= */

scene.addEventListener(
  "enter-vr",
  async ()=>{

    stopDictation();
    stopSpeaking();

    stopAddMode();

    closePopup();


    toolbar.style.display =
      "none";


    hint.style.display =
      "none";


    hideVRInfo();


    await acquireWakeLock();


    checkOrientation();

  }
);


/* =========================================================
   EXIT VR
========================================================= */

scene.addEventListener(
  "exit-vr",
  async ()=>{

    toolbar.style.display =
      "flex";


    rotateWarning.style.display =
      "none";


    hideVRInfo();


    await releaseWakeLock();


    try{

      if(
        screen.orientation &&
        screen.orientation.unlock
      ){

        screen.orientation.unlock();

      }

    }
    catch(e){}

  }
);


/* =========================================================
   ORIENTATION
========================================================= */

function checkOrientation(){

  if(
    !scene.is(
      "vr-mode"
    )
  ){

    rotateWarning.style.display =
      "none";

    return;

  }


  if(
    innerHeight >
    innerWidth
  ){

    rotateWarning.style.display =
      "flex";

  }
  else{

    rotateWarning.style.display =
      "none";

  }

}


window.addEventListener(
  "resize",
  checkOrientation
);


window.addEventListener(
  "orientationchange",
  ()=>{

    setTimeout(
      checkOrientation,
      300
    );

  }
);


/* =========================================================
   WAKE LOCK RETURN
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState ===
        "visible" &&

      scene.is(
        "vr-mode"
      )
    ){

      acquireWakeLock();

    }

  }
);


/* =========================================================
   SCENE READY
========================================================= */

scene.addEventListener(
  "loaded",
  ()=>{

    renderHotspots();


    installPointerControls();


    setFov(
      normalFov
    );


    if(scene.canvas){

      scene.canvas.addEventListener(
        "wheel",
        event=>{

          if(
            scene.is(
              "vr-mode"
            )
          ){
            return;
          }


          event.preventDefault();


          setFov(

            normalFov +

            (
              event.deltaY > 0
                ? 4
                : -4
            )

          );

        },

        {
          passive:false
        }
      );

    }

  }
);


/* =========================================================
   UI LOOP
========================================================= */

function uiLoop(){

  requestAnimationFrame(
    uiLoop
  );


  if(
    !scene.is(
      "vr-mode"
    )
  ){

    positionPopup();

  }

}


uiLoop();

</script>
