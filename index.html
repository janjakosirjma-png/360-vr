<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>360° interaktivna tura</title>

<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    #app {
        position: fixed;
        inset: 0;
        background: #000;
    }

    #viewer {
        position: absolute;
        inset: 0;
    }

    canvas {
        display: block;
    }

    /* ZGORNJA VRSTICA */

    #toolbar {
        position: fixed;
        z-index: 20;
        top: 12px;
        left: 12px;
        right: 12px;

        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;

        padding: 9px;

        background: rgba(12, 25, 34, .88);
        backdrop-filter: blur(8px);

        border: 1px solid rgba(255,255,255,.16);
        border-radius: 12px;
    }

    .title {
        color: white;
        font-weight: 800;
        margin-right: 8px;
    }

    .title span {
        color: #5ce0c2;
    }

    .spacer {
        flex: 1;
    }

    button {
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;

        background: #263d4a;
        color: white;

        font-size: 14px;
        font-weight: 650;

        cursor: pointer;
    }

    button:hover {
        background: #345365;
    }

    button.primary {
        background: #5ce0c2;
        color: #082720;
    }

    button.active {
        background: #ffd15c;
        color: #261d00;
    }

    button.danger {
        background: #71373c;
    }

    /* NAVODILO */

    #hint {
        position: fixed;
        z-index: 15;

        top: 82px;
        left: 50%;
        transform: translateX(-50%);

        padding: 8px 12px;

        background: rgba(0,0,0,.68);
        color: white;

        border-radius: 8px;
        font-size: 13px;

        pointer-events: none;
    }

    /* UREJEVALNIK */

    #editor {
        position: fixed;
        z-index: 30;

        right: 14px;
        top: 82px;

        width: 310px;
        max-height: calc(100vh - 100px);

        overflow: auto;

        background: rgba(15, 31, 41, .95);
        color: white;

        border: 1px solid #4d6876;
        border-radius: 12px;

        padding: 15px;

        display: none;
    }

    #editor h2 {
        font-size: 18px;
        margin: 0 0 12px;
    }

    label {
        display: block;
        font-size: 12px;
        color: #bcd0d8;
        margin-top: 10px;
    }

    input, textarea {
        display: block;
        width: 100%;

        margin-top: 5px;
        padding: 9px;

        border: 1px solid #526c79;
        border-radius: 7px;

        background: #0b1c25;
        color: white;

        font: inherit;
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    .editor-buttons {
        display: flex;
        gap: 7px;
        margin-top: 12px;
    }

    .editor-buttons button {
        flex: 1;
    }

    /* POPUP */

    #popup {
        position: fixed;
        z-index: 40;

        left: 50%;
        bottom: 25px;
        transform: translateX(-50%);

        width: min(430px, calc(100vw - 30px));

        background: rgba(11, 28, 38, .96);
        color: white;

        border: 1px solid #5ce0c2;
        border-radius: 12px;

        padding: 17px 45px 17px 17px;

        display: none;
    }

    #popup h2 {
        margin: 0 0 7px;
        font-size: 20px;
    }

    #popup p {
        margin: 0;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    #popupClose {
        position: absolute;
        right: 7px;
        top: 6px;

        background: transparent;
        font-size: 24px;
        padding: 4px 8px;
    }

    /* HOTSPOT LABEL */

    .hotspot-label {
        color: white;
        background: rgba(10, 25, 34, .9);

        border: 1px solid #5ce0c2;
        border-radius: 7px;

        padding: 5px 8px;

        font-size: 12px;
        white-space: nowrap;

        pointer-events: none;
    }

    /* STATUS */

    #status {
        position: fixed;

        left: 12px;
        bottom: 12px;

        z-index: 15;

        color: white;
        background: rgba(0,0,0,.65);

        padding: 7px 10px;
        border-radius: 7px;

        font-size: 12px;

        pointer-events: none;
    }

    #fileInput {
        display: none;
    }

    @media (max-width: 700px) {

        #toolbar {
            top: 6px;
            left: 6px;
            right: 6px;
        }

        .title {
            width: 100%;
            font-size: 13px;
        }

        button {
            padding: 8px 9px;
            font-size: 12px;
        }

        #hint {
            top: 112px;
            font-size: 11px;
        }

        #editor {
            left: 8px;
            right: 8px;
            top: auto;
            bottom: 8px;

            width: auto;
            max-height: 55vh;
        }

        #status {
            display: none;
        }
    }
</style>
</head>

<body>

<div id="app">

    <div id="viewer"></div>

    <div id="toolbar">

        <div class="title">
            360° <span>INTERAKTIVNA TURA</span>
        </div>

        <button id="modeBtn">
            ✏️ Urejanje
        </button>

        <button id="addBtn" class="primary">
            ＋ Hotspot
        </button>

        <button id="resetBtn">
            ⟳ Pogled
        </button>

        <div class="spacer"></div>

        <button id="vrBtn">
            🥽 VR
        </button>

        <button id="fullscreenBtn">
            ⛶
        </button>

        <button id="exportBtn">
            Izvoz
        </button>

        <button id="importBtn">
            Uvoz
        </button>

    </div>

    <div id="hint">
        Povleci za obračanje • kolešček za zoom
    </div>

    <div id="editor">

        <h2>Uredi hotspot</h2>

        <label>
            Naslov
            <input id="spotTitle" placeholder="Npr. Računalnik">
        </label>

        <label>
            Opis
            <textarea
                id="spotDescription"
                placeholder="Vnesi opis..."
            ></textarea>
        </label>

        <div class="editor-buttons">

            <button id="saveBtn" class="primary">
                Shrani
            </button>

            <button id="deleteBtn" class="danger">
                Izbriši
            </button>

        </div>

    </div>

    <div id="popup">

        <button id="popupClose">×</button>

        <h2 id="popupTitle"></h2>

        <p id="popupText"></p>

    </div>

    <div id="status">
        360.jpg
    </div>

    <input
        id="fileInput"
        type="file"
        accept=".json,application/json"
    >

</div>


<!-- THREE.JS -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { VRButton }
from "three/addons/webxr/VRButton.js";


/* =========================================================
   NASTAVITVE
   ========================================================= */

const IMAGE_URL = "./360.jpg";

const STORAGE_KEY = "moja-360-tura-v1";


/* =========================================================
   THREE.JS
   ========================================================= */

const viewer =
    document.getElementById("viewer");

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.01,
        1100
    );

camera.position.set(0, 0, 0.01);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.xr.enabled = true;

viewer.appendChild(
    renderer.domElement
);


/* =========================================================
   360° SLIKA
   ========================================================= */

const geometry =
    new THREE.SphereGeometry(
        100,
        64,
        40
    );

geometry.scale(-1, 1, 1);


const textureLoader =
    new THREE.TextureLoader();


textureLoader.load(

    IMAGE_URL,

    texture => {

        texture.colorSpace =
            THREE.SRGBColorSpace;

        const material =
            new THREE.MeshBasicMaterial({
                map: texture
            });

        const sphere =
            new THREE.Mesh(
                geometry,
                material
            );

        scene.add(sphere);

    },

    undefined,

    error => {

        console.error(error);

        alert(
            "Slike 360.jpg ni mogoče naložiti.\n\n" +
            "Preveri, da sta index.html in 360.jpg " +
            "v isti GitHub mapi."
        );

    }

);


/* =========================================================
   KONTROLE
   ========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.06;

controls.enablePan = false;

controls.enableZoom = true;

controls.rotateSpeed = -0.35;

controls.minDistance = 0.01;

controls.maxDistance = 0.01;

controls.target.set(
    0,
    0,
    -1
);

controls.update();


/* Zoom preko FOV */

renderer.domElement.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        camera.fov +=
            event.deltaY * 0.035;

        camera.fov =
            THREE.MathUtils.clamp(
                camera.fov,
                35,
                95
            );

        camera.updateProjectionMatrix();

    },
    { passive:false }
);


/* =========================================================
   HOTSPOTI
   ========================================================= */

let hotspots = [];

let hotspotObjects = [];

let editing = true;

let adding = false;

let selectedId = null;


const hotspotGroup =
    new THREE.Group();

scene.add(hotspotGroup);


/* Material */

function makeHotspotMaterial(){

    return new THREE.MeshBasicMaterial({

        color: 0xffd15c,

        depthTest: false,

        transparent: true,

        opacity: 0.96

    });

}


/* Nariši vse hotspote */

function rebuildHotspots(){

    hotspotGroup.clear();

    hotspotObjects = [];


    hotspots.forEach(point => {

        const group =
            new THREE.Group();


        group.position.set(
            point.x,
            point.y,
            point.z
        );


        /*
           Hotspot postavimo nekoliko pred
           notranjo površino sfere.
        */

        group.position
            .normalize()
            .multiplyScalar(92);


        const circle =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    1.5,
                    24,
                    24
                ),

                makeHotspotMaterial()

            );


        circle.userData.hotspotId =
            point.id;


        circle.renderOrder = 10;


        group.add(circle);


        /*
           Zunanji obroč
        */

        const ring =
            new THREE.Mesh(

                new THREE.RingGeometry(
                    1.8,
                    2.2,
                    32
                ),

                new THREE.MeshBasicMaterial({

                    color: 0xffffff,

                    side: THREE.DoubleSide,

                    depthTest: false,

                    transparent: true

                })

            );


        ring.renderOrder = 11;

        group.add(ring);


        hotspotGroup.add(group);

        hotspotObjects.push(circle);

    });

}


/* =========================================================
   SHRANJEVANJE
   ========================================================= */

function saveLocal(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(hotspots)
    );

}


function loadLocal(){

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(saved){

            const data =
                JSON.parse(saved);

            if(Array.isArray(data))
                hotspots = data;

        }

    }
    catch(error){

        console.error(error);

    }

}


loadLocal();
rebuildHotspots();


/* =========================================================
   RAYCASTER
   ========================================================= */

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();


function setPointer(event){

    const rect =
        renderer.domElement
            .getBoundingClientRect();


    pointer.x =
        (
            (event.clientX - rect.left)
            /
            rect.width
        ) * 2 - 1;


    pointer.y =
        -(
            (
                event.clientY - rect.top
            )
            /
            rect.height
        ) * 2 + 1;

}


/* =========================================================
   KLIK
   ========================================================= */

let downX = 0;
let downY = 0;


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        downX = event.clientX;
        downY = event.clientY;

    }
);


renderer.domElement.addEventListener(
    "pointerup",
    event => {

        const moved =
            Math.hypot(
                event.clientX - downX,
                event.clientY - downY
            );


        /*
           Če smo pogled vlekli,
           to ni klik.
        */

        if(moved > 7)
            return;


        setPointer(event);

        raycaster.setFromCamera(
            pointer,
            camera
        );


        /* =============================================
           DODAJANJE NOVEGA HOTSPOTA
           ============================================= */

        if(adding){

            const direction =
                raycaster.ray.direction
                    .clone()
                    .normalize();


            const point = {

                id:
                    Date.now().toString(36)
                    +
                    Math.random()
                        .toString(36)
                        .slice(2),

                title:
                    "Nova točka",

                description:
                    "",

                x:
                    direction.x,

                y:
                    direction.y,

                z:
                    direction.z

            };


            hotspots.push(point);

            selectedId =
                point.id;

            adding = false;

            document
                .getElementById("addBtn")
                .classList
                .remove("active");


            saveLocal();

            rebuildHotspots();

            openEditor(point);

            return;
        }


        /* =============================================
           KLIK NA OBSTOJEČ HOTSPOT
           ============================================= */

        const intersections =
            raycaster.intersectObjects(
                hotspotObjects,
                false
            );


        if(!intersections.length)
            return;


        const id =
            intersections[0]
                .object
                .userData
                .hotspotId;


        const point =
            hotspots.find(
                p => p.id === id
            );


        if(!point)
            return;


        if(editing){

            selectedId = id;

            openEditor(point);

        }
        else{

            showPopup(point);

        }

    }
);


/* =========================================================
   EDITOR
   ========================================================= */

const editor =
    document.getElementById("editor");

const titleInput =
    document.getElementById("spotTitle");

const descriptionInput =
    document.getElementById(
        "spotDescription"
    );


function openEditor(point){

    titleInput.value =
        point.title || "";

    descriptionInput.value =
        point.description || "";

    editor.style.display =
        "block";

}


document
    .getElementById("saveBtn")
    .onclick =
    () => {

        const point =
            hotspots.find(
                p => p.id === selectedId
            );

        if(!point)
            return;


        point.title =
            titleInput.value.trim()
            || "Točka";


        point.description =
            descriptionInput.value.trim();


        saveLocal();

        rebuildHotspots();

        editor.style.display =
            "none";

    };


document
    .getElementById("deleteBtn")
    .onclick =
    () => {

        if(!selectedId)
            return;


        hotspots =
            hotspots.filter(
                p => p.id !== selectedId
            );


        selectedId = null;

        saveLocal();

        rebuildHotspots();

        editor.style.display =
            "none";

    };


/* =========================================================
   POPUP
   ========================================================= */

const popup =
    document.getElementById("popup");


function showPopup(point){

    document
        .getElementById("popupTitle")
        .textContent =
        point.title || "Točka";


    document
        .getElementById("popupText")
        .textContent =
        point.description || "";


    popup.style.display =
        "block";

}


document
    .getElementById("popupClose")
    .onclick =
    () => {

        popup.style.display =
            "none";

    };


/* =========================================================
   DODAJ HOTSPOT
   ========================================================= */

const addBtn =
    document.getElementById("addBtn");


addBtn.onclick =
    () => {

        if(!editing){

            editing = true;

            updateModeButton();

        }


        adding =
            !adding;


        addBtn.classList.toggle(
            "active",
            adding
        );


        document
            .getElementById("hint")
            .textContent =
            adding
            ?
            "Klikni predmet, kamor želiš postaviti hotspot"
            :
            "Povleci za obračanje • kolešček za zoom";

    };


/* =========================================================
   UREJANJE / OGLED
   ========================================================= */

const modeBtn =
    document.getElementById("modeBtn");


function updateModeButton(){

    modeBtn.textContent =
        editing
        ?
        "👁 Ogled"
        :
        "✏️ Urejanje";


    addBtn.style.display =
        editing
        ?
        "inline-block"
        :
        "none";


    editor.style.display =
        "none";


    adding = false;

    addBtn.classList.remove(
        "active"
    );

}


modeBtn.onclick =
    () => {

        editing =
            !editing;

        popup.style.display =
            "none";

        updateModeButton();

    };


updateModeButton();


/* =========================================================
   RESET POGLEDA
   ========================================================= */

document
    .getElementById("resetBtn")
    .onclick =
    () => {

        camera.fov = 75;

        camera.updateProjectionMatrix();

        camera.position.set(
            0,
            0,
            0.01
        );

        controls.target.set(
            0,
            0,
            -1
        );

        controls.update();

    };


/* =========================================================
   FULLSCREEN
   ========================================================= */

document
    .getElementById("fullscreenBtn")
    .onclick =
    async () => {

        try {

            if(!document.fullscreenElement){

                await document
                    .documentElement
                    .requestFullscreen();

            }
            else{

                await document
                    .exitFullscreen();

            }

        }
        catch(error){

            console.error(error);

        }

    };


/* =========================================================
   VR / WEBXR
   ========================================================= */

const vrButton =
    VRButton.createButton(
        renderer
    );


/*
   Three.js ustvari lasten ENTER VR gumb.
   Skrijemo ga in naš gumb uporabi isti mehanizem.
*/

vrButton.style.display =
    "none";

document.body.appendChild(
    vrButton
);


document
    .getElementById("vrBtn")
    .onclick =
    () => {

        vrButton.click();

    };


/* =========================================================
   IZVOZ
   ========================================================= */

document
    .getElementById("exportBtn")
    .onclick =
    () => {

        const project = {

            image:
                "360.jpg",

            hotspots:
                hotspots

        };


        const blob =
            new Blob(

                [
                    JSON.stringify(
                        project,
                        null,
                        2
                    )
                ],

                {
                    type:
                        "application/json"
                }

            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        a.href = url;

        a.download =
            "360-projekt.json";


        a.click();


        setTimeout(
            () =>
                URL.revokeObjectURL(url),
            1000
        );

    };


/* =========================================================
   UVOZ
   ========================================================= */

const fileInput =
    document.getElementById("fileInput");


document
    .getElementById("importBtn")
    .onclick =
    () => {

        fileInput.click();

    };


fileInput.onchange =
    async event => {

        const file =
            event.target.files[0];

        if(!file)
            return;


        try {

            const project =
                JSON.parse(
                    await file.text()
                );


            if(
                !Array.isArray(
                    project.hotspots
                )
            ){

                throw new Error(
                    "Datoteka nima hotspotov."
                );

            }


            hotspots =
                project.hotspots;


            saveLocal();

            rebuildHotspots();

        }
        catch(error){

            alert(
                "Uvoz ni uspel: "
                +
                error.message
            );

        }


        fileInput.value = "";

    };


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth
            /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   ANIMACIJA
   ========================================================= */

renderer.setAnimationLoop(
    () => {

        if(!renderer.xr.isPresenting){

            controls.update();

        }


        /*
           Hotspot obroče obračamo proti kameri,
           da so vedno lepo vidni.
        */

        hotspotGroup.children.forEach(
            group => {

                if(group.children[1]){

                    group.children[1]
                        .lookAt(
                            camera.position
                        );

                }

            }
        );


        renderer.render(
            scene,
            camera
        );

    }
);

</script>

</body>
</html>
