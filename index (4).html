<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>360° VR ogled</title>

<!-- A-FRAME -->
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

/* =========================================================
   A-FRAME
========================================================= */

a-scene{
  position:fixed !important;
  inset:0;
  width:100% !important;
  height:100% !important;
}

/* =========================================================
   NORMAL UI
========================================================= */

#toolbar{
  position:fixed;
  z-index:10000;

  top:max(10px,env(safe-area-inset-top));
  left:max(10px,env(safe-area-inset-left));

  display:flex;
  gap:7px;
  flex-wrap:wrap;

  padding:8px;

  border-radius:14px;
  background:rgba(0,0,0,.82);
}

button{
  min-height:42px;
  padding:0 13px;

  border:0;
  border-radius:9px;

  background:#333;
  color:#fff;

  font-size:14px;
  font-weight:700;

  cursor:pointer;
  touch-action:manipulation;
}

#addBtn{
  background:#2563eb;
}

#addBtn.active{
  background:#16a34a;
}

#vrBtn{
  background:#7c3aed;
}

#hint{
  position:fixed;
  z-index:10001;

  display:none;

  left:50%;
  bottom:max(22px,env(safe-area-inset-bottom));

  transform:translateX(-50%);

  width:max-content;
  max-width:calc(100vw - 30px);

  padding:11px 18px;

  border-radius:30px;

  background:rgba(0,0,0,.88);
  color:#fff;

  text-align:center;

  pointer-events:none;
}

/* =========================================================
   POPUP
========================================================= */

#popup{
  position:fixed;
  z-index:10002;

  display:none;

  width:330px;
  max-width:calc(100vw - 20px);

  padding:18px;

  border-radius:14px;

  background:#fff;
  color:#111;

  box-shadow:0 12px 45px rgba(0,0,0,.5);
}

#popupClose{
  position:absolute;

  right:8px;
  top:8px;

  width:32px;
  height:32px;
  min-height:0;

  padding:0;

  border-radius:50%;

  background:#e5e5e5;
  color:#111;

  font-size:21px;
}

#reader,
#editor{
  display:none;
}

#readerTitle{
  margin:0 38px 10px 0;
}

#readerDescription{
  margin-bottom:15px;

  white-space:pre-wrap;
  line-height:1.45;
}

#editBtn{
  width:100%;
  background:#2563eb;
}

.fieldLabel{
  display:block;

  margin:9px 0 4px;

  font-size:13px;
  font-weight:700;
}

#titleInput,
#descriptionInput{
  width:100%;

  padding:11px;

  border:1px solid #aaa;
  border-radius:8px;

  font:inherit;
}

#descriptionInput{
  min-height:110px;
  resize:vertical;
}

.editorButtons{
  display:flex;
  gap:6px;

  margin-top:10px;
}

.editorButtons button{
  flex:1;
}

#saveBtn{
  background:#16a34a;
}

#cancelBtn{
  background:#666;
}

#deleteBtn{
  background:#dc2626;
}

/* =========================================================
   VR START
========================================================= */

#vrStart{
  position:fixed;
  inset:0;
  z-index:20000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.94);
}

#vrStartBox{
  width:390px;
  max-width:100%;

  padding:24px;

  border-radius:16px;

  background:#fff;
  color:#111;

  text-align:center;
}

#vrStartBox h2{
  margin-top:0;
}

#vrStartBox button{
  width:100%;
  margin-top:8px;
}

#startVRBtn{
  background:#7c3aed;
}

#cancelVRBtn{
  background:#666;
}

/* =========================================================
   ROTATE WARNING
========================================================= */

#rotateWarning{
  position:fixed;
  inset:0;
  z-index:30000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:30px;

  background:#000;
  color:#fff;

  text-align:center;

  font-size:22px;
  font-weight:bold;
}

/* uporabljamo svoj Cardboard gumb */
.a-enter-vr{
  display:none !important;
}
</style>
</head>

<body>

<!-- =======================================================
     A-FRAME SCENE
======================================================== -->

<a-scene
  id="scene"

  embedded

  vr-mode-ui="enabled: true"

  device-orientation-permission-ui="enabled: true"

  renderer="
    antialias: true;
    colorManagement: true;
    highRefreshRate: true;
    physicallyCorrectLights: false;
  "

  background="color:#000000">


  <!-- =====================================================
       ASSETS
  ====================================================== -->

  <a-assets timeout="20000">

    <img
      id="panoramaImage"
      src="360.jpg"
      crossorigin="anonymous">

  </a-assets>


  <!-- =====================================================
       PANORAMA
  ====================================================== -->

  <a-sky
    id="sky"
    src="#panoramaImage"
    rotation="0 0 0">
  </a-sky>


  <!-- =====================================================
       HOTSPOTS
  ====================================================== -->

  <a-entity id="hotspotContainer"></a-entity>


  <!-- =====================================================
       VR INFO CARD
  ====================================================== -->

  <a-entity
    id="vrInfo"
    visible="false">

    <a-plane
      width="3.4"
      height="1.8"

      color="#ffffff"

      material="
        shader:flat;
        opacity:0.96;
        transparent:true;
      ">
    </a-plane>


    <a-text
      id="vrInfoTitle"

      value=""

      color="#111111"

      width="3"

      align="center"
      anchor="center"

      position="0 0.45 0.015">
    </a-text>


    <a-text
      id="vrInfoDescription"

      value=""

      color="#333333"

      width="2.8"

      align="center"
      anchor="center"

      wrap-count="42"

      position="0 -0.15 0.015">
    </a-text>

  </a-entity>


  <!-- =====================================================
       CAMERA
  ====================================================== -->

  <a-entity
    id="cameraRig"
    position="0 0 0">

    <a-camera
      id="camera"

      position="0 0 0"

      wasd-controls="enabled:false"

      look-controls="
        enabled:true;
        magicWindowTrackingEnabled:true;
        touchEnabled:true;
        mouseEnabled:true;
        pointerLockEnabled:false;
      ">


      <!-- VR gaze reticle -->

      <a-entity
        id="reticle"

        position="0 0 -1"

        cursor="
          fuse:true;
          fuseTimeout:1200;
        "

        raycaster="
          objects:.hotspot;
          far:100;
          interval:50;
        "

        geometry="
          primitive:ring;
          radiusInner:0.012;
          radiusOuter:0.019;
        "

        material="
          color:#ffffff;
          shader:flat;
          opacity:0.95;
        ">
      </a-entity>

    </a-camera>

  </a-entity>

</a-scene>


<!-- =======================================================
     TOOLBAR
======================================================== -->

<div id="toolbar">

  <button id="addBtn">
    + Dodaj hotspot
  </button>

  <button id="zoomInBtn">
    +
  </button>

  <button id="zoomOutBtn">
    −
  </button>

  <button id="fullscreenBtn">
    ⛶
  </button>

  <button id="vrBtn">
    🥽 CARDBOARD
  </button>

</div>


<div id="hint">
  Tapni točno mesto v panorami
</div>


<!-- =======================================================
     POPUP
======================================================== -->

<div id="popup">

  <button id="popupClose">
    ×
  </button>


  <div id="reader">

    <h2 id="readerTitle"></h2>

    <div id="readerDescription"></div>

    <button id="editBtn">
      Uredi
    </button>

  </div>


  <div id="editor">

    <label class="fieldLabel">
      Naslov
    </label>

    <input
      id="titleInput"
      type="text">


    <label class="fieldLabel">
      Opis
    </label>

    <textarea id="descriptionInput"></textarea>


    <div class="editorButtons">

      <button id="saveBtn">
        Shrani
      </button>

      <button id="cancelBtn">
        Prekliči
      </button>

      <button id="deleteBtn">
        Izbriši
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     VR START
======================================================== -->

<div id="vrStart">

  <div id="vrStartBox">

    <h2>
      Samsung Galaxy A36
    </h2>

    <p>
      Obrni telefon vodoravno in ga vstavi v Cardboard očala.
    </p>

    <button id="startVRBtn">
      ZAŽENI CARDBOARD
    </button>

    <button id="cancelVRBtn">
      Prekliči
    </button>

  </div>

</div>


<div id="rotateWarning">
  Obrni Samsung Galaxy A36 vodoravno
</div>


<script>
"use strict";

/* =========================================================
   A-FRAME COMPONENTS
========================================================= */

/*
  Hotspot marker je vedno obrnjen proti centru panorame.
*/

AFRAME.registerComponent(
  "look-at-center",
  {

    tick:function(){

      if(!this.el.object3D){
        return;
      }

      this.el.object3D.lookAt(
        0,
        0,
        0
      );

    }

  }
);


/*
  VR kartica je vedno obrnjena proti kameri.
*/

AFRAME.registerComponent(
  "vr-card-face-camera",
  {

    tick:function(){

      const cameraEl =
        document.getElementById(
          "camera"
        );

      if(
        !this.el.object3D ||
        !cameraEl ||
        !cameraEl.object3D
      ){
        return;
      }

      const cameraPosition =
        new THREE.Vector3();

      cameraEl.object3D.getWorldPosition(
        cameraPosition
      );

      this.el.object3D.lookAt(
        cameraPosition
      );

    }

  }
);


/* =========================================================
   DOM
========================================================= */

const $ =
  id =>
    document.getElementById(id);


const scene =
  $("scene");

const camera =
  $("camera");

const hotspotContainer =
  $("hotspotContainer");

const reticle =
  $("reticle");

const vrInfo =
  $("vrInfo");

const vrInfoTitle =
  $("vrInfoTitle");

const vrInfoDescription =
  $("vrInfoDescription");


const toolbar =
  $("toolbar");

const addBtn =
  $("addBtn");

const zoomInBtn =
  $("zoomInBtn");

const zoomOutBtn =
  $("zoomOutBtn");

const fullscreenBtn =
  $("fullscreenBtn");

const vrBtn =
  $("vrBtn");

const hint =
  $("hint");


const popup =
  $("popup");

const popupClose =
  $("popupClose");

const reader =
  $("reader");

const editor =
  $("editor");

const readerTitle =
  $("readerTitle");

const readerDescription =
  $("readerDescription");

const editBtn =
  $("editBtn");

const titleInput =
  $("titleInput");

const descriptionInput =
  $("descriptionInput");

const saveBtn =
  $("saveBtn");

const cancelBtn =
  $("cancelBtn");

const deleteBtn =
  $("deleteBtn");


const vrStart =
  $("vrStart");

const startVRBtn =
  $("startVRBtn");

const cancelVRBtn =
  $("cancelVRBtn");

const rotateWarning =
  $("rotateWarning");


vrInfo.setAttribute(
  "vr-card-face-camera",
  ""
);


/* =========================================================
   STORAGE

   ISTI KLJUČ KOT PREJ
========================================================= */

const STORAGE_KEY =
  "stable-360-hotspots-v5";


let hotspots =
  [];


try{

  hotspots =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

}
catch(e){

  hotspots =
    [];

}


function saveHotspots(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      hotspots
    )
  );

}


function getHotspot(id){

  return hotspots.find(
    hotspot =>
      hotspot.id === id
  );

}


/* =========================================================
   SPHERICAL COORDINATES
========================================================= */

function sphericalToVector(
  yaw,
  pitch,
  radius=8
){

  return {

    x:
      radius *
      Math.cos(pitch) *
      Math.sin(yaw),

    y:
      radius *
      Math.sin(pitch),

    z:
      -radius *
      Math.cos(pitch) *
      Math.cos(yaw)

  };

}


function vectorToSpherical(v){

  const length =
    Math.sqrt(
      v.x*v.x +
      v.y*v.y +
      v.z*v.z
    );


  if(!length){

    return{
      yaw:0,
      pitch:0
    };

  }


  const x =
    v.x/length;

  const y =
    v.y/length;

  const z =
    v.z/length;


  return{

    yaw:
      Math.atan2(
        x,
        -z
      ),

    pitch:
      Math.asin(
        THREE.MathUtils.clamp(
          y,
          -1,
          1
        )
      )

  };

}


/* =========================================================
   HOTSPOT IMAGE
========================================================= */

function makeHotspotCanvas(number){

  const c =
    document.createElement(
      "canvas"
    );


  c.width =
    256;

  c.height =
    256;


  const ctx =
    c.getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    256,
    256
  );


  /*
    White border
  */

  ctx.beginPath();

  ctx.arc(
    128,
    128,
    112,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.fill();


  /*
    Red center
  */

  ctx.beginPath();

  ctx.arc(
    128,
    128,
    91,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#ef3333";

  ctx.fill();


  /*
    Number
  */

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "bold 100px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    String(number),
    128,
    136
  );


  return c;

}


/* =========================================================
   RENDER HOTSPOTS
========================================================= */

function renderHotspots(){

  while(
    hotspotContainer.firstChild
  ){

    hotspotContainer.removeChild(
      hotspotContainer.firstChild
    );

  }


  hotspots.forEach(
    (hotspot,index)=>{

      const position =
        sphericalToVector(
          hotspot.yaw,
          hotspot.pitch,
          8
        );


      const marker =
        document.createElement(
          "a-image"
        );


      marker.setAttribute(
        "src",
        makeHotspotCanvas(
          index+1
        ).toDataURL(
          "image/png"
        )
      );


      marker.setAttribute(
        "position",
        `${position.x} ${position.y} ${position.z}`
      );


      marker.setAttribute(
        "width",
        "0.55"
      );


      marker.setAttribute(
        "height",
        "0.55"
      );


      marker.setAttribute(
        "material",
        "shader:flat; transparent:true; alphaTest:0.05"
      );


      marker.setAttribute(
        "look-at-center",
        ""
      );


      marker.classList.add(
        "hotspot"
      );


      marker.dataset.hotspotId =
        hotspot.id;


      /*
        Desktop click + A-Frame gaze click.

        Mobilni tap za dodajanje je ločeno obdelan spodaj.
      */

      marker.addEventListener(
        "click",
        event=>{

          /*
            Če ravno dodajamo nov hotspot,
            klik na obstoječ marker ignoriramo.
          */

          if(addMode){
            return;
          }


          if(
            scene.is(
              "vr-mode"
            )
          ){

            showVRInfo(
              hotspot.id
            );

          }
          else{

            openReader(
              hotspot.id
            );

          }

        }
      );


      hotspotContainer.appendChild(
        marker
      );

    }
  );

}


/* =========================================================
   POPUP
========================================================= */

let selectedHotspotId =
  null;


function closePopup(){

  popup.style.display =
    "none";

  popup.style.visibility =
    "visible";

  selectedHotspotId =
    null;

}


function openReader(id){

  const hotspot =
    getHotspot(id);


  if(!hotspot){
    return;
  }


  selectedHotspotId =
    id;


  readerTitle.textContent =
    hotspot.title ||
    "Brez naslova";


  readerDescription.textContent =
    hotspot.description ||
    "Ni opisa.";


  editor.style.display =
    "none";


  reader.style.display =
    "block";


  popup.style.display =
    "block";


  popup.style.visibility =
    "visible";


  positionPopup();

}


function openEditor(id){

  const hotspot =
    getHotspot(id);


  if(!hotspot){
    return;
  }


  selectedHotspotId =
    id;


  titleInput.value =
    hotspot.title || "";


  descriptionInput.value =
    hotspot.description || "";


  reader.style.display =
    "none";


  editor.style.display =
    "block";


  popup.style.display =
    "block";


  popup.style.visibility =
    "visible";


  positionPopup();


  /*
    Na telefonu ne odpiramo tipkovnice avtomatsko.
    Uporabnik sam tapne polje.
  */

}


popupClose.onclick =
  closePopup;


editBtn.onclick =
  ()=>{

    if(selectedHotspotId){

      openEditor(
        selectedHotspotId
      );

    }

  };


saveBtn.onclick =
  ()=>{

    const hotspot =
      getHotspot(
        selectedHotspotId
      );


    if(!hotspot){
      return;
    }


    hotspot.title =
      titleInput.value.trim();


    hotspot.description =
      descriptionInput.value.trim();


    saveHotspots();


    renderHotspots();


    openReader(
      hotspot.id
    );

  };


cancelBtn.onclick =
  ()=>{

    const hotspot =
      getHotspot(
        selectedHotspotId
      );


    if(
      hotspot &&
      (
        hotspot.title ||
        hotspot.description
      )
    ){

      openReader(
        hotspot.id
      );

    }
    else{

      closePopup();

    }

  };


deleteBtn.onclick =
  ()=>{

    if(!selectedHotspotId){
      return;
    }


    hotspots =
      hotspots.filter(
        hotspot =>
          hotspot.id !==
          selectedHotspotId
      );


    saveHotspots();


    closePopup();


    renderHotspots();

  };


/* =========================================================
   POPUP POSITION
========================================================= */

function positionPopup(){

  if(
    !selectedHotspotId ||
    popup.style.display === "none" ||
    scene.is("vr-mode")
  ){
    return;
  }


  const marker =
    [...hotspotContainer.children]
      .find(
        element =>
          element.dataset.hotspotId ===
          selectedHotspotId
      );


  if(
    !marker ||
    !marker.object3D ||
    !scene.camera
  ){
    return;
  }


  const worldPosition =
    new THREE.Vector3();


  marker.object3D.getWorldPosition(
    worldPosition
  );


  const cameraPosition =
    new THREE.Vector3();


  scene.camera.getWorldPosition(
    cameraPosition
  );


  const cameraDirection =
    new THREE.Vector3();


  scene.camera.getWorldDirection(
    cameraDirection
  );


  const markerDirection =
    worldPosition
      .clone()
      .sub(
        cameraPosition
      )
      .normalize();


  if(
    cameraDirection.dot(
      markerDirection
    ) <= 0
  ){

    popup.style.visibility =
      "hidden";

    return;

  }


  popup.style.visibility =
    "visible";


  worldPosition.project(
    scene.camera
  );


  const x =
    (
      worldPosition.x+1
    ) *
    0.5 *
    innerWidth;


  const y =
    (
      -worldPosition.y+1
    ) *
    0.5 *
    innerHeight;


  const width =
    popup.offsetWidth;


  const height =
    popup.offsetHeight;


  let left;


  if(
    x <
    innerWidth/2
  ){

    left =
      x+28;

  }
  else{

    left =
      x-width-28;

  }


  let top =
    y-height/2;


  left =
    THREE.MathUtils.clamp(
      left,
      8,
      innerWidth-width-8
    );


  top =
    THREE.MathUtils.clamp(
      top,
      8,
      innerHeight-height-8
    );


  popup.style.left =
    left+"px";


  popup.style.top =
    top+"px";

}


/* =========================================================
   ADD MODE
========================================================= */

let addMode =
  false;


function startAddMode(){

  if(
    scene.is(
      "vr-mode"
    )
  ){
    return;
  }


  closePopup();


  addMode =
    true;


  addBtn.classList.add(
    "active"
  );


  addBtn.textContent =
    "PREKLIČI";


  hint.textContent =
    "Tapni točno mesto v panorami";


  hint.style.display =
    "block";

}


function stopAddMode(){

  addMode =
    false;


  addBtn.classList.remove(
    "active"
  );


  addBtn.textContent =
    "+ Dodaj hotspot";


  hint.style.display =
    "none";

}


addBtn.addEventListener(
  "click",
  event=>{

    /*
      Preprečimo, da isti klik/tap, s katerim smo vključili
      addMode, takoj ustvari tudi hotspot na canvasu.
    */

    event.stopPropagation();


    if(addMode){

      stopAddMode();

    }
    else{

      startAddMode();

    }

  }
);


/* =========================================================
   MOBILE + DESKTOP POINTER HOTSPOT PLACEMENT

   TO JE GLAVNA SPREMEMBA.

   Deluje:
   - mouse
   - touchscreen
   - Samsung Galaxy A36
   - stylus

   Tap = ustvari hotspot.
   Drag = samo obrača panoramo.
========================================================= */

let sceneCanvas =
  null;


let pointerTracking =
  false;


let pointerStartX =
  0;


let pointerStartY =
  0;


let pointerStartTime =
  0;


let pointerWasDrag =
  false;


/*
  Koliko se lahko prst premakne in je še vedno tap.

  Na telefonu potrebujemo nekaj tolerance.
*/

const TAP_MOVE_LIMIT =
  14;


/*
  Dolg pritisk ne štejemo kot tap.
*/

const TAP_TIME_LIMIT =
  650;


/* =========================================================
   CREATE HOTSPOT FROM SCREEN POSITION
========================================================= */

function createHotspotAtScreenPoint(
  clientX,
  clientY
){

  if(
    !sceneCanvas ||
    !scene.camera
  ){
    return;
  }


  const rect =
    sceneCanvas.getBoundingClientRect();


  /*
    Preverimo, ali je tap dejansko znotraj A-Frame canvas.
  */

  if(
    clientX < rect.left ||
    clientX > rect.right ||
    clientY < rect.top ||
    clientY > rect.bottom
  ){
    return;
  }


  /*
    Touch/mouse koordinato pretvorimo v WebGL NDC:
      X: -1 ... +1
      Y: -1 ... +1
  */

  const ndc =
    new THREE.Vector2(

      (
        (
          clientX -
          rect.left
        ) /
        rect.width
      ) *
      2 -
      1,

      -(
        (
          clientY -
          rect.top
        ) /
        rect.height
      ) *
      2 +
      1

    );


  /*
    Ray iz trenutne A-Frame kamere skozi točno mesto,
    ki se ga je uporabnik dotaknil.
  */

  const raycaster =
    new THREE.Raycaster();


  raycaster.setFromCamera(
    ndc,
    scene.camera
  );


  const direction =
    raycaster
      .ray
      .direction
      .clone()
      .normalize();


  /*
    Pretvorba v isti yaw/pitch format, ki ga že uporablja
    stable-360-hotspots-v5.
  */

  const spherical =
    vectorToSpherical(
      direction
    );


  const hotspot = {

    id:
      "hs-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2,7),

    yaw:
      spherical.yaw,

    pitch:
      spherical.pitch,

    title:"",

    description:""

  };


  hotspots.push(
    hotspot
  );


  saveHotspots();


  renderHotspots();


  stopAddMode();


  /*
    Počakamo, da A-Frame vstavi nov marker v 3D sceno,
    nato odpremo editor ob njem.
  */

  requestAnimationFrame(
    ()=>{

      requestAnimationFrame(
        ()=>{

          openEditor(
            hotspot.id
          );

        }
      );

    }
  );

}


/* =========================================================
   INSTALL POINTER EVENTS
========================================================= */

function installPointerControls(){

  sceneCanvas =
    scene.canvas;


  if(!sceneCanvas){
    return;
  }


  /*
    POINTER DOWN
  */

  sceneCanvas.addEventListener(
    "pointerdown",
    event=>{

      if(
        !addMode ||
        scene.is(
          "vr-mode"
        )
      ){
        return;
      }


      /*
        Samo glavni dotik / levi miškin gumb.
      */

      if(
        event.pointerType === "mouse" &&
        event.button !== 0
      ){
        return;
      }


      pointerTracking =
        true;


      pointerWasDrag =
        false;


      pointerStartX =
        event.clientX;


      pointerStartY =
        event.clientY;


      pointerStartTime =
        performance.now();

    },
    true
  );


  /*
    POINTER MOVE

    Če se prst dovolj premakne, gre za drag in ne za tap.
  */

  sceneCanvas.addEventListener(
    "pointermove",
    event=>{

      if(
        !pointerTracking ||
        !addMode
      ){
        return;
      }


      const distance =
        Math.hypot(

          event.clientX -
          pointerStartX,

          event.clientY -
          pointerStartY

        );


      if(
        distance >
        TAP_MOVE_LIMIT
      ){

        pointerWasDrag =
          true;

      }

    },
    true
  );


  /*
    POINTER CANCEL
  */

  sceneCanvas.addEventListener(
    "pointercancel",
    ()=>{

      pointerTracking =
        false;

      pointerWasDrag =
        false;

    },
    true
  );


  /*
    POINTER UP

    Če ni bil drag:
    ustvari hotspot TOČNO na mestu dotika.
  */

  sceneCanvas.addEventListener(
    "pointerup",
    event=>{

      if(
        !pointerTracking
      ){
        return;
      }


      pointerTracking =
        false;


      if(
        !addMode ||
        scene.is(
          "vr-mode"
        )
      ){
        return;
      }


      const duration =
        performance.now() -
        pointerStartTime;


      const distance =
        Math.hypot(

          event.clientX -
          pointerStartX,

          event.clientY -
          pointerStartY

        );


      if(
        pointerWasDrag ||
        distance >
        TAP_MOVE_LIMIT ||
        duration >
        TAP_TIME_LIMIT
      ){

        pointerWasDrag =
          false;

        return;

      }


      pointerWasDrag =
        false;


      /*
        Uporabimo končni položaj tapa.
      */

      createHotspotAtScreenPoint(
        event.clientX,
        event.clientY
      );

    },
    true
  );

}


/* =========================================================
   ZOOM
========================================================= */

let normalFov =
  80;


function setFov(value){

  normalFov =
    THREE.MathUtils.clamp(
      value,
      35,
      100
    );


  if(
    camera &&
    camera.components &&
    camera.components.camera &&
    camera.components.camera.camera
  ){

    const threeCamera =
      camera
        .components
        .camera
        .camera;


    threeCamera.fov =
      normalFov;


    threeCamera.updateProjectionMatrix();

  }

}


zoomInBtn.onclick =
  ()=>{

    setFov(
      normalFov-8
    );

  };


zoomOutBtn.onclick =
  ()=>{

    setFov(
      normalFov+8
    );

  };


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.onclick =
  async ()=>{

    try{

      if(
        !document.fullscreenElement
      ){

        if(
          document.documentElement
            .requestFullscreen
        ){

          await document
            .documentElement
            .requestFullscreen();

        }

      }
      else if(
        document.exitFullscreen
      ){

        await document
          .exitFullscreen();

      }

    }
    catch(e){}

  };


/* =========================================================
   VR INFO
========================================================= */

function hideVRInfo(){

  vrInfo.setAttribute(
    "visible",
    false
  );

}


function showVRInfo(id){

  const hotspot =
    getHotspot(id);


  if(!hotspot){
    return;
  }


  vrInfoTitle.setAttribute(
    "value",
    hotspot.title ||
    "Brez naslova"
  );


  vrInfoDescription.setAttribute(
    "value",
    hotspot.description ||
    "Ni opisa."
  );


  if(!scene.camera){
    return;
  }


  const cameraPosition =
    new THREE.Vector3();


  const direction =
    new THREE.Vector3();


  scene.camera.getWorldPosition(
    cameraPosition
  );


  scene.camera.getWorldDirection(
    direction
  );


  const position =
    cameraPosition
      .clone()
      .add(

        direction
          .clone()
          .multiplyScalar(
            2.6
          )

      );


  vrInfo.object3D.position.copy(
    position
  );


  vrInfo.object3D.lookAt(
    cameraPosition
  );


  vrInfo.setAttribute(
    "visible",
    true
  );

}


/* =========================================================
   GAZE
========================================================= */

reticle.addEventListener(
  "fusing",
  ()=>{

    reticle.setAttribute(
      "material",
      "color",
      "#22c55e"
    );

  }
);


reticle.addEventListener(
  "mouseleave",
  ()=>{

    reticle.setAttribute(
      "material",
      "color",
      "#ffffff"
    );

  }
);


reticle.addEventListener(
  "click",
  event=>{

    if(
      !scene.is(
        "vr-mode"
      )
    ){
      return;
    }


    const target =
      event.detail &&
      event.detail.intersectedEl;


    if(
      !target ||
      !target.classList.contains(
        "hotspot"
      )
    ){
      return;
    }


    showVRInfo(
      target.dataset.hotspotId
    );

  }
);


/* =========================================================
   WAKE LOCK
========================================================= */

let wakeLock =
  null;


async function acquireWakeLock(){

  if(
    !(
      "wakeLock" in
      navigator
    )
  ){
    return;
  }


  try{

    if(
      wakeLock &&
      !wakeLock.released
    ){
      return;
    }


    wakeLock =
      await navigator
        .wakeLock
        .request(
          "screen"
        );


    wakeLock.addEventListener(
      "release",
      ()=>{

        wakeLock =
          null;

      }
    );

  }
  catch(e){}

}


async function releaseWakeLock(){

  if(!wakeLock){
    return;
  }


  try{

    await wakeLock.release();

  }
  catch(e){}


  wakeLock =
    null;

}


/* =========================================================
   CARDBOARD
========================================================= */

vrBtn.onclick =
  ()=>{

    closePopup();

    stopAddMode();

    vrStart.style.display =
      "flex";

  };


cancelVRBtn.onclick =
  ()=>{

    vrStart.style.display =
      "none";

  };


startVRBtn.onclick =
  async ()=>{

    /*
      iOS motion permission.
      Galaxy A36 / Android tega običajno ne zahteva.
    */

    if(
      typeof DeviceOrientationEvent !==
        "undefined" &&

      typeof DeviceOrientationEvent
        .requestPermission ===
        "function"
    ){

      try{

        const permission =
          await DeviceOrientationEvent
            .requestPermission();


        if(
          permission !==
          "granted"
        ){

          alert(
            "Dovoljenje za senzor gibanja ni bilo odobreno."
          );

          return;

        }

      }
      catch(e){

        return;

      }

    }


    vrStart.style.display =
      "none";


    /*
      Landscape.
    */

    try{

      if(
        screen.orientation &&
        screen.orientation.lock
      ){

        await screen.orientation.lock(
          "landscape"
        );

      }

    }
    catch(e){}


    /*
      A-FRAME PREVZAME VR.

      Tega dela ne nadomeščamo več z lastnim rendererjem.
    */

    try{

      await scene.enterVR();

    }
    catch(e){

      alert(
        "Brskalnik ni uspel zagnati VR načina."
      );

    }

  };


/* =========================================================
   ENTER VR
========================================================= */

scene.addEventListener(
  "enter-vr",
  async ()=>{

    stopAddMode();

    closePopup();

    toolbar.style.display =
      "none";

    hint.style.display =
      "none";

    hideVRInfo();


    await acquireWakeLock();


    checkOrientation();

  }
);


/* =========================================================
   EXIT VR
========================================================= */

scene.addEventListener(
  "exit-vr",
  async ()=>{

    toolbar.style.display =
      "flex";


    rotateWarning.style.display =
      "none";


    hideVRInfo();


    await releaseWakeLock();


    try{

      if(
        screen.orientation &&
        screen.orientation.unlock
      ){

        screen.orientation.unlock();

      }

    }
    catch(e){}

  }
);


/* =========================================================
   ORIENTATION
========================================================= */

function checkOrientation(){

  if(
    !scene.is(
      "vr-mode"
    )
  ){

    rotateWarning.style.display =
      "none";

    return;

  }


  if(
    innerHeight >
    innerWidth
  ){

    rotateWarning.style.display =
      "flex";

  }
  else{

    rotateWarning.style.display =
      "none";

  }

}


window.addEventListener(
  "resize",
  checkOrientation
);


window.addEventListener(
  "orientationchange",
  ()=>{

    setTimeout(
      checkOrientation,
      300
    );

  }
);


/* =========================================================
   WAKE LOCK RETURN
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState ===
        "visible" &&

      scene.is(
        "vr-mode"
      )
    ){

      acquireWakeLock();

    }

  }
);


/* =========================================================
   SCENE READY
========================================================= */

scene.addEventListener(
  "loaded",
  ()=>{

    renderHotspots();


    /*
      Namestimo TOUCH + MOUSE pointer podporo.
    */

    installPointerControls();


    setFov(
      normalFov
    );


    /*
      Mouse wheel zoom samo na desktopu.
    */

    if(scene.canvas){

      scene.canvas.addEventListener(
        "wheel",
        event=>{

          if(
            scene.is(
              "vr-mode"
            )
          ){
            return;
          }


          event.preventDefault();


          setFov(

            normalFov +

            (
              event.deltaY > 0
                ? 4
                : -4
            )

          );

        },

        {
          passive:false
        }
      );

    }

  }
);


/* =========================================================
   UI LOOP
========================================================= */

function uiLoop(){

  requestAnimationFrame(
    uiLoop
  );


  if(
    !scene.is(
      "vr-mode"
    )
  ){

    positionPopup();

  }

}


uiLoop();

</script>
